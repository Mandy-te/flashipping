<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4429">
<title>Flashipping — Finance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>

/* ═══════════════════════════════════════════════════════════════
   Même grammaire visuelle que l'app Logistique, mais l'en-tête est
   ambre : quand un agent a les deux applications installées, il voit
   d'un coup d'œil laquelle est ouverte.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --marine:#0E4429; --or:#1B7F4B; --or-fonce:#14623A;
  --vert:#1B7F4B; --rouge:#C62828; --orange:#E67E22; --bleu:#1565C0;
  --fond:#F3F7F4; --carte:#FFFFFF; --bord:#D7E3DA;
  --texte:#10261B; --doux:#5C7366;
  --ombre:0 1px 3px rgba(14,68,41,.12);
  --haut:env(safe-area-inset-top,0px);
  --bas:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--fond); color:var(--texte); overscroll-behavior-y:none;
}
input,select,textarea,button{font:inherit;color:inherit}
a{color:var(--bleu)}

#app{min-height:100vh;display:flex;flex-direction:column}
.entete{
  background:var(--marine); color:#fff;
  padding:calc(var(--haut) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;
}
.entete h1{font-size:16px;margin:0;font-weight:700;flex:1;letter-spacing:.2px}
.entete .sous{font-size:11.5px;opacity:.78;font-weight:400;display:block}
.pastille{width:9px;height:9px;border-radius:50%;background:#7ED6A5;flex:none}
.pastille.hors{background:#FF8A80}
.btn-entete{
  background:rgba(255,255,255,.16);border:0;color:#fff;
  width:38px;height:38px;border-radius:10px;font-size:17px;flex:none;
}
main{flex:1;padding:12px 12px 96px;max-width:760px;margin:0 auto;width:100%}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;
  border-top:1px solid var(--bord);display:flex;padding-bottom:var(--bas);
  box-shadow:0 -1px 8px rgba(14,68,41,.08);
}
nav button{
  flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;
  flex-direction:column;align-items:center;gap:3px;font-size:10.5px;
  color:var(--doux);font-weight:600;
}
nav button .ic{font-size:21px;line-height:1}
nav button.actif{color:var(--marine)}

.carte{
  background:var(--carte);border:1px solid var(--bord);border-radius:12px;
  padding:14px;margin-bottom:12px;box-shadow:var(--ombre);
}
.carte.serree{padding:11px 12px}
.titre-section{
  font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  color:var(--doux);margin:18px 2px 8px;
}
.titre-section:first-child{margin-top:2px}

label.champ{display:block;margin-bottom:12px}
label.champ > span{
  display:block;font-size:12px;font-weight:700;color:var(--doux);
  margin-bottom:5px;letter-spacing:.2px;
}
input[type=text],input[type=tel],input[type=number],input[type=password],
input[type=email],input[type=url],select,textarea{
  width:100%;padding:13px 12px;border:1.5px solid var(--bord);
  border-radius:10px;background:#fff;font-size:16px;
}
input:focus,select:focus,textarea:focus{
  outline:0;border-color:var(--or-fonce);box-shadow:0 0 0 3px rgba(27,127,75,.18);
}
input[readonly]{background:#EFF4F0;color:var(--doux)}
textarea{min-height:60px;resize:vertical}
.duo{display:flex;gap:10px}
.duo > *{flex:1;min-width:0}
.trio{display:flex;gap:8px}
.trio > *{min-width:0}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border:0;border-radius:11px;background:var(--or);
  color:#fff;font-weight:800;font-size:15.5px;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45}
.btn.vert{background:#0E4429;color:#fff}
.btn.rouge{background:var(--rouge);color:#fff}
.btn.sombre{background:var(--marine);color:#fff}
.btn.vide{background:#fff;color:var(--marine);border:1.5px solid var(--bord);font-weight:700}
.btn.petit{padding:10px;font-size:14px;border-radius:9px}
.btn + .btn{margin-top:9px}
.rangee-btn{display:flex;gap:9px}
.rangee-btn .btn + .btn{margin-top:0}

.puces{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;
  scrollbar-width:none;-ms-overflow-style:none}
.puces::-webkit-scrollbar{display:none}
.puce{
  flex:none;padding:8px 13px;border-radius:999px;border:1.5px solid var(--bord);
  background:#fff;font-size:13px;font-weight:650;white-space:nowrap;color:var(--doux);
}
.puce.actif{background:var(--marine);color:#fff;border-color:var(--marine)}

.ligne{
  display:flex;align-items:center;gap:11px;padding:12px 13px;background:#fff;
  border:1px solid var(--bord);border-radius:11px;margin-bottom:8px;
  text-align:left;width:100%;
}
.ligne:active{background:#F7FBF8}
.ligne .corps{flex:1;min-width:0}
.ligne .t1{font-weight:700;font-size:14.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ligne .t2{font-size:12.5px;color:var(--doux);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .droite{text-align:right;flex:none}
.mono{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:13px;
  letter-spacing:-.2px;word-break:break-all}

.etat{display:inline-block;padding:3px 9px;border-radius:7px;
  font-size:11px;font-weight:800;letter-spacing:.3px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border-radius:7px;font-size:11px;font-weight:700;background:#E7EFE9;color:var(--doux)}
.badge.ok{background:#E8F5E9;color:var(--vert)}
.badge.ko{background:#FFEBEE;color:var(--rouge)}

.msg{padding:12px 13px;border-radius:11px;margin-bottom:12px;font-size:14px;
  font-weight:500;line-height:1.4;display:flex;gap:9px;align-items:flex-start}
.msg.ok{background:#E8F5E9;color:#145A32;border:1px solid #BEE3C8}
.msg.ko{background:#FFEBEE;color:#8E1F1F;border:1px solid #F5C6C6}
.msg.info{background:#EAF3FB;color:#0D3C6E;border:1px solid #C3DEF3}
.msg.attention{background:#FFF8E1;color:#7A4F00;border:1px solid #FFE0A3}
.msg .ic{font-size:17px;flex:none;line-height:1.3}

.vide{text-align:center;padding:42px 20px;color:var(--doux)}
.vide .gros{font-size:40px;margin-bottom:10px;opacity:.5}
.chargement{text-align:center;padding:30px;color:var(--doux);font-size:14px}
.tourne{display:inline-block;width:19px;height:19px;border:2.5px solid var(--bord);
  border-top-color:var(--or-fonce);border-radius:50%;animation:t .7s linear infinite;
  vertical-align:-4px;margin-right:8px}
@keyframes t{to{transform:rotate(360deg)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:9px}
.stat{background:#fff;border:1px solid var(--bord);border-radius:11px;
  padding:12px 9px;text-align:center}
.stat .v{font-size:20px;font-weight:800;line-height:1.1}
.stat .l{font-size:10.5px;color:var(--doux);margin-top:3px;font-weight:650;
  text-transform:uppercase;letter-spacing:.4px}

.total{display:flex;justify-content:space-between;align-items:baseline;
  padding:8px 0;font-size:14.5px}
.total + .total{border-top:1px solid var(--bord)}
.total.gros{font-size:19px;font-weight:800;padding-top:12px;
  border-top:2px solid var(--marine);margin-top:4px}
.total .l{color:var(--doux);font-weight:650}
.total.gros .l{color:var(--texte)}

/* ── Article du panier ── */
.article{
  border:1.5px solid var(--bord);border-radius:11px;padding:12px;
  margin-bottom:9px;background:#fff;
}
.article .tete{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.article .num{
  width:24px;height:24px;border-radius:7px;background:var(--or);
  color:#fff;font-weight:800;font-size:12.5px;display:flex;
  align-items:center;justify-content:center;flex:none;
}
.article .tete .sup{
  margin-left:auto;background:none;border:0;color:var(--rouge);
  font-size:17px;padding:2px 6px;
}
.article label.champ{margin-bottom:8px}

/* ── Jalons du cycle de vie ── */
.jalons{display:flex;gap:4px;margin:4px 0 14px}
.jalon{flex:1;text-align:center}
.jalon .pt{
  height:5px;border-radius:9px;background:var(--bord);margin-bottom:6px;
}
.jalon.faite .pt{background:var(--vert)}
.jalon.ici .pt{background:var(--or)}
.jalon .l{font-size:9.5px;color:var(--doux);font-weight:700;
  text-transform:uppercase;letter-spacing:.2px;line-height:1.2}
.jalon.ici .l{color:var(--texte)}

/* ── Marge ── */
.marge{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 13px;border-radius:11px;margin-bottom:12px;font-weight:700;
}
.marge.positive{background:#E8F5E9;color:#145A32}
.marge.negative{background:#FFEBEE;color:#8E1F1F}
.marge .v{font-size:20px;font-weight:800}

.voile{position:fixed;inset:0;background:rgba(16,38,27,.5);z-index:60;
  display:flex;align-items:flex-end;justify-content:center}
.modale{
  background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;
  padding:18px 16px calc(18px + var(--bas));max-height:92vh;overflow-y:auto;
  animation:monte .22s ease-out;
}
@keyframes monte{from{transform:translateY(18px);opacity:.4}}
.modale h3{margin:0 0 14px;font-size:17px}
.poignee{width:40px;height:4px;background:var(--bord);border-radius:9px;
  margin:0 auto 14px}

.suggestions{border:1.5px solid var(--bord);border-radius:11px;overflow:hidden;
  margin-top:-4px;margin-bottom:12px;background:#fff}
.suggestions button{display:block;width:100%;text-align:left;padding:12px 13px;
  background:none;border:0;border-bottom:1px solid var(--bord)}
.suggestions button:last-child{border-bottom:0}
.suggestions button:active{background:#EFF6F1}

.coche{
  display:flex;gap:12px;align-items:center;padding:13px;border:1.5px solid var(--bord);
  border-radius:11px;background:#fff;margin-bottom:8px;
}
.coche.on{border-color:var(--or-fonce);background:#F2FAF5}
.coche input{width:23px;height:23px;flex:none;accent-color:var(--or-fonce)}
.coche .corps{flex:1;min-width:0}

#bandeau{
  background:var(--rouge);color:#fff;padding:9px 13px;font-size:13px;
  font-weight:700;display:none;align-items:center;gap:8px;
  position:sticky;top:0;z-index:29;
}
#bandeau.vu{display:flex}

#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--bas));
  z-index:80;pointer-events:none}
#toast div{
  background:var(--marine);color:#fff;padding:13px 15px;border-radius:11px;
  font-size:14px;font-weight:650;box-shadow:0 5px 22px rgba(14,68,41,.3);
  animation:monte .2s ease-out;margin-top:8px;
}
#toast div.ko{background:var(--rouge)}
#toast div.ok{background:var(--vert)}

/* ── Impression 50 mm : reçu de commande ── */
#zone-impression{display:none}
@media print{
  /* Le format de page n'est PAS figé ici : imprimer() injecte @page au
     moment du clic, A4 pour un rapport, 50 mm pour un reçu. Une règle
     fixe à cet endroit imprimerait tous les rapports sur un ticket. */
  body{background:#fff;margin:0}
  /* .voile est frère de #app : sans cette ligne, c'est la modale
     affichée à l'écran qui part sur le papier. */
  #app,#toast,#bandeau,nav,.voile{display:none!important}
  #zone-impression{display:block!important}

  /* ── Document A4 ── */
  .doc{
    font-family:Arial,Helvetica,sans-serif;color:#16222E;font-size:10.5pt;
    line-height:1.45;
  }
  .doc-tete{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid #0B2545;padding-bottom:4mm;margin-bottom:5mm;
  }
  .doc-marque{font-size:21pt;font-weight:bold;letter-spacing:3px;color:#0B2545;
    line-height:1}
  .doc-eclair{color:#F0A818}
  .doc-slogan{font-size:8pt;font-weight:bold;color:#C62828;letter-spacing:2.5px;
    margin-top:1mm}
  .doc-coord{font-size:7.5pt;color:#5F7183;text-align:right;line-height:1.5}
  .doc-titre{
    background:#0B2545;color:#fff;padding:2.5mm 4mm;font-size:12pt;
    font-weight:bold;letter-spacing:1px;display:flex;
    justify-content:space-between;margin-bottom:5mm;
  }
  .doc-cols{display:flex;gap:6mm;margin-bottom:5mm}
  .doc-col{flex:1}
  .doc-col h4{
    font-size:7.5pt;letter-spacing:1.2px;color:#5F7183;margin:0 0 1.5mm;
    text-transform:uppercase;border-bottom:1px solid #D9E0E6;padding-bottom:1mm;
  }
  .doc-col .gros{font-size:11pt;font-weight:bold}
  .doc-col div{font-size:9pt}

  table.doc-t{width:100%;border-collapse:collapse;margin-bottom:4mm}
  table.doc-t th{
    background:#EEF2F6;font-size:8pt;text-transform:uppercase;letter-spacing:.8px;
    color:#0B2545;padding:2mm;text-align:left;border-bottom:1.5px solid #0B2545;
  }
  table.doc-t td{padding:2mm;border-bottom:1px solid #E6ECF1;font-size:9.5pt;
    vertical-align:top}
  table.doc-t .num{text-align:right;white-space:nowrap}
  table.doc-t .ref{font-family:'Courier New',monospace;font-size:8.5pt}

  .doc-tot{margin-left:auto;width:72mm}
  .doc-tot div{display:flex;justify-content:space-between;padding:1.5mm 0;
    font-size:10pt}
  .doc-tot .grand{
    border-top:2px solid #0B2545;margin-top:1mm;padding-top:2mm;
    font-size:13pt;font-weight:bold;
  }
  .doc-tot .gdes{color:#5F7183;font-size:9.5pt}

  .doc-tampon{
    display:inline-block;border:2px solid;padding:1.5mm 5mm;font-weight:bold;
    font-size:11pt;letter-spacing:1.5px;transform:rotate(-3deg);margin-top:3mm;
  }
  .doc-tampon.paye{color:#1B7F4B;border-color:#1B7F4B}
  .doc-tampon.du{color:#C62828;border-color:#C62828}

  .doc-note{
    background:#F7F9FB;border-left:3px solid #F0A818;padding:2.5mm 3mm;
    font-size:8.5pt;margin-top:5mm;color:#16222E;
  }
  .doc-sign{display:flex;gap:10mm;margin-top:14mm}
  .doc-sign div{flex:1;border-top:1px solid #16222E;padding-top:1.5mm;
    font-size:8pt;color:#5F7183}
  .doc-pied{
    margin-top:8mm;border-top:1px solid #D9E0E6;padding-top:2.5mm;
    font-size:7.5pt;color:#5F7183;text-align:center;line-height:1.6;
  }
  .doc-pied b{color:#C62828;letter-spacing:1.5px}

  /* ── Propre au rapport financier ── */
  .doc-h2{
    font-size:9pt;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;
    color:#0B2545;border-bottom:1.5px solid #0B2545;padding-bottom:1mm;
    margin:6mm 0 2.5mm;
  }
  .doc-h2:first-of-type{margin-top:0}
  table.doc-t tfoot td{
    font-weight:bold;border-top:1.5px solid #0B2545;border-bottom:0;
    background:#F7F9FB;
  }
  .doc-t .creux{color:#5F7183;font-size:8.5pt}
  .doc-cadre{
    border:1.5px solid #0B2545;padding:3mm 4mm;margin-bottom:5mm;
  }
  .doc-cadre .ligne{display:flex;justify-content:space-between;padding:1mm 0;
    font-size:10pt}
  .doc-cadre .ligne.fort{font-size:12.5pt;font-weight:bold;border-top:1px solid #0B2545;
    margin-top:1.5mm;padding-top:2mm}
  .doc-alerte{
    border-left:3px solid #C62828;background:#FDF3F3;padding:2.5mm 3mm;
    font-size:8.5pt;margin-bottom:4mm;color:#8E1F1F;
  }
  .doc-ok{
    border-left:3px solid #1B7F4B;background:#F2F9F5;padding:2mm 3mm;
    font-size:8.5pt;margin-bottom:4mm;color:#145A32;
  }
  .doc-deux{display:flex;gap:6mm}
  .doc-deux > div{flex:1}
  .doc-saut{page-break-before:always}


  .etiquette{width:46mm;font-family:Arial,Helvetica,sans-serif;color:#000}
  .et-haut{text-align:center;font-size:8pt;font-weight:bold;
    border-bottom:1.5px solid #000;padding-bottom:1mm;margin-bottom:1.5mm;
    letter-spacing:.5px}
  .rec-t{font-size:12pt;font-weight:bold;text-align:center}
  .rec-l{font-size:8pt;display:flex;justify-content:space-between;padding:.5mm 0}
  .rec-art{font-size:7.5pt;padding:.4mm 0;border-bottom:1px dotted #999}
  .rec-sep{border-top:1px dashed #000;margin:1.5mm 0}
  .rec-tot{font-size:12pt;font-weight:bold;display:flex;justify-content:space-between;
    border-top:1.5px solid #000;padding-top:1mm;margin-top:1mm}
  .et-pied{font-size:6.5pt;text-align:center;margin-top:1.5mm;
    border-top:1px solid #000;padding-top:.8mm}
}

/* ── Journal : une ligne = un mouvement ── */
.mvt{
  display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;
  border:1px solid var(--bord);border-radius:11px;margin-bottom:7px;
  text-align:left;width:100%;
}
.mvt .pic{
  flex:none;width:30px;height:30px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-size:15px;
}
.mvt.rev .pic{background:#E8F5E9}
.mvt.dep .pic{background:#FFEBEE}
.mvt.app .pic{background:#FFF8E1}
.mvt .corps{flex:1;min-width:0}
/* Ces spans vivent dans un <button> : sans display:block, le titre et
   la description se collent l'un à l'autre sur une seule ligne. */
.mvt .t{display:block;font-size:13.5px;font-weight:700;color:var(--marine)}
.mvt .s{display:block;font-size:11.5px;color:var(--doux);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.mvt .m{flex:none;text-align:right;font-weight:800;font-size:14px;
  white-space:nowrap;line-height:1.25}
.mvt .m .d{display:block;font-size:11px;color:var(--doux);font-weight:600}
.mvt.rev .m{color:#1B7F4B}
.mvt.dep .m{color:#C0392B}
.mvt.app .m{color:#8A6100}
.mvt.annule{opacity:.5}
.mvt.annule .t{text-decoration:line-through}
.etiq{
  display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;
  padding:1px 5px;border-radius:5px;background:var(--bord);color:var(--doux);
  text-transform:uppercase;margin-left:5px;vertical-align:1px;
}
.etiq.neutre{background:#E3EAF2;color:#3A5A7A}
.etiq.stock{background:#EDE7F6;color:#5E35B1}

/* ── Séparateur de jour dans le journal ── */
.jour-sep{
  font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--doux);margin:14px 0 7px;display:flex;align-items:center;gap:8px;
}
.jour-sep:first-child{margin-top:2px}
.jour-sep::after{content:'';flex:1;height:1px;background:var(--bord)}

/* ── Filtres compacts ── */
.filtres{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.filtres select,.filtres input{
  flex:1;min-width:116px;padding:9px 10px;border:1px solid var(--bord);
  border-radius:9px;font-size:13.5px;background:#fff;color:var(--marine);
  font-family:inherit;
}
.puces{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px}
.puce{
  flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--bord);
  background:#fff;font-size:12.5px;font-weight:700;color:var(--doux);
}
.puce.actif{background:var(--marine);border-color:var(--marine);color:#fff}

/* ── Règles d'entrée d'un associé : vert / rouge, toutes visibles ── */
.regle{
  display:flex;gap:10px;align-items:flex-start;padding:10px 12px;

}

/* ── Barre de progression d'un versement ── */

  margin-bottom:14px}

  flex:1;border:0;background:none;padding:10px 4px;border-radius:8px;
  font-size:13.5px;font-weight:700;color:var(--doux);

  box-shadow:0 1px 3px rgba(14,68,41,.14)}
</style>
</head>
<body>

<div id="bandeau"><span>📴</span><span id="bandeau-txt">Hors ligne</span></div>
<div id="app"></div>
<div id="toast"></div>
<div id="zone-impression"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   FLASHIPPING — FINANCE
   Comptabilité, parts des associés, clôtures.

   Deux principes gouvernent tout ce fichier.

   1. FLUX NEUTRE. Certaines opérations déplacent de l'argent sans
      créer ni détruire de richesse : l'avance d'un client sur une
      commande, l'achat correspondant, un emprunt et son
      remboursement. Elles bougent la caisse, jamais le bénéfice.
      L'application le dit à chaque fois plutôt que de laisser croire
      à un gain.

   2. LE PARAMÈTRE NE SERT QU'À LA SAISIE. Chaque écriture emporte son
      taux, son prix, son pourcentage. Changer un paramètre demain ne
      retouche aucune ligne d'hier.

   Comme l'app Commandes, celle-ci exige le réseau : tout ce qu'on y
   fait touche la caisse.
   ═══════════════════════════════════════════════════════════════════ */

/* Le nom de cette application. Il part à chaque connexion : le
   serveur refuse lui-même un rôle qui n'a rien à faire ici, au
   lieu de délivrer un jeton qui ouvrirait les autres apps. */
var APP = 'finance';

var CLE_URL   = 'fls_api_url';
var CLE_TOKEN = 'fls_fin_token';
var CLE_USER  = 'fls_fin_user';
var CLE_CACHE = 'fls_fin_cache';

var S = {
  lire: function (c, d) {
    try { var v = localStorage.getItem(c); return v === null ? d : v; }
    catch (e) { return d; }
  },
  ecrire: function (c, v) { try { localStorage.setItem(c, v); } catch (e) {} },
  effacer: function (c) { try { localStorage.removeItem(c); } catch (e) {} },
  lireJson: function (c, d) {
    try { return JSON.parse(localStorage.getItem(c)) || d; } catch (e) { return d; }
  },
  ecrireJson: function (c, v) { S.ecrire(c, JSON.stringify(v)); }
};

var Etat = {
  url: S.lire(CLE_URL, ''),
  token: S.lire(CLE_TOKEN, ''),
  user: S.lireJson(CLE_USER, null),
  ref: null,
  onglet: 'caisse',
  vue: null
};

var CATEGORIES = ['Logistique', 'Commandes', 'Salaire', 'Loyer',
                  'Materiel', 'Communication', 'Dette', 'Autre'];
var SOURCES = ['Autre Revenu', 'Colis Livre', 'Commission Commande',
               'Avance Commande', 'Encaissement emprunt'];
/** Ces lignes bougent la caisse sans toucher au bénéfice. */
var NEUTRES = { 'Avance Commande': true, 'Encaissement emprunt': true,
                'Achat Commande': true, 'Remboursement dette': true };


// ═══════════════════════════════════════════════════════════════════
//  API
// ═══════════════════════════════════════════════════════════════════

function api(action, params) {
  params = params || {};
  if (!Etat.url) return Promise.reject(new Error('Aucune URL d\'API configurée.'));
  if (!navigator.onLine) {
    return Promise.reject(new Error(
      'Pas de réseau. Cette application écrit directement en caisse : ' +
      'elle ne peut pas travailler hors ligne.'));
  }

  var corps = Object.assign({ action: action }, params);
  if (Etat.token && !corps.token) corps.token = Etat.token;

  // text/plain : Apps Script ne répond pas au préalable CORS
  return fetch(Etat.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(corps),
    redirect: 'follow'
  })
  .then(function (r) { return r.text(); })
  .then(function (txt) {
    var d;
    try { d = JSON.parse(txt); }
    catch (e) {
      if (txt.indexOf('<!DOCTYPE') === 0 || txt.indexOf('<html') === 0) {
        throw new Error(Etat.token
          ? 'Google a renvoyé une page d\'erreur : le script a échoué ou a ' +
            'dépassé son temps d\'exécution. Regarde « Exécutions » dans ' +
            'Apps Script pour la cause exacte.'
          : 'L\'API a renvoyé une page web. Vérifie que le déploiement est ' +
            'réglé sur « Accès : Tout le monde ».');
      }
      throw new Error('Réponse illisible du serveur.');
    }
    if (d.ok === false) { var x = new Error(d.erreur || 'Erreur inconnue.');
                          x.metier = true; x.detail = d; throw x; }
    return d.data !== undefined ? d.data : d;
  })
  .catch(function (e) {
    if (e.metier) throw e;
    if (/Session expirée|Jeton/i.test(e.message)) { deconnecter(); throw e; }
    throw e;
  });
}


// ═══════════════════════════════════════════════════════════════════
//  OUTILS
// ═══════════════════════════════════════════════════════════════════

function e(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function n2(v) { return (Math.round((Number(v) || 0) * 100) / 100).toFixed(2); }
function n0(v) { return Math.round(Number(v) || 0).toLocaleString('fr-FR'); }
function usd(v) { return n2(v) + ' $'; }
function htg(v) { return n0(v) + ' HTG'; }
function pct(v) { return (Math.round((Number(v) || 0) * 100) / 100) + ' %'; }

/** Les gros montants se lisent mieux abrégés sur un téléphone. */
function court(v) {
  var n = Number(v) || 0, s = n < 0 ? '-' : '';
  n = Math.abs(n);
  if (n >= 1000000) return s + (n / 1000000).toFixed(1).replace('.0', '') + ' M';
  if (n >= 10000)   return s + Math.round(n / 1000) + ' k';
  return s + n0(n);
}

function dateCourte(d) {
  if (!d) return '';
  var x = new Date(d);
  if (isNaN(x)) return String(d).substring(0, 10);
  return ('0' + x.getDate()).slice(-2) + '/' + ('0' + (x.getMonth() + 1)).slice(-2) +
         '/' + x.getFullYear();
}
function aujourdhui() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) +
         '-' + ('0' + d.getDate()).slice(-2);
}
function premierDuMois() { return aujourdhui().substring(0, 8) + '01'; }

function toast(txt, genre) {
  var z = document.getElementById('toast');
  var d = document.createElement('div');
  if (genre) d.className = genre;
  d.textContent = txt;
  z.appendChild(d);
  setTimeout(function () { d.remove(); }, genre === 'ko' ? 5600 : 3200);
}

function bloc(msg, genre, icone) {
  return '<div class="msg ' + genre + '"><span class="ic">' + (icone || 'ℹ️') +
         '</span><span>' + e(msg) + '</span></div>';
}
function chargement(t) {
  return '<div class="chargement"><span class="tourne"></span>' +
         e(t || 'Chargement…') + '</div>';
}
function vide(ic, t) {
  return '<div class="vide"><div class="gros">' + ic + '</div>' + e(t) + '</div>';
}
function tauxUsd() {
  var p = (Etat.ref && Etat.ref.parametres) || {};
  return Number(p.TAUX_ACHAT_USD) || 135;
}


// ═══════════════════════════════════════════════════════════════════
//  SQUELETTE
// ═══════════════════════════════════════════════════════════════════

/**
 * Les onglets dépendent du rôle.
 *
 * Un comptable tient la caisse ; il ne voit ni la table des parts ni la
 * clôture. Ce n'est pas seulement un masquage d'écran : le serveur
 * refuse les mêmes actions. L'interface ne fait qu'éviter de proposer
 * une porte fermée.
 */
var TOUS_ONGLETS = [
  { id: 'caisse',   ic: '💰', nom: 'Caisse',   droit: 'voir_finance' },
  { id: 'saisie',   ic: '✍️', nom: 'Saisie',   droit: 'saisir_finance' },
  { id: 'journal',  ic: '📜', nom: 'Journal',  droit: 'voir_finance' },
  { id: 'associes', ic: '👥', nom: 'Associés', droit: 'voir_parts' },
  { id: 'cloture',  ic: '🔒', nom: 'Clôture',  droit: 'cloturer' }
];

var ONGLETS = TOUS_ONGLETS;

function majOnglets() {
  var d = (Etat.user && Etat.user.droits) || {};
  ONGLETS = TOUS_ONGLETS.filter(function (o) { return d[o.droit]; });
  if (!ONGLETS.length) ONGLETS = [TOUS_ONGLETS[0]];
  if (!ONGLETS.some(function (o) { return o.id === Etat.onglet; })) {
    Etat.onglet = ONGLETS[0].id;
  }
}

var Nav = { modaleOuverte: false };

function dessiner() {
  var app = document.getElementById('app');
  if (!Etat.url)   { app.innerHTML = ecranReglage(); return; }
  if (!Etat.token) { app.innerHTML = ecranConnexion(); chargerUtilisateurs(); return; }

  if (!Etat.user || !Etat.user.droits || !Etat.user.droits.voir_finance) {
    app.innerHTML =
      '<header class="entete"><h1>Finance<span class="sous">' +
      e(Etat.user ? Etat.user.nom : '') + '</span></h1>' +
      '<button class="btn-entete" onclick="deconnecter()">⏻</button></header>' +
      '<main>' + bloc('La comptabilité est réservée aux administrateurs. ' +
        'Ton compte n\'y a pas accès.', 'attention', '🔒') +
      '<button class="btn vide" onclick="deconnecter()">Se déconnecter</button></main>';
    return;
  }

  majOnglets();

  var u = Etat.user;
  app.innerHTML =
    '<header class="entete">' +
      '<span class="pastille' + (navigator.onLine ? '' : ' hors') + '"></span>' +
      '<h1>' + e(titreOnglet()) + '<span class="sous">' + e(u.nom) +
        ' · ' + e(u.role_libelle || u.role) + '</span></h1>' +
      '<button class="btn-entete" onclick="ouvrirReglages()">⚙️</button>' +
    '</header>' +
    '<main id="contenu">' + chargement() + '</main>' +
    '<nav>' + ONGLETS.map(function (o) {
      return '<button class="' + (Etat.onglet === o.id ? 'actif' : '') +
        '" onclick="allerA(\'' + o.id + '\')"><span class="ic">' + o.ic +
        '</span>' + e(o.nom) + '</button>';
    }).join('') + '</nav>';

  majBandeau();
  rendreOnglet();
}

function titreOnglet() {
  var o = ONGLETS.filter(function (x) { return x.id === Etat.onglet; })[0];
  return o ? o.nom : 'Finance';
}

function allerA(id) {
  if (Etat.onglet === id) return;
  Etat.onglet = id; Etat.vue = null;
  try { history.pushState({ onglet: id }, '', '#' + id); } catch (e2) {}
  dessiner();
}

window.addEventListener('popstate', function (ev) {
  if (Nav.modaleOuverte) { fermerModaleDom(); return; }
  var st = ev.state || {};
  if (st.onglet && st.onglet !== Etat.onglet) {
    Etat.onglet = st.onglet; Etat.vue = null; dessiner();
  }
});

function poser(h) { var c = document.getElementById('contenu'); if (c) c.innerHTML = h; }

function rendreOnglet() {
  switch (Etat.onglet) {
    case 'caisse':   return ongletCaisse();
    case 'saisie':   return ongletSaisie();
    case 'journal':  return ongletJournal();
    case 'associes': return ongletAssocies();
    case 'cloture':  return ongletCloture();
  }
}

function majBandeau() {
  var b = document.getElementById('bandeau');
  if (!b) return;
  b.className = navigator.onLine ? '' : 'vu';
  if (!navigator.onLine) {
    document.getElementById('bandeau-txt').textContent =
      'Hors ligne — la comptabilité ne peut rien enregistrer';
  }
  var p = document.querySelector('.pastille');
  if (p) p.className = 'pastille' + (navigator.onLine ? '' : ' hors');
}


// ═══════════════════════════════════════════════════════════════════
//  RÉGLAGE INITIAL ET CONNEXION
// ═══════════════════════════════════════════════════════════════════

function ecranReglage() {
  return '<header class="entete"><h1>Flashipping<span class="sous">' +
    'Première configuration</span></h1></header><main><div class="carte">' +
    bloc('Colle l\'URL de ton déploiement Apps Script — la même que pour les ' +
         'autres applications. Elle se termine par /exec.', 'info', '🔗') +
    '<label class="champ"><span>URL de l\'API</span>' +
    '<input type="url" id="in-url" placeholder="https://script.google.com/macros/s/…/exec" ' +
    'autocomplete="off" autocapitalize="off" spellcheck="false"></label>' +
    '<button class="btn" onclick="validerUrl()">Vérifier et continuer</button>' +
    '<div id="res-url"></div></div></main>';
}

function validerUrl() {
  var v = (document.getElementById('in-url').value || '').trim();
  var res = document.getElementById('res-url');

  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(v)) {
    res.innerHTML = bloc('L\'URL doit finir par /exec, pas /dev.', 'ko', '⚠️');
    return;
  }
  res.innerHTML = chargement('Vérification…');
  Etat.url = v;

  api('diag').then(function (d) {
    var manquants = [];
    if (d.modules) {
      if (!d.modules.finance) manquants.push('Finance.gs');
      if (!d.modules.parts)   manquants.push('Parts_Associes.gs');
    }
    if (manquants.length) {
      Etat.url = '';
      res.innerHTML = bloc('L\'API répond, mais ' + manquants.join(' et ') +
        ' n\'y est pas enregistré. Ouvre le projet Apps Script, enregistre ' +
        'le fichier, puis redéploie une nouvelle version.', 'ko', '❌');
      return;
    }
    S.ecrire(CLE_URL, v);
    toast('API joignable.', 'ok');
    dessiner();
  }).catch(function (err) {
    Etat.url = '';
    res.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function ecranConnexion() {
  return '<header class="entete"><h1>Flashipping<span class="sous">Finance' +
    '</span></h1></header><main><div class="carte">' +
    '<div id="liste-users">' + chargement('Chargement des comptes…') + '</div></div>' +
    '<button class="btn vide petit" onclick="changerUrl()">Changer l\'URL de l\'API</button>' +
    '</main>';
}

function chargerUtilisateurs() {
  api('utilisateurs_publics', { app: APP }).then(function (liste) {
    var z = document.getElementById('liste-users');
    if (!z) return;
    /* Le serveur n'a renvoyé que les comptes qui peuvent entrer dans la
       Finance. Un second filtre ici ne protégerait rien et finirait par
       oublier un rôle ajouté plus tard. */
    var admins = liste;
    if (!admins.length) {
      z.innerHTML = bloc('Aucun compte administrateur ou comptable actif.',
                         'attention', '⚠️');
      return;
    }
    z.innerHTML =
      '<label class="champ"><span>Qui es-tu ?</span><select id="in-user">' +
      admins.map(function (u) {
        return '<option value="' + e(u.user_id) + '">' + e(u.nom) + ' — ' +
               e(u.role_libelle || u.role) + '</option>';
      }).join('') + '</select></label>' +
      '<label class="champ"><span>Code à 6 chiffres</span>' +
      '<input type="password" id="in-code" inputmode="numeric" maxlength="6" ' +
      'autocomplete="current-password" style="text-align:center;font-size:25px;' +
      'letter-spacing:9px;font-weight:700"></label>' +
      '<button class="btn" id="btn-login" onclick="connecter()">Entrer</button>' +
      '<div id="res-login"></div>';

    var ic = document.getElementById('in-code');
    ic.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') connecter(); });
    ic.addEventListener('input', function () { if (ic.value.length === 6) connecter(); });
  }).catch(function (err) {
    var z = document.getElementById('liste-users');
    if (z) z.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function connecter() {
  var uid = document.getElementById('in-user').value;
  var code = document.getElementById('in-code').value;
  var b = document.getElementById('btn-login');
  var res = document.getElementById('res-login');

  if (!/^\d{6}$/.test(code)) { res.innerHTML = bloc('Six chiffres.', 'ko', '⚠️'); return; }
  b.disabled = true; b.textContent = 'Connexion…'; res.innerHTML = '';

  api('login', { user_id: uid, code: code, app: APP }).then(function (d) {
    Etat.token = d.token; Etat.user = d.utilisateur;
    S.ecrire(CLE_TOKEN, d.token); S.ecrireJson(CLE_USER, d.utilisateur);
    verifierVersion();
    return chargerReferentiels();
  }).then(function () {
    toast('Bienvenue ' + (Etat.user.nom || '') + '.', 'ok');
    dessiner();
  }).catch(function (err) {
    b.disabled = false; b.textContent = 'Entrer';
    document.getElementById('in-code').value = '';
    res.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function chargerReferentiels() {
  return api('referentiels').then(function (r) {
    Etat.ref = r;
    S.ecrireJson(CLE_CACHE, { ref: r, date: Date.now() });
    return r;
  }).catch(function (err) {
    var c = S.lireJson(CLE_CACHE, null);
    if (c && c.ref) { Etat.ref = c.ref; return c.ref; }
    throw err;
  });
}

function deconnecter() {
  S.effacer(CLE_TOKEN); S.effacer(CLE_USER);
  Etat.token = ''; Etat.user = null; Etat.onglet = 'caisse';
  dessiner();
}

function changerUrl() {
  if (!confirm('Changer l\'URL de l\'API ? Tu devras te reconnecter.')) return;
  S.effacer(CLE_URL); S.effacer(CLE_TOKEN); S.effacer(CLE_USER);
  Etat.url = ''; Etat.token = ''; Etat.user = null;
  dessiner();
}


// ═══════════════════════════════════════════════════════════════════
//  ONGLET CAISSE
// ═══════════════════════════════════════════════════════════════════

function ongletCaisse() {
  poser(chargement('Calcul des soldes…'));

  api('soldes').then(function (d) {
    Etat.vue = d;
    var taux = d.taux_achat || tauxUsd();
    var profit = Number(d.profit_gdes) || 0;

    var h =
      '<div class="chiffre ' + (profit < 0 ? 'negatif' : 'positif') + '">' +
        '<div class="v">' + court(profit) + '</div>' +
        '<div class="l">bénéfice en gourdes</div>' +
        '<div class="s">' + usd(d.profit_usd) + ' · taux ' + n0(taux) + '</div>' +
      '</div>' +

      '<div class="stats" style="margin-bottom:14px">' +
        '<div class="stat"><div class="v" style="color:var(--vert)">' +
          court(d.total_revenus_gdes) + '</div><div class="l">revenus</div></div>' +
        '<div class="stat"><div class="v" style="color:var(--rouge)">' +
          court(d.total_depenses_gdes) + '</div><div class="l">dépenses</div></div>' +
        (d.tresorerie_gdes !== undefined
          ? '<div class="stat"><div class="v">' + court(d.tresorerie_gdes) +
            '</div><div class="l">trésorerie</div></div>' : '') +
      '</div>';

    if (d.depuis_cloture) {
      h += bloc('Ces chiffres repartent de la clôture du ' +
                dateCourte(d.depuis_cloture) + '.', 'info', '🔒');
    }

    // Le serveur retire la répartition et les associés quand le rôle
    // n'y a pas droit : on ne dessine donc rien plutôt que des zéros.
    if (d.parts_masquees) {
      h += bloc(d.note_acces || 'La répartition entre associés est réservée ' +
                'à l\'administrateur.', 'info', '🔒');
      h += '<div class="rangee-btn" style="margin-top:14px">' +
        '<button class="btn vide petit" onclick="allerA(\'saisie\')">✍️ Saisir</button>' +
        '<button class="btn vide petit" onclick="ouvrirEtats()">📊 États financiers</button>' +
        '</div>';
      poser(h);
      return;
    }

    // ── La clé de répartition, expliquée à l'écran ──
    var r = d.repartition || {};
    h += '<div class="titre-section">Clé de répartition du bénéfice</div>' +
      '<div class="carte">' +
        '<div style="font-weight:800;font-size:16px;text-transform:uppercase;' +
          'letter-spacing:.5px">' + e(r.mode || d.mode_repartition) + '</div>' +
        '<div style="font-size:13px;color:var(--doux);margin:6px 0 10px;' +
          'line-height:1.4">' + e(r.note || '') + '</div>' +
        (r.mode === 'mixte'
          ? '<div class="total"><span class="l">Rôles actifs</span><b>' +
            r.nb_roles_actifs + '</b></div>' +
            (Number(r.points_role_perdus) > 0.01
              ? '<div class="total"><span class="l">Points de rôle non ' +
                'attribués</span><b style="color:var(--orange)">' +
                n2(r.points_role_perdus) + '</b></div>' : '')
          : '') +
        (Number(r.capital_cible_gdes) > 0
          ? '<div class="total"><span class="l">Capital appelé</span><span>' +
            htg(r.capital_cible_gdes) + '</span></div>' +
            '<div class="total"><span class="l">Versé</span><b>' +
            htg(r.capital_verse_gdes) + '</b></div>' +
            (Number(r.capital_manquant_gdes) > 0
              ? '<div class="total"><span class="l">Manquant</span>' +
                '<b style="color:var(--rouge)">' + htg(r.capital_manquant_gdes) +
                '</b></div>' : '')
          : '') +
      '</div>';

    // ── Le solde de chaque associé ──
    var liste = d.associes || d.soldes_associes || [];
    if (liste.length) {
      h += '<div class="titre-section">Solde de chaque associé</div>';
      h += liste.map(function (a) {
        var neg = Number(a.solde_gdes) < 0;

          e(a.associe_id) + '\')"><div class="corps">' +

          '<div class="t2">' + pct(a.part_pourcentage) + ' du bénéfice' +
            (a.role_nom ? ' · ' + e(a.role_nom) : '') +
            (a.role_actif ? '' : ' · sans rôle') + '</div></div>' +

            court(a.solde_gdes) + '</div>' +
          '<div style="font-size:11.5px;color:var(--doux)">HTG</div></div></button>';
      }).join('');
    }

    h += '<div class="rangee-btn" style="margin-top:14px">' +
      '<button class="btn vide petit" onclick="allerA(\'saisie\')">✍️ Saisir</button>' +
      '<button class="btn vide petit" onclick="ouvrirEtats()">📊 États financiers</button>' +
      '</div>';

    poser(h);
  }).catch(function (err) { poser(bloc(err.message, 'ko', '❌')); });
}

var Saisie = { type: 'depense' };

function ongletSaisie() {
  poser(
    '<div class="segments">' +
      ['depense', 'revenu', 'contribution'].map(function (t) {
        var nom = t === 'depense' ? 'Dépense' : (t === 'revenu' ? 'Revenu' : 'Apport');
        return '<button class="' + (Saisie.type === t ? 'actif' : '') +
          '" onclick="choisirSaisie(\'' + t + '\')">' + nom + '</button>';
      }).join('') +
    '</div>' +
    '<div id="form-saisie"></div>'
  );
  rendreFormulaire();
}

function choisirSaisie(t) { Saisie.type = t; ongletSaisie(); }

function champMontant(id) {
  return '<div class="duo">' +
    '<label class="champ"><span>Montant</span>' +
      '<input type="number" id="' + id + '-montant" step="0.01" min="0" ' +
      'inputmode="decimal" oninput="majConversion(\'' + id + '\')"></label>' +
    '<label class="champ"><span>Devise</span>' +
      '<select id="' + id + '-devise" onchange="majConversion(\'' + id + '\')">' +
      '<option value="Gourdes">Gourdes</option>' +
      '<option value="USD">Dollars</option></select></label>' +
  '</div>' +
  '<div id="' + id + '-conv" class="total" style="margin-top:-6px"></div>';
}

/**
 * La conversion s'affiche AVANT l'enregistrement.
 *
 * Le taux d'achat et le taux de vente diffèrent : une dépense saisie
 * en dollars ne vaut pas le même nombre de gourdes qu'un revenu du
 * même montant. Montrer le résultat ici évite d'avoir à le découvrir
 * dans le classeur.
 */
function majConversion(id) {
  var z = document.getElementById(id + '-conv');
  if (!z) return;
  var m = Number(document.getElementById(id + '-montant').value) || 0;
  var dev = document.getElementById(id + '-devise').value;
  if (!m) { z.innerHTML = ''; return; }

  var p = (Etat.ref && Etat.ref.parametres) || {};
  var achat = Number(p.TAUX_ACHAT_USD) || 135;
  var vente = Number(p.TAUX_VENTE_USD) || 130;
  // Un revenu encaissé en dollars se convertit au taux de VENTE.
  var taux = dev === 'USD'
    ? (Saisie.type === 'revenu' ? vente : achat)
    : achat;

  var perso = document.getElementById(id + '-taux');
  if (perso && perso.value) taux = Number(perso.value);

  z.innerHTML = dev === 'USD'
    ? '<span class="l">Au taux ' + n0(taux) + '</span><b>' + htg(m * taux) + '</b>'
    : '<span class="l">Au taux ' + n0(taux) + '</span><b>' + usd(m / taux) + '</b>';
}

function rendreFormulaire() {
  var z = document.getElementById('form-saisie');
  if (Saisie.type === 'depense')      z.innerHTML = formDepense();
  else if (Saisie.type === 'revenu')  z.innerHTML = formRevenu();
  else                                 z.innerHTML = formContribution();

  if (Saisie.type === 'contribution') chargerAssociesPourApport();
}

// ═══════════════════════════════════════════════════════════════════
//  ONGLET JOURNAL — mouvements et rapport
// ═══════════════════════════════════════════════════════════════════

/**
 * Deux écrans sous un seul onglet, et ce n'est pas de l'économie de
 * place : ils répondent à la même question à deux échelles. Le journal
 * dit « qu'est-ce qui s'est passé », le rapport dit « qu'est-ce que ça
 * a donné ». Les deux partagent donc le même sélecteur de période —
 * on choisit septembre une fois, et on peut passer du détail au total
 * sans resaisir les dates.
 */
var Jrn = {
  vue: 'mouvements',
  genre: 'tout',
  type: 'mensuel',
  ref: '',
  debut: '',
  fin: '',
  cherche: '',
  annules: false,
  depuis: 0,
  data: null,
  rapport: null,
  etats: null
};

var PERIODES = [
  { id: 'tout',        nom: 'Tout' },
  { id: 'journalier',  nom: 'Jour' },
  { id: 'hebdomadaire', nom: 'Semaine' },
  { id: 'mensuel',     nom: 'Mois' },
  { id: 'trimestriel', nom: 'Trimestre' },
  { id: 'semestriel',  nom: 'Semestre' },
  { id: 'annuel',      nom: 'Année' },
  { id: 'libre',       nom: 'Dates…' }
];

/**
 * Les paramètres de période envoyés au serveur.
 *
 * Le serveur est seul à calculer les bornes : lui demander « le mois
 * du 15 septembre » plutôt que « du 1er au 30 septembre » évite d'avoir
 * deux calendriers, un sur le téléphone et un sur le serveur, qui
 * finiraient par ne plus dire la même chose (fin de mois, février,
 * semaine à cheval sur deux années).
 */
function jrnPeriode() {
  if (Jrn.type === 'tout') return {};
  if (Jrn.type === 'libre') {
    return { type_periode: 'libre', debut: Jrn.debut, fin: Jrn.fin };
  }
  return { type_periode: Jrn.type, ref: Jrn.ref || aujourdhui() };
}

function jrnPeriodePrete() {
  if (Jrn.type === 'libre') return !!(Jrn.debut && Jrn.fin);
  return true;
}

function ongletJournal() {
  if (!Jrn.ref) {
    Jrn.ref = aujourdhui();
    Jrn.debut = premierDuMois();
    Jrn.fin = aujourdhui();
  }

  poser(
    '<div class="segments">' +
      '<button class="' + (Jrn.vue === 'mouvements' ? 'actif' : '') +
        '" onclick="jrnVue(\'mouvements\')">Mouvements</button>' +
      '<button class="' + (Jrn.vue === 'rapport' ? 'actif' : '') +
        '" onclick="jrnVue(\'rapport\')">Rapport</button>' +
    '</div>' +
    '<div id="jrn-periode">' + jrnSelecteur() + '</div>' +
    '<div id="jrn-corps">' + chargement() + '</div>'
  );

  jrnCharger();
}

function jrnVue(v) {
  Jrn.vue = v; Jrn.depuis = 0;
  ongletJournal();
}

/** Le sélecteur de période, commun aux deux écrans. */
function jrnSelecteur() {
  var h = '<div class="puces">' + PERIODES.filter(function (p) {
    // Un rapport sans période n'a pas de sens : on ne propose « Tout »
    // que pour la liste des mouvements.
    return !(p.id === 'tout' && Jrn.vue === 'rapport');
  }).map(function (p) {
    return '<button class="puce' + (Jrn.type === p.id ? ' actif' : '') +
      '" onclick="jrnType(\'' + p.id + '\')">' + e(p.nom) + '</button>';
  }).join('') + '</div>';

  if (Jrn.type === 'libre') {
    h += '<div class="filtres">' +
      '<input type="date" id="jrn-d1" value="' + e(Jrn.debut) +
        '" onchange="jrnDates()" aria-label="Du">' +
      '<input type="date" id="jrn-d2" value="' + e(Jrn.fin) +
        '" onchange="jrnDates()" aria-label="Au">' +
      '</div>';
  } else if (Jrn.type === 'mensuel') {
    h += '<div class="filtres">' +
      '<input type="month" id="jrn-mois" value="' + e(String(Jrn.ref).substring(0, 7)) +
        '" onchange="jrnMois()" aria-label="Mois">' +
      '</div>';
  } else if (Jrn.type !== 'tout') {
    h += '<div class="filtres">' +
      '<input type="date" id="jrn-ref" value="' + e(Jrn.ref) +
        '" onchange="jrnRef()" aria-label="Date de référence">' +
      '</div>' +
      '<div class="aide">N\'importe quel jour de la période voulue : ' +
        'le ' + e(dateCourte(Jrn.ref)) + ' sort ' +
        (Jrn.type === 'journalier' ? 'cette journée'
          : Jrn.type === 'hebdomadaire' ? 'sa semaine entière'
          : Jrn.type === 'trimestriel' ? 'son trimestre entier'
          : Jrn.type === 'semestriel' ? 'son semestre entier'
          : 'son année entière') + '.</div>';
  }

  return h;
}

function jrnType(t) {
  Jrn.type = t; Jrn.depuis = 0;
  ongletJournal();
}
function jrnDates() {
  Jrn.debut = document.getElementById('jrn-d1').value;
  Jrn.fin = document.getElementById('jrn-d2').value;
  Jrn.depuis = 0;
  if (jrnPeriodePrete()) jrnCharger();
}
function jrnMois() {
  var m = document.getElementById('jrn-mois').value;   // AAAA-MM
  // Le 15 : au milieu du mois, hors de portée des décalages de fuseau.
  if (m) { Jrn.ref = m + '-15'; Jrn.depuis = 0; jrnCharger(); }
}
function jrnRef() {
  Jrn.ref = document.getElementById('jrn-ref').value;
  Jrn.depuis = 0;
  var s = document.getElementById('jrn-periode');
  if (s) s.innerHTML = jrnSelecteur();
  jrnCharger();
}

function jrnCorps(h) {
  var c = document.getElementById('jrn-corps');
  if (c) c.innerHTML = h;
}

function jrnCharger() {
  if (!jrnPeriodePrete()) {
    jrnCorps(bloc('Choisis une date de début et une date de fin.', 'info', '📅'));
    return;
  }
  return Jrn.vue === 'rapport' ? jrnChargerRapport() : jrnChargerMouvements();
}


// ── Les mouvements ─────────────────────────────────────────────────

function jrnChargerMouvements() {
  jrnCorps(chargement('Lecture du journal…'));

  var p = Object.assign({
    genre: Jrn.genre,
    cherche: Jrn.cherche,
    depuis: Jrn.depuis,
    limite: 40
  }, jrnPeriode());
  if (Jrn.annules) p.inclure_annules = 'Oui';

  return api('historique', p).then(function (d) {
    Jrn.data = d;
    jrnCorps(jrnVueMouvements(d));
  }).catch(function (err) {
    jrnCorps(bloc(err.message, 'ko', '⚠️'));
  });
}

var GENRES = [
  { id: 'tout',    nom: 'Tout' },
  { id: 'revenu',  nom: 'Revenus' },
  { id: 'depense', nom: 'Dépenses' },
  { id: 'apport',  nom: 'Apports' }
];

function jrnVueMouvements(d) {
  var t = d.totaux || {};

  var h =
    '<div class="filtres">' +
      '<select onchange="jrnGenre(this.value)">' + GENRES.map(function (g) {
        return '<option value="' + g.id + '"' + (Jrn.genre === g.id ? ' selected' : '') +
          '>' + e(g.nom) + '</option>';
      }).join('') + '</select>' +
      '<input type="search" id="jrn-q" placeholder="Chercher…" value="' + e(Jrn.cherche) +
        '" onchange="jrnChercher()" autocomplete="off">' +
    '</div>' +

    '<div class="stats" style="margin-bottom:12px">' +
      '<div class="stat"><div class="v" style="color:var(--vert)">' +
        court(t.revenus_gdes) + '</div><div class="l">revenus</div></div>' +
      '<div class="stat"><div class="v" style="color:var(--rouge)">' +
        court(t.depenses_gdes) + '</div><div class="l">dépenses</div></div>' +
      '<div class="stat"><div class="v">' + court(t.profit_gdes) +
        '</div><div class="l">bénéfice</div></div>' +
    '</div>';

  // Les lignes qui ne pèsent pas sur le bénéfice sont annoncées, sinon
  // les totaux au-dessus semblent faux par rapport à la liste en bas.
  var aside = [];
  if (t.revenus_neutres_gdes) aside.push(htg(t.revenus_neutres_gdes) + ' d\'avances encaissées');
  if (t.depenses_neutres_gdes) aside.push(htg(t.depenses_neutres_gdes) + ' d\'achats pour clients');
  if (t.entrees_stock_gdes) aside.push(htg(t.entrees_stock_gdes) + ' partis en stock');
  if (t.apports_gdes) aside.push(htg(t.apports_gdes) + ' d\'apports');
  if (aside.length) {
    h += bloc('Hors bénéfice : ' + aside.join(', ') + '.', 'info', '↔️');
  }

  if (!d.lignes.length) {
    h += vide('📭', Jrn.cherche ? 'Rien ne correspond à cette recherche.'
                                : 'Aucun mouvement sur cette période.');
    return h + jrnPiedListe(d);
  }

  var jourCourant = '';
  d.lignes.forEach(function (l) {
    var j = dateCourte(l.date);
    if (j !== jourCourant) {
      jourCourant = j;
      h += '<div class="jour-sep">' + e(j) + '</div>';
    }
    h += jrnLigne(l);
  });

  return h + jrnPiedListe(d);
}

function jrnPiedListe(d) {
  var h = '<div class="aide" style="text-align:center;margin-top:12px">' +
    n0(Math.min(d.depuis + d.lignes.length, d.total)) + ' sur ' + n0(d.total) +
    ' mouvement' + (d.total > 1 ? 's' : '') + '</div>';

  if (d.reste > 0) {
    h += '<button class="btn vide" onclick="jrnPlus()">Voir ' +
      Math.min(d.reste, 40) + ' de plus</button>';
  }
  h += '<button class="btn vide" onclick="jrnAnnules()">' +
    (Jrn.annules ? 'Masquer les écritures annulées' : 'Montrer les écritures annulées') +
    '</button>';
  return h;
}

var ICONES_GENRE = { revenu: '↘', depense: '↗', apport: '👤' };
var CLASSE_GENRE = { revenu: 'rev', depense: 'dep', apport: 'app' };

function jrnLigne(l) {
  var annule = l.statut === 'Annule';
  var signe = l.genre === 'depense' ? '−'
            : (l.genre === 'apport' && l.sens === -1) ? '−' : '+';

  var marques = '';
  if (l.neutre && l.genre !== 'apport') marques += '<span class="etiq neutre">neutre</span>';
  if (l.entree_stock) marques += '<span class="etiq stock">stock</span>';
  if (annule) marques += '<span class="etiq">annulée</span>';

  return '<button class="mvt ' + CLASSE_GENRE[l.genre] + (annule ? ' annule' : '') +
    '" onclick="jrnDetail(\'' + e(l.genre) + '\',\'' + e(l.id) + '\')">' +
    '<span class="pic">' + ICONES_GENRE[l.genre] + '</span>' +
    '<span class="corps">' +
      '<span class="t">' + e(l.libelle) + marques + '</span>' +
      '<span class="s">' + e(l.description || l.reference || l.id) + '</span>' +
    '</span>' +
    '<span class="m">' + signe + court(l.montant_gdes) +
      '<span class="d">' + usd(l.montant_usd) + '</span></span>' +
    '</button>';
}

function jrnGenre(g) { Jrn.genre = g; Jrn.depuis = 0; jrnChargerMouvements(); }
function jrnChercher() {
  Jrn.cherche = document.getElementById('jrn-q').value;
  Jrn.depuis = 0; jrnChargerMouvements();
}
function jrnPlus() {
  Jrn.depuis += (Jrn.data && Jrn.data.lignes.length) || 40;
  jrnChargerMouvements();
}
function jrnAnnules() { Jrn.annules = !Jrn.annules; Jrn.depuis = 0; jrnChargerMouvements(); }

/** Le détail d'un mouvement, avec de quoi l'annuler si on en a le droit. */
function jrnDetail(genre, id) {
  var l = null;
  (Jrn.data ? Jrn.data.lignes : []).forEach(function (x) {
    if (x.genre === genre && x.id === id) l = x;
  });
  if (!l) return;

  var peut = Etat.user && Etat.user.droits && Etat.user.droits.saisir_finance;
  var titres = { revenu: 'Revenu', depense: 'Dépense', apport: 'Mouvement d\'associé' };

  var h = '<div class="chiffre"><div class="v">' + htg(l.montant_gdes) + '</div>' +
    '<div class="l">' + e(l.libelle) + '</div>' +
    '<div class="s">' + usd(l.montant_usd) + ' · saisi en ' +
      e(l.devise_saisie || '—') + ' au taux ' + n0(l.taux_applique) + '</div></div>';

  h += '<div class="carte">' + [
    ['Référence', l.id],
    ['Date', dateCourte(l.date)],
    ['Description', l.description],
    ['Catégorie', l.categorie],
    ['Agence', l.agence_id],
    ['Rattaché à', l.reference],
    ['Saisi par', l.saisi_par],
    ['Statut', l.statut],
    ['Note', l.note]
  ].filter(function (r) { return r[1]; }).map(function (r) {
    return '<div class="total"><span class="l">' + e(r[0]) + '</span><b>' + e(r[1]) + '</b></div>';
  }).join('') + '</div>';

  if (l.neutre && l.genre !== 'apport') {
    h += bloc('Ce mouvement traverse la caisse sans toucher au bénéfice : ' +
      'c\'est l\'argent d\'un client qui entre puis ressort.', 'info', '↔️');
  }
  if (l.entree_stock) {
    h += bloc('Cet achat est devenu du stock : il sort de la caisse mais ' +
      'ne pèse sur le bénéfice qu\'à la vente.', 'info', '📦');
  }

  if (peut && l.statut !== 'Annule') {
    h += '<label class="champ"><span>Motif d\'annulation</span>' +
      '<input type="text" id="jrn-motif" placeholder="Erreur de saisie, doublon…" ' +
      'autocomplete="off"></label>' +
      '<button class="btn rouge" id="jrn-btn-annul" onclick="jrnAnnuler(\'' +
        e(genre) + '\',\'' + e(id) + '\')">Annuler cette écriture</button>' +
      '<div class="aide">Rien n\'est effacé : la ligne reste au journal, ' +
        'marquée annulée, avec ton nom et le motif.</div>';
  }

  modale(titres[genre] || 'Mouvement', h);
}

function jrnAnnuler(genre, id) {
  var motif = (document.getElementById('jrn-motif') || {}).value || '';
  if (!motif.trim()) { toast('Le motif est obligatoire.', 'ko'); return; }

  var b = document.getElementById('jrn-btn-annul');
  b.disabled = true; b.textContent = 'Annulation…';

  // Le journal parle d'« apport » ; la table s'appelle Contributions.
  var type = genre === 'apport' ? 'contribution' : genre;

  api('annuler', { type: type, id: id, motif: motif.trim() }).then(function () {
    toast('Écriture annulée.', 'ok');
    fermerModale();
    jrnChargerMouvements();
  }).catch(function (err) {
    b.disabled = false; b.textContent = 'Annuler cette écriture';
    toast(err.message, 'ko');
  });
}


// ── Le rapport ─────────────────────────────────────────────────────

function jrnChargerRapport() {
  jrnCorps(chargement('Calcul du rapport…'));
  var p = jrnPeriode();

  return Promise.all([
    api('rapport', Object.assign({ type_rapport: p.type_periode || 'mensuel' }, p)),
    api('etats_financiers', p)
  ]).then(function (r) {
    Jrn.rapport = r[0]; Jrn.etats = r[1];
    jrnCorps(jrnVueRapport(r[0], r[1]));
  }).catch(function (err) {
    jrnCorps(bloc(err.message, 'ko', '⚠️'));
  });
}

function jrnVueRapport(r, f) {
  // Montant exact, pas abrégé : sur un rapport, « 16 k » ne sert à rien.
  // Les tuiles en dessous gardent la forme courte, elles ne servent qu'à
  // donner l'ordre de grandeur d'un coup d'œil.
  var h = '<div class="chiffre ' + (r.profit_gdes < 0 ? 'negatif' : 'positif') + '">' +
    '<div class="v" style="font-size:27px">' + htg(r.profit_gdes) + '</div>' +
    '<div class="l">bénéfice · ' + e(r.libelle_periode) + '</div>' +
    '<div class="s">' + usd(r.profit_usd) + ' · marge ' + pct(r.marge_pct) + '</div></div>';

  (r.avertissements || []).forEach(function (a) { h += bloc(a, 'attention', '⚠️'); });
  if (r.controle && r.controle.equilibre) {
    h += bloc('Caisse et bénéfice se recoupent au centime.', 'ok', '✅');
  }

  h += '<div class="stats" style="margin-bottom:12px">' +
    '<div class="stat"><div class="v" style="color:var(--vert)">' +
      court(r.revenus_gdes) + '</div><div class="l">revenus</div></div>' +
    '<div class="stat"><div class="v" style="color:var(--rouge)">' +
      court(r.depenses_gdes) + '</div><div class="l">dépenses</div></div>' +
    '<div class="stat"><div class="v">' + court(r.variation_tresorerie_gdes) +
      '</div><div class="l">caisse</div></div>' +
    '</div>';

  h += jrnTableau('Revenus par source', r.par_source, r.revenus_gdes);
  h += jrnTableau('Dépenses par catégorie', r.par_categorie, r.depenses_gdes);

  var ag = Object.keys(r.par_agence || {});
  if (ag.length > 1) {
    h += '<div class="titre-section">Par agence</div><div class="carte">' +
      ag.map(function (k) {
        var a = r.par_agence[k];
        return '<div class="total"><span class="l">' + e(k) + '</span><b>' +
          htg(a.marge) + '</b></div>';
      }).join('') + '</div>';
  }

  if (r.poids_livre_lb) {
    h += '<div class="carte"><div class="total"><span class="l">Poids livré</span><b>' +
      n2(r.poids_livre_lb) + ' lb</b></div>' +
      '<div class="total"><span class="l">Revenu par livre</span><b>' +
      htg(r.revenu_par_lb_gdes) + '</b></div></div>';
  }

  if (f && f.bilan) {
    h += '<div class="titre-section">Bilan au ' + e(f.periode.fin || r.periode.fin) + '</div>' +
      '<div class="carte">' +
      '<div class="total"><span class="l">Total actif</span><b>' + htg(f.bilan.actif.total_gdes) + '</b></div>' +
      '<div class="total"><span class="l">Total passif</span><b>' + htg(f.bilan.passif.total_gdes) + '</b></div>' +
      (f.bilan.equilibre
        ? '<div class="total"><span class="l">Équilibre</span><b style="color:var(--vert)">✓</b></div>'
        : '<div class="total"><span class="l">Écart</span><b style="color:var(--rouge)">' +
          htg(f.bilan.ecart_gdes) + '</b></div>') +
      '</div>';
    (f.avertissements || []).forEach(function (a) { h += bloc(a, 'attention', '⚠️'); });
  }

  h += '<button class="btn" onclick="jrnImprimer()">🖨️ Imprimer le rapport</button>';
  h += '<div class="aide">Format A4, en-tête de l\'entreprise, compte de ' +
    'résultat et bilan. De quoi classer un dossier par mois.</div>';
  return h;
}

function jrnTableau(titre, objet, total) {
  var cles = Object.keys(objet || {});
  if (!cles.length) return '';
  cles.sort(function (a, b) { return objet[b] - objet[a]; });

  return '<div class="titre-section">' + e(titre) + '</div><div class="carte">' +
    cles.map(function (k) {
      var part = total > 0 ? Math.round(objet[k] / total * 100) : 0;
      return '<div class="total"><span class="l">' + e(k) +
        (part ? ' <span class="etiq">' + part + ' %</span>' : '') +
        '</span><b>' + htg(objet[k]) + '</b></div>';
    }).join('') + '</div>';
}


// ═══════════════════════════════════════════════════════════════════
//  IMPRESSION — rapport financier A4
// ═══════════════════════════════════════════════════════════════════

/**
 * Le format de page se décide au clic, pas dans la feuille de style.
 *
 * `@page` ne peut pas se conditionner par une classe : une règle fixe
 * dans le CSS imprimerait le rapport financier sur un ticket de 50 mm.
 * On injecte donc la bonne règle juste avant d'appeler window.print().
 */
function imprimer(html, format) {
  var ancienne = document.getElementById('regle-page');
  if (ancienne) ancienne.remove();

  var st = document.createElement('style');
  st.id = 'regle-page';
  st.textContent = format === 'ticket'
    ? '@media print{@page{size:50mm auto;margin:2mm}}'
    : '@media print{@page{size:A4;margin:12mm}}';
  document.head.appendChild(st);

  document.getElementById('zone-impression').innerHTML = html;
  setTimeout(function () { window.print(); }, 150);
}

/**
 * Ce qui s'imprime sur les documents.
 *
 * Rien n'est figé dans le code : l'administrateur change le nom, le
 * slogan et les coordonnées depuis ⚙️ Réglages. Les valeurs ci-dessous
 * ne servent que si le paramètre a été effacé du classeur.
 */
function marque_(cle, defaut) {
  var p = (Etat.ref && Etat.ref.parametres) || {};
  var v = p[cle];
  return (v === undefined || v === null || String(v).trim() === '')
    ? defaut : String(v);
}

var MARQUE_DEFAUT = {
  nom: 'FLASHIPPING',
  slogan: 'FAST AND SECURE',
  creole: 'PI RAPID · PI SEKIRIZE · PI BA PRI',
  coord: '+509 43 31 40 28  ·  +509 47 15 64 24 | contact@flashipping-haiti.com'
         + ' | www.flashipping-haiti.com'
};

function coordonnees_() {
  return marque_('COORDONNEES_DOC', MARQUE_DEFAUT.coord)
    .split('|').map(function (x) { return x.trim(); })
    .filter(function (x) { return x; });
}

function enteteDoc(titre, reference, date) {
  var ent = marque_('NOM_ENTREPRISE', MARQUE_DEFAUT.nom);
  return '<div class="doc-tete">' +
      '<div><div class="doc-marque">' + e(ent) +
        ' <span class="doc-eclair">⚡</span></div>' +
        '<div class="doc-slogan">' +
          e(marque_('SLOGAN_DOC', MARQUE_DEFAUT.slogan)) + '</div></div>' +
      '<div class="doc-coord">' + coordonnees_().map(e).join('<br>') + '</div>' +
    '</div>' +
    '<div class="doc-titre"><span>' + e(titre) + '</span>' +
      '<span>' + e(reference) + '</span></div>' +
    '<div style="text-align:right;font-size:9pt;color:#5F7183;margin-top:-3mm;' +
      'margin-bottom:4mm">Émis le ' + e(date) + '</div>';
}

function piedDocFin(mention) {
  return (mention ? '<div class="doc-note">' + mention + '</div>' : '') +
    '<div class="doc-sign"><div>Le directeur financier</div>' +
      '<div>Pour ' + e(marque_('NOM_ENTREPRISE', MARQUE_DEFAUT.nom)) +
      '</div></div>' +
    '<div class="doc-pied"><b>' +
      e(marque_('MSG_PIED_DOC', MARQUE_DEFAUT.creole)) + '</b><br>' +
      coordonnees_().map(e).join(' · ') + '</div>';
}


/**
 * Le rapport sur papier.
 *
 * Volontairement plus riche que l'écran : à l'écran on cherche un
 * chiffre, sur papier on classe un dossier et on le relit dans six
 * mois. Le document porte donc la période en clair, les détails par
 * source et par catégorie, le compte de résultat, le bilan, et le
 * contrôle caisse/bénéfice — c'est le document qu'on ressort quand
 * quelqu'un demande d'où venait tel montant.
 */
function jrnImprimer() {
  var r = Jrn.rapport, f = Jrn.etats;
  if (!r) { toast('Rapport non chargé.', 'ko'); return; }
  imprimer(docRapport(r, f), 'a4');
}

function docRapport(r, f) {
  var h = '<div class="doc">' +
    enteteDoc('RAPPORT FINANCIER', r.libelle_periode,
              dateCourte(new Date()) + ' · ' + e((Etat.user && Etat.user.nom) || ''));

  // ── Résumé encadré ──
  h += '<div class="doc-cadre">' +
    docLigne('Revenus de la période', htg(r.revenus_gdes)) +
    docLigne('Dépenses de la période', '− ' + htg(r.depenses_gdes)) +
    (r.entrees_stock_gdes
      ? docLigne('dont partis en stock (non charge)', htg(r.entrees_stock_gdes), true) : '') +
    docLigne('Bénéfice', htg(r.profit_gdes) + '  /  ' + usd(r.profit_usd), false, true) +
    '</div>';

  // ── Mouvements de caisse ──
  h += '<div class="doc-h2">Mouvements de caisse</div>' +
    '<table class="doc-t"><tbody>' +
    docRang('Encaissements (tout compris)', htg(r.encaissements_gdes)) +
    docRang('Décaissements (tout compris)', '− ' + htg(r.decaissements_gdes)) +
    (r.apports_nets_gdes ? docRang('Apports nets des associés', htg(r.apports_nets_gdes)) : '') +
    '</tbody><tfoot>' +
    docRang('Variation de la caisse', htg(r.variation_tresorerie_gdes)) +
    '</tfoot></table>';

  if (r.controle) {
    h += r.controle.equilibre
      ? '<div class="doc-ok">Contrôle : la variation de caisse s\'explique ' +
        'entièrement par le bénéfice, les apports et les achats de stock. ' +
        'Aucun montant sans origine.</div>'
      : '<div class="doc-alerte"><b>Contrôle en défaut.</b> La caisse a bougé de ' +
        htg(r.variation_tresorerie_gdes) + ' alors que le bénéfice et les apports ' +
        'n\'en expliquent que ' + htg(r.controle.explique_gdes) + '. Reste ' +
        htg(Math.abs(r.controle.inexplique_gdes)) + ' sans origine identifiée.</div>';
  }

  // ── Détails ──
  h += '<div class="doc-deux">' +
    '<div>' + docDetail('Revenus par source', r.par_source, r.revenus_gdes) + '</div>' +
    '<div>' + docDetail('Dépenses par catégorie', r.par_categorie, r.depenses_gdes) + '</div>' +
    '</div>';

  var ag = Object.keys(r.par_agence || {});
  if (ag.length > 1) {
    h += '<div class="doc-h2">Résultat par agence</div>' +
      '<table class="doc-t"><thead><tr><th>Agence</th>' +
      '<th class="num">Revenus</th><th class="num">Dépenses</th>' +
      '<th class="num">Marge</th></tr></thead><tbody>' +
      ag.map(function (k) {
        var a = r.par_agence[k];
        return '<tr><td>' + e(k) + '</td><td class="num">' + htg(a.revenus) +
          '</td><td class="num">' + htg(a.depenses) + '</td><td class="num"><b>' +
          htg(a.marge) + '</b></td></tr>';
      }).join('') + '</tbody></table>';
  }

  if (r.poids_livre_lb) {
    h += '<div class="doc-h2">Activité logistique</div>' +
      '<table class="doc-t"><tbody>' +
      docRang('Poids livré', n2(r.poids_livre_lb) + ' lb') +
      docRang('Revenu moyen par livre', htg(r.revenu_par_lb_gdes)) +
      docRang('Nombre d\'écritures', n0(r.nb_revenus) + ' revenus · ' +
              n0(r.nb_depenses) + ' dépenses') +
      '</tbody></table>';
  }

  // ── États financiers, sur la page suivante ──
  if (f && f.resultat && f.bilan) {
    h += '<div class="doc-saut">' +
      '<div class="doc-titre"><span>ÉTATS FINANCIERS</span><span>' +
        e(r.libelle_periode) + '</span></div>';

    h += '<div class="doc-h2">Compte de résultat</div>' +
      '<table class="doc-t"><thead><tr><th>Poste</th><th class="num">Gourdes</th>' +
      '</tr></thead><tbody>' +
      docSousTotal('Produits', f.resultat.detail_produits) +
      '<tr><td><b>Total des produits</b></td><td class="num"><b>' +
        htg(f.resultat.produits_gdes) + '</b></td></tr>' +
      docSousTotal('Charges', f.resultat.detail_charges) +
      (f.resultat.dotation_amortissement_gdes
        ? '<tr><td class="creux">Amortissements</td><td class="num creux">' +
          htg(f.resultat.dotation_amortissement_gdes) + '</td></tr>' : '') +
      '<tr><td><b>Total des charges</b></td><td class="num"><b>' +
        htg(f.resultat.charges_gdes +
            (Number(f.resultat.dotation_amortissement_gdes) || 0)) + '</b></td></tr>' +
      '</tbody><tfoot><tr><td>Résultat de la période</td><td class="num">' +
        htg(f.resultat.resultat_net_gdes) + '</td></tr></tfoot></table>';

    h += '<div class="doc-h2">Bilan au ' + e(f.periode.fin || r.periode.fin) + '</div>' +
      '<div class="doc-deux">' +
      '<div><table class="doc-t"><thead><tr><th>Actif</th>' +
        '<th class="num">Gourdes</th></tr></thead><tbody>' +
        docRang('Trésorerie', htg(f.bilan.actif.tresorerie_gdes)) +
        docRang('Stock', htg(f.bilan.actif.stock_gdes)) +
        docRang('Immobilisations nettes', htg(f.bilan.actif.immobilisations_nettes_gdes)) +
        '</tbody><tfoot>' + docRang('Total', htg(f.bilan.actif.total_gdes)) +
        '</tfoot></table></div>' +
      '<div><table class="doc-t"><thead><tr><th>Passif</th>' +
        '<th class="num">Gourdes</th></tr></thead><tbody>' +
        docRang('Dettes', htg(f.bilan.passif.dettes_gdes)) +
        docRang('Capitaux propres', htg(f.bilan.passif.capitaux_propres_gdes)) +
        '</tbody><tfoot>' + docRang('Total', htg(f.bilan.passif.total_gdes)) +
        '</tfoot></table></div>' +
      '</div>';

    h += f.bilan.equilibre
      ? '<div class="doc-ok">Bilan équilibré.</div>'
      : '<div class="doc-alerte">Bilan déséquilibré de ' +
        htg(f.bilan.ecart_gdes) + '.</div>';

    (f.avertissements || []).forEach(function (a) {
      h += '<div class="doc-alerte">' + e(a) + '</div>';
    });
    h += '</div>';
  }

  h += piedDocFin(marque_('MSG_RAPPORT',
    'Document interne. Les montants en gourdes font foi ; les montants en ' +
    'dollars sont donnés au taux de chaque opération.'));

  return h + '</div>';
}

function docLigne(libelle, valeur, creux, fort) {
  return '<div class="ligne' + (fort ? ' fort' : '') + '"' +
    (creux ? ' style="font-size:8.5pt;color:#5F7183"' : '') +
    '><span>' + e(libelle) + '</span><span>' + e(valeur) + '</span></div>';
}
function docRang(libelle, valeur) {
  return '<tr><td>' + e(libelle) + '</td><td class="num">' + e(valeur) + '</td></tr>';
}
function docSousTotal(titre, detail) {
  var cles = Object.keys(detail || {});
  if (!cles.length) return '<tr><td class="creux">' + e(titre) +
    ' — aucun</td><td class="num creux">0</td></tr>';
  cles.sort(function (a, b) { return detail[b] - detail[a]; });
  return cles.map(function (k) {
    return '<tr><td class="creux">' + e(k) + '</td><td class="num creux">' +
      htg(detail[k]) + '</td></tr>';
  }).join('');
}

function docDetail(titre, objet, total) {
  var cles = Object.keys(objet || {});
  if (!cles.length) return '';
  cles.sort(function (a, b) { return objet[b] - objet[a]; });

  return '<div class="doc-h2">' + e(titre) + '</div>' +
    '<table class="doc-t"><tbody>' + cles.map(function (k) {
      var part = total > 0 ? Math.round(objet[k] / total * 100) : 0;
      return '<tr><td>' + e(k) + (part ? ' <span class="creux">' + part +
        ' %</span>' : '') + '</td><td class="num">' + htg(objet[k]) + '</td></tr>';
    }).join('') + '</tbody><tfoot>' + docRang('Total', htg(total)) +
    '</tfoot></table>';
}

function ongletAssocies() {
  poser(chargement('Parts et vesting…'));

  Promise.all([api('parts_associes'), api('appel_fonds'), api('parts_integrite')])
    .then(function (r) {
      var d = r[0], appel = r[1], integ = r[2];

      var h =
        '<div class="stats" style="margin-bottom:14px">' +
          '<div class="stat"><div class="v">' + d.nb_associes + '</div>' +
            '<div class="l">associés</div></div>' +
          '<div class="stat"><div class="v">' + n2(d.total_detenue) + ' %</div>' +
            '<div class="l">parts détenues</div></div>' +
          '<div class="stat"><div class="v" style="color:' +
            (d.places_restantes ? 'var(--vert)' : 'var(--doux)') + '">' +
            d.places_restantes + '</div><div class="l">places libres</div></div>' +
        '</div>';

      if (!integ.ok_global && integ.problemes && integ.problemes.length) {
        h += bloc('Intégrité : ' + integ.problemes.join(' · '), 'ko', '⚠️');
      } else if (integ.ok) {
        h += bloc('Parts cohérentes avec le journal.', 'ok', '✅');
      }

      if (Number(appel.capital_manquant_gdes) > 0) {
        h += bloc('Appel de fonds en cours : ' + htg(appel.capital_manquant_gdes) +
                  ' restent à verser sur ' + htg(appel.capital_cible_gdes) + '.',
                  'attention', '💰');
      }

      var parAppel = {};
      (appel.associes || []).forEach(function (a) { parAppel[a.associe_id] = a; });

      h += '<div class="titre-section">Les associés</div>';
      h += d.associes.map(function (a) {
        var f = parAppel[a.id] || {};
        var taux = Number(f.taux_atteinte_pct) || 0;
        return '<button class="ligne" style="align-items:flex-start" ' +
          'onclick="ouvrirAssocie(\'' + e(a.id) + '\')">' +
          '<div class="corps">' +
            '<div class="t1">' + e(a.nom) +
              (a.role_actif ? '' : ' <span class="badge">sans rôle</span>') + '</div>' +
            '<div class="t2">rang ' + a.rang_entree +
              (a.role ? ' · ' + e(a.role) : '') + '</div>' +
            (Number(f.cible_gdes) > 0
              ? '<div class="jauge' + (taux >= 100 ? ' plein' : '') + '">' +
                '<div style="width:' + Math.min(taux, 100) + '%"></div></div>' +
                '<div style="font-size:11.5px;color:var(--doux);margin-top:4px">' +
                htg(f.verse_gdes) + ' sur ' + htg(f.cible_gdes) +
                ' · ' + n2(taux) + ' %</div>'
              : '') +
          '</div>' +
          '<div class="droite"><div style="font-weight:800;font-size:16px">' +
            n2(a.part_detenue) + ' %</div>' +
            (a.part_acquise !== a.part_detenue
              ? '<div style="font-size:11.5px;color:var(--orange)">acquis ' +
                n2(a.part_acquise) + ' %</div>' : '') +
          '</div></button>';
      }).join('');

      h += '<button class="btn" style="margin-top:12px" onclick="ouvrirNouvelAssocie()">' +
        '➕ Faire entrer un associé</button>' +
        '<button class="btn vide" onclick="ouvrirAppelFonds()">💰 Appel de fonds</button>';

      poser(h);
    }).catch(function (err) { poser(bloc(err.message, 'ko', '❌')); });
}

function ouvrirAssocie(id) {
  modale('Associé', chargement());
  Promise.all([api('parts_associes'), api('parts_historique', { id_associe: id }),
               api('soldes')])
    .then(function (r) {
      var a = r[0].associes.filter(function (x) { return x.id === id; })[0];
      if (!a) { majModale('Associé', bloc('Introuvable.', 'ko', '❌')); return; }
      var sol = (r[2].associes || []).filter(function (x) {
        return x.associe_id === id; })[0] || {};

      var h = '<div style="margin-bottom:14px">' +
        '<div style="font-weight:800;font-size:18px">' + e(a.nom) + '</div>' +
        '<div style="color:var(--doux);font-size:13px;margin-top:3px">' +
          e(a.id) + ' · rang ' + a.rang_entree + ' · entré le ' +
          dateCourte(a.date_entree) + '</div></div>' +

        '<div class="stats" style="margin-bottom:14px">' +
          '<div class="stat"><div class="v">' + n2(a.part_detenue) + ' %</div>' +
            '<div class="l">détenue</div></div>' +
          '<div class="stat"><div class="v">' + n2(a.part_acquise) + ' %</div>' +
            '<div class="l">acquise</div></div>' +
          '<div class="stat"><div class="v">' + court(sol.solde_gdes) + '</div>' +
            '<div class="l">solde HTG</div></div>' +
        '</div>';

      if (a.vesting_mois > 0) {
        h += '<div class="titre-section">Vesting</div>' +
          '<div class="carte serree">' +
          '<div class="total"><span class="l">Durée</span><b>' + a.vesting_mois +
            ' mois</b></div>' +
          '<div class="total"><span class="l">Cliff</span><b>' + a.cliff_mois +
            ' mois</b></div>' +
          '<div class="jauge"><div style="width:' +
            Math.round((a.progression_vesting || 0) * 100) + '%"></div></div>' +
          '<div style="font-size:12px;color:var(--doux);margin-top:6px">' +
            (a.vesting_termine ? 'Vesting terminé — part entièrement acquise.'
              : (a.cliff_franchi
                  ? 'Cliff franchi, acquisition en cours.'
                  : 'Cliff non franchi : aucune part acquise à ce jour.')) +
          '</div></div>';
      }

      h += '<div class="titre-section">Rôle</div><div class="carte serree">' +
        '<div class="total"><span class="l">Fonction</span><b>' +
          e(a.role || '— aucune —') + '</b></div>' +
        '<div class="total"><span class="l">Rôle actif</span><b style="color:' +
          (a.role_actif ? 'var(--vert)' : 'var(--orange)') + '">' +
          (a.role_actif ? 'OUI' : 'NON') + '</b></div>' +
        '<button class="btn vide petit" style="margin-top:10px" ' +
          'onclick="ouvrirRole(' + e(JSON.stringify({ id: a.id, nom: a.nom,
            role: a.role || '', actif: !!a.role_actif })).replace(/'/g, '&#39;') +
          ')">Modifier le rôle</button>' +
        (a.role_actif ? '' :
          bloc('En mode mixte, un associé sans rôle laisse ses points de rôle ' +
               'aux autres.', 'attention', '⚠️')) +
      '</div>';

      // ── Détail du solde ──
      h += '<div class="titre-section">Détail du solde</div>' +
        '<div class="total"><span class="l">Apports en espèces</span><span>' +
          htg(sol.apports_cash_gdes) + '</span></div>' +
        (Number(sol.apports_nature_gdes) ?
          '<div class="total"><span class="l">Apports en nature</span><span>' +
          htg(sol.apports_nature_gdes) + '</span></div>' : '') +
        (Number(sol.retraits_gdes) ?
          '<div class="total"><span class="l">Retraits</span><span>−' +
          htg(sol.retraits_gdes) + '</span></div>' : '') +
        '<div class="total"><span class="l">Part du bénéfice</span><span>' +
          htg(sol.part_profit_gdes) + '</span></div>' +
        '<div class="total gros"><span class="l">Solde</span><span>' +
          htg(sol.solde_gdes) + '</span></div>';

      // ── Journal des parts ──
      var hist = r[1].evenements || r[1] || [];
      if (hist.length) {
        h += '<div class="titre-section">Journal des parts</div>';
        h += hist.slice().reverse().map(function (x) {
          return '<div class="ligne"><div class="corps">' +
            '<div class="t1" style="font-size:13.5px">' + e(x.libelle || x.type) +
              '</div><div class="t2">' + dateCourte(x.date) + '</div></div>' +
            '<div class="droite"><div style="font-weight:700">' +
              n2(x.part_avant) + ' → ' + n2(x.part_apres) + ' %</div></div></div>';
        }).join('');
      }

      majModale(a.nom, h);
    }).catch(function (err) {
      majModale('Associé', bloc(err.message, 'ko', '❌'));
    });
}
