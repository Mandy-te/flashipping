// ── Faire entrer un associé ───────────────────────────────────────

var Entree = { rang: null, simulation: null };

/**
 * On simule AVANT d'écrire, et on montre les six règles, vertes comme
 * rouges. Savoir qu'une entrée viole deux règles vaut mieux que de
 * n'en voir qu'une — et que de découvrir la dilution une fois faite.
 */
function ouvrirNouvelAssocie() {
  Entree = { rang: null, simulation: null };
  modale('Faire entrer un associé', chargement());

  api('parts_associes').then(function (d) {
    Entree.rang = d.nb_associes + 1;
    var plafondConnu = (Etat.ref && Etat.ref.parametres &&
                        Etat.ref.parametres.MAX_ASSOCIES) || '—';

    majModale('Faire entrer un associé',
      (d.places_restantes
        ? bloc('Rang ' + Entree.rang + '. Les rangs se suivent sans trou : ' +
               'c\'est ce qui garantit que chaque entrant reste sous le ' +
               'précédent.', 'info', '📋')
        : bloc('Plus de place : ' + d.nb_associes + ' associés sur ' +
               plafondConnu + ' prévus. Relève MAX_ASSOCIES dans ⚙️ Réglages ' +
               'si les statuts le permettent.', 'attention', '⚠️')) +

      '<label class="champ"><span>Nom complet</span>' +
        '<input type="text" id="na-nom" autocapitalize="words"></label>' +
      '<label class="champ"><span>Part d\'entrée (%)</span>' +
        '<input type="number" id="na-part" step="0.5" min="0" inputmode="decimal" ' +
        'oninput="simulerEntree()"></label>' +
      '<div id="na-simul"></div>' +

      '<div class="titre-section">Ses spécificités</div>' +
      '<label class="champ"><span>Apport en espèces (HTG)</span>' +
        '<input type="number" id="na-apport" step="1000" min="0" inputmode="decimal" ' +
        'value="0"></label>' +
      '<label class="champ"><span>Fonction</span>' +
        '<input type="text" id="na-role" placeholder="laisser vide si aucune"></label>' +
      '<label class="champ"><span>Rôle réellement exercé ?</span>' +
        '<select id="na-actif"><option value="NON">Non</option>' +
        '<option value="OUI">Oui</option></select></label>' +
      '<div class="duo">' +
        '<label class="champ"><span>Vesting (mois)</span>' +
          '<input type="number" id="na-vesting" step="1" min="0" value="0" ' +
          'inputmode="numeric"></label>' +
        '<label class="champ"><span>Cliff (mois)</span>' +
          '<input type="number" id="na-cliff" step="1" min="0" value="0" ' +
          'inputmode="numeric"></label>' +
      '</div>' +
      '<label class="champ"><span>Téléphone</span>' +
        '<input type="tel" id="na-tel" inputmode="tel"></label>' +
      '<label class="champ"><span>Date d\'entrée</span>' +
        '<input type="date" id="na-date" value="' + aujourdhui() + '"></label>' +
      '<div id="na-res"></div>' +
      '<button class="btn" id="na-btn" disabled onclick="validerEntreeAssocie()">' +
        'Saisis une part pour continuer</button>');
  }).catch(function (err) {
    majModale('Faire entrer un associé', bloc(err.message, 'ko', '❌'));
  });
}

var minuteurSim = null;
function simulerEntree() {
  clearTimeout(minuteurSim);
  var z = document.getElementById('na-simul');
  var b = document.getElementById('na-btn');
  var part = Number(document.getElementById('na-part').value);

  if (!part) {
    z.innerHTML = '';
    b.disabled = true; b.textContent = 'Saisis une part pour continuer';
    return;
  }

  z.innerHTML = chargement('Simulation…');
  minuteurSim = setTimeout(function () {
    api('parts_simuler', { part: part, rang: Entree.rang })
      .then(function (s) { afficherSimulation(s, part); })
      .catch(function (err) {
        // Une entrée refusée renvoie quand même les règles : on les montre.
        var s = err.detail && err.detail.data;
        if (s && s.regles) { afficherSimulation(s, part); return; }
        z.innerHTML = bloc(err.message, 'ko', '❌');
        b.disabled = true; b.textContent = 'Entrée impossible';
      });
  }, 400);
}

function afficherSimulation(s, part) {
  Entree.simulation = s;
  var z = document.getElementById('na-simul');
  var b = document.getElementById('na-btn');

  var h = '<div class="titre-section">Les six règles</div>';
  (s.regles || []).forEach(function (r) {
    h += '<div class="regle ' + (r.ok ? 'oui' : 'non') + '">' +
      '<span class="ic">' + (r.ok ? '✓' : '✕') + '</span>' +
      '<span>' + e(r.libelle) +
      (r.detail ? '<span class="detail">' + e(r.detail) + '</span>' : '') +
      '</span></div>';
  });

  if (s.projection && s.projection.length) {
    h += '<div class="titre-section">Effet sur chacun</div>';
    s.projection.forEach(function (a) {
      var delta = a.part_apres - a.part_avant;
      h += '<div class="total"><span class="l">' + e(a.nom) + '</span>' +
        '<span>' + n2(a.part_avant) + ' → <b>' + n2(a.part_apres) + ' %</b>' +
        '<span style="color:var(--rouge);font-size:12px"> ' + n2(delta) + '</span>' +
        '</span></div>';
    });
    h += '<div class="total gros"><span class="l">Nouvel entrant</span><span>' +
      n2(part) + ' %</span></div>';
  }

  z.innerHTML = h;
  b.disabled = !s.valide;
  b.textContent = s.valide
    ? 'Faire entrer à ' + n2(part) + ' %'
    : 'Règles non respectées';
}

function validerEntreeAssocie() {
  var res = document.getElementById('na-res');
  var b = document.getElementById('na-btn');
  var nom = document.getElementById('na-nom').value.trim();
  var part = Number(document.getElementById('na-part').value);

  if (!nom) { res.innerHTML = bloc('Le nom est requis.', 'ko', '⚠️'); return; }

  if (!confirm('Faire entrer ' + nom + ' à ' + n2(part) + ' % ?\n\n' +
               'Toutes les parts existantes seront diluées. ' +
               'L\'opération est tracée au journal.')) return;

  b.disabled = true; b.textContent = 'Enregistrement…';

  api('parts_enregistrer', {
    nom: nom,
    part: part,
    rang: Entree.rang,
    rang_entree: Entree.rang,
    date_entree: document.getElementById('na-date').value,
    apport_espece: Number(document.getElementById('na-apport').value) || 0,
    role: document.getElementById('na-role').value,
    role_actif: document.getElementById('na-actif').value,
    vesting_mois: Number(document.getElementById('na-vesting').value) || 0,
    cliff_mois: Number(document.getElementById('na-cliff').value) || 0,
    telephone: document.getElementById('na-tel').value
  }).then(function (d) {
    fermerModale();
    toast(nom + ' est entré à ' + n2(part) + ' %.', 'ok');
    ongletAssocies();
  }).catch(function (err) {
    b.disabled = false; b.textContent = 'Faire entrer à ' + n2(part) + ' %';
    res.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

              'c\'est le sens du mode « financement » et de la moitié du mode ' +
              '« mixte ».', 'info', '💡');

    majModale('Appel de fonds', h);
  }).catch(function (err) {
    majModale('Appel de fonds', bloc(err.message, 'ko', '❌'));
  });
}

function ongletCloture() {
  poser(
    bloc('Clôturer fige une période : le bénéfice est réparti entre les ' +
         'associés et porté à leur solde. Les calculs suivants repartent de ' +
         'ce point. Une clôture s\'annule, mais laisse une trace.',
         'info', '🔒') +
    '<div class="carte">' +
      '<div class="duo">' +
        '<label class="champ"><span>Du</span><input type="date" id="cl-debut" ' +
          'value="' + premierDuMois() + '"></label>' +
        '<label class="champ"><span>Au</span><input type="date" id="cl-fin" ' +
          'value="' + aujourdhui() + '"></label>' +
      '</div>' +
      '<button class="btn" onclick="preparerCloture()">Préparer la clôture</button>' +
    '</div>' +
    '<div id="cl-prep"></div>' +
    '<div class="titre-section">Clôtures passées</div>' +
    '<div id="cl-liste">' + chargement() + '</div>'
  );
  chargerClotures();
}

function chargerClotures() {
  api('clotures').then(function (liste) {
    var z = document.getElementById('cl-liste');
    if (!z) return;
    var l = liste.clotures || liste;
    if (!l || !l.length) { z.innerHTML = vide('🔓', 'Aucune clôture.'); return; }
    z.innerHTML = l.map(function (c) {
      return '<div class="ligne"><div class="corps">' +
        '<div class="t1">' + dateCourte(c.debut) + ' → ' + dateCourte(c.fin) + '</div>' +
        '<div class="t2">' + e(c.type_periode || '') + ' · ' +
          (c.nb_associes || 0) + ' associé(s)</div></div>' +
        '<div class="droite"><b>' + court(c.profit_gdes) + '</b>' +
        '<div style="font-size:11.5px;color:var(--doux)">HTG</div></div></div>';
    }).join('');
  }).catch(function (err) {
    var z = document.getElementById('cl-liste');
    if (z) z.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function preparerCloture() {
  var debut = document.getElementById('cl-debut').value;
  var fin = document.getElementById('cl-fin').value;
  var z = document.getElementById('cl-prep');
  z.innerHTML = chargement('Préparation…');

  api('preparer_cloture', { debut: debut, fin: fin }).then(function (d) {
    var h = '<div class="carte">' +
      '<div class="total"><span class="l">Revenus</span><span>' +
        htg(d.revenus_gdes) + '</span></div>' +
      '<div class="total"><span class="l">Dépenses</span><span>−' +
        htg(d.depenses_gdes) + '</span></div>' +
      '<div class="total gros"><span class="l">Bénéfice à répartir</span>' +
        '<span style="color:' + (d.profit_gdes < 0 ? 'var(--rouge)' : '#0E4429') +
        '">' + htg(d.profit_gdes) + '</span></div>';

    (d.alertes || []).forEach(function (a) { h += bloc(a, 'attention', '⚠️'); });

    if (d.lignes && d.lignes.length) {
      h += '<div class="titre-section">Ce que chacun recevra</div>';
      d.lignes.forEach(function (l) {
        h += '<div class="total"><span class="l">' + e(l.nom) + '</span>' +
          '<span>' + pct(l.part_pct || l.part_pourcentage) + ' → <b>' +
          htg(l.montant_gdes || l.part_profit_gdes) + '</b></span></div>';
      });
    }

    h += d.pret
      ? '<button class="btn" style="margin-top:14px" onclick="executerCloture()">' +
        '🔒 Clôturer définitivement</button>'
      : bloc('Corrige les alertes avant de clôturer.', 'ko', '⛔');

    h += '</div>';
    z.innerHTML = h;
  }).catch(function (err) { z.innerHTML = bloc(err.message, 'ko', '❌'); });
}

function executerCloture() {
  var debut = document.getElementById('cl-debut').value;
  var fin = document.getElementById('cl-fin').value;

  if (!confirm('Clôturer du ' + dateCourte(debut) + ' au ' + dateCourte(fin) + ' ?\n\n' +
               'Le bénéfice sera réparti et porté au solde de chaque associé. ' +
               'Les calculs suivants repartiront de ce point.')) return;

  api('cloturer', { type_periode: 'mensuel', debut: debut, fin: fin })
    .then(function (d) {
      toast(d.message || 'Période clôturée.', 'ok');
      ongletCloture();
    }).catch(function (err) { toast(err.message, 'ko'); });
}

/**

  { cle:'TAUX_VENTE_USD', nom:'Taux de vente du dollar', unite:'HTG', pas:1,

/* Qui voit quoi dans les réglages.

   La direction logistique règle son métier — prix au poids, délais,
   paliers de dépôt. Le taux de change, le capital et les textes
   imprimés restent au super administrateur : ce ne sont pas des
   réglages d'exploitation, ce sont des décisions d'entreprise. */
function peutReglages() {
  var d = (Etat.user && Etat.user.droits) || {};
  return !!(d.gerer_parametres || d.gerer_parametres_metier);
}
function peutTextes() {
  var d = (Etat.user && Etat.user.droits) || {};
  return !!d.gerer_parametres;
}

function ouvrirParametres() {
  if (!peutReglages()) {
    toast('Réservé à la direction.', 'ko');
    return;
  }
  modale('Paramètres', chargement());

  Promise.all([api('admin_parametres'), api('admin_tarifs_depot')])
    .then(function (r) {
      var valeurs = {}, modifiables = {};
      r[0].forEach(function (x) {
        valeurs[x.cle] = x.valeur;
        modifiables[x.cle] = x.modifiable !== false;
      });
      rendreParametres(valeurs, r[1].tarifs, modifiables);
    }).catch(function (err) {
      majModale('Paramètres', bloc(err.message, 'ko', '❌'));
    });
}

function rendreParametres(valeurs, tarifs, modifiables) {
  modifiables = modifiables || {};
  var h = bloc('Une modification ne touche jamais une opération déjà ' +
               'enregistrée. Un colis garde le prix du jour de sa réception, ' +
               'une facture son taux, une commande ses frais. Seules les ' +
               'opérations suivantes changent.', 'info', '🔒');

  PARAMS_EDITABLES.forEach(function (p) {
    var brut = valeurs[p.cle];
    if (brut === undefined) return;
    var affiche = p.fraction ? (Number(brut) * 100) : brut;
    var ouvert = modifiables[p.cle] !== false;

    h += '<div class="carte serree" style="margin-bottom:10px' +
        (ouvert ? '' : ';opacity:.62') + '">' +
      '<div style="font-weight:700;font-size:14.5px">' + e(p.nom) +
        (ouvert ? '' : ' 🔒') + '</div>' +
      '<div style="font-size:12px;color:var(--doux);margin:3px 0 9px;' +
        'line-height:1.35">' + e(p.aide) +
        (ouvert ? '' : '<br><b>Réservé au super administrateur.</b>') + '</div>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        '<input type="number" id="pm-' + e(p.cle) + '" value="' + e(affiche) + '" ' +
          'step="' + p.pas + '" inputmode="decimal" style="flex:1"' +
          (ouvert ? '' : ' disabled') + '>' +
        (p.unite ? '<span style="font-weight:700;color:var(--doux);' +
          'min-width:34px">' + e(p.unite) + '</span>' : '') +
        (ouvert
          ? '<button class="btn petit" style="width:auto;padding:11px 15px" ' +
            'onclick="enregistrerParametre(\'' + e(p.cle) + '\',' +
            (p.fraction ? 'true' : 'false') + ')">OK</button>'
          : '') +
      '</div></div>';
  });

  // ── Paliers de frais de dépôt ──
  h += '<div class="titre-section">Paliers de frais de dépôt</div>' +
    bloc('Ce que TOI tu paies pour recharger la carte. Ces paliers ne ' +
         'servent qu\'à estimer : le frais réellement prélevé est saisi à ' +
         'la main sur chaque dépôt, et c\'est lui qui entre en comptabilité.',
         'attention', '💳');

  (tarifs || []).forEach(function (t) {
    h += '<div class="carte serree" style="margin-bottom:10px' +
        (t.actif ? '' : ';opacity:.5') + '">' +
      '<div style="font-weight:700;font-size:14px;margin-bottom:8px">' +
        n0(t.min_usd) + ' $ – ' + (t.max_usd === '' ? '∞' : n0(t.max_usd) + ' $') +
        (t.note ? ' <span style="font-weight:400;color:var(--doux);font-size:12px">· ' +
          e(t.note) + '</span>' : '') + '</div>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        '<input type="number" id="td-' + e(t.tarif_id) + '" ' +
          'value="' + (t.taux * 100) + '" step="0.5" inputmode="decimal" style="flex:1">' +
        '<span style="font-weight:700;color:var(--doux);min-width:34px">%</span>' +
        '<button class="btn petit" style="width:auto;padding:11px 15px" ' +
          'onclick="enregistrerTarif(\'' + e(t.tarif_id) + '\')">OK</button>' +
      '</div>' +
      '<button class="btn vide petit" style="margin-top:8px" onclick="basculerTarif(\'' +
        e(t.tarif_id) + '\',' + (t.actif ? 'false' : 'true') + ')">' +
        (t.actif ? 'Désactiver ce palier' : 'Réactiver ce palier') + '</button>' +
    '</div>';
  });

  h += '<div id="pm-res"></div>';
  majModale('Paramètres', h);
}

function ouvrirTextes() {

function enregistrerTexte(cle) {
  var champ = document.getElementById('tx-' + cle);
  var val = champ.value.trim();
  if (!val) { toast('Le texte ne peut pas être vide.', 'ko'); return; }

  api('admin_parametres', { cle: cle, valeur: val }).then(function () {
    toast('Enregistré.', 'ok');
    champ.style.borderColor = 'var(--vert)';
    // Les documents lisent les référentiels : il faut les recharger
    // pour que la prochaine impression porte le nouveau texte.
    return chargerReferentiels();
  }).catch(function (err) {
    champ.style.borderColor = 'var(--rouge)';
    var z = document.getElementById('tx-res');
    if (z) z.innerHTML = bloc(err.message, 'ko', '❌');
    toast(err.message, 'ko');
  });
}

function enregistrerParametre(cle, fraction) {
  var champ = document.getElementById('pm-' + cle);
  var saisi = champ.value;
  if (saisi === '') { toast('Valeur vide.', 'ko'); return; }

  // L'écran parle en pourcentage, le serveur attend une fraction :
  // la conversion se fait ici, jamais dans la tête de l'utilisateur.
  var valeur = fraction ? (Number(saisi) / 100) : saisi;

  api('admin_parametres', { cle: cle, valeur: valeur }).then(function () {
    toast(cle + ' enregistré.', 'ok');
    champ.style.borderColor = 'var(--vert)';
    return chargerReferentiels();
  }).catch(function (err) {
    champ.style.borderColor = 'var(--rouge)';
    var z = document.getElementById('pm-res');
    if (z) z.innerHTML = bloc(err.message, 'ko', '❌');
    toast(err.message, 'ko');
  });
}

function enregistrerTarif(id) {
  var champ = document.getElementById('td-' + id);
  api('admin_tarifs_depot', { tarif_id: id, taux: Number(champ.value) / 100 })
    .then(function () {
      toast('Palier enregistré.', 'ok');
      champ.style.borderColor = 'var(--vert)';
      return chargerReferentiels();
    }).catch(function (err) {
      champ.style.borderColor = 'var(--rouge)';
      toast(err.message, 'ko');
    });
}

function basculerTarif(id, actif) {
  api('admin_tarifs_depot', { tarif_id: id, actif: actif ? 'OUI' : 'NON' })
    .then(function () {
      toast(actif ? 'Palier réactivé.' : 'Palier désactivé.', 'ok');
      return chargerReferentiels();
    }).then(ouvrirParametres)
    .catch(function (err) { toast(err.message, 'ko'); });
}

function rafraichirRef() {
  toast('Rechargement…');
  chargerReferentiels().then(function () {
    fermerModale(); toast('Référentiels à jour.', 'ok'); rendreOnglet();
  }).catch(function (err) { toast(err.message, 'ko'); });
}

      'inputmode="numeric" maxlength="6"></label>' +
    '<div id="k-res"></div>' +

function validerCode() {
  var a = document.getElementById('k-a').value;
  var b = document.getElementById('k-b').value;
  var c = document.getElementById('k-c').value;
  var res = document.getElementById('k-res');
  if (!/^\d{6}$/.test(b)) { res.innerHTML = bloc('Six chiffres exactement.', 'ko', '⚠️'); return; }
  if (b !== c) { res.innerHTML = bloc('Les deux codes diffèrent.', 'ko', '⚠️'); return; }
  api('changer_code', { ancien_code: a, nouveau_code: b }).then(function () {
    fermerModale(); toast('Code modifié.', 'ok');
  }).catch(function (err) { res.innerHTML = bloc(err.message, 'ko', '❌'); });
}

/**
 * Le contrôle de version.
 *
 * Un backend non redéployé, ou un fichier .gs oublié au copier-coller,
 * donne des symptômes incompréhensibles : une action qui répond
 * « inconnue », un écran vide, un champ qui ne s'enregistre pas. Cette
 * vérification transforme tout ça en une phrase claire.
 */
var VERSION_ATTENDUE = '2026-10-07.6';

function verifierVersion() {
  return api('diag').then(function (d) {
    var dep = String(d.version_code || '');
    Etat.versionBackend = dep || '(ancienne)';
    Etat.versionOk = (dep === VERSION_ATTENDUE);
    return Etat.versionOk;
  }).catch(function () { return null; });
}

function blocVersion() {
  if (Etat.versionOk === undefined) {
    // Réponse pas encore arrivée : on la demande et on repeint à son retour.
    verifierVersion().then(function (r) {
      if (r !== null && document.getElementById('voile')) ouvrirReglages();
    });
    return '<div style="text-align:center;color:var(--doux);font-size:11.5px;' +
      'margin-top:14px">Vérification de la version…</div>';
  }
  if (Etat.versionOk) {
    return '<div style="text-align:center;color:var(--doux);font-size:11.5px;' +
      'margin-top:14px">Code déployé ' + e(Etat.versionBackend) + ' — à jour</div>';
  }
  return bloc('Le code déployé dans Apps Script (' + Etat.versionBackend + ') ne ' +
    'correspond pas à cette application (' + VERSION_ATTENDUE + '). Il manque un ' +
    'fichier .gs, ou le déploiement n\'a pas été refait en « Nouvelle version ». ' +
    'Certaines fonctions ne marcheront pas.', 'attention', '⚠️');
}

    '<button class="btn vide" onclick="rafraichirRef()">🔄 Recharger les référentiels</button>' +
    '<button class="btn vide" onclick="changerUrl()">🔗 Changer l\'URL de l\'API</button>' +
    '<button class="btn rouge" onclick="fermerModale();deconnecter()">Se déconnecter</button>' +
    blocVersion());
}

/**
 * Les règles d'entrée d'un associé — plafonds, planchers, dégressivité.
 *
 * Elles vivaient en dur dans le code : le huitième associé était refusé
 * par un trou dans une table, pas par une décision. Elles sont
 * maintenant des paramètres, donc des choix que les associés peuvent
 * prendre et inscrire eux-mêmes.
 */
var PARAMS_GOUVERNANCE = [
  { cle:'MAX_ASSOCIES', nom:'Nombre maximum d\'associés', unite:'', pas:1,
    aide:'Prévu par les statuts. Au-delà, toute entrée est refusée.' },
  { cle:'PLANCHER_FONDATEUR_PCT', nom:'Plancher du fondateur', unite:'%', pas:1,
    aide:'Part sous laquelle le rang 1 ne peut jamais descendre, quelle que soit la dilution.' },
  { cle:'PLAFOND_NOUVEAUX_PCT', nom:'Plafond collectif des nouveaux', unite:'%', pas:1,
    aide:'Total maximal détenu ensemble par les associés de rang 5 et plus.' },
  { cle:'PART_MAX_RANG5_PCT', nom:'Part maximale au rang 5', unite:'%', pas:0.5,
    aide:'Point de départ de la dégressivité.' },
  { cle:'DEGRESSION_PART_PCT', nom:'Dégressivité par rang', unite:'pts', pas:0.5,
    aide:'Points retirés au plafond à chaque rang suivant. Avec 10 et 2 : 10, 8, 6, 4…' },
  { cle:'PART_MIN_NOUVEAU_PCT', nom:'Plancher du plafond', unite:'%', pas:0.5,
    aide:'La dégressivité ne descend jamais sous cette valeur.' },
  { cle:'CAPITAL_CIBLE_GDES', nom:'Capital appelé', unite:'HTG', pas:10000,
    aide:'0 = aucun appel en cours. Sinon, chacun doit verser sa part statutaire de ce montant.' },
  { cle:'POIDS_ROLE_PCT', nom:'Poids du rôle', unite:'%', pas:5,
    aide:'Part du bénéfice qui suit les rôles occupés. Avec le poids du cash, doit faire 100.' },
  { cle:'POIDS_CASH_PCT', nom:'Poids du cash', unite:'%', pas:5,
    aide:'Part du bénéfice qui suit l\'argent réellement versé.' }
];

function ouvrirGouvernance() {
  modale('Règles d\'entrée', chargement());

  api('admin_parametres').then(function (liste) {
    var v = {};
    liste.forEach(function (x) { v[x.cle] = x.valeur; });

    var h = bloc('Ces règles décident qui peut entrer, à quelle part, et ' +
                 'comment le bénéfice se partage. Les changer ne retouche ' +
                 'aucune entrée déjà enregistrée — seulement les suivantes. ' +
                 'À décider entre associés, puis à inscrire ici.',
                 'attention', '⚖️');

    PARAMS_GOUVERNANCE.forEach(function (p) {
      if (v[p.cle] === undefined) return;
      h += '<div class="carte serree" style="margin-bottom:10px">' +
        '<div style="font-weight:700;font-size:14.5px">' + e(p.nom) + '</div>' +
        '<div style="font-size:12px;color:var(--doux);margin:3px 0 9px;' +
          'line-height:1.35">' + e(p.aide) + '</div>' +
        '<div style="display:flex;gap:8px;align-items:center">' +
          '<input type="number" id="gv-' + e(p.cle) + '" value="' + e(v[p.cle]) + '" ' +
            'step="' + p.pas + '" inputmode="decimal" style="flex:1">' +
          (p.unite ? '<span style="font-weight:700;color:var(--doux);' +
            'min-width:34px">' + e(p.unite) + '</span>' : '') +
          '<button class="btn petit" style="width:auto;padding:11px 15px" ' +
            'onclick="enregistrerGouvernance(\'' + e(p.cle) + '\')">OK</button>' +
        '</div></div>';
    });

    // Le mode de répartition n'est pas un nombre : il mérite sa liste.
    h += '<div class="carte serree">' +
      '<div style="font-weight:700;font-size:14.5px">Clé de répartition</div>' +
      '<div style="font-size:12px;color:var(--doux);margin:3px 0 9px;line-height:1.35">' +
        'statutaire = les parts du capital · financement = le cash versé · ' +
        'mixte = les deux, selon les poids ci-dessus.</div>' +
      '<select id="gv-MODE_REPARTITION" onchange="enregistrerMode()">' +
        ['statutaire', 'financement', 'mixte'].map(function (m) {
          return '<option value="' + m + '"' +
            (String(v.MODE_REPARTITION) === m ? ' selected' : '') + '>' + m + '</option>';
        }).join('') + '</select></div>' +

      bloc('La clé ne touche PAS aux parts du capital social. Elle ne partage ' +
           'que le bénéfice. Juridiquement, un apport en travail ouvre droit ' +
           'aux bénéfices, jamais au capital — c\'est exactement ce que fait ' +
           'le mode mixte. À faire écrire dans un accord entre associés, ' +
           'séparé des statuts.', 'info', '⚖️') +
      '<div id="gv-res"></div>';

    majModale('Règles d\'entrée', h);
  }).catch(function (err) {
    majModale('Règles d\'entrée', bloc(err.message, 'ko', '❌'));
  });
}

function enregistrerGouvernance(cle) {
  var champ = document.getElementById('gv-' + cle);
  api('admin_parametres', { cle: cle, valeur: champ.value }).then(function () {
    toast(cle + ' enregistré.', 'ok');
    champ.style.borderColor = 'var(--vert)';
    return chargerReferentiels();
  }).catch(function (err) {
    champ.style.borderColor = 'var(--rouge)';
    var z = document.getElementById('gv-res');
    if (z) z.innerHTML = bloc(err.message, 'ko', '❌');
    toast(err.message, 'ko');
  });
}

function enregistrerMode() {
  var v = document.getElementById('gv-MODE_REPARTITION').value;
  api('admin_parametres', { cle: 'MODE_REPARTITION', valeur: v }).then(function () {
    toast('Clé de répartition : ' + v, 'ok');
    return chargerReferentiels();
  }).catch(function (err) { toast(err.message, 'ko'); });
}


// ═══════════════════════════════════════════════════════════════════
//  MODALE ET DÉMARRAGE
// ═══════════════════════════════════════════════════════════════════

function modale(titre, html) {
  var dejaOuverte = Nav.modaleOuverte;
  fermerModaleDom();
  var v = document.createElement('div');
  v.className = 'voile'; v.id = 'voile';
  v.innerHTML = '<div class="modale" onclick="event.stopPropagation()">' +
    '<div class="poignee"></div><h3>' + e(titre) + '</h3>' +
    '<div id="corps-modale">' + html + '</div></div>';
  v.onclick = fermerModale;
  document.body.appendChild(v);
  document.body.style.overflow = 'hidden';
  Nav.modaleOuverte = true;
  if (!dejaOuverte) { try { history.pushState({ modale: true }, ''); } catch (e2) {} }
}

function majModale(titre, html) {
  var c = document.getElementById('corps-modale');
  var t = document.querySelector('.modale h3');
  if (c) { c.innerHTML = html; if (t) t.textContent = titre; }
  else modale(titre, html);
}

/** Ferme sans toucher à l'historique — réservé à popstate. */
function fermerModaleDom() {
  var v = document.getElementById('voile');
  if (v) v.remove();
  document.body.style.overflow = '';
  Nav.modaleOuverte = false;
}

function fermerModale() {
  if (Nav.modaleOuverte) {
    Nav.modaleOuverte = false;
    fermerModaleDom();
    try { history.back(); } catch (e2) {}
    return;
  }
  fermerModaleDom();
}

window.addEventListener('online',  function () { majBandeau(); toast('Réseau revenu.', 'ok'); });
window.addEventListener('offline', function () { majBandeau(); toast('Réseau perdu.', 'ko'); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

(function demarrer() {
  try {
    var h = (location.hash || '').replace('#', '');
    if (h && ONGLETS.some(function (o) { return o.id === h; })) Etat.onglet = h;
    history.replaceState({ onglet: Etat.onglet }, '', '#' + Etat.onglet);
  } catch (e2) {}

  if (Etat.url && Etat.token) {
    document.getElementById('app').innerHTML =
      '<header class="entete"><h1>Flashipping<span class="sous">Ouverture…' +
      '</span></h1></header><main>' + chargement() + '</main>';
    verifierVersion();
    chargerReferentiels().then(dessiner).catch(function (err) {
      if (/Session|Jeton/i.test(err.message)) { deconnecter(); return; }
      toast(err.message, 'ko'); dessiner();
    });
  } else {
    dessiner();
  }
})();
</script>
