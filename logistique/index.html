<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<title>Flashipping — Logistique</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ═══════════════════════════════════════════════════════════════
   Conçu pour un téléphone tenu d'une main, dans un dépôt.
   Cibles tactiles à 48px minimum, contrastes forts : un agent
   lit cet écran debout, parfois au soleil.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --marine:#0B2545; --marine-clair:#13365F; --or:#F0A818;
  --vert:#1B7F4B; --rouge:#C62828; --orange:#E67E22; --bleu:#1565C0;
  --fond:#F4F6F8; --carte:#FFFFFF; --bord:#D9E0E6;
  --texte:#16222E; --doux:#5F7183;
  --ombre:0 1px 3px rgba(11,37,69,.12);
  --haut:env(safe-area-inset-top,0px);
  --bas:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--fond); color:var(--texte);
  overscroll-behavior-y:none;
}
input,select,textarea,button{font:inherit;color:inherit}
a{color:var(--bleu)}

/* ── Structure ── */
#app{min-height:100vh;display:flex;flex-direction:column}
.entete{
  background:var(--marine); color:#fff;
  padding:calc(var(--haut) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:30;
}
.entete h1{font-size:16px;margin:0;font-weight:700;flex:1;letter-spacing:.2px}
.entete .sous{font-size:11.5px;opacity:.75;font-weight:400;display:block}
.pastille{
  width:9px;height:9px;border-radius:50%;background:var(--vert);flex:none;
}
.pastille.hors{background:var(--rouge)}
.btn-entete{
  background:rgba(255,255,255,.14);border:0;color:#fff;
  width:38px;height:38px;border-radius:10px;font-size:17px;flex:none;
}
main{flex:1;padding:12px 12px 96px;max-width:760px;margin:0 auto;width:100%}

/* ── Barre de navigation ── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:#fff;border-top:1px solid var(--bord);
  display:flex;padding-bottom:var(--bas);
  box-shadow:0 -1px 8px rgba(11,37,69,.07);
}
nav button{
  flex:1;background:none;border:0;padding:8px 2px 7px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--doux);font-weight:600;
}
nav button .ic{font-size:21px;line-height:1}
nav button.actif{color:var(--marine)}
nav button.actif .ic{transform:translateY(-1px)}

/* ── Cartes ── */
.carte{
  background:var(--carte);border:1px solid var(--bord);border-radius:12px;
  padding:14px;margin-bottom:12px;box-shadow:var(--ombre);
}
.carte.serree{padding:11px 12px}
.titre-section{
  font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  color:var(--doux);margin:18px 2px 8px;
}
.titre-section:first-child{margin-top:2px}

/* ── Formulaires ── */
label.champ{display:block;margin-bottom:12px}
label.champ > span{
  display:block;font-size:12px;font-weight:700;color:var(--doux);
  margin-bottom:5px;letter-spacing:.2px;
}
input[type=text],input[type=tel],input[type=number],input[type=password],
input[type=email],input[type=url],select,textarea{
  width:100%;padding:13px 12px;border:1.5px solid var(--bord);
  border-radius:10px;background:#fff;font-size:16px;
}
input:focus,select:focus,textarea:focus{
  outline:0;border-color:var(--marine);box-shadow:0 0 0 3px rgba(11,37,69,.09);
}
input[readonly]{background:#F0F3F6;color:var(--doux)}
textarea{min-height:68px;resize:vertical}
.duo{display:flex;gap:10px}
.duo > *{flex:1;min-width:0}

/* ── Boutons ── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:14px;border:0;border-radius:11px;
  background:var(--marine);color:#fff;font-weight:700;font-size:15.5px;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45}
.btn.or{background:var(--or);color:#3A2600}
.btn.vert{background:var(--vert)}
.btn.rouge{background:var(--rouge)}
.btn.vide{background:#fff;color:var(--marine);border:1.5px solid var(--bord)}
.btn.petit{padding:10px;font-size:14px;border-radius:9px}
.btn + .btn{margin-top:9px}
.rangee-btn{display:flex;gap:9px}
.rangee-btn .btn + .btn{margin-top:0}

/* ── Puces de filtre ── */
.puces{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;
  scrollbar-width:none;-ms-overflow-style:none}
.puces::-webkit-scrollbar{display:none}
.puce{
  flex:none;padding:8px 13px;border-radius:999px;border:1.5px solid var(--bord);
  background:#fff;font-size:13px;font-weight:650;white-space:nowrap;color:var(--doux);
}
.puce.actif{background:var(--marine);color:#fff;border-color:var(--marine)}
.puce b{font-weight:800}

/* ── Listes ── */
.ligne{
  display:flex;align-items:center;gap:11px;padding:12px 13px;
  background:#fff;border:1px solid var(--bord);border-radius:11px;
  margin-bottom:8px;text-align:left;width:100%;
}
.ligne:active{background:#F7F9FB}
.ligne .corps{flex:1;min-width:0}
.ligne .t1{font-weight:700;font-size:14.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ligne .t2{font-size:12.5px;color:var(--doux);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .droite{text-align:right;flex:none}
.mono{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:13px;
  letter-spacing:-.2px;word-break:break-all}

/* ── Étiquettes d'état ── */
.etat{
  display:inline-block;padding:3px 9px;border-radius:7px;
  font-size:11px;font-weight:800;letter-spacing:.3px;
}
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border-radius:7px;font-size:11px;font-weight:700;
  background:#EEF2F6;color:var(--doux);
}
.badge.camion{background:#E1F5FE;color:#0277BD}
.badge.passage{background:#FFF3E0;color:#E65100}
.badge.paye{background:#E8F5E9;color:var(--vert)}
.badge.impaye{background:#FFEBEE;color:var(--rouge)}

/* ── Messages ── */
.msg{
  padding:12px 13px;border-radius:11px;margin-bottom:12px;
  font-size:14px;font-weight:500;display:flex;gap:9px;align-items:flex-start;
  line-height:1.4;
}
.msg.ok{background:#E8F5E9;color:#145A32;border:1px solid #BEE3C8}
.msg.ko{background:#FFEBEE;color:#8E1F1F;border:1px solid #F5C6C6}
.msg.info{background:#E3F2FD;color:#0D3C6E;border:1px solid #BBDEFB}
.msg.attention{background:#FFF8E1;color:#7A4F00;border:1px solid #FFE0A3}
.msg .ic{font-size:17px;flex:none;line-height:1.3}

/* ── Vide / chargement ── */
.vide{text-align:center;padding:42px 20px;color:var(--doux)}
.vide .gros{font-size:40px;margin-bottom:10px;opacity:.5}
.chargement{text-align:center;padding:30px;color:var(--doux);font-size:14px}
.tourne{
  display:inline-block;width:19px;height:19px;border:2.5px solid var(--bord);
  border-top-color:var(--marine);border-radius:50%;
  animation:t .7s linear infinite;vertical-align:-4px;margin-right:8px;
}
@keyframes t{to{transform:rotate(360deg)}}

/* ── Statistiques ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:9px}
.stat{
  background:#fff;border:1px solid var(--bord);border-radius:11px;
  padding:12px 9px;text-align:center;
}
.stat .v{font-size:21px;font-weight:800;line-height:1.1}
.stat .l{font-size:10.5px;color:var(--doux);margin-top:3px;font-weight:650;
  text-transform:uppercase;letter-spacing:.4px}

/* ── Itinéraire ── */
.route{display:flex;flex-direction:column;gap:0;margin:4px 0}
.etape{display:flex;gap:12px;align-items:flex-start;min-height:40px}
.etape .rail{display:flex;flex-direction:column;align-items:center;flex:none;width:22px}
.etape .pt{
  width:13px;height:13px;border-radius:50%;background:#fff;
  border:2.5px solid var(--bord);margin-top:4px;flex:none;
}
.etape.faite .pt{background:var(--vert);border-color:var(--vert)}
.etape.ici .pt{background:var(--or);border-color:var(--or);
  box-shadow:0 0 0 4px rgba(240,168,24,.25)}
.etape .fil{width:2.5px;flex:1;background:var(--bord);min-height:16px}
.etape.faite .fil{background:var(--vert)}
.etape .txt{padding:2px 0 14px;font-size:14px;font-weight:650}
.etape .txt small{display:block;font-weight:400;color:var(--doux);font-size:12px}

/* ── Cases à cocher de livraison ── */
.coche{
  display:flex;gap:12px;align-items:center;padding:13px;
  border:1.5px solid var(--bord);border-radius:11px;background:#fff;
  margin-bottom:8px;
}
.coche.on{border-color:var(--vert);background:#F4FBF6}
.coche input{width:23px;height:23px;flex:none;accent-color:var(--vert)}
.coche .corps{flex:1;min-width:0}

/* ── Totaux ── */
.total{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:8px 0;font-size:14.5px;
}
.total + .total{border-top:1px solid var(--bord)}
.total.gros{font-size:19px;font-weight:800;padding-top:12px;
  border-top:2px solid var(--marine);margin-top:4px}
.total .l{color:var(--doux);font-weight:650}
.total.gros .l{color:var(--texte)}

/* ── Scanner ── */
#flux{
  width:100%;max-height:44vh;border-radius:12px;background:#000;
  display:block;object-fit:cover;
}
.cadre-scan{position:relative;margin-bottom:12px}
.viseur{
  position:absolute;left:11%;right:11%;top:32%;height:36%;
  border:2.5px solid var(--or);border-radius:9px;
  box-shadow:0 0 0 2000px rgba(0,0,0,.28);
}
.saisie-scan{
  display:flex;gap:8px;
}
.saisie-scan input{
  font-family:'SF Mono',Menlo,Consolas,monospace;font-size:17px;
  letter-spacing:.5px;text-align:center;
}

/* ── Modale ── */
.voile{
  position:fixed;inset:0;background:rgba(11,37,69,.5);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
}
.modale{
  background:#fff;width:100%;max-width:560px;
  border-radius:16px 16px 0 0;padding:18px 16px calc(18px + var(--bas));
  max-height:92vh;overflow-y:auto;
  animation:monte .22s ease-out;
}
@keyframes monte{from{transform:translateY(18px);opacity:.4}}
.modale h3{margin:0 0 14px;font-size:17px}
.poignee{
  width:40px;height:4px;background:var(--bord);border-radius:9px;
  margin:0 auto 14px;
}

/* ── Résultats de recherche superposés ── */
.suggestions{
  border:1.5px solid var(--bord);border-radius:11px;overflow:hidden;
  margin-top:-4px;margin-bottom:12px;background:#fff;
}
.suggestions button{
  display:block;width:100%;text-align:left;padding:12px 13px;
  background:none;border:0;border-bottom:1px solid var(--bord);
}
.suggestions button:last-child{border-bottom:0}
.suggestions button:active{background:#F0F4F8}

/* ── Bandeau hors-ligne ── */
#bandeau{
  background:var(--orange);color:#fff;padding:9px 13px;font-size:13px;
  font-weight:700;display:none;align-items:center;gap:8px;
  position:sticky;top:0;z-index:29;
}
#bandeau.vu{display:flex}
#bandeau button{
  margin-left:auto;background:rgba(255,255,255,.22);border:0;color:#fff;
  padding:5px 11px;border-radius:7px;font-size:12px;font-weight:700;
}

/* ── Notification éphémère ── */
#toast{
  position:fixed;left:12px;right:12px;bottom:calc(84px + var(--bas));
  z-index:80;pointer-events:none;
}
#toast div{
  background:var(--marine);color:#fff;padding:13px 15px;border-radius:11px;
  font-size:14px;font-weight:650;box-shadow:0 5px 22px rgba(11,37,69,.3);
  animation:monte .2s ease-out;margin-top:8px;
}
#toast div.ko{background:var(--rouge)}
#toast div.ok{background:var(--vert)}

/* ═══════════════════════════════════════════════════════════════
   IMPRESSION 50 mm — étiquettes et reçus
   La largeur est imposée par @page : une imprimante thermique de
   50 mm ignore les marges du navigateur, pas la taille de page.
   ═══════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════
   IMPRESSION
   Deux formats : un document A4 pour le client, un ticket 50 mm
   pour l'imprimante thermique. La règle @page est injectée au
   moment de l'impression, parce qu'une feuille de style ne peut
   pas en porter deux.
   ═══════════════════════════════════════════════════════════════ */
#zone-impression{display:none}
@media print{
  body{background:#fff;margin:0}
  /* .voile est frère de #app : sans cette ligne, c'est la fiche
     affichée à l'écran qui part sur le papier, pas le document. */
  #app,#toast,#bandeau,nav,.voile{display:none!important}
  #zone-impression{display:block!important}

  /* ── Document A4 ── */
  .doc{
    font-family:Arial,Helvetica,sans-serif;color:#16222E;font-size:10.5pt;
    line-height:1.45;
  }
  .doc-tete{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid #0B2545;padding-bottom:4mm;margin-bottom:5mm;
  }
  .doc-marque{font-size:21pt;font-weight:bold;letter-spacing:3px;color:#0B2545;
    line-height:1}
  .doc-eclair{color:#F0A818}
  .doc-slogan{font-size:8pt;font-weight:bold;color:#C62828;letter-spacing:2.5px;
    margin-top:1mm}
  .doc-coord{font-size:7.5pt;color:#5F7183;text-align:right;line-height:1.5}
  .doc-titre{
    background:#0B2545;color:#fff;padding:2.5mm 4mm;font-size:12pt;
    font-weight:bold;letter-spacing:1px;display:flex;
    justify-content:space-between;margin-bottom:5mm;
  }
  .doc-cols{display:flex;gap:6mm;margin-bottom:5mm}
  .doc-col{flex:1}
  .doc-col h4{
    font-size:7.5pt;letter-spacing:1.2px;color:#5F7183;margin:0 0 1.5mm;
    text-transform:uppercase;border-bottom:1px solid #D9E0E6;padding-bottom:1mm;
  }
  .doc-col .gros{font-size:11pt;font-weight:bold}
  .doc-col div{font-size:9pt}

  table.doc-t{width:100%;border-collapse:collapse;margin-bottom:4mm}
  table.doc-t th{
    background:#EEF2F6;font-size:8pt;text-transform:uppercase;letter-spacing:.8px;
    color:#0B2545;padding:2mm;text-align:left;border-bottom:1.5px solid #0B2545;
  }
  table.doc-t td{padding:2mm;border-bottom:1px solid #E6ECF1;font-size:9.5pt;
    vertical-align:top}
  table.doc-t .num{text-align:right;white-space:nowrap}
  table.doc-t .ref{font-family:'Courier New',monospace;font-size:8.5pt}

  .doc-tot{margin-left:auto;width:72mm}
  .doc-tot div{display:flex;justify-content:space-between;padding:1.5mm 0;
    font-size:10pt}
  .doc-tot .grand{
    border-top:2px solid #0B2545;margin-top:1mm;padding-top:2mm;
    font-size:13pt;font-weight:bold;
  }
  .doc-tot .gdes{color:#5F7183;font-size:9.5pt}

  .doc-tampon{
    display:inline-block;border:2px solid;padding:1.5mm 5mm;font-weight:bold;
    font-size:11pt;letter-spacing:1.5px;transform:rotate(-3deg);margin-top:3mm;
  }
  .doc-tampon.paye{color:#1B7F4B;border-color:#1B7F4B}
  .doc-tampon.du{color:#C62828;border-color:#C62828}

  .doc-note{
    background:#F7F9FB;border-left:3px solid #F0A818;padding:2.5mm 3mm;
    font-size:8.5pt;margin-top:5mm;color:#16222E;
  }
  .doc-sign{display:flex;gap:10mm;margin-top:14mm}
  .doc-sign div{flex:1;border-top:1px solid #16222E;padding-top:1.5mm;
    font-size:8pt;color:#5F7183}
  .doc-pied{
    margin-top:8mm;border-top:1px solid #D9E0E6;padding-top:2.5mm;
    font-size:7.5pt;color:#5F7183;text-align:center;line-height:1.6;
  }
  .doc-pied b{color:#C62828;letter-spacing:1.5px}

  /* ── Ticket 50 mm ── */
  .etiquette{width:46mm;font-family:Arial,Helvetica,sans-serif;color:#000;
    page-break-after:always}
  .etiquette:last-child{page-break-after:auto}
  .et-haut{text-align:center;font-size:8pt;font-weight:bold;
    border-bottom:1.5px solid #000;padding-bottom:1mm;margin-bottom:1.5mm;
    letter-spacing:.5px}
  .et-code{font-size:21pt;font-weight:bold;text-align:center;line-height:1}
  .et-nom{font-size:10pt;font-weight:bold;text-align:center;margin-top:.8mm}
  .et-ville{font-size:11pt;text-align:center;font-weight:bold;
    border:1.5px solid #000;padding:.8mm;margin:1.5mm 0}
  .et-info{font-size:7.5pt;display:flex;justify-content:space-between;
    margin-bottom:1mm}
  .et-bar{width:100%;height:14mm;display:block}
  .et-tk{font-size:7pt;text-align:center;word-break:break-all;
    font-family:monospace;margin-top:.5mm}
  .et-pied{font-size:6.5pt;text-align:center;margin-top:1.5mm;
    border-top:1px solid #000;padding-top:.8mm}
  .rec-t{font-size:12pt;font-weight:bold;text-align:center}
  .rec-l{font-size:8pt;display:flex;justify-content:space-between;padding:.5mm 0}
  .rec-art{font-size:7.5pt;padding:.4mm 0;border-bottom:1px dotted #999}
  .rec-sep{border-top:1px dashed #000;margin:1.5mm 0}
  .rec-tot{font-size:12pt;font-weight:bold;display:flex;
    justify-content:space-between;border-top:1.5px solid #000;
    padding-top:1mm;margin-top:1mm}
  .rec-tk{font-size:6.5pt;font-family:monospace;word-break:break-all;
    line-height:1.3}
}
</style>
</head>
<body>

<div id="bandeau">
  <span>📴</span><span id="bandeau-txt">Hors ligne</span>
  <button onclick="Queue.vider()">Envoyer</button>
</div>

<div id="app"></div>
<div id="toast"></div>
<div id="zone-impression"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   FLASHIPPING — LOGISTIQUE
   PWA autonome. Aucune dépendance externe : tout tient dans ce
   fichier, ce qui garantit qu'elle démarre même avec un réseau à
   genoux. Le backend est un Apps Script déployé en /exec.
   ═══════════════════════════════════════════════════════════════════ */

/* Le nom de cette application. Il part à chaque connexion : le
   serveur refuse lui-même un rôle qui n'a rien à faire ici, au
   lieu de délivrer un jeton qui ouvrirait les autres apps. */
var APP = 'logistique';

var CLE_URL   = 'fls_api_url';
var CLE_TOKEN = 'fls_token';
var CLE_USER  = 'fls_user';
var CLE_FILE  = 'fls_file_attente';
var CLE_CACHE = 'fls_cache';

// ── Petits utilitaires de stockage, tolérants au mode privé ──
var S = {
  lire: function (c, defaut) {
    try { var v = localStorage.getItem(c); return v === null ? defaut : v; }
    catch (e) { return defaut; }
  },
  ecrire: function (c, v) { try { localStorage.setItem(c, v); } catch (e) {} },
  effacer: function (c) { try { localStorage.removeItem(c); } catch (e) {} },
  lireJson: function (c, defaut) {
    try { return JSON.parse(localStorage.getItem(c)) || defaut; }
    catch (e) { return defaut; }
  },
  ecrireJson: function (c, v) { S.ecrire(c, JSON.stringify(v)); }
};

var Etat = {
  url: S.lire(CLE_URL, ''),
  token: S.lire(CLE_TOKEN, ''),
  user: S.lireJson(CLE_USER, null),
  ref: null,          // référentiels : statuts, agences, paramètres
  onglet: 'scan',
  vue: null,          // données de l'onglet courant
  enLigne: navigator.onLine
};


// ═══════════════════════════════════════════════════════════════════
//  COUCHE API
// ═══════════════════════════════════════════════════════════════════

/**
 * Apps Script ne répond pas aux requêtes préalables CORS. Un
 * Content-Type 'text/plain' garde la requête « simple » : le
 * navigateur l'envoie directement, sans OPTIONS préalable.
 * Mettre application/json ici casserait tout, silencieusement.
 */
function api(action, params) {
  params = params || {};
  if (!Etat.url) return Promise.reject(new Error('Aucune URL d\'API configurée.'));

  var corps = Object.assign({ action: action }, params);
  if (Etat.token && !corps.token) corps.token = Etat.token;

  return fetch(Etat.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(corps),
    redirect: 'follow'
  })
  .then(function (r) { return r.text(); })
  .then(function (texte) {
    var d;
    try { d = JSON.parse(texte); }
    catch (e) {
      // Apps Script renvoie du HTML quand le déploiement est mal réglé
      if (texte.indexOf('<!DOCTYPE') === 0 || texte.indexOf('<html') === 0) {
        // Deux causes très différentes, d'où les deux phrases : avant la
        // première connexion c'est le déploiement, après c'est le script
        // qui a planté ou dépassé son temps d'exécution.
        throw new Error(Etat.token
          ? 'Google a renvoyé une page d\'erreur : le script a échoué ou a ' +
            'dépassé son temps d\'exécution sur cette opération. Regarde ' +
            '« Exécutions » dans Apps Script pour la cause exacte.'
          : 'L\'API a renvoyé une page web au lieu de données. Vérifie que le ' +
            'déploiement est réglé sur « Accès : Tout le monde ».');
      }
      throw new Error('Réponse illisible du serveur.');
    }
    if (d.ok === false) {
      var e2 = new Error(d.erreur || 'Erreur inconnue.');
      e2.metier = true;   // erreur de règle, pas de réseau
      throw e2;
    }
    return d.data !== undefined ? d.data : d;
  })
  .catch(function (e) {
    if (e.metier) throw e;
    if (/Session expirée|Jeton/i.test(e.message)) { deconnecter(); throw e; }
    e.reseau = true;
    throw e;
  });
}

//  FILE D'ATTENTE HORS LIGNE
// ═══════════════════════════════════════════════════════════════════

/**
 * Seuls les MOUVEMENTS sont mis en file. Pas les factures.
 *
 * Un mouvement est rejouable sans danger : le serveur décide du
 * statut suivant d'après l'état réel du colis, donc un envoi en
 * double ne fait pas avancer deux fois. Une réception en double est
 * refusée par « ce colis existe déjà ».
 *
 * Une facture, non : elle prend un numéro, elle écrit un revenu en
 * comptabilité et elle encaisse de l'argent. Un numéro inventé hors
 * ligne entrerait en collision avec celui d'un autre agent, et le
 * reçu remis au client ne correspondrait plus à rien. La facturation
 * exige donc le réseau, et l'écran le dit.
 */
var Queue = {
  ACTIONS_OK: ['colis_avancer', 'colis_recevoir', 'colis_corriger', 'colis_prix'],

  liste: function () { return S.lireJson(CLE_FILE, []); },
  nb: function () { return Queue.liste().length; },

  accepte: function (action) { return Queue.ACTIONS_OK.indexOf(action) !== -1; },

  ajouter: function (action, params, resume) {
    var f = Queue.liste();
    f.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
             action: action, params: params, resume: resume || action,
             date: new Date().toISOString() });
    S.ecrireJson(CLE_FILE, f);
    majBandeau();
  },

  retirer: function (id) {
    S.ecrireJson(CLE_FILE, Queue.liste().filter(function (x) { return x.id !== id; }));
    majBandeau();
  },

  /** Envoi séquentiel : l'ordre des scans compte pour la route. */
  vider: function () {
    var f = Queue.liste();
    if (!f.length) { toast('Rien en attente.', 'ok'); return Promise.resolve(); }
    if (!navigator.onLine) { toast('Toujours hors ligne.', 'ko'); return Promise.resolve(); }

    toast('Envoi de ' + f.length + ' opération(s)…');
    var reussis = 0, echecs = [];

    return f.reduce(function (chaine, item) {
      return chaine.then(function () {
        return api(item.action, item.params)
          .then(function () { Queue.retirer(item.id); reussis++; })
          .catch(function (e) {
            if (e.metier) {
              // Règle refusée : la rejouer ne changera rien, on la sort
              Queue.retirer(item.id);
              echecs.push(item.resume + ' — ' + e.message);
            }
            // Erreur réseau : on la laisse en file pour plus tard
          });
      });
    }, Promise.resolve())
    .then(function () {
      majBandeau();
      if (reussis) toast(reussis + ' opération(s) enregistrée(s).', 'ok');
      if (echecs.length) {
        Etat.echecsQueue = echecs;
        toast(echecs.length + ' refusée(s) — voir Réglages.', 'ko');
      }
      if (Etat.onglet) dessiner();
    });
  }
};

/**
 * Enveloppe les écritures : en ligne on envoie, hors ligne on met en
 * file. L'appelant n'a pas à savoir dans quel état on se trouve.
 */
function ecrire(action, params, resume) {
  if (navigator.onLine) {
    return api(action, params).catch(function (e) {
      if (e.reseau && Queue.accepte(action)) {
        Queue.ajouter(action, params, resume);
        var faux = { _en_attente: true };
        toast('Réseau coupé — mis en attente.', 'ko');
        return faux;
      }
      throw e;
    });
  }
  if (Queue.accepte(action)) {
    Queue.ajouter(action, params, resume);
    return Promise.resolve({ _en_attente: true });
  }
  return Promise.reject(new Error(
    'Cette opération a besoin du réseau. ' +
    (action.indexOf('facture') === 0
      ? 'Une facture prend un numéro et encaisse de l\'argent : elle ne peut pas être créée hors ligne.'
      : '')));
}

function e(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function n2(v) { return (Math.round((Number(v) || 0) * 100) / 100).toFixed(2); }
function n0(v) { return Math.round(Number(v) || 0).toLocaleString('fr-FR'); }
function usd(v) { return n2(v) + ' $'; }
function htg(v) { return n0(v) + ' HTG'; }

function dateCourte(d) {
  if (!d) return '';
  var x = new Date(d);
  if (isNaN(x)) return String(d).substring(0, 16);
  var auj = new Date();
  var memeJour = x.toDateString() === auj.toDateString();
  var h = ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2);
  if (memeJour) return h;
  return ('0' + x.getDate()).slice(-2) + '/' + ('0' + (x.getMonth() + 1)).slice(-2) + ' ' + h;
}

/**
 * Une étiquette sans code-barres se saisit à la main, donc elle se
 * saisit mal. Ce générateur est volontairement inclus en entier
 * plutôt qu'appelé depuis un CDN : l'étiquette doit s'imprimer même
 * sans connexion.
 */
var CODE128 = (function () {
  var P = ['212222','222122','222221','121223','121322','131222','122213','122312',
  '132212','221213','221312','231212','112232','122132','122231','113222','123122',
  '123221','223211','221132','221231','213212','223112','312131','311222','321122',
  '321221','312212','322112','322211','212123','212321','232121','111323','131123',
  '131321','112313','132113','132311','211313','231113','231311','112133','112331',
  '132131','113123','113321','133121','313121','211331','231131','213113','213311',
  '213131','311123','311321','331121','312113','312311','332111','314111','221411',
  '431111','111224','111422','121124','121421','141122','141221','112214','112412',
  '122114','122411','142112','142211','241211','221114','413111','241112','134111',
  '111242','121142','121241','114212','124112','124211','411212','421112','421211',
  '212141','214121','412121','111143','111341','131141','114113','114311','411113',
  '411311','113141','114131','311141','411131','211412','211214','211232','2331112'];

  /** Rendu SVG : net à l'impression, quelle que soit la résolution. */
  function svg(texte, hauteurMm) {
    var t = String(texte || '').replace(/[^\x20-\x7E]/g, '');
    if (!t) return '';

    var valeurs = [104];                       // START B
    var somme = 104;
    for (var i = 0; i < t.length; i++) {
      var v = t.charCodeAt(i) - 32;
      if (v < 0 || v > 94) v = 0;
      valeurs.push(v);
      somme += v * (i + 1);
    }
    valeurs.push(somme % 103);                 // clé de contrôle
    valeurs.push(106);                         // STOP

    var largeurs = [];
    valeurs.forEach(function (v) {
      var motif = P[v] || P[0];
      for (var k = 0; k < motif.length; k++) largeurs.push(Number(motif[k]));
    });

    var total = largeurs.reduce(function (a, b) { return a + b; }, 0);
    var rects = '', x = 0, barre = true;
    largeurs.forEach(function (l) {
      if (barre) {
        rects += '<rect x="' + x + '" y="0" width="' + l + '" height="40" fill="#000"/>';
      }
      x += l; barre = !barre;
    });

    return '<svg class="et-bar" viewBox="0 0 ' + total + ' 40" ' +
           'preserveAspectRatio="none" style="height:' + (hauteurMm || 14) + 'mm" ' +
           'xmlns="http://www.w3.org/2000/svg">' + rects + '</svg>';
  }

  return { svg: svg };
})();

/**
 * Impression.
 *
 * `format` décide de la règle @page, injectée à la volée : une feuille
 * de style ne peut pas porter deux tailles de page, et le navigateur
 * d'Android ignore une taille qui ne correspond pas au papier choisi
 * dans sa boîte de dialogue.
 *
 *   'a4'     document pour le client — à enregistrer en PDF, à envoyer
 *            sur WhatsApp, à classer
 *   'ticket' bande de 50 mm pour l'imprimante thermique du comptoir
 */
function imprimer(html, format) {
  var ancienne = document.getElementById('regle-page');
  if (ancienne) ancienne.remove();

  var st = document.createElement('style');
  st.id = 'regle-page';
  st.textContent = format === 'ticket'
    ? '@media print{@page{size:50mm auto;margin:2mm}}'
    : '@media print{@page{size:A4;margin:12mm}}';
  document.head.appendChild(st);

  document.getElementById('zone-impression').innerHTML = html;
  setTimeout(function () { window.print(); }, 150);
}

/**
 * Ce qui s'imprime sur les documents.

 * Rien n'est figé dans le code : l'administrateur change les mentions,
 * le slogan et les coordonnées depuis ⚙️ Réglages. Les valeurs
 * ci-dessous ne servent que si le paramètre a été effacé du classeur.
 */
function marque_(cle, defaut) {
  var p = (Etat.ref && Etat.ref.parametres) || {};
  var v = p[cle];
  return (v === undefined || v === null || String(v).trim() === '')
    ? defaut : String(v);
}

  { id: 'clients',    ic: '👤', nom: 'Clients' },
  { id: 'livraison',  ic: '🧾', nom: 'Livrer' },
  { id: 'tri',        ic: '🏷', nom: 'Tri', droit: 'attribuer_colis' }
];

var ONGLETS = TOUS_ONGLETS;

function majOnglets() {
  var d = (Etat.user && Etat.user.droits) || {};
  ONGLETS = TOUS_ONGLETS.filter(function (o) { return !o.droit || d[o.droit]; });
  if (!ONGLETS.some(function (o) { return o.id === Etat.onglet; })) {
    Etat.onglet = ONGLETS[0].id;
  }
}

function dessiner() {
  var app = document.getElementById('app');

  if (!Etat.url)   { app.innerHTML = ecranReglage(); return; }
  if (!Etat.token) { app.innerHTML = ecranConnexion(); chargerUtilisateurs(); return; }

  majOnglets();

  var u = Etat.user || {};
  app.innerHTML =
    '<header class="entete">' +
      '<span class="pastille' + (navigator.onLine ? '' : ' hors') + '"></span>' +
      '<h1>' + e(titreOnglet()) +
        '<span class="sous">' + e(u.nom || '') + ' · ' +
        e(villeAgence(u.agence_id) || u.agence_id || '') + ' · ' +
        e(u.role_libelle || u.role || '') +
        '</span></h1>' +
      '<button class="btn-entete" onclick="ouvrirReglages()">⚙️</button>' +
    '</header>' +
    '<main id="contenu">' + chargement() + '</main>' +
    '<nav>' + ONGLETS.map(function (o) {
      return '<button class="' + (Etat.onglet === o.id ? 'actif' : '') +
        '" onclick="allerA(\'' + o.id + '\')">' +
        '<span class="ic">' + o.ic + '</span>' + e(o.nom) + '</button>';
    }).join('') + '</nav>';

  majBandeau();
  rendreOnglet();
}

function titreOnglet() {
  var o = ONGLETS.filter(function (x) { return x.id === Etat.onglet; })[0];
  return o ? o.nom : 'Flashipping';
}

/**
 * Le bouton Retour du téléphone.
 *
 * Une application d'une seule page n'empile rien dans l'historique :
 * Retour sortait donc du site, même avec une fiche ouverte. On pose
 * une entrée d'historique par onglet visité et une par modale, pour
 * que Retour ferme la modale puis remonte les onglets, comme dans
 * n'importe quelle application.
 */
var Nav = { modaleOuverte: false };

function allerA(id, sansHistorique) {
  if (Etat.onglet === id) return;
  arreterCamera();
  Etat.onglet = id;
  Etat.vue = null;
  if (!sansHistorique) {
    try { history.pushState({ onglet: id }, '', '#' + id); } catch (e) {}
  }
  dessiner();
}

window.addEventListener('popstate', function (ev) {
  // Une modale ouverte se ferme en premier : c'est ce que l'utilisateur attend.
  if (Nav.modaleOuverte) { fermerModaleDom(); return; }

  var st = ev.state || {};
  if (st.onglet && st.onglet !== Etat.onglet) {
    arreterCamera();
    Etat.onglet = st.onglet;
    Etat.vue = null;
    dessiner();
  }
});

function poser(html) {
  var c = document.getElementById('contenu');
  if (c) c.innerHTML = html;
}

function rendreOnglet() {
  switch (Etat.onglet) {
    case 'scan':      return ongletScan();
    case 'colis':     return ongletColis();
    case 'clients':   return ongletClients();
    case 'livraison': return ongletLivraison();
    case 'tri':       return ongletTri();
    case 'stock':     return ongletStock();
  }
}

function majBandeau() {
  var b = document.getElementById('bandeau');
  if (!b) return;
  var nb = Queue.nb();
  var hors = !navigator.onLine;
  if (!hors && !nb) { b.className = ''; return; }
  b.className = 'vu';
  document.getElementById('bandeau-txt').textContent =
    hors ? (nb ? 'Hors ligne — ' + nb + ' en attente' : 'Hors ligne')
         : nb + ' opération(s) en attente';
  var pt = document.querySelector('.pastille');
  if (pt) pt.className = 'pastille' + (hors ? ' hors' : '');
}


// ═══════════════════════════════════════════════════════════════════
//  ÉCRAN — RÉGLAGE INITIAL DE L'URL
// ═══════════════════════════════════════════════════════════════════

function ecranReglage() {
  return '<header class="entete"><h1>Flashipping<span class="sous">Première ' +
    'configuration</span></h1></header>' +
    '<main><div class="carte">' +
    bloc('Colle ici l\'URL de ton déploiement Apps Script. Elle se termine ' +
         'par /exec. Tu ne la saisiras qu\'une fois : elle reste enregistrée ' +
         'sur cet appareil.', 'info', '🔗') +
    '<label class="champ"><span>URL de l\'API</span>' +
    '<input type="url" id="in-url" placeholder="https://script.google.com/macros/s/…/exec" ' +
    'autocomplete="off" autocapitalize="off" spellcheck="false"></label>' +
    '<button class="btn" onclick="validerUrl()">Vérifier et continuer</button>' +
    '<div id="res-url"></div></div></main>';
}

function validerUrl() {
  var v = (document.getElementById('in-url').value || '').trim();
  var res = document.getElementById('res-url');

  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(v)) {
    res.innerHTML = bloc('L\'URL doit ressembler à ' +
      'https://script.google.com/macros/s/AKfy…/exec — vérifie qu\'elle finit ' +
      'bien par /exec et non par /dev.', 'ko', '⚠️');
    return;
  }

  res.innerHTML = chargement('Vérification…');
  Etat.url = v;

  api('diag').then(function (d) {
    // Le module logistique absent, l'application n'aurait aucune action :
    // mieux vaut le dire ici que laisser l'agent buter écran par écran.
    if (d.modules && !d.modules.logistique) {
      Etat.url = '';
      res.innerHTML = bloc('L\'API répond, mais le fichier Logistique.gs n\'y ' +
        'est pas enregistré. Ouvre le projet Apps Script, vérifie que le ' +
        'fichier existe, enregistre-le, puis redéploie une nouvelle version.',
        'ko', '❌');
      return;
    }
    S.ecrire(CLE_URL, v);
    toast('API joignable — ' + (d.nb_tables || 0) + ' tables.', 'ok');
    dessiner();
  }).catch(function (err) {
    Etat.url = '';
    res.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

//  ÉCRAN — CONNEXION
// ═══════════════════════════════════════════════════════════════════

function ecranConnexion() {
  return '<header class="entete"><h1>Flashipping<span class="sous">Logistique' +
    '</span></h1></header>' +
    '<main><div class="carte">' +
    '<div id="liste-users">' + chargement('Chargement des comptes…') + '</div>' +
    '</div>' +
    '<button class="btn vide petit" onclick="changerUrl()">Changer l\'URL de l\'API</button>' +
    '</main>';
}

function chargerUtilisateurs() {
  api('utilisateurs_publics', { app: APP }).then(function (liste) {
    var z = document.getElementById('liste-users');
    if (!z) return;
    if (!liste.length) {
      z.innerHTML = bloc('Aucun compte actif. Lance CREER_ADMIN() dans Apps Script.',
                         'attention', '⚠️');
      return;
    }
    z.innerHTML =
      '<label class="champ"><span>Qui es-tu ?</span><select id="in-user">' +
      liste.map(function (u) {
        return '<option value="' + e(u.user_id) + '">' + e(u.nom) + ' — ' +
               e(u.role_libelle || u.role) + ' (' + e(u.agence_id) + ')</option>';
      }).join('') + '</select></label>' +
      '<label class="champ"><span>Code à 6 chiffres</span>' +
      '<input type="password" id="in-code" inputmode="numeric" maxlength="6" ' +
      'autocomplete="current-password" style="text-align:center;font-size:25px;' +
      'letter-spacing:9px;font-weight:700"></label>' +
      '<button class="btn" id="btn-login" onclick="connecter()">Entrer</button>' +
      '<div id="res-login"></div>';

    var ic = document.getElementById('in-code');
    ic.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') connecter();
    });
    ic.addEventListener('input', function () {
      if (ic.value.length === 6) connecter();
    });
  }).catch(function (err) {
    var z = document.getElementById('liste-users');
    if (z) z.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function connecter() {
  var uid = document.getElementById('in-user').value;
  var code = document.getElementById('in-code').value;
  var b = document.getElementById('btn-login');
  var res = document.getElementById('res-login');

  if (!/^\d{6}$/.test(code)) {
    res.innerHTML = bloc('Le code fait 6 chiffres.', 'ko', '⚠️');
    return;
  }

  b.disabled = true;
  b.textContent = 'Connexion…';
  res.innerHTML = '';

  api('login', { user_id: uid, code: code, app: APP }).then(function (d) {
    Etat.token = d.token;
    Etat.user = d.utilisateur;
    S.ecrire(CLE_TOKEN, d.token);
    S.ecrireJson(CLE_USER, d.utilisateur);
    verifierVersion();
    return chargerReferentiels();
  }).then(function () {
    toast('Bienvenue ' + (Etat.user.nom || '') + '.', 'ok');
    dessiner();
  }).catch(function (err) {
    b.disabled = false;
    b.textContent = 'Entrer';
    document.getElementById('in-code').value = '';
    res.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function chargerReferentiels() {
  return api('referentiels').then(function (r) {
    Etat.ref = r;
    S.ecrireJson(CLE_CACHE, { ref: r, date: Date.now() });
    return r;
  }).catch(function (err) {
    // Hors ligne : on repart sur le dernier cache pour que les
    // libellés, couleurs et villes restent lisibles.
    var c = S.lireJson(CLE_CACHE, null);
    if (c && c.ref) { Etat.ref = c.ref; return c.ref; }
    throw err;
  });
}

function deconnecter() {
  if (Queue.nb()) {
    if (!confirm(Queue.nb() + ' opération(s) ne sont pas encore envoyées. ' +
                 'Elles seront perdues. Se déconnecter quand même ?')) return;
  }
  S.effacer(CLE_TOKEN); S.effacer(CLE_USER); S.effacer(CLE_FILE);
  Etat.token = ''; Etat.user = null; Etat.onglet = 'scan';
  arreterCamera();
  dessiner();
}

function changerUrl() {
  if (!confirm('Changer l\'URL de l\'API ? Tu devras te reconnecter.')) return;
  S.effacer(CLE_URL); S.effacer(CLE_TOKEN); S.effacer(CLE_USER);
  Etat.url = ''; Etat.token = ''; Etat.user = null;
  dessiner();
}


// ═══════════════════════════════════════════════════════════════════
//  ONGLET SCAN
// ═══════════════════════════════════════════════════════════════════

var Cam = { flux: null, detecteur: null, boucle: null, dernier: '', quand: 0,
            pause: false };
var ModeRafale = false;
var Rafale = [];

/**
 * Mode douchette : une douchette USB ou Bluetooth se comporte comme un
 * clavier — elle tape le code puis envoie Entrée. Il suffit donc que le
 * champ garde le focus entre deux colis, sinon les caractères se
 * perdent et l'agent doit retoucher l'écran à chaque fois.
 *
 * `inputmode="none"` empêche le clavier du téléphone de s'ouvrir : sur
 * un appareil sans douchette on le laisse, sur un poste équipé il ne
 * ferait que masquer l'écran.
 */
var ModeScanner = S.lire('fls_mode_scanner', '0') === '1';

function ongletScan() {
  var supporte = 'BarcodeDetector' in window;

  poser(
    '<div class="cadre-scan" id="zone-cam" style="display:none">' +
      '<video id="flux" playsinline muted></video><div class="viseur"></div>' +
    '</div>' +
    '<div class="carte serree">' +
      '<div class="saisie-scan">' +
        '<input type="text" id="in-tk" placeholder="' +
          (ModeScanner ? 'Prêt — douchette' : 'Numéro de suivi') + '" ' +
          'autocomplete="off" autocapitalize="characters" spellcheck="false" ' +
          'inputmode="' + (ModeScanner ? 'none' : 'text') + '">' +
        '<button class="btn" style="width:58px;flex:none" onclick="lancerScan()">➜</button>' +
      '</div>' +
      '<div class="rangee-btn" style="margin-top:9px">' +
        '<button class="btn ' + (Cam.flux ? 'rouge' : 'vide') + ' petit" ' +
          'onclick="basculerCamera()">' + (Cam.flux ? '⏹ Stop' : '📷 Caméra') + '</button>' +
        '<button class="btn ' + (ModeRafale ? 'or' : 'vide') + ' petit" ' +
          'onclick="basculerRafale()">⚡ Rafale' +
          (Rafale.length ? ' (' + Rafale.length + ')' : '') + '</button>' +
        '<button class="btn ' + (ModeScanner ? 'vert' : 'vide') + ' petit" ' +
          'onclick="basculerScanner()">🔫 Douchette</button>' +
      '</div>' +
      (ModeScanner
        ? '<div style="font-size:12px;color:var(--vert);margin-top:9px;' +
          'font-weight:650">Le champ reste actif entre deux colis et le clavier ' +
          'ne s\'ouvre plus. Avec la rafale, tu enchaînes sans toucher l\'écran.</div>'
        : (supporte ? '' : '<div style="font-size:12px;color:var(--doux);' +
          'margin-top:9px">Ce navigateur ne lit pas les codes-barres par la ' +
          'caméra. Saisis le numéro, branche une douchette, ou utilise ' +
          'Chrome sur Android.</div>')) +
    '</div>' +
    '<div id="zone-rafale">' + (ModeRafale ? zoneRafale() : '') + '</div>' +
    '<div id="res-scan"></div>'
  );

  var i = document.getElementById('in-tk');
  i.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') lancerScan(); });
  if (Cam.flux) brancherFlux();
  else redonnerFocus();
}

/** Le champ doit être prêt à recevoir le colis suivant, toujours. */
function redonnerFocus() {
  if (Cam.flux) return;
  if (document.getElementById('voile')) return;   // une modale est ouverte
  var i = document.getElementById('in-tk');
  if (i) setTimeout(function () { try { i.focus(); } catch (e) {} }, 60);
}

function basculerScanner() {
  ModeScanner = !ModeScanner;
  S.ecrire('fls_mode_scanner', ModeScanner ? '1' : '0');
  if (ModeScanner && Cam.flux) arreterCamera();
  rendreOnglet();
  toast(ModeScanner ? 'Mode douchette activé.' : 'Mode douchette désactivé.', 'ok');
}

function zoneRafale() {
  return '<div class="carte">' +
    '<div class="titre-section" style="margin-top:0">Rafale — ' +
      Rafale.length + ' colis</div>' +
    (Rafale.length
      ? Rafale.map(function (t, i) {
          return '<div class="ligne"><div class="corps"><div class="mono">' +
            e(t) + '</div></div><button class="btn vide petit" ' +
            'style="width:42px" onclick="retirerRafale(' + i + ')">✕</button></div>';
        }).join('') +
        '<button class="btn vert" onclick="envoyerRafale()">Faire avancer les ' +
          Rafale.length + ' colis</button>' +
        '<button class="btn vide petit" onclick="Rafale=[];majRafale()">Tout effacer</button>'
      : '<div style="color:var(--doux);font-size:13.5px">Scanne les colis les ' +
        'uns après les autres. Ils avanceront tous d\'un cran en une seule fois.</div>') +
  '</div>';
}

/**
 * On ne repeint que la liste, pas tout l'onglet : reconstruire l'écran
 * à chaque colis ferait perdre le focus à la douchette et saccaderait
 * la saisie.
 */
function majRafale() {
  var z = document.getElementById('zone-rafale');
  if (z) z.innerHTML = ModeRafale ? zoneRafale() : '';
  var b = document.querySelector('.rangee-btn .btn.or');
  if (b) b.innerHTML = '⚡ Rafale' + (Rafale.length ? ' (' + Rafale.length + ')' : '');
  redonnerFocus();
}

function basculerRafale() {
  ModeRafale = !ModeRafale;
  if (!ModeRafale) Rafale = [];
  rendreOnglet();
}
function retirerRafale(i) { Rafale.splice(i, 1); majRafale(); }

function envoyerRafale() {
  if (!Rafale.length) return;
  var liste = Rafale.slice();

  if (!navigator.onLine) {
    // Hors ligne, un par un dans la file : chacun reste rejouable seul
    liste.forEach(function (t) {
      Queue.ajouter('colis_avancer', { tracking: t }, 'Avancer ' + t);
    });
    Rafale = [];
    toast(liste.length + ' colis mis en attente.', 'ok');
    rendreOnglet();
    return;
  }

  poser(chargement('Envoi de ' + liste.length + ' colis…'));
  api('colis_avancer_lot', { trackings: JSON.stringify(liste) }).then(function (d) {
    Rafale = [];
    rendreOnglet();
    var h = bloc(d.nb_reussis + ' colis avancé(s)' +
      (d.nb_echecs ? ', ' + d.nb_echecs + ' refusé(s)' : '') + '.',
      d.nb_echecs ? 'attention' : 'ok', d.nb_echecs ? '⚠️' : '✅');

    if (d.echecs && d.echecs.length) {
      h += '<div class="carte"><div class="titre-section" style="margin-top:0">' +
        'Refusés</div>' + d.echecs.map(function (x) {
          return '<div class="ligne"><div class="corps"><div class="mono">' +
            e(x.tracking) + '</div><div class="t2">' + e(x.erreur) + '</div></div></div>';
        }).join('') + '</div>';
    }
    if (d.a_notifier && d.a_notifier.length) {
      h += bloc(d.a_notifier.length + ' colis sont devenus disponibles. ' +
        'Pense à prévenir les clients depuis leur fiche.', 'info', '💬');
    }
    document.getElementById('res-scan').innerHTML = h;
  }).catch(function (err) {
    rendreOnglet();
    document.getElementById('res-scan').innerHTML = bloc(err.message, 'ko', '❌');
  });
}

/**
 * Le colis dont on attend l'écran de scan, et le nombre d'essais déjà
 * faits pour y arriver. Voir lancerScan ci-dessous.
 */
var ScanEnAttente = null;
var ScanEssais = 0;

/**
 * Reprend un scan demandé depuis un autre onglet.
 *
 * Il faut parfois deux passages, et c'est voulu. Fermer la fiche colis
 * appelle history.back(), dont le popstate arrive APRÈS le clic : il
 * remet l'onglet d'origine et redessine, effaçant l'écran de scan
 * qu'on venait d'ouvrir. Au deuxième essai, plus rien n'est en
 * attente et la navigation tient.
 *
 * Le compteur borne la reprise. Sans lui, un onglet qui refuserait de
 * s'afficher ferait tourner cette fonction indéfiniment — et une
 * boucle invisible sur un téléphone de guichet vide la batterie sans
 * que personne comprenne pourquoi.
 */
function reprendreScanEnAttente() {
  if (!ScanEnAttente) return;

  if (!document.getElementById('res-scan')) {
    if (++ScanEssais > 10) {
      ScanEnAttente = null;
      toast('Impossible d\'ouvrir l\'écran de scan.', 'ko');
      return;
    }
    if (Etat.onglet !== 'scan') allerA('scan');
    setTimeout(reprendreScanEnAttente, 60);
    return;
  }

  var t = ScanEnAttente;
  ScanEnAttente = null;
  lancerScan(t);
}

function lancerScan(valeur) {
  var champ = document.getElementById('in-tk');
  var t = (valeur || (champ ? champ.value : '') || '').trim().toUpperCase();
  if (!t) return;

  /**
   * Appelé depuis un autre onglet — le bouton « Faire avancer » de la
   * fiche colis le fait.
   *
   * Le conteneur res-scan n'existe que sur l'onglet Scan. Sans cette
   * garde, la ligne suivante lisait null.innerHTML, levait une
   * exception qu'aucun gestionnaire n'attrapait, et le bouton ne
   * faisait visiblement rien. Une panne muette : l'agent clique,
   * l'écran ne bouge pas, et rien n'indique où regarder.
   */
  if (!document.getElementById('res-scan')) {
    ScanEnAttente = t;
    ScanEssais = 0;
    if (Etat.onglet !== 'scan') allerA('scan');
    setTimeout(reprendreScanEnAttente, 60);
    return;
  }

  if (champ) champ.value = '';

  if (ModeRafale) {
    if (Rafale.indexOf(t) === -1) { Rafale.push(t); bip(); }
    else toast('Déjà scanné.');
    majRafale();
    return;
  }

  if (!navigator.onLine) {
    // Sans réseau on ne peut pas interroger l'état : on propose
    // l'avancement à l'aveugle, que le serveur tranchera au retour.
    document.getElementById('res-scan').innerHTML =
      '<div class="carte"><div class="mono" style="font-size:15px;font-weight:700">' +
      e(t) + '</div>' +
      bloc('Hors ligne : impossible de lire l\'état de ce colis. Tu peux ' +
           'quand même enregistrer son passage — le serveur appliquera la ' +
           'bonne étape au retour du réseau.', 'attention', '📴') +
      '<button class="btn vert" onclick="avancerHorsLigne(\'' + e(t) + '\')">' +
      'Enregistrer le passage</button></div>' + boutonReprise();
    pauserCamera();
    return;
  }

  document.getElementById('res-scan').innerHTML = chargement('Lecture…');
  pauserCamera();
  api('colis_scanner', { tracking: t }).then(function (d) {
    bip();
    document.getElementById('res-scan').innerHTML = carteScan(d) + boutonReprise();
    redonnerFocus();
  }).catch(function (err) {
    document.getElementById('res-scan').innerHTML =
      bloc(err.message, 'ko', '❌') + boutonReprise();
    redonnerFocus();
  });
}

function avancerHorsLigne(t) {
  Queue.ajouter('colis_avancer', { tracking: t }, 'Avancer ' + t);
  toast('Mis en attente.', 'ok');
  document.getElementById('res-scan').innerHTML =
    bloc('Passage de ' + t + ' enregistré localement. Il partira dès le ' +
         'retour du réseau.', 'ok', '✅');
}

function carteScan(d) {
  if (d.etat === 'inconnu') {
    return '<div class="carte">' +
      '<div class="mono" style="font-size:15px;font-weight:700;margin-bottom:4px">' +
        e(d.tracking) + '</div>' +
      bloc('Colis inconnu — c\'est une nouvelle réception.', 'info', '🆕') +
      '<button class="btn or" onclick="ouvrirReception(\'' + e(d.tracking) + '\')">' +
      'Réceptionner ce colis</button></div>';
  }

  if (d.etat === 'bloque' && !d.colis) {
    return bloc(d.message, 'ko', '🚫');
  }

  var c = d.colis;
  var s = d.suivant || {};

  var h = '<div class="carte">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;' +
      'gap:10px;margin-bottom:10px">' +
      '<div style="min-width:0"><div style="font-weight:800;font-size:16px">' +
        e(c.client_nom) + '</div>' +
      '<div class="mono" style="color:var(--doux)">' + e(d.tracking) + '</div></div>' +
      puceStatut(c.statut) +
    '</div>' +
    '<div class="stats" style="margin-bottom:12px">' +
      '<div class="stat"><div class="v">' + n2(c.poids_lb) + '</div><div class="l">livres</div></div>' +
      '<div class="stat"><div class="v">' + n2(c.montant_usd) + '</div><div class="l">USD</div></div>' +
      '<div class="stat"><div class="v" style="font-size:14px;padding:3px 0">' +
        e(c.ville_destination) + '</div><div class="l">destination</div></div>' +
    '</div>';

  if (d.route && d.route.length) {
    h += '<div class="titre-section">Itinéraire</div><div class="route">';
    var iCourant = -1;
    d.route.forEach(function (r, i) { if (r.agence_id === c.agence_courante) iCourant = i; });
    d.route.forEach(function (r, i) {
      var cls = i < iCourant ? 'faite' : (i === iCourant ? 'ici faite' : '');
      h += '<div class="etape ' + cls + '"><div class="rail"><div class="pt"></div>' +
        (i < d.route.length - 1 ? '<div class="fil"></div>' : '') + '</div>' +
        '<div class="txt">' + e(r.ville) +
        (i === iCourant ? '<small>le colis est ici</small>' : '') + '</div></div>';
    });
    h += '</div>';
  }

  if (s.possible) {
    var etiq = s.action === 'sortie'  ? 'Scanner la SORTIE → ' + e(villeAgence(s.vers) || s.vers)
             : s.action === 'entree'  ? 'Scanner l\'ENTRÉE à ' + e(villeAgence(s.vers) || s.vers)
             : 'Passer à « ' + e(s.libelle) + ' »';

    if (s.action === 'livraison') {
      h += bloc('Ce colis est disponible. Il se remet au client depuis ' +
                'l\'onglet Livrer, qui produit la facture.', 'info', '🧾') +
        '<button class="btn or" onclick="allerLivrer(\'' + e(c.client_id) + '\')">' +
        'Préparer la livraison</button>';
    } else {
      h += '<button class="btn vert" onclick="confirmerAvance(\'' + e(d.tracking) +
        '\')">' + etiq + '</button>';
    }
  } else if (s.a_identifier) {
    h += bloc(s.message, 'attention', '🏷') +
      '<button class="btn or" onclick="fermerModalePuis(function(){allerA(\'tri\')})">' +
      '👤 Aller attribuer ce colis</button>';
  } else {
    h += bloc(s.message || 'Aucune étape suivante.', 'attention', '⏸');
  }

  h += '<div class="rangee-btn" style="margin-top:9px">' +
    '<button class="btn vide petit" onclick="imprimerEtiquette(' +
      e(JSON.stringify({
        tracking: d.tracking, client_nom: c.client_nom, code_client: '',
        ville_destination: c.ville_destination, poids_lb: c.poids_lb,
        montant_usd: c.montant_usd, contenu: c.contenu
      })).replace(/'/g, '&#39;') + ')">🏷 Étiquette</button>' +
    '<button class="btn vide petit" onclick="ouvrirDetail(\'' + e(d.tracking) +
      '\')">📄 Détail</button></div>';

  return h + '</div>';
}

function confirmerAvance(t) {
  var z = document.getElementById('res-scan');
  z.innerHTML = chargement('Enregistrement…');
  ecrire('colis_avancer', { tracking: t }, 'Avancer ' + t).then(function (d) {
    if (d._en_attente) {
      z.innerHTML = bloc('Mis en attente — partira au retour du réseau.', 'attention', '📴');
      return;
    }
    bip();
    var h = bloc(d.ancien + ' → ' + d.libelle, 'ok', '✅');
    if (d.notifier_client) {
      h += bloc('Le colis est disponible : prévenez le client.', 'info', '💬');
    }
    h += '<button class="btn vide" onclick="lancerScan(\'' + e(t) + '\')">Revoir ce colis</button>';
    // Ce colis est traité : la caméra peut reprendre sans qu'on le lui demande.
    Cam.pause = false; Cam.dernier = '';
    z.innerHTML = h;
    redonnerFocus();
  }).catch(function (err) {
    z.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function bip() {
  try {
    var c = new (window.AudioContext || window.webkitAudioContext)();
    var o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = 1180; o.type = 'square';
    g.gain.setValueAtTime(.08, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .11);
    o.start(); o.stop(c.currentTime + .11);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(45);
}


// ── Caméra et lecture de codes-barres ──

function basculerCamera() {
  if (Cam.flux) { arreterCamera(); rendreOnglet(); return; }
  demarrerCamera();
}

function demarrerCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('Caméra indisponible sur cet appareil.', 'ko');
    return;
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' },
             width: { ideal: 1280 }, height: { ideal: 720 } }
  }).then(function (flux) {
    Cam.flux = flux;
    rendreOnglet();
  }).catch(function () {
    toast('Accès à la caméra refusé.', 'ko');
  });
}

function brancherFlux() {
  var v = document.getElementById('flux');
  var z = document.getElementById('zone-cam');
  if (!v || !Cam.flux) return;
  z.style.display = 'block';
  v.srcObject = Cam.flux;
  v.play().catch(function () {});

  if (!('BarcodeDetector' in window)) return;
  if (!Cam.detecteur) {
    try {
      Cam.detecteur = new window.BarcodeDetector({
        formats: ['code_128', 'code_39', 'ean_13', 'qr_code', 'itf', 'codabar']
      });
    } catch (e) { return; }
  }

  // 300 ms suffisent : au-delà le téléphone chauffe pour rien
  Cam.boucle = setInterval(function () {
    if (!Cam.flux || Cam.pause || v.readyState < 2) return;
    Cam.detecteur.detect(v).then(function (codes) {
      if (!codes || !codes.length) return;
      var val = String(codes[0].rawValue || '').trim().toUpperCase();
      if (!val) return;
      // Anti-rebond : un code reste dans le viseur plusieurs images
      if (val === Cam.dernier && Date.now() - Cam.quand < 2800) return;
      Cam.dernier = val; Cam.quand = Date.now();
      lancerScan(val);
    }).catch(function () {});
  }, 300);
}

/**
 * La caméra se met en pause dès qu'un résultat demande une décision.
 *
 * Sans cela elle relit le même code toutes les trois secondes et
 * remplace l'écran que l'agent est en train de lire — c'est
 * particulièrement pénible sur un colis inconnu, où il faut remplir un
 * formulaire pendant que la caméra insiste.
 */
function pauserCamera() {
  if (Cam.flux) Cam.pause = true;
}

function reprendreCamera() {
  Cam.pause = false;
  Cam.dernier = '';                       // le même code redevient scannable
  var z = document.getElementById('res-scan');
  if (z) z.innerHTML = '';
  redonnerFocus();
}

/** Bouton de reprise, affiché seulement quand la caméra est en pause. */
function boutonReprise() {
  if (!Cam.flux || !Cam.pause) return '';
  return '<button class="btn or" onclick="reprendreCamera()">' +
         '▶ Scanner le colis suivant</button>';
}

function arreterCamera() {
  Cam.pause = false;
  if (Cam.boucle) { clearInterval(Cam.boucle); Cam.boucle = null; }
  if (Cam.flux) {
    Cam.flux.getTracks().forEach(function (t) { t.stop(); });
    Cam.flux = null;
  }
  Cam.dernier = '';
}

var Recep = { client: null, anonyme: false };

function ouvrirReception(tracking) {
  Recep.client = null;
  Recep.anonyme = false;
  var peutPrix = Etat.user && Etat.user.droits && Etat.user.droits.fixer_prix;
  var prixDef = (Etat.ref && Etat.ref.parametres && Etat.ref.parametres.PRIX_LB_USD) || 5;

  var agences = (Etat.ref && Etat.ref.agences || [])
    .filter(function (a) { return a.agence_id !== 'AG00'; });

  modale('Réceptionner un colis',
    '<label class="champ"><span>Numéro de suivi</span>' +
      '<input type="text" id="r-tk" value="' + e(tracking || '') + '" ' +
      'class="mono" autocapitalize="characters" spellcheck="false"></label>' +

    '<label class="champ"><span>Client <span style="font-weight:400">' +
      '— facultatif</span></span>' +
      '<input type="text" id="r-cli" placeholder="Nom, code ou téléphone" ' +
      'autocomplete="off" oninput="chercherClientRecep()"></label>' +
    '<div id="r-sugg"></div>' +
    '<div id="r-choisi"></div>' +
    '<button class="btn vide petit" style="margin:-4px 0 12px" ' +
      'onclick="sansClient()">⏭ Sans client — à identifier plus tard</button>' +

    '<div class="duo">' +
      '<label class="champ"><span>Poids (lb)</span>' +
        '<input type="number" id="r-poids" step="0.1" min="0" inputmode="decimal" ' +
        'oninput="majMontantRecep()"></label>' +
      '<label class="champ"><span>Prix / lb ($)</span>' +
        '<input type="number" id="r-prix" step="0.25" min="0" inputmode="decimal" ' +
        'value="' + e(prixDef) + '" ' + (peutPrix ? '' : 'readonly') + ' ' +
        'oninput="majMontantRecep()"></label>' +
    '</div>' +
    (peutPrix ? '' : '<div style="font-size:12px;color:var(--doux);margin:-6px 0 12px">' +
      'Seuls un admin ou un responsable peuvent changer le prix.</div>') +

    '<div class="total gros" style="margin-bottom:12px"><span class="l">Montant</span>' +
      '<span id="r-montant">0.00 $</span></div>' +

    '<label class="champ"><span>Contenu</span>' +
      '<input type="text" id="r-contenu" placeholder="Vêtements, téléphone…"></label>' +

    '<label class="champ"><span>Agence de destination</span><select id="r-dest">' +
      '<option value="">— celle du client —</option>' +
      agences.map(function (a) {
        return '<option value="' + e(a.agence_id) + '">' + e(a.ville) +
               ' (' + e(a.agence_id) + ')</option>';
      }).join('') + '</select></label>' +

    '<label class="champ"><span>Point d\'entrée en Haïti</span><select id="r-entree">' +
      '<option value="">— identique à la destination —</option>' +
      agences.filter(function (a) { return String(a.type).trim() === 'hub'; })
        .map(function (a) {
          return '<option value="' + e(a.agence_id) + '">' + e(a.ville) + '</option>';
        }).join('') + '</select>' +
      '<span style="font-size:12px;color:var(--doux);font-weight:400;' +
        'display:block;margin-top:5px">Par où le colis entre en Haïti. ' +
        'Ouanaminthe pour un colis qui passe la douane là-bas, même si ' +
        'sa destination est le Cap.</span>' +
      '</label>' +

    '<div id="r-res"></div>' +
    '<button class="btn vert" id="r-btn" onclick="validerReception()">Enregistrer</button>'
  );

  setTimeout(function () {
    var c = document.getElementById('r-cli');
    if (c && !tracking) document.getElementById('r-tk').focus();
    else if (c) c.focus();
  }, 220);
}

var minuteurRecep = null;
function chercherClientRecep() {
  clearTimeout(minuteurRecep);
  var q = document.getElementById('r-cli').value.trim();
  var z = document.getElementById('r-sugg');
  if (q.length < 2) { z.innerHTML = ''; return; }

  minuteurRecep = setTimeout(function () {
    api('client_chercher', { q: q }).then(function (liste) {
      if (!liste.length) {
        z.innerHTML = '<div class="suggestions"><button onclick="ouvrirNouveauClient()">' +
          '➕ Créer « ' + e(q) + ' »</button></div>';
        return;
      }
      z.innerHTML = '<div class="suggestions">' + liste.map(function (c) {
        return '<button onclick="choisirClientRecep(' +
          e(JSON.stringify(c)).replace(/'/g, '&#39;') + ')"><b>' + e(c.nom_complet) +
          '</b> <span style="color:var(--doux)">' + e(c.code_client) + '</span>' +
          '<div style="font-size:12px;color:var(--doux)">' + e(c.telephone) +
          ' · ' + e(villeAgence(c.agence_id)) + '</div></button>';
      }).join('') + '<button onclick="ouvrirNouveauClient()">➕ Nouveau client</button></div>';
    }).catch(function (err) { z.innerHTML = bloc(err.message, 'ko', '❌'); });
  }, 330);
}

/**
 * Le quai ne s'arrête pas pour chercher un nom. Le colis part sur le
 * client système et rejoint la file « à identifier » — il circulera
 * normalement, mais ne pourra pas devenir disponible tant qu'un
 * responsable ne lui aura pas donné son client.
 */
function sansClient() {
  Recep.client = null;
  Recep.anonyme = true;
  document.getElementById('r-sugg').innerHTML = '';
  document.getElementById('r-cli').value = '';
  document.getElementById('r-choisi').innerHTML =
    '<div class="msg attention" style="margin-top:-4px"><span class="ic">🏷</span>' +
    '<span>À identifier plus tard. Le colis apparaîtra dans la file de tri, ' +
    'et un responsable lui donnera son client avant la livraison.</span></div>';
  var d = document.getElementById('r-dest');
  if (d) d.value = '';
  document.getElementById('r-poids').focus();
}

function choisirClientRecep(c) {
  Recep.anonyme = false;
  Recep.client = c;
  document.getElementById('r-sugg').innerHTML = '';
  document.getElementById('r-cli').value = c.nom_complet;
  document.getElementById('r-choisi').innerHTML =
    '<div class="msg ok" style="margin-top:-4px"><span class="ic">👤</span><span>' +
    e(c.nom_complet) + ' · ' + e(c.code_client) + ' · ' +
    e(villeAgence(c.agence_id)) + '</span></div>';
  var d = document.getElementById('r-dest');
  if (d && c.agence_id) d.value = c.agence_id;
  document.getElementById('r-poids').focus();
}

function majMontantRecep() {
  var p = Number(document.getElementById('r-poids').value) || 0;
  var pr = Number(document.getElementById('r-prix').value) || 0;
  var min = Number((Etat.ref && Etat.ref.parametres && Etat.ref.parametres.POIDS_MINIMUM_LB) || 0.5);
  if (p > 0 && p < min) p = min;
  document.getElementById('r-montant').textContent = usd(p * pr);
}

function validerReception() {
  var tk = document.getElementById('r-tk').value.trim();
  var res = document.getElementById('r-res');
  var b = document.getElementById('r-btn');

  if (tk.length < 4) { res.innerHTML = bloc('Numéro de suivi trop court.', 'ko', '⚠️'); return; }
  if (!Recep.client && !Recep.anonyme) {
    res.innerHTML = bloc('Choisis un client, ou appuie sur « Sans client » ' +
                         'pour l\'identifier plus tard.', 'ko', '⚠️');
    return;
  }

  var p = {
    tracking: tk,
    poids_lb: document.getElementById('r-poids').value || 0,
    contenu: document.getElementById('r-contenu').value || ''
  };
  // Sans client_id, le serveur rattache au client système et marque le
  // colis « à identifier ».
  if (Recep.client) p.client_id = Recep.client.client_id;
  var dest = document.getElementById('r-dest').value;
  var entree = document.getElementById('r-entree').value;
  if (dest) p.agence_destination = dest;
  if (entree) p.agence_entree = entree;

  var peutPrix = Etat.user && Etat.user.droits && Etat.user.droits.fixer_prix;
  var prixSaisi = document.getElementById('r-prix').value;
  var prixDef = String((Etat.ref && Etat.ref.parametres && Etat.ref.parametres.PRIX_LB_USD) || 5);
  if (peutPrix && prixSaisi !== '' && prixSaisi !== prixDef) p.prix_lb_usd = prixSaisi;

  b.disabled = true; b.textContent = 'Enregistrement…';

  ecrire('colis_recevoir', p, 'Réception ' + tk).then(function (d) {
    fermerModale();
    if (d._en_attente) {
      toast('Réception mise en attente.', 'ok');
      return;
    }
    bip();
    var pourEtiquette = {
      tracking: d.tracking, client_nom: d.client_nom,
      code_client: Recep.client ? Recep.client.code_client : '?',
      ville_destination: villeAgence(d.agence_destination),
      poids_lb: d.poids_lb, montant_usd: d.montant_usd,
      contenu: p.contenu
    };
    document.getElementById('res-scan').innerHTML =
      bloc(d.client_nom + ' · ' + n2(d.poids_lb) + ' lb · ' + usd(d.montant_usd),
           'ok', '✅') +
      (d.a_identifier
        ? bloc('Colis sans client : il est dans la file de tri. Un responsable ' +
               'devra l\'attribuer avant qu\'il puisse être livré.',
               'attention', '🏷')
        : '') +
      '<div class="carte"><div class="titre-section" style="margin-top:0">' +
        'Itinéraire prévu</div><div style="font-size:14px;font-weight:650">' +
        (d.route || []).map(e).join(' → ') + '</div>' +
      '<button class="btn or" style="margin-top:12px" onclick="imprimerEtiquette(' +
        e(JSON.stringify(pourEtiquette)).replace(/'/g, '&#39;') + ')">' +
        '🏷 Imprimer l\'étiquette 50 mm</button>' +
      '<button class="btn vide petit" onclick="ouvrirReception()">' +
        '➕ Réceptionner le suivant</button></div>' + boutonReprise();
    Cam.pause = false; Cam.dernier = '';
  }).catch(function (err) {
    b.disabled = false; b.textContent = 'Enregistrer';
    res.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function ouvrirNouveauClient(apres) {
  var agences = (Etat.ref && Etat.ref.agences || [])
    .filter(function (a) { return a.agence_id !== 'AG00'; });

  modale('Nouveau client',
    '<div class="duo">' +
      '<label class="champ"><span>Nom</span><input type="text" id="c-nom" ' +
        'autocapitalize="words"></label>' +
      '<label class="champ"><span>Prénom</span><input type="text" id="c-prenom" ' +
        'autocapitalize="words"></label>' +
    '</div>' +
    '<label class="champ"><span>Téléphone</span><input type="tel" id="c-tel" ' +
      'inputmode="tel" placeholder="509…"></label>' +
    '<label class="champ"><span>WhatsApp <span style="font-weight:400">' +
      '(si différent)</span></span><input type="tel" id="c-wa" inputmode="tel"></label>' +
    '<label class="champ"><span>Ville</span><input type="text" id="c-ville" ' +
      'autocapitalize="words"></label>' +
    '<label class="champ"><span>Agence de rattachement</span><select id="c-ag">' +
      agences.map(function (a) {
        return '<option value="' + e(a.agence_id) + '"' +
          (Etat.user && a.agence_id === Etat.user.agence_id ? ' selected' : '') +
          '>' + e(a.ville) + ' (' + e(a.agence_id) + ')</option>';
      }).join('') + '</select></label>' +
    '<div id="c-res"></div>' +
    '<button class="btn vert" id="c-btn" onclick="validerClient(' +
      (apres ? "'" + apres + "'" : 'null') + ')">Créer</button>'
  );
  setTimeout(function () { document.getElementById('c-nom').focus(); }, 220);
}

function validerClient(apres) {
  var res = document.getElementById('c-res');
  var b = document.getElementById('c-btn');
  var p = {
    nom: document.getElementById('c-nom').value.trim(),
    prenom: document.getElementById('c-prenom').value.trim(),
    telephone: document.getElementById('c-tel').value.trim(),
    whatsapp: document.getElementById('c-wa').value.trim(),
    ville: document.getElementById('c-ville').value.trim(),
    agence_id: document.getElementById('c-ag').value
  };
  if (!p.nom && !p.prenom) {
    res.innerHTML = bloc('Nom ou prénom requis.', 'ko', '⚠️'); return;
  }

  b.disabled = true; b.textContent = 'Création…';
  api('client_creer', p).then(function (d) {
    toast(d.nom_complet + ' — code ' + d.code_client, 'ok');
    fermerModale();
    if (apres === 'recep') {
      ouvrirReception();
      setTimeout(function () { choisirClientRecep(d); }, 300);
    } else if (Etat.onglet === 'clients') {
      ouvrirFicheClient(d.client_id);
    } else {
      // Retour au flux de réception, le cas le plus fréquent
      ouvrirReception();
      setTimeout(function () { choisirClientRecep(d); }, 300);
    }
  }).catch(function (err) {
    b.disabled = false; b.textContent = 'Créer';
    res.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

var FiltreColis = { statut: '', q: '', sur_place: false };

function ongletColis() {
  var statuts = (Etat.ref && Etat.ref.statuts) || [];

  poser(
    '<div class="carte serree">' +
      '<input type="text" id="f-q" placeholder="Numéro de suivi ou nom de client" ' +
        'value="' + e(FiltreColis.q) + '" autocomplete="off" oninput="filtrerColis()">' +
    '</div>' +
    '<div class="puces">' +
      '<button class="puce ' + (!FiltreColis.statut && !FiltreColis.sur_place ? 'actif' : '') +
        '" onclick="choisirStatut(\'\')">Tous</button>' +
      '<button class="puce ' + (FiltreColis.sur_place ? 'actif' : '') +
        '" onclick="choisirSurPlace()">🏬 Chez moi</button>' +
      statuts.map(function (s) {
        return '<button class="puce ' + (FiltreColis.statut === s.code ? 'actif' : '') +
          '" onclick="choisirStatut(\'' + e(s.code) + '\')">' + e(s.libelle) +
          '<b id="cpt-' + e(s.code) + '"></b></button>';
      }).join('') +
    '</div>' +
    '<div id="liste-colis">' + chargement() + '</div>'
  );
  chargerColis();
}

function choisirStatut(s) {
  FiltreColis.statut = s; FiltreColis.sur_place = false;
  ongletColis();
}
function choisirSurPlace() {
  FiltreColis.sur_place = !FiltreColis.sur_place;
  FiltreColis.statut = '';
  ongletColis();
}

var minuteurColis = null;
function filtrerColis() {
  clearTimeout(minuteurColis);
  FiltreColis.q = document.getElementById('f-q').value;
  minuteurColis = setTimeout(chargerColis, 380);
}

function chargerColis() {
  var z = document.getElementById('liste-colis');
  if (!z) return;
  z.innerHTML = chargement();

  var p = { limite: 150 };
  if (FiltreColis.statut) p.statut = FiltreColis.statut;
  if (FiltreColis.q) p.q = FiltreColis.q;
  if (FiltreColis.sur_place && Etat.user) p.sur_place = Etat.user.agence_id;

  api('colis_lister', p).then(function (d) {
    (Etat.ref.statuts || []).forEach(function (s) {
      var b = document.getElementById('cpt-' + s.code);
      if (b) b.textContent = d.compteurs[s.code] ? ' ' + d.compteurs[s.code] : '';
    });

    if (!d.colis.length) { z.innerHTML = vide('📦', 'Aucun colis.'); return; }

    var entete = '<div style="font-size:12.5px;color:var(--doux);padding:0 3px 8px;' +
      'font-weight:650">' + d.affiches + ' sur ' + d.total +
      (d.total > d.affiches ? ' — affine ta recherche' : '') + '</div>';

    z.innerHTML = entete + d.colis.map(ligneColis).join('');
  }).catch(function (err) {
    z.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function ligneColis(c) {
  var marques = '';
  if (c.a_identifier) marques += '<span class="badge passage">🏷 à identifier</span> ';
  if (c.en_camion)  marques += '<span class="badge camion">🚚 en route</span> ';
  if (c.de_passage && !c.en_camion) marques += '<span class="badge passage">↻ de passage</span> ';
  if (c.statut === 'livre') {
    marques += c.statut_paiement === 'paye'
      ? '<span class="badge paye">payé</span>'
      : '<span class="badge impaye">' + e(c.statut_paiement) + '</span>';
  }

  return '<button class="ligne" onclick="ouvrirDetail(\'' + e(c.tracking) + '\')">' +
    '<div class="corps">' +
      '<div class="t1">' + e(c.client_nom) + '</div>' +
      '<div class="t2 mono">' + e(c.tracking) + '</div>' +
      '<div style="margin-top:5px">' + puceStatut(c.statut, c.libelle) + ' ' + marques + '</div>' +
    '</div>' +
    '<div class="droite">' +
      '<div style="font-weight:800;font-size:14.5px">' + usd(c.montant_usd) + '</div>' +
      '<div style="font-size:12px;color:var(--doux)">' + n2(c.poids_lb) + ' lb</div>' +
      '<div style="font-size:11px;color:var(--doux);margin-top:3px">' +
        e(c.ville_courante) + '</div>' +
    '</div></button>';
}
