function ouvrirDetail(tracking) {
  modale('Colis', chargement());
  api('colis_detail', { tracking: tracking }).then(function (d) {
    var c = d.colis, cl = d.client || {};
    var peutCorriger = Etat.user && Etat.user.droits && Etat.user.droits.retrograder_statut;
    var peutPrix = Etat.user && Etat.user.droits && Etat.user.droits.fixer_prix;

    var h = '<div style="margin-bottom:12px">' +
      '<div style="font-weight:800;font-size:17px">' + e(cl.nom_complet || '(sans client)') + '</div>' +
      '<div class="mono" style="color:var(--doux);margin:2px 0 7px">' +
        e(c.tracking_number) + '</div>' + puceStatut(c.statut, d.libelle) +
      (d.en_camion ? ' <span class="badge camion">🚚 en route</span>' : '') +
      '</div>' +

      '<div class="stats" style="margin-bottom:14px">' +
        '<div class="stat"><div class="v">' + n2(c.poids_lb) + '</div><div class="l">livres</div></div>' +
        '<div class="stat"><div class="v">' + n2(c.montant_usd) + '</div><div class="l">USD</div></div>' +
        '<div class="stat"><div class="v" style="font-size:15px;padding:3px 0">' +
          n2(c.prix_lb_usd) + '</div><div class="l">$ / lb</div></div>' +
      '</div>';

    if (c.contenu) {
      h += '<div class="total"><span class="l">Contenu</span><span>' + e(c.contenu) + '</span></div>';
    }
    if (c.commande_id) {
      h += '<div class="total"><span class="l">Commande</span><span class="mono">' +
           e(c.commande_id) + '</span></div>';
    }
    if (c.facture_id) {
      h += '<div class="total"><span class="l">Facture</span><span class="mono">' +
           e(c.facture_id) + '</span></div>';
    }

    if (d.route && d.route.length) {
      h += '<div class="titre-section">Itinéraire</div><div class="route">';
      d.route.forEach(function (r, i) {
        var ici = r.agence_id === String(c.agence_courante).trim();
        h += '<div class="etape ' + (r.atteinte ? 'faite' : '') + (ici ? ' ici' : '') +
          '"><div class="rail"><div class="pt"></div>' +
          (i < d.route.length - 1 ? '<div class="fil"></div>' : '') + '</div>' +
          '<div class="txt">' + e(r.ville) +
          (ici ? '<small>position actuelle</small>' : '') + '</div></div>';
      });
      h += '</div>';
    }

    if (d.historique && d.historique.length) {
      h += '<div class="titre-section">Historique</div>';
      h += d.historique.slice().reverse().map(function (x) {
        return '<div class="ligne serree"><div class="corps">' +
          '<div class="t1" style="font-size:13.5px">' + e(x.libelle) + '</div>' +
          '<div class="t2">' + dateCourte(x.date) + ' · ' + e(x.agent) +
          (x.agence ? ' · ' + e(villeAgence(x.agence)) : '') +
          (x.note ? ' · ' + e(x.note) : '') + '</div></div></div>';
      }).join('');
    }

    var s = d.suivant || {};
    if (s.possible && s.action !== 'livraison') {
      h += '<button class="btn vert" style="margin-top:12px" ' +
        'onclick="fermerModalePuis(function(){lancerScan(\'' + e(c.tracking_number) + '\')})">' +
        'Faire avancer → ' + e(s.libelle) + '</button>';
    }

    h += '<button class="btn vide" style="margin-top:9px" onclick="imprimerEtiquette(' +
      e(JSON.stringify({
        tracking: c.tracking_number, client_nom: cl.nom_complet || '',
        code_client: cl.code_client || '',
        ville_destination: villeAgence(c.agence_destination),
        poids_lb: c.poids_lb, montant_usd: c.montant_usd, contenu: c.contenu
      })).replace(/'/g, '&#39;') + '))">🏷 Réimprimer l\'étiquette</button>';

    if (peutPrix && !c.facture_id) {
      h += '<button class="btn vide" onclick="ouvrirPrix(' +
        e(JSON.stringify({ tracking: c.tracking_number, poids_lb: c.poids_lb,
                           prix_lb_usd: c.prix_lb_usd })).replace(/'/g, '&#39;') +
        ')">💲 Corriger poids et prix</button>';
    }
    if (peutCorriger) {
      h += '<button class="btn rouge" onclick="ouvrirCorrection(\'' +
        e(c.tracking_number) + '\',\'' + e(c.statut) + '\')">' +
        '⚙️ Corriger le statut (admin)</button>';
    }

    majModale('Colis', h);
  }).catch(function (err) {
    majModale('Colis', bloc(err.message, 'ko', '❌'));
  });
}

function ouvrirPrix(c) {
  modale('Poids et prix',
    bloc('Le montant est recalculé à poids × prix. Un colis déjà facturé ne ' +
         'peut plus être modifié.', 'info', 'ℹ️') +
    '<div class="duo">' +
      '<label class="champ"><span>Poids (lb)</span><input type="number" id="p-poids" ' +
        'step="0.1" inputmode="decimal" value="' + e(c.poids_lb) + '" ' +
        'oninput="majMontantPrix()"></label>' +
      '<label class="champ"><span>Prix / lb ($)</span><input type="number" id="p-prix" ' +
        'step="0.25" inputmode="decimal" value="' + e(c.prix_lb_usd) + '" ' +
        'oninput="majMontantPrix()"></label>' +
    '</div>' +
    '<div class="total gros"><span class="l">Montant</span><span id="p-montant">' +
      usd(Number(c.poids_lb) * Number(c.prix_lb_usd)) + '</span></div>' +
    '<div id="p-res"></div>' +
    '<button class="btn vert" style="margin-top:12px" onclick="validerPrix(\'' +
      e(c.tracking) + '\')">Enregistrer</button>');
}

function majMontantPrix() {
  var p = Number(document.getElementById('p-poids').value) || 0;
  var pr = Number(document.getElementById('p-prix').value) || 0;
  document.getElementById('p-montant').textContent = usd(p * pr);
}

function validerPrix(tracking) {
  var p = {
    tracking: tracking,
    poids_lb: document.getElementById('p-poids').value,
    prix_lb_usd: document.getElementById('p-prix').value
  };
  ecrire('colis_prix', p, 'Prix ' + tracking).then(function (d) {
    fermerModale();
    toast(d._en_attente ? 'Mis en attente.' : 'Montant : ' + usd(d.montant_usd), 'ok');
    if (Etat.onglet === 'colis') chargerColis();
  }).catch(function (err) {
    document.getElementById('p-res').innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function ouvrirCorrection(tracking, actuel) {
  var statuts = (Etat.ref && Etat.ref.statuts) || [];
  modale('Corriger le statut',
    bloc('La correction est la seule voie qui permet de redescendre un statut. ' +
         'Elle est tracée dans l\'historique avec ton nom et ta justification.',
         'attention', '⚠️') +
    '<label class="champ"><span>Nouveau statut</span><select id="x-statut">' +
      statuts.map(function (s) {
        return '<option value="' + e(s.code) + '"' +
          (s.code === actuel ? ' selected' : '') + '>' + e(s.libelle) + '</option>';
      }).join('') + '</select></label>' +
    '<label class="champ"><span>Justification (obligatoire)</span>' +
      '<textarea id="x-note" placeholder="Pourquoi cette correction ?"></textarea></label>' +
    '<div id="x-res"></div>' +
    '<button class="btn rouge" onclick="validerCorrection(\'' + e(tracking) +
      '\')">Corriger</button>');
}

function validerCorrection(tracking) {
  var statut = document.getElementById('x-statut').value;
  var note = document.getElementById('x-note').value.trim();
  if (!note) {
    document.getElementById('x-res').innerHTML =
      bloc('La justification est obligatoire.', 'ko', '⚠️');
    return;
  }
  ecrire('colis_corriger', { tracking: tracking, statut: statut, note: note },
         'Correction ' + tracking).then(function (d) {
    fermerModale();
    toast(d._en_attente ? 'Mis en attente.' : 'Statut : ' + d.libelle, 'ok');
    if (Etat.onglet === 'colis') chargerColis();
  }).catch(function (err) {
    document.getElementById('x-res').innerHTML = bloc(err.message, 'ko', '❌');
  });
}

          '<div class="t2">' + e(c.code_client) + ' · ' + e(c.telephone) + ' · ' +
          e(villeAgence(c.agence_id)) + '</div></div>' +

/**
 * Les factures d'un client, et leur réimpression.
 *
 * Le besoin vient du comptoir : un client revient, il a perdu son
 * papier, il veut une copie. Sans cet écran il fallait ouvrir le
 * classeur — ce qu'un agent ne doit pas avoir à faire.
 */
function ouvrirFactures(clientId, nom) {
  modale('Factures de ' + nom, chargement());

  api('facture_lister', { client_id: clientId }).then(function (d) {
    var liste = d.factures || d;
    if (!liste.length) {
      majModale('Factures', vide('📄', 'Aucune facture pour ce client.'));
      return;
    }
    majModale('Factures de ' + nom, liste.map(function (f) {
      var du = Number(f.reste_du_usd || (f.montant_usd - f.montant_paye_usd));
      return '<button class="ligne" onclick="ouvrirFacture(\'' +
        e(f.facture_id) + '\')"><div class="corps">' +
        '<div class="t1">' + e(f.facture_id) + '</div>' +
        '<div class="t2">' + dateCourte(f.date) + ' · ' + (f.nb_colis || 0) +
          ' colis</div></div>' +
        '<div class="droite"><div style="font-weight:800">' +
          usd(f.montant_usd) + '</div>' +
        (du > 0.01
          ? '<span class="badge impaye">' + usd(du) + ' dû</span>'
          : '<span class="badge paye">payé</span>') +
        '</div></button>';
    }).join(''));
  }).catch(function (err) {
    majModale('Factures', bloc(err.message, 'ko', '❌'));
  });
}

/**
 * Le reçu d'un VERSEMENT, qui n'est pas le reçu de la facture.
 *
 * La distinction a l'air subtile et elle ne l'est pas. Le reçu de
 * facture dit ce que le client doit ; celui-ci dit ce qu'il vient de
 * donner, à cette date, à cet agent. Un client qui vient solder une
 * ancienne dette repart avec la preuve de SON versement — pas avec
 * une facture réimprimée dont les totaux ont changé, qui ne prouve
 * rien de la transaction du jour.
 *
 * Le numéro du reçu est celui de l'écriture comptable créée par le
 * serveur. Un reçu sans numéro propre est un bout de papier ; relié
 * au revenu, il se retrouve dans les livres le jour où quelqu'un
 * conteste.
 */
function recuPaiement(v) {
  var ent = marque_('NOM_ENTREPRISE', 'FLASHIPPING');
  var reste = Number(v.reste_du_usd) || 0;
  var numero = v.revenu_id || v.facture_id;

  var h = '<div class="etiquette">' +
    '<div class="et-haut">' + e(ent) + '</div>' +
    '<div class="rec-t">REÇU DE PAIEMENT</div>' +
    '<div class="rec-l"><span>Reçu n°</span><b>' + e(numero) + '</b></div>' +
    '<div class="rec-sep"></div>' +

    '<div class="rec-l"><span>Client</span><b>' + e(v.client_nom || '') + '</b></div>' +
    '<div class="rec-l"><span>Date</span><span>' +
      new Date().toLocaleString('fr-FR') + '</span></div>' +
    '<div class="rec-l"><span>Facture</span><span>' + e(v.facture_id) + '</span></div>' +
    '<div class="rec-sep"></div>' +

    '<div class="rec-tot"><span>REÇU</span><span>' + usd(v.versement_usd) + '</span></div>' +
    (Number(v.taux) > 0
      ? '<div class="rec-l"><span>Au taux ' + n0(v.taux) + '</span><b>' +
        htg(Number(v.versement_usd) * Number(v.taux)) + '</b></div>'
      : '') +
    '<div class="rec-l"><span>Mode</span><span>' + e(v.methode || 'cash') + '</span></div>' +
    '<div class="rec-sep"></div>' +

    '<div class="rec-l"><span>Total facture</span><span>' + usd(v.montant_usd) + '</span></div>' +
    '<div class="rec-l"><span>Payé à ce jour</span><span>' +
      usd(v.montant_paye_usd) + '</span></div>';

  /* Le reste dû est la raison d'être de ce document pour un paiement
     partiel. Il ne doit pas se lire comme une ligne parmi d'autres :
     le client doit repartir en sachant combien il doit encore. */
  h += reste > 0.009
    ? '<div class="rec-tot" style="border-top:1px dashed #000">' +
      '<span>RESTE DÛ</span><span>' + usd(reste) + '</span></div>' +
      (Number(v.taux) > 0
        ? '<div class="rec-l"><span>soit</span><b>' +
          htg(reste * Number(v.taux)) + '</b></div>' : '')
    : '<div class="rec-tot" style="border-top:1px dashed #000">' +
      '<span>FACTURE SOLDÉE</span><span>✓</span></div>';

  if (Number(v.solde_client_usd) > 0.009 && reste <= 0.009) {
    /* Facture soldée mais le client doit encore sur d'AUTRES factures.
       Le taire laisserait croire qu'il ne doit plus rien. */
    h += '<div class="rec-l"><span>Autres factures dues</span><b>' +
      usd(v.solde_client_usd) + '</b></div>';
  }

  h += '<div class="rec-sep"></div>' +
    '<div class="rec-l"><span>Agent</span><span>' +
      e((Etat.user && Etat.user.user_id) || '') + '</span></div>' +
    '<div class="et-pied">Merci de votre confiance</div>' +
    CODE128.svg(String(numero), 10) +
    '</div>';
  return h;
}


/* La facture ouverte, pour que l'écran d'encaissement sache de quoi
   il parle sans la redemander au serveur. */
var Fact = { courante: null };

/**
 * L'encaissement.
 *
 * Le montant est pré-rempli avec le reste dû : dans l'immense
 * majorité des cas le client solde, et l'agent n'a qu'à valider. Le
 * champ reste modifiable pour les paiements partiels, que le serveur
 * accepte et plafonne au reste.
 */
function ouvrirPaiement(factureId) {
  var f = Fact.courante;
  if (!f || String(f.facture_id) !== String(factureId)) return;

  var reste = Number(f.reste_du_usd) || 0;
  if (reste <= 0.009) { toast('Facture déjà soldée.'); return; }

  var modes = ['cash', 'moncash', 'natcash', 'virement', 'carte', 'autre'];

  modale('Encaisser — ' + f.facture_id,
    '<div class="total"><span class="l">Client</span><b>' +
      e(f.client_nom || '') + '</b></div>' +
    '<div class="total"><span class="l">Total facture</span><span>' +
      usd(f.montant_usd) + '</span></div>' +
    '<div class="total"><span class="l">Déjà payé</span><span>' +
      usd(f.montant_paye_usd) + '</span></div>' +
    '<div class="total gros"><span class="l">Reste dû</span><span>' +
      usd(reste) + '</span></div>' +
    (Number(f.taux) > 0
      ? '<div class="total"><span class="l">soit au taux ' + n0(f.taux) +
        '</span><b>' + htg(reste * Number(f.taux)) + '</b></div>' : '') +

    '<label class="champ" style="margin-top:12px"><span>Montant reçu ($ US)</span>' +
      '<input type="number" id="pay-montant" inputmode="decimal" step="0.01" ' +
      'min="0.01" max="' + reste.toFixed(2) + '" value="' + reste.toFixed(2) +
      '"></label>' +

    '<label class="champ"><span>Mode de paiement</span><select id="pay-mode">' +
      modes.map(function (m) {
        return '<option value="' + m + '">' + m + '</option>';
      }).join('') +
    '</select></label>' +

    '<div id="pay-apercu" style="font-size:13px;color:var(--doux);margin:6px 2px"></div>' +

    '<button class="btn vert" id="pay-ok" onclick="enregistrerPaiement()">' +
      '💵 Encaisser et imprimer le reçu</button>');

  var champ = document.getElementById('pay-montant');
  function apercu() {
    var v = Number(champ.value) || 0;
    var r = Math.round((reste - v) * 100) / 100;
    document.getElementById('pay-apercu').innerHTML = r > 0.009
      ? 'Paiement partiel — il restera <b>' + usd(r) + '</b> à payer.'
      : (v > 0 ? 'La facture sera soldée.' : '');
  }
  champ.addEventListener('input', apercu);
  apercu();
  champ.focus();
  champ.select();
}


function enregistrerPaiement() {
  var f = Fact.courante;
  if (!f) return;

  var montant = Number(document.getElementById('pay-montant').value) || 0;
  var mode = document.getElementById('pay-mode').value;
  var reste = Number(f.reste_du_usd) || 0;

  if (montant <= 0) { toast('Entre un montant.', 'ko'); return; }
  if (montant > reste + 0.009) {
    toast('Plus que le reste dû (' + usd(reste) + ').', 'ko');
    return;
  }

  /* Le bouton se désarme pendant l'appel. Sur une connexion lente, un
     agent pressé appuie deux fois — et encaisse deux fois. */
  var btn = document.getElementById('pay-ok');
  if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }

  api('facture_payer', { facture_id: f.facture_id,
                         montant_usd: montant, methode: mode })
  .then(function (d) {
    fermerModaleDom();
    Nav.modaleOuverte = false;

    imprimer(recuPaiement({
      facture_id: d.facture_id,
      revenu_id: d.revenu_id,
      client_nom: f.client_nom,
      versement_usd: montant,
      methode: mode,
      taux: f.taux,
      montant_usd: d.montant_usd,
      montant_paye_usd: d.montant_paye_usd,
      reste_du_usd: d.reste_du_usd,
      solde_client_usd: d.solde_client_usd
    }), 'ticket');

    toast(Number(d.reste_du_usd) > 0.009
      ? 'Encaissé ' + usd(montant) + ' · reste ' + usd(d.reste_du_usd)
      : 'Facture soldée.');

    if (d.avertissement) toast(d.avertissement, 'ko');
  })
  .catch(function (err) {
    if (btn) { btn.disabled = false; btn.textContent = '💵 Encaisser et imprimer le reçu'; }
    toast(err.message, 'ko');
  });
}


function ouvrirFacture(id) {
  modale('Facture', chargement());
  api('facture_detail', { facture_id: id }).then(function (d) {
    var f = d.facture, cl = d.client || {};
    // On reconstruit la forme attendue par factureA4 : le même document
    // qu'à la livraison, réimprimé à l'identique.
    var pour = {
      facture_id: f.facture_id, date: f.date,
      client: cl, ville_agence: d.agence ? d.agence.ville : '',
      lignes_detail: d.lignes, nb_colis: f.nb_colis, poids_lb: f.poids_total,
      sous_total_usd: f.montant_usd, remise_usd: 0,
      montant_usd: f.montant_usd, taux: f.taux, montant_htg: f.montant_htg,
      montant_paye_usd: f.montant_paye_usd, reste_du_usd: f.reste_du_usd,
      trackings: (d.lignes || []).map(function (l) { return l.tracking; })
    };

    /* Gardée pour l'écran d'encaissement, qui ne doit pas redemander
       au serveur ce qu'on vient de lui demander. */
    Fact.courante = {
      facture_id: String(f.facture_id),
      client_nom: String(cl.nom_complet || ''),
      montant_usd: Number(f.montant_usd) || 0,
      montant_paye_usd: Number(f.montant_paye_usd) || 0,
      reste_du_usd: Number(f.reste_du_usd) || 0,
      taux: Number(f.taux) || 0
    };

    var peutEncaisser = !!(Etat.user && Etat.user.droits && Etat.user.droits.facturer);

    majModale('Facture ' + f.facture_id,
      '<div class="total"><span class="l">Client</span><b>' +
        e(cl.nom_complet || '') + '</b></div>' +
      '<div class="total"><span class="l">Date</span><span>' +
        dateCourte(f.date) + '</span></div>' +
      '<div class="total"><span class="l">' + f.nb_colis + ' colis · ' +
        n2(f.poids_total) + ' lb</span><span>' + usd(f.montant_usd) + '</span></div>' +
      '<div class="total"><span class="l">Au taux ' + n0(f.taux) + '</span><b>' +
        htg(f.montant_htg) + '</b></div>' +
      '<div class="total"><span class="l">Encaissé</span><b>' +
        usd(f.montant_paye_usd) + '</b></div>' +
      (Number(f.reste_du_usd) > 0.01
        ? bloc('Reste dû : ' + usd(f.reste_du_usd), 'attention', '💰') : '') +

      '<div class="titre-section">Colis facturés</div>' +
      (d.lignes || []).map(function (l) {
        return '<div class="ligne"><div class="corps">' +
          '<div class="t2 mono" style="color:var(--texte)">' + e(l.tracking) +
          '</div><div class="t2">' + n2(l.poids_lb) + ' lb' +
          (l.contenu ? ' · ' + e(l.contenu) : '') + '</div></div>' +
          '<div class="droite"><b>' + usd(l.montant_usd) + '</b></div></div>';
      }).join('') +

      /* L'encaissement passe avant la réimpression : quand un client
         est au comptoir avec son argent, c'est le geste du moment. */
      (Number(f.reste_du_usd) > 0.009 && peutEncaisser
        ? '<button class="btn vert" style="margin-top:14px" ' +
          'onclick="ouvrirPaiement(\'' + e(f.facture_id) + '\')">' +
          '💵 Encaisser ' + usd(f.reste_du_usd) + '</button>'
        : '') +

      '<button class="btn vide" style="margin-top:9px" onclick="imprimer(factureA4(' +
        e(JSON.stringify(pour)).replace(/'/g, '&#39;') + '),\'a4\')">' +
        '📄 Réimprimer en A4</button>');
  }).catch(function (err) {
    majModale('Facture', bloc(err.message, 'ko', '❌'));
  });
}

function ouvrirFicheClient(clientId) {
  modale('Fiche client', chargement());
  api('client_fiche', { client_id: clientId }).then(function (d) {
    var c = d.client, r = d.resume;

    var h = '<div style="margin-bottom:14px">' +
      '<div style="font-weight:800;font-size:18px">' + e(c.nom_complet) + '</div>' +
      '<div style="color:var(--doux);font-size:13px;margin-top:3px">' +
        e(c.code_client) + ' · ' + e(c.telephone) +
        (c.ville ? ' · ' + e(c.ville) : '') + '</div></div>' +

      '<div class="stats" style="margin-bottom:14px">' +
        '<div class="stat"><div class="v">' + r.total_colis + '</div>' +
          '<div class="l">colis</div></div>' +
        '<div class="stat"><div class="v" style="color:var(--vert)">' + r.nb_disponibles +
          '</div><div class="l">à livrer</div></div>' +
        '<div class="stat"><div class="v">' + n2(r.poids_total_lb) + '</div>' +
          '<div class="l">livres</div></div>' +
        '<div class="stat"><div class="v">' + n2(r.montant_a_payer_usd) + '</div>' +
          '<div class="l">$ à payer</div></div>' +
      '</div>';

    /* Le solde dû mène à ses factures d'un seul geste. C'est le
       parcours du client qui arrive au comptoir avec son argent :
       sans ce raccourci, l'agent lit « solde dû », cherche le bouton
       des factures plus bas, et le client attend. */
    if (Number(c.solde_du) > 0) {
      h += '<button class="mvt" style="width:100%;text-align:left" ' +
        'onclick="ouvrirFactures(\'' + e(c.client_id) + '\',\'' +
        e(String(c.nom_complet).replace(/'/g, '')) + '\')">' +
        '<span class="pic" style="background:#FDECEA">💰</span>' +
        '<span class="corps"><span class="t">Solde dû : ' + usd(c.solde_du) +
        '</span><span class="s">Voir ses factures et encaisser</span></span>' +
        '<span class="m" style="font-size:19px;color:var(--doux)">›</span>' +
        '</button>';
    }

    h += '<button class="btn vide" onclick="ouvrirFactures(\'' + e(c.client_id) +
      '\',\'' + e(c.nom_complet).replace(/'/g, '') + '\')">📄 Ses factures</button>';

    if (r.nb_disponibles > 0) {
      h += '<button class="btn or" onclick="fermerModalePuis(function(){allerLivrer(\'' +
        e(c.client_id) + '\')})">🧾 Livrer ' + r.nb_disponibles + ' colis</button>' +
        '<button class="btn vide" onclick="envoyerWhatsapp(\'' + e(c.client_id) +
        '\')">💬 Prévenir sur WhatsApp</button>';
    }

    (d.groupes || []).forEach(function (g) {
      h += '<div class="titre-section">' + e(g.libelle) + ' — ' + g.colis.length + '</div>';
      h += g.colis.map(function (x) {
        return '<button class="ligne" onclick="fermerModale();ouvrirDetail(\'' +
          e(x.tracking) + '\')"><div class="corps">' +
          '<div class="t2 mono" style="color:var(--texte);font-weight:650">' +
            e(x.tracking) + '</div>' +
          '<div class="t2">' + (x.contenu ? e(x.contenu) + ' · ' : '') +
            e(x.ville_courante) +
            (x.en_camion ? ' 🚚' : '') + '</div></div>' +
          '<div class="droite"><div style="font-weight:700">' + usd(x.montant_usd) +
            '</div><div style="font-size:11.5px;color:var(--doux)">' +
            n2(x.poids_lb) + ' lb</div></div></button>';
      }).join('');
    });

    if (!r.total_colis) h += vide('📦', 'Aucun colis pour ce client.');

    majModale('Fiche client', h);
  }).catch(function (err) {
    majModale('Fiche client', bloc(err.message, 'ko', '❌'));
  });
}

/**
 * Pas d'API WhatsApp payante : le serveur compose le message et
 * renvoie un lien wa.me. L'agent appuie, WhatsApp s'ouvre, il envoie.
 * Un geste de plus, zéro coût, et le message part du numéro de
 * l'agence — ce que les clients reconnaissent.
 */
function envoyerWhatsapp(clientId) {
  toast('Préparation du message…');
  api('notif_whatsapp', { client_id: clientId }).then(function (d) {
    modale('Prévenir ' + d.client_nom,
      '<div class="carte serree" style="background:#F0F7F2;white-space:pre-wrap;' +
        'font-size:14px;margin-bottom:12px">' + e(d.message) + '</div>' +
      '<div class="total"><span class="l">Colis</span><b>' + d.nb_colis + '</b></div>' +
      '<div class="total"><span class="l">À payer</span><b>' + usd(d.montant_usd) +
        ' / ' + htg(d.montant_htg) + '</b></div>' +
      '<a class="btn vert" style="margin-top:14px;text-decoration:none" ' +
        'href="' + e(d.lien) + '" target="_blank" rel="noopener" ' +
        'onclick="setTimeout(fermerModale,600)">💬 Ouvrir WhatsApp (' +
        e(d.numero) + ')</a>');
  }).catch(function (err) { toast(err.message, 'ko'); });
}


// ═══════════════════════════════════════════════════════════════════
//  ONGLET LIVRAISON
// ═══════════════════════════════════════════════════════════════════

var Livr = { client: null, prep: null, coches: {} };

function allerLivrer(clientId) {
  Etat.onglet = 'livraison';
  Livr = { client: null, prep: null, coches: {} };
  dessiner();
  if (clientId) setTimeout(function () { preparerLivraison(clientId); }, 60);
}

function ongletLivraison() {
  if (Livr.prep) return rendreLivraison();

  poser(
    (navigator.onLine ? '' :
      bloc('Hors ligne : la facturation est indisponible. Une facture prend un ' +
           'numéro et encaisse de l\'argent — elle ne peut pas être inventée ' +
           'sur l\'appareil. Reviens dès que le réseau revient.', 'attention', '📴')) +
    '<div class="carte serree">' +
      '<input type="text" id="lv-q" placeholder="Nom, code client ou téléphone" ' +
        'autocomplete="off" oninput="chercherClientLivr()">' +
    '</div>' +
    '<div id="lv-sugg"></div>' +
    '<div id="lv-zone">' + vide('🧾', 'Cherche le client qui vient chercher ses colis.') + '</div>'
  );
  setTimeout(function () {
    var i = document.getElementById('lv-q'); if (i) i.focus();
  }, 180);
}

var minuteurLivr = null;
function chercherClientLivr() {
  clearTimeout(minuteurLivr);
  var q = document.getElementById('lv-q').value.trim();
  var z = document.getElementById('lv-sugg');
  if (q.length < 2) { z.innerHTML = ''; return; }

  minuteurLivr = setTimeout(function () {
    api('client_chercher', { q: q }).then(function (liste) {
      if (!liste.length) { z.innerHTML = bloc('Aucun client.', 'info', '🔍'); return; }
      z.innerHTML = '<div class="suggestions">' + liste.map(function (c) {
        return '<button onclick="preparerLivraison(\'' + e(c.client_id) + '\')">' +
          '<b>' + e(c.nom_complet) + '</b> <span style="color:var(--doux)">' +
          e(c.code_client) + '</span></button>';
      }).join('') + '</div>';
    }).catch(function (err) { z.innerHTML = bloc(err.message, 'ko', '❌'); });
  }, 330);
}

function preparerLivraison(clientId) {
  var z = document.getElementById('lv-zone');
  var sg = document.getElementById('lv-sugg');
  if (sg) sg.innerHTML = '';
  if (z) z.innerHTML = chargement('Colis disponibles…');

  api('livraison_preparer', { client_id: clientId }).then(function (d) {
    Livr.prep = d;
    Livr.client = d.client;
    Livr.coches = {};
    // Tout coché par défaut : le cas courant est « il prend tout »
    d.colis.forEach(function (c) { Livr.coches[c.tracking] = true; });
    rendreLivraison();
  }).catch(function (err) {
    if (z) z.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function basculerCoche(t) {
  Livr.coches[t] = !Livr.coches[t];
  rendreLivraison();
}
function cocherTout(on) {
  Livr.prep.colis.forEach(function (c) { Livr.coches[c.tracking] = on; });
  rendreLivraison();
}

function totauxLivraison() {
  var nb = 0, usdT = 0, poids = 0;
  (Livr.prep.colis || []).forEach(function (c) {
    if (Livr.coches[c.tracking]) { nb++; usdT += Number(c.montant_usd); poids += Number(c.poids_lb); }
  });
  var remise = Number((document.getElementById('lv-remise') || {}).value) || 0;
  if (remise > usdT) remise = usdT;
  var net = Math.round((usdT - remise) * 100) / 100;
  return { nb: nb, brut: usdT, remise: remise, net: net, poids: poids,
           htg: net * Number(Livr.prep.taux) };
}

function rendreLivraison() {
  var d = Livr.prep, c = Livr.client;

  if (!d.colis.length) {
    poser(
      '<div class="carte"><div style="font-weight:800;font-size:17px">' +
        e(c.nom_complet) + '</div>' +
      '<div style="color:var(--doux);font-size:13px;margin:3px 0 12px">' +
        e(c.code_client) + '</div>' +
      bloc('Aucun colis disponible à livrer pour ce client. Un colis doit être ' +
           'au statut « Disponible » et non encore facturé.', 'info', '📭') +
      '<button class="btn vide" onclick="Livr={client:null,prep:null,coches:{}};' +
        'rendreOnglet()">Chercher un autre client</button></div>');
    return;
  }

  var t = totauxLivraison();
  var peutRemise = Etat.user && Etat.user.droits && Etat.user.droits.fixer_prix;
  var remiseVal = (document.getElementById('lv-remise') || {}).value || '';
  var payeVal = (document.getElementById('lv-paye') || {}).value;
  if (payeVal === undefined || payeVal === null) payeVal = '';

  poser(
    '<div class="carte serree">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">' +
        '<div style="min-width:0"><div style="font-weight:800;font-size:16px">' +
          e(c.nom_complet) + '</div>' +
        '<div style="font-size:12.5px;color:var(--doux)">' + e(c.code_client) +
          ' · ' + e(c.telephone) + '</div></div>' +
        '<button class="btn vide petit" style="width:auto;padding:9px 12px" ' +
          'onclick="Livr={client:null,prep:null,coches:{}};rendreOnglet()">✕</button>' +
      '</div>' +
      (Number(c.solde_du) > 0
        ? '<div style="margin-top:9px"><span class="badge impaye">Ancien solde dû : ' +
          usd(c.solde_du) + '</span></div>' : '') +
    '</div>' +

    '<div class="titre-section">Colis disponibles — coche ce qu\'il emporte</div>' +
    '<div class="rangee-btn" style="margin-bottom:10px">' +
      '<button class="btn vide petit" onclick="cocherTout(true)">Tout cocher</button>' +
      '<button class="btn vide petit" onclick="cocherTout(false)">Tout décocher</button>' +
    '</div>' +

    d.colis.map(function (x) {
      var on = !!Livr.coches[x.tracking];
      return '<label class="coche ' + (on ? 'on' : '') + '">' +
        '<input type="checkbox" ' + (on ? 'checked' : '') +
          ' onchange="basculerCoche(\'' + e(x.tracking) + '\')">' +
        '<div class="corps"><div class="mono" style="font-weight:650">' +
          e(x.tracking) + '</div>' +
        '<div style="font-size:12.5px;color:var(--doux);margin-top:2px">' +
          n2(x.poids_lb) + ' lb × ' + n2(x.prix_lb_usd) + ' $' +
          (x.contenu ? ' · ' + e(x.contenu) : '') + '</div></div>' +
        '<div style="font-weight:800;text-align:right">' + usd(x.montant_usd) + '</div>' +
      '</label>';
    }).join('') +

    '<div class="carte">' +
      '<div class="total"><span class="l">' + t.nb + ' colis · ' + n2(t.poids) +
        ' lb</span><span>' + usd(t.brut) + '</span></div>' +

      (peutRemise
        ? '<label class="champ" style="margin:10px 0 4px"><span>Remise ($)</span>' +
          '<input type="number" id="lv-remise" step="0.5" min="0" inputmode="decimal" ' +
          'value="' + e(remiseVal) + '" oninput="rendreLivraison()"></label>'
        : '') +
      (t.remise > 0
        ? '<div class="total"><span class="l">Remise</span><span>-' + usd(t.remise) +
          '</span></div>' : '') +

      '<div class="total gros"><span class="l">À payer</span><span>' + usd(t.net) + '</span></div>' +
      '<div class="total"><span class="l">Au taux ' + n0(d.taux) + '</span><b>' +
        htg(t.htg) + '</b></div>' +

      '<label class="champ" style="margin:14px 0 4px"><span>Montant encaissé ($)</span>' +
        '<input type="number" id="lv-paye" step="0.5" min="0" inputmode="decimal" ' +
        'value="' + e(payeVal) + '" placeholder="' + n2(t.net) + '" ' +
        'oninput="majResteLivraison()"></label>' +
      '<div class="rangee-btn" style="margin-bottom:10px">' +
        '<button class="btn vide petit" onclick="document.getElementById(\'lv-paye\')' +
          '.value=' + t.net + ';majResteLivraison()">Payé en entier</button>' +
        '<button class="btn vide petit" onclick="document.getElementById(\'lv-paye\')' +
          '.value=0;majResteLivraison()">Rien payé</button>' +
      '</div>' +
      '<div id="lv-reste"></div>' +

      '<label class="champ"><span>Méthode</span><select id="lv-methode">' +
        '<option value="cash">Espèces</option>' +
        '<option value="moncash">MonCash</option>' +
        '<option value="natcash">NatCash</option>' +
        '<option value="virement">Virement / chèque</option>' +
      '</select></label>' +

      '<div id="lv-res"></div>' +
      '<button class="btn vert" id="lv-btn" ' + (t.nb ? '' : 'disabled') +
        ' onclick="validerLivraison()">Facturer et remettre ' + t.nb + ' colis</button>' +
      (navigator.onLine ? '' :
        bloc('Hors ligne — la facturation est bloquée.', 'ko', '📴')) +
    '</div>'
  );
  majResteLivraison();
}

function majResteLivraison() {
  var t = totauxLivraison();
  var champ = document.getElementById('lv-paye');
  var z = document.getElementById('lv-reste');
  if (!z) return;
  var saisi = champ.value;
  var paye = saisi === '' ? t.net : Number(saisi) || 0;
  if (paye > t.net) paye = t.net;
  var reste = Math.round((t.net - paye) * 100) / 100;

  z.innerHTML = reste > 0
    ? bloc('Reste dû après cette livraison : ' + usd(reste) + ' (' + htg(reste * Number(Livr.prep.taux)) +
           '). Il s\'ajoutera au solde du client.', 'attention', '⚠️')
    : (t.net > 0 ? bloc('Payé en entier.', 'ok', '✅') : '');
}

function validerLivraison() {
  if (!navigator.onLine) {
    toast('Facturation impossible hors ligne.', 'ko');
    return;
  }
  var t = totauxLivraison();
  if (!t.nb) { toast('Coche au moins un colis.', 'ko'); return; }

  var trackings = Object.keys(Livr.coches).filter(function (k) { return Livr.coches[k]; });
  var saisi = document.getElementById('lv-paye').value;
  var paye = saisi === '' ? t.net : Number(saisi) || 0;

  var b = document.getElementById('lv-btn');
  b.disabled = true; b.textContent = 'Facturation…';

  api('facture_creer', {
    client_id: Livr.client.client_id,
    trackings: JSON.stringify(trackings),
    remise_usd: t.remise || 0,
    montant_paye_usd: paye,
    methode: document.getElementById('lv-methode').value
  }).then(function (f) {
    bip();
    Livr = { client: null, prep: null, coches: {} };
    afficherFacture(f);
  }).catch(function (err) {
    b.disabled = false;
    b.textContent = 'Facturer et remettre ' + t.nb + ' colis';
    document.getElementById('lv-res').innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function afficherFacture(f) {
  poser(
    bloc('Facture ' + f.facture_id + ' — ' + f.nb_colis + ' colis remis.', 'ok', '✅') +
    (f.avertissement ? bloc(f.avertissement, 'attention', '⚠️') : '') +
    '<div class="carte">' +
      '<div style="font-size:21px;font-weight:800">' + e(f.facture_id) + '</div>' +
      '<div style="color:var(--doux);font-size:13.5px;margin:3px 0 14px">' +
        e(f.client.nom_complet) + '</div>' +
      '<div class="total"><span class="l">' + f.nb_colis + ' colis · ' +
        n2(f.poids_lb) + ' lb</span><span>' + usd(f.sous_total_usd) + '</span></div>' +
      (Number(f.remise_usd) > 0
        ? '<div class="total"><span class="l">Remise</span><span>-' +
          usd(f.remise_usd) + '</span></div>' : '') +
      '<div class="total gros"><span class="l">Total</span><span>' +
        usd(f.montant_usd) + '</span></div>' +
      '<div class="total"><span class="l">Au taux ' + n0(f.taux) + '</span><b>' +
        htg(f.montant_htg) + '</b></div>' +
      '<div class="total"><span class="l">Encaissé</span><b>' +
        usd(f.montant_paye_usd) + '</b></div>' +
      (Number(f.reste_du_usd) > 0
        ? '<div class="total"><span class="l">Reste dû</span><b style="color:var(--rouge)">' +
          usd(f.reste_du_usd) + '</b></div>' : '') +
      (f.revenu_id
        ? '<div class="total"><span class="l">Revenu comptable</span>' +
          '<span class="mono">' + e(f.revenu_id) + '</span></div>'
        : bloc('Aucun encaissement : rien n\'a été écrit en comptabilité. ' +
               'Le montant reste au solde du client.', 'info', 'ℹ️')) +

      '<button class="btn or" style="margin-top:14px" onclick="imprimer(factureA4(' +
        e(JSON.stringify(f)).replace(/'/g, '&#39;') + '),\'a4\')">' +
        '📄 Facture A4 — à enregistrer en PDF</button>' +
      '<button class="btn vide" onclick="imprimer(recuFacture(' +
        e(JSON.stringify(f)).replace(/'/g, '&#39;') + '),\'ticket\')">' +
        '🧾 Ticket 50 mm (imprimante thermique)</button>' +
      '<button class="btn vide" onclick="Livr={client:null,prep:null,coches:{}};' +
        'rendreOnglet()">Livraison suivante</button>' +
    '</div>'
  );
}


// ═══════════════════════════════════════════════════════════════════
//  ONGLET TRI — les colis scannés sans client
// ═══════════════════════════════════════════════════════════════════

/**
 * La contrepartie du scan rapide. Sans cet écran, un colis scanné sans
 * nom n'apparaîtrait dans la liste de personne et pourrait disparaître
 * sans que ça se voie. Ici il est compté, daté, et attribuable en lot.
 */
var Tri = { colis: [], coches: {}, client: null };

function ongletTri() {
  poser(chargement('Colis à identifier…'));
  Tri = { colis: [], coches: {}, client: null };

  api('colis_a_identifier').then(function (d) {
    Tri.colis = d.colis;
    rendreTri(d);
  }).catch(function (err) { poser(bloc(err.message, 'ko', '❌')); });
}

function rendreTri(d) {
  if (!d.total) {
    poser(vide('✅', 'Aucun colis en attente d\'identification.') +
      '<button class="btn vide" onclick="allerA(\'stock\')">' +
      '🏬 Voir l\'inventaire</button>');
    return;
  }

  var choisis = Object.keys(Tri.coches).filter(function (k) { return Tri.coches[k]; });
  var vieux = d.colis.filter(function (c) { return c.jours_attente >= 7; }).length;

  poser(
    '<div class="stats" style="margin-bottom:12px">' +
      '<div class="stat"><div class="v" style="color:var(--orange)">' + d.total +
        '</div><div class="l">à identifier</div></div>' +
      '<div class="stat"><div class="v">' + n2(d.poids_total_lb) + '</div>' +
        '<div class="l">livres</div></div>' +
      (vieux ? '<div class="stat"><div class="v" style="color:var(--rouge)">' + vieux +
        '</div><div class="l">+ de 7 jours</div></div>' : '') +
    '</div>' +

    bloc('Ces colis circulent normalement, mais aucun ne pourra devenir ' +
         '« disponible » tant qu\'il n\'aura pas de client. Coche ceux qui ' +
         'appartiennent à la même personne, puis attribue-les d\'un coup.',
         'info', '🏷') +

    '<div class="rangee-btn" style="margin-bottom:10px">' +
      '<button class="btn vide petit" onclick="cocherTri(true)">Tout cocher</button>' +
      '<button class="btn vide petit" onclick="cocherTri(false)">Tout décocher</button>' +
    '</div>' +

    d.colis.map(function (c) {
      var on = !!Tri.coches[c.tracking];
      return '<label class="coche ' + (on ? 'on' : '') + '">' +
        '<input type="checkbox" ' + (on ? 'checked' : '') +
          ' onchange="basculerTri(\'' + e(c.tracking) + '\')">' +
        '<div class="corps"><div class="mono" style="font-weight:650">' +
          e(c.tracking) + '</div>' +
        '<div style="font-size:12.5px;color:var(--doux);margin-top:3px">' +
          n2(c.poids_lb) + ' lb' + (c.contenu ? ' · ' + e(c.contenu) : '') +
          ' · ' + e(c.ville_courante) + '</div>' +
        '<div style="margin-top:5px">' + puceStatut(c.statut, c.libelle) +
          (c.jours_attente >= 7
            ? ' <span class="badge impaye">' + c.jours_attente + ' jours</span>'
            : (c.jours_attente > 0
               ? ' <span class="badge">' + c.jours_attente + ' j</span>' : '')) +
        '</div></div></label>';
    }).join('') +

    (choisis.length
      ? '<button class="btn or" onclick="ouvrirAttribution()">👤 Attribuer ' +
        choisis.length + ' colis à un client</button>'
      : '<div style="text-align:center;color:var(--doux);font-size:13px;' +
        'padding:10px">Coche au moins un colis.</div>')
  );
}

function basculerTri(t) {
  Tri.coches[t] = !Tri.coches[t];
  api('colis_a_identifier').then(rendreTri).catch(function () {});
}
function cocherTri(on) {
  Tri.colis.forEach(function (c) { Tri.coches[c.tracking] = on; });
  api('colis_a_identifier').then(rendreTri).catch(function () {});
}

function ouvrirAttribution() {
  var choisis = Object.keys(Tri.coches).filter(function (k) { return Tri.coches[k]; });
  Tri.client = null;

  var agences = (Etat.ref && Etat.ref.agences || [])
    .filter(function (a) { return a.agence_id !== 'AG00'; });

  modale('Attribuer ' + choisis.length + ' colis',
    '<label class="champ"><span>Client</span>' +
      '<input type="text" id="t-cli" placeholder="Nom, code ou téléphone" ' +
      'autocomplete="off" oninput="chercherClientTri()"></label>' +
    '<div id="t-sugg"></div><div id="t-choisi"></div>' +
    '<label class="champ"><span>Agence de livraison</span><select id="t-dest">' +
      '<option value="">— celle du client —</option>' +
      agences.map(function (a) {
        return '<option value="' + e(a.agence_id) + '">' + e(a.ville) + '</option>';
      }).join('') + '</select>' +
      '<span style="font-size:12px;color:var(--doux);font-weight:400;display:block;' +
      'margin-top:5px">Si la destination change, le colis repartira en camion ' +
      'au prochain scan — il ne saute pas d\'étape.</span></label>' +
    '<div id="t-res"></div>' +
    '<button class="btn vert" id="t-btn" onclick="validerAttribution()">' +
      'Attribuer</button>');
  setTimeout(function () { document.getElementById('t-cli').focus(); }, 220);
}

var minuteurTri = null;
function chercherClientTri() {
  clearTimeout(minuteurTri);
  var q = document.getElementById('t-cli').value.trim();
  var z = document.getElementById('t-sugg');
  if (q.length < 2) { z.innerHTML = ''; return; }

  minuteurTri = setTimeout(function () {
    api('client_chercher', { q: q }).then(function (liste) {
      // Le client système n'est pas un choix valable ici.
      liste = liste.filter(function (c) { return c.client_id !== 'CL0000'; });
      if (!liste.length) {
        z.innerHTML = '<div class="suggestions"><button onclick="ouvrirNouveauClient()">' +
          '➕ Créer « ' + e(q) + ' »</button></div>';
        return;
      }
      z.innerHTML = '<div class="suggestions">' + liste.map(function (c) {
        return '<button onclick="choisirClientTri(' +
          e(JSON.stringify(c)).replace(/'/g, '&#39;') + ')"><b>' +
          e(c.nom_complet) + '</b> <span style="color:var(--doux)">' +
          e(c.code_client) + '</span><div style="font-size:12px;color:var(--doux)">' +
          e(villeAgence(c.agence_id)) + '</div></button>';
      }).join('') + '</div>';
    }).catch(function (err) { z.innerHTML = bloc(err.message, 'ko', '❌'); });
  }, 330);
}

function choisirClientTri(c) {
  Tri.client = c;
  document.getElementById('t-sugg').innerHTML = '';
  document.getElementById('t-cli').value = c.nom_complet;
  document.getElementById('t-choisi').innerHTML =
    '<div class="msg ok" style="margin-top:-4px"><span class="ic">👤</span><span>' +
    e(c.nom_complet) + ' · ' + e(c.code_client) + '</span></div>';
  var d = document.getElementById('t-dest');
  if (d && c.agence_id) d.value = c.agence_id;
}

function validerAttribution() {
  var choisis = Object.keys(Tri.coches).filter(function (k) { return Tri.coches[k]; });
  var res = document.getElementById('t-res');
  var b = document.getElementById('t-btn');

  if (!Tri.client) { res.innerHTML = bloc('Choisis un client.', 'ko', '⚠️'); return; }

  var p = { client_id: Tri.client.client_id, trackings: JSON.stringify(choisis) };
  var dest = document.getElementById('t-dest').value;
  if (dest) p.agence_destination = dest;

  b.disabled = true; b.textContent = 'Attribution…';

  api('colis_attribuer', p).then(function (d) {
    fermerModale();
    bip();
    toast(d.nb_attribues + ' colis attribués à ' + d.client.nom_complet +
          ' (' + d.ville_destination + ').', 'ok');
    if (d.nb_refuses) {
      toast(d.nb_refuses + ' refusé(s) : ' +
            d.refuses.map(function (x) { return x.erreur; }).join(' '), 'ko');
    }
    ongletTri();
  }).catch(function (err) {
    b.disabled = false; b.textContent = 'Attribuer';
    res.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

//  ONGLET STOCK — inventaire physique
// ═══════════════════════════════════════════════════════════════════

function ongletStock() {
  var peutToutVoir = Etat.user && Etat.user.droits && Etat.user.droits.voir_toutes_agences;
  var agences = (Etat.ref && Etat.ref.agences || [])
    .filter(function (a) { return a.agence_id !== 'AG00'; });

  poser(
    (peutToutVoir && agences.length > 1
      ? '<div class="carte serree"><label class="champ" style="margin:0">' +
        '<span>Agence</span><select id="st-ag" onchange="chargerStock()">' +
        agences.map(function (a) {
          return '<option value="' + e(a.agence_id) + '"' +
            (Etat.user && a.agence_id === Etat.user.agence_id ? ' selected' : '') +
            '>' + e(a.ville) + ' (' + e(a.agence_id) + ')</option>';
        }).join('') + '</select></label></div>'
      : '') +
    '<div id="zone-stock">' + chargement() + '</div>'
  );
  chargerStock();
}

function chargerStock() {
  var z = document.getElementById('zone-stock');
  var sel = document.getElementById('st-ag');
  var ag = sel ? sel.value : (Etat.user ? Etat.user.agence_id : '');
  z.innerHTML = chargement();

  api('inventaire', { agence_id: ag }).then(function (d) {
    var h =
      '<div class="stats" style="margin-bottom:14px">' +
        '<div class="stat"><div class="v">' + d.total_present + '</div>' +
          '<div class="l">présents</div></div>' +
        '<div class="stat"><div class="v">' + n2(d.poids_present_lb) + '</div>' +
          '<div class="l">livres</div></div>' +
        '<div class="stat"><div class="v" style="color:var(--bleu)">' + d.expedies.nb +
          '</div><div class="l">en route</div></div>' +
      '</div>' +
      bloc('« Présents » compte ce qui est physiquement à ' + d.agence.ville +
           '. Un colis sorti en camion n\'y est plus compté, même s\'il n\'est ' +
           'pas encore réceptionné ailleurs — c\'est ce que le double scan ' +
           'permet de voir.', 'info', '🏬');

    h += sectionStock('À livrer ici', d.sur_place, '📍');
    h += sectionStock('De passage — repartent ailleurs', d.de_passage, '↻');
    h += sectionStock('Sortis, pas encore réceptionnés', d.expedies, '🚚');

    if (!d.total_present && !d.expedies.nb) h += vide('🏬', 'Agence vide.');
    z.innerHTML = h;
  }).catch(function (err) {
    z.innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function sectionStock(titre, bloc2, icone) {
  if (!bloc2 || !bloc2.nb) return '';
  return '<div class="titre-section">' + icone + ' ' + e(titre) + ' — ' + bloc2.nb + '</div>' +
    bloc2.colis.map(function (c) {
      return '<button class="ligne" onclick="ouvrirDetail(\'' + e(c.tracking) +
        '\')"><div class="corps"><div class="t1">' + e(c.client_nom) + '</div>' +
        '<div class="t2 mono">' + e(c.tracking) + '</div></div>' +
        '<div class="droite">' + puceStatut(c.statut, c.libelle) +
        '<div style="font-size:11.5px;color:var(--doux);margin-top:4px">' +
        e(c.ville_destination) + ' · ' + n2(c.poids_lb) + ' lb</div></div></button>';
    }).join('');
}

/**
 * Le contrôle de version.
 *
 * Un backend non redéployé, ou un fichier .gs oublié au copier-coller,
 * donne des symptômes incompréhensibles : une action qui répond
 * « inconnue », un écran vide, un champ qui ne s'enregistre pas. Cette
 * vérification transforme tout ça en une phrase claire.
 */
var VERSION_ATTENDUE = '2026-10-07.8';

function verifierVersion() {
  return api('diag').then(function (d) {
    var dep = String(d.version_code || '');
    Etat.versionBackend = dep || '(ancienne)';
    Etat.versionOk = (dep === VERSION_ATTENDUE);
    return Etat.versionOk;
  }).catch(function () { return null; });
}

function blocVersion() {
  if (Etat.versionOk === undefined) {
    // Réponse pas encore arrivée : on la demande et on repeint à son retour.
    verifierVersion().then(function (r) {
      if (r !== null && document.getElementById('voile')) ouvrirReglages();
    });
    return '<div style="text-align:center;color:var(--doux);font-size:11.5px;' +
      'margin-top:14px">Vérification de la version…</div>';
  }
  if (Etat.versionOk) {
    return '<div style="text-align:center;color:var(--doux);font-size:11.5px;' +
      'margin-top:14px">Code déployé ' + e(Etat.versionBackend) + ' — à jour</div>';
  }
  return bloc('Le code déployé dans Apps Script (' + Etat.versionBackend + ') ne ' +
    'correspond pas à cette application (' + VERSION_ATTENDUE + '). Il manque un ' +
    'fichier .gs, ou le déploiement n\'a pas été refait en « Nouvelle version ». ' +
    'Certaines fonctions ne marcheront pas.', 'attention', '⚠️');
}

function ouvrirReglages() {
  var u = Etat.user || {};
  var nb = Queue.nb();

  var h =
    '<div class="carte serree" style="margin-bottom:12px">' +
      '<div style="font-weight:800;font-size:16px">' + e(u.nom) + '</div>' +
      '<div style="color:var(--doux);font-size:13px;margin-top:3px">' +
        e(u.user_id) + ' · ' + e(u.role_libelle || u.role) + ' · ' +
        e(villeAgence(u.agence_id)) + '</div></div>';

  if (nb) {
    h += '<div class="carte"><div class="titre-section" style="margin-top:0">' +
      nb + ' opération(s) en attente</div>' +
      Queue.liste().map(function (x) {
        return '<div class="ligne"><div class="corps"><div class="t1" ' +
          'style="font-size:13.5px">' + e(x.resume) + '</div>' +
          '<div class="t2">' + dateCourte(x.date) + '</div></div>' +
          '<button class="btn vide petit" style="width:42px" onclick="Queue.retirer(\'' +
          e(x.id) + '\');fermerModale();ouvrirReglages()">✕</button></div>';
      }).join('') +
      '<button class="btn vert" onclick="Queue.vider().then(function(){' +
        'fermerModale();ouvrirReglages()})">Envoyer maintenant</button></div>';
  }

  if (Etat.echecsQueue && Etat.echecsQueue.length) {
    h += '<div class="carte"><div class="titre-section" style="margin-top:0">' +
      'Opérations refusées par le serveur</div>' +
      Etat.echecsQueue.map(function (x) {
        return '<div class="msg ko" style="font-size:13px"><span class="ic">❌</span>' +
          '<span>' + e(x) + '</span></div>';
      }).join('') +
      '<button class="btn vide petit" onclick="Etat.echecsQueue=[];fermerModale();' +
        'ouvrirReglages()">Effacer cette liste</button></div>';
  }

  h += '<button class="btn vide" onclick="fermerModalePuis(function(){allerA(\'stock\')})">' +
      '🏬 Inventaire de l\'agence</button>' +
    (peutReglages()
      ? '<button class="btn vide" onclick="ouvrirParametres()">⚙️ Paramètres et tarifs</button>'
      : '') +
    (peutTextes()
      ? '<button class="btn vide" onclick="ouvrirTextes()">📝 Textes et mentions</button>'
      : '') +
    '<button class="btn vide" onclick="ouvrirChangerCode()">🔑 Changer mon code</button>' +
    '<button class="btn vide" onclick="rafraichirRef()">🔄 Recharger les référentiels</button>' +
    '<button class="btn vide" onclick="changerUrl()">🔗 Changer l\'URL de l\'API</button>' +
    '<button class="btn rouge" onclick="fermerModale();deconnecter()">Se déconnecter</button>' +
    blocVersion() +
    '<div style="text-align:center;color:var(--doux);font-size:11.5px;margin-top:16px">' +
      'Flashipping Logistique · ' + (Etat.ref && Etat.ref.parametres
        ? 'taux ' + n0(Etat.ref.parametres.TAUX_ACHAT_USD) + ' / ' +
          n0(Etat.ref.parametres.TAUX_VENTE_USD) : '') + '</div>';

  modale('Réglages', h);
}

// ═══════════════════════════════════════════════════════════════════
//  PARAMÈTRES — réservé à l'administrateur
// ═══════════════════════════════════════════════════════════════════

/**
 * Chaque paramètre porte ici sa propre unité et sa propre explication.
 *
 * Le point à retenir, écrit à l'écran plutôt que dans une note que
 * personne ne lira : changer une valeur ne retouche JAMAIS une
 * opération déjà enregistrée. Un colis garde le prix au livre du jour
 * de sa réception, une facture son taux, une commande ses frais, un
 * revenu ses gourdes. Seules les opérations suivantes changent.
 */
var PARAMS_EDITABLES = [
  { cle:'PRIX_LB_USD', nom:'Prix par livre', unite:'$', pas:0.25,
    aide:'Appliqué à la réception d\'un colis. Les colis déjà reçus gardent le leur.' },
  { cle:'POIDS_MINIMUM_LB', nom:'Poids minimum facturé', unite:'lb', pas:0.1,
    aide:'Un colis plus léger est facturé à ce poids.' },
  { cle:'TAUX_ACHAT_USD', nom:'Taux d\'achat du dollar', unite:'HTG', pas:1,
    aide:'Quand le client paie en gourdes et que tu achètes du dollar.' },
  { cle:'TAUX_VENTE_USD', nom:'Taux de vente du dollar', unite:'HTG', pas:1,
    aide:'Quand le client paie en dollars. Toujours sous le taux d\'achat.' },
  { cle:'TAUX_COMMISSION_DEFAUT', nom:'Frais de commande', unite:'%', pas:0.5,
    fraction:true,
    aide:'Proposé à la saisie. 0 pour une promotion. Le taux fidèle d\'un client passe devant.' },
  { cle:'JOURS_ALERTE_NON_RECLAME', nom:'Alerte colis non réclamé', unite:'jours', pas:1,
    aide:'Au-delà, le colis est signalé comme oublié.' },
  { cle:'DUREE_SESSION_HEURES', nom:'Durée d\'une session', unite:'h', pas:1,
    aide:'Au-delà, l\'agent doit retaper son code.' },
  { cle:'MAX_TENTATIVES_CODE', nom:'Codes faux avant blocage', unite:'', pas:1,
    aide:'Le compte se bloque ensuite ; un admin le débloque.' }
];

/* Qui voit quoi dans les réglages.

   La direction logistique règle son métier — prix au poids, délais,
   paliers de dépôt. Le taux de change, le capital et les textes
   imprimés restent au super administrateur : ce ne sont pas des
   réglages d'exploitation, ce sont des décisions d'entreprise. */
function peutReglages() {
  var d = (Etat.user && Etat.user.droits) || {};
  return !!(d.gerer_parametres || d.gerer_parametres_metier);
}
function peutTextes() {
  var d = (Etat.user && Etat.user.droits) || {};
  return !!d.gerer_parametres;
}

function ouvrirParametres() {
  if (!peutReglages()) {
    toast('Réservé à la direction.', 'ko');
    return;
  }
  modale('Paramètres', chargement());

  Promise.all([api('admin_parametres'), api('admin_tarifs_depot')])
    .then(function (r) {
      var valeurs = {}, modifiables = {};
      r[0].forEach(function (x) {
        valeurs[x.cle] = x.valeur;
        modifiables[x.cle] = x.modifiable !== false;
      });
      rendreParametres(valeurs, r[1].tarifs, modifiables);
    }).catch(function (err) {
      majModale('Paramètres', bloc(err.message, 'ko', '❌'));
    });
}

function rendreParametres(valeurs, tarifs, modifiables) {
  modifiables = modifiables || {};
  var h = bloc('Une modification ne touche jamais une opération déjà ' +
               'enregistrée. Un colis garde le prix du jour de sa réception, ' +
               'une facture son taux, une commande ses frais. Seules les ' +
               'opérations suivantes changent.', 'info', '🔒');

  PARAMS_EDITABLES.forEach(function (p) {
    var brut = valeurs[p.cle];
    if (brut === undefined) return;
    var affiche = p.fraction ? (Number(brut) * 100) : brut;
    var ouvert = modifiables[p.cle] !== false;

    h += '<div class="carte serree" style="margin-bottom:10px' +
        (ouvert ? '' : ';opacity:.62') + '">' +
      '<div style="font-weight:700;font-size:14.5px">' + e(p.nom) +
        (ouvert ? '' : ' 🔒') + '</div>' +
      '<div style="font-size:12px;color:var(--doux);margin:3px 0 9px;' +
        'line-height:1.35">' + e(p.aide) +
        (ouvert ? '' : '<br><b>Réservé au super administrateur.</b>') + '</div>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        '<input type="number" id="pm-' + e(p.cle) + '" value="' + e(affiche) + '" ' +
          'step="' + p.pas + '" inputmode="decimal" style="flex:1"' +
          (ouvert ? '' : ' disabled') + '>' +
        (p.unite ? '<span style="font-weight:700;color:var(--doux);' +
          'min-width:34px">' + e(p.unite) + '</span>' : '') +
        (ouvert
          ? '<button class="btn petit" style="width:auto;padding:11px 15px" ' +
            'onclick="enregistrerParametre(\'' + e(p.cle) + '\',' +
            (p.fraction ? 'true' : 'false') + ')">OK</button>'
          : '') +
      '</div></div>';
  });

  // ── Paliers de frais de dépôt ──
  h += '<div class="titre-section">Paliers de frais de dépôt</div>' +
    bloc('Ce que TOI tu paies pour recharger la carte. Ces paliers ne ' +
         'servent qu\'à estimer : le frais réellement prélevé est saisi à ' +
         'la main sur chaque dépôt, et c\'est lui qui entre en comptabilité.',
         'attention', '💳');

  (tarifs || []).forEach(function (t) {
    h += '<div class="carte serree" style="margin-bottom:10px' +
        (t.actif ? '' : ';opacity:.5') + '">' +
      '<div style="font-weight:700;font-size:14px;margin-bottom:8px">' +
        n0(t.min_usd) + ' $ – ' + (t.max_usd === '' ? '∞' : n0(t.max_usd) + ' $') +
        (t.note ? ' <span style="font-weight:400;color:var(--doux);font-size:12px">· ' +
          e(t.note) + '</span>' : '') + '</div>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        '<input type="number" id="td-' + e(t.tarif_id) + '" ' +
          'value="' + (t.taux * 100) + '" step="0.5" inputmode="decimal" style="flex:1">' +
        '<span style="font-weight:700;color:var(--doux);min-width:34px">%</span>' +
        '<button class="btn petit" style="width:auto;padding:11px 15px" ' +
          'onclick="enregistrerTarif(\'' + e(t.tarif_id) + '\')">OK</button>' +
      '</div>' +
      '<button class="btn vide petit" style="margin-top:8px" onclick="basculerTarif(\'' +
        e(t.tarif_id) + '\',' + (t.actif ? 'false' : 'true') + ')">' +
        (t.actif ? 'Désactiver ce palier' : 'Réactiver ce palier') + '</button>' +
    '</div>';
  });

  h += '<div id="pm-res"></div>';
  majModale('Paramètres', h);
}

/**
 * Les textes imprimés sur les documents et envoyés aux clients.
 *
 * Ils étaient figés dans le code : changer une mention de facture
 * demandait de republier l'application. Ce sont maintenant des
 * paramètres comme les autres, modifiables par l'administrateur.
 */
var TEXTES_EDITABLES = [
  { cle:'NOM_ENTREPRISE', nom:'Nom imprimé en en-tête', lignes:1,
    aide:'Apparaît en gros sur tous les documents.' },
  { cle:'SLOGAN_DOC', nom:'Slogan sous le nom', lignes:1,
    aide:'En rouge, juste sous le nom. Par défaut : FAST AND SECURE.' },
  { cle:'COORDONNEES_DOC', nom:'Coordonnées', lignes:2,
    aide:'Téléphones, courriel, site. Sépare chaque bloc par une barre | — ' +
         'ils s\'affichent sur des lignes différentes en haut du document.' },
  { cle:'MSG_PIED_DOC', nom:'Slogan en pied de page', lignes:1,
    aide:'La ligne rouge tout en bas de chaque document.' },
  { cle:'MSG_FACTURE_COLIS', nom:'Mention — facture de livraison', lignes:4,
    aide:'L\'encadré au bas de la facture d\'un colis livré.' },
  { cle:'MSG_RECU_COMMANDE', nom:'Mention — reçu de commande', lignes:4,
    aide:'L\'encadré au bas du reçu d\'une commande. C\'est là qu\'il faut ' +
         'écrire que le transport n\'est pas compris.' },
  { cle:'MSG_RAPPORT', nom:'Mention — rapport financier', lignes:3,
    aide:'L\'encadré au bas du rapport financier imprimé. Document interne : c\'est là qu\'on précise quelle devise fait foi.' },
  { cle:'MSG_DISPONIBLE', nom:'Message WhatsApp « colis disponible »', lignes:4,
    aide:'Les repères {client} {agence} {nb} {poids} {montant} sont remplacés ' +
         'automatiquement. Garde-les tels quels.' }
];

function ouvrirTextes() {
  modale('Textes et mentions', chargement());

  api('admin_parametres').then(function (liste) {
    var v = {};
    liste.forEach(function (x) { v[x.cle] = x.valeur; });

    var h = bloc('Ces textes s\'impriment sur les documents remis aux clients. ' +
                 'Une modification s\'applique aux documents imprimés ensuite ; ' +
                 'une facture déjà remise ne change pas.', 'info', '📝');

    TEXTES_EDITABLES.forEach(function (t) {
      var val = v[t.cle];
      if (val === undefined) val = '';
      h += '<div class="carte serree" style="margin-bottom:10px">' +
        '<div style="font-weight:700;font-size:14.5px">' + e(t.nom) + '</div>' +
        '<div style="font-size:12px;color:var(--doux);margin:3px 0 9px;' +
          'line-height:1.35">' + e(t.aide) + '</div>' +
        (t.lignes > 1
          ? '<textarea id="tx-' + e(t.cle) + '" style="min-height:' +
            (t.lignes * 22) + 'px">' + e(val) + '</textarea>'
          : '<input type="text" id="tx-' + e(t.cle) + '" value="' + e(val) + '">') +
        '<button class="btn petit" style="margin-top:9px" onclick="enregistrerTexte(\'' +
          e(t.cle) + '\')">Enregistrer</button>' +
      '</div>';
    });

    h += '<div id="tx-res"></div>';
    majModale('Textes et mentions', h);
  }).catch(function (err) {
    majModale('Textes et mentions', bloc(err.message, 'ko', '❌'));
  });
}

function enregistrerTexte(cle) {
  var champ = document.getElementById('tx-' + cle);
  var val = champ.value.trim();
  if (!val) { toast('Le texte ne peut pas être vide.', 'ko'); return; }

  api('admin_parametres', { cle: cle, valeur: val }).then(function () {
    toast('Enregistré.', 'ok');
    champ.style.borderColor = 'var(--vert)';
    // Les documents lisent les référentiels : il faut les recharger
    // pour que la prochaine impression porte le nouveau texte.
    return chargerReferentiels();
  }).catch(function (err) {
    champ.style.borderColor = 'var(--rouge)';
    var z = document.getElementById('tx-res');
    if (z) z.innerHTML = bloc(err.message, 'ko', '❌');
    toast(err.message, 'ko');
  });
}

function enregistrerParametre(cle, fraction) {
  var champ = document.getElementById('pm-' + cle);
  var saisi = champ.value;
  if (saisi === '') { toast('Valeur vide.', 'ko'); return; }

  // L'écran parle en pourcentage, le serveur attend une fraction :
  // la conversion se fait ici, jamais dans la tête de l'utilisateur.
  var valeur = fraction ? (Number(saisi) / 100) : saisi;

  api('admin_parametres', { cle: cle, valeur: valeur }).then(function () {
    toast(cle + ' enregistré.', 'ok');
    champ.style.borderColor = 'var(--vert)';
    return chargerReferentiels();
  }).catch(function (err) {
    champ.style.borderColor = 'var(--rouge)';
    var z = document.getElementById('pm-res');
    if (z) z.innerHTML = bloc(err.message, 'ko', '❌');
    toast(err.message, 'ko');
  });
}

function enregistrerTarif(id) {
  var champ = document.getElementById('td-' + id);
  api('admin_tarifs_depot', { tarif_id: id, taux: Number(champ.value) / 100 })
    .then(function () {
      toast('Palier enregistré.', 'ok');
      champ.style.borderColor = 'var(--vert)';
      return chargerReferentiels();
    }).catch(function (err) {
      champ.style.borderColor = 'var(--rouge)';
      toast(err.message, 'ko');
    });
}

function basculerTarif(id, actif) {
  api('admin_tarifs_depot', { tarif_id: id, actif: actif ? 'OUI' : 'NON' })
    .then(function () {
      toast(actif ? 'Palier réactivé.' : 'Palier désactivé.', 'ok');
      return chargerReferentiels();
    }).then(ouvrirParametres)
    .catch(function (err) { toast(err.message, 'ko'); });
}

function rafraichirRef() {
  toast('Rechargement…');
  chargerReferentiels().then(function () {
    fermerModale();
    toast('Référentiels à jour.', 'ok');
    rendreOnglet();
  }).catch(function (err) { toast(err.message, 'ko'); });
}

function ouvrirChangerCode() {
  modale('Changer mon code',
    bloc('Six chiffres. Personne ne peut retrouver ton code, pas même un ' +
         'administrateur : il est haché. Il ne peut qu\'être régénéré.', 'info', '🔑') +
    '<label class="champ"><span>Code actuel</span><input type="password" id="k-a" ' +
      'inputmode="numeric" maxlength="6"></label>' +
    '<label class="champ"><span>Nouveau code</span><input type="password" id="k-b" ' +
      'inputmode="numeric" maxlength="6"></label>' +
    '<label class="champ"><span>Confirmer</span><input type="password" id="k-c" ' +
      'inputmode="numeric" maxlength="6"></label>' +
    '<div id="k-res"></div>' +
    '<button class="btn vert" onclick="validerCode()">Changer</button>');
}

function validerCode() {
  var a = document.getElementById('k-a').value;
  var b = document.getElementById('k-b').value;
  var c = document.getElementById('k-c').value;
  var res = document.getElementById('k-res');

  if (!/^\d{6}$/.test(b)) { res.innerHTML = bloc('Six chiffres exactement.', 'ko', '⚠️'); return; }
  if (b !== c) { res.innerHTML = bloc('Les deux nouveaux codes diffèrent.', 'ko', '⚠️'); return; }

  api('changer_code', { ancien_code: a, nouveau_code: b }).then(function () {
    fermerModale();
    toast('Code modifié.', 'ok');
  }).catch(function (err) { res.innerHTML = bloc(err.message, 'ko', '❌'); });
}


// ═══════════════════════════════════════════════════════════════════
//  MODALE
// ═══════════════════════════════════════════════════════════════════

function modale(titre, html) {
  // Une modale qui en remplace une autre ne crée pas d'entrée
  // supplémentaire : un seul Retour doit suffire à tout refermer.
  var dejaOuverte = Nav.modaleOuverte;
  fermerModaleDom();

  var v = document.createElement('div');
  v.className = 'voile';
  v.id = 'voile';
  v.innerHTML = '<div class="modale" onclick="event.stopPropagation()">' +
    '<div class="poignee"></div><h3>' + e(titre) + '</h3>' +
    '<div id="corps-modale">' + html + '</div></div>';
  v.onclick = fermerModale;
  document.body.appendChild(v);
  document.body.style.overflow = 'hidden';

  Nav.modaleOuverte = true;
  if (!dejaOuverte) {
    try { history.pushState({ modale: true }, ''); } catch (e) {}
  }
}

function majModale(titre, html) {
  var c = document.getElementById('corps-modale');
  var t = document.querySelector('.modale h3');
  if (c) { c.innerHTML = html; if (t) t.textContent = titre; }
  else modale(titre, html);
}

/** Ferme sans toucher à l'historique — réservé à popstate. */
function fermerModaleDom() {
  var v = document.getElementById('voile');
  if (v) v.remove();
  document.body.style.overflow = '';
  Nav.modaleOuverte = false;
}

/**
 * Fermeture demandée par l'utilisateur : on repasse par l'historique
 * pour que l'entrée empilée soit consommée. Sans ça, un Retour après
 * une fermeture au doigt reviendrait sur une modale déjà fermée.
 */
/**
 * Ferme la fiche, PUIS fait autre chose.
 *
 * Le piège : fermerModale() appelle history.back(), dont le popstate
 * n'arrive pas au moment du clic mais à la tâche suivante. Tout ce
 * qu'on enchaîne derrière — changer d'onglet, ouvrir l'écran de
 * livraison — est donc défait une fraction de seconde plus tard par
 * un gestionnaire qui remet l'onglet d'avant et redessine.
 *
 * Le symptôme est le pire qui soit : le bouton ne fait visiblement
 * rien. Pas d'erreur, pas de message, rien à montrer au support.
 *
 * On attend donc que le retour ait eu lieu avant d'agir. Le minuteur
 * de secours couvre le cas où le popstate n'arrive jamais — certains
 * navigateurs ne le déclenchent pas quand il n'y a rien derrière dans
 * l'historique, et un bouton muet pour cette raison serait le même
 * défaut déplacé d'un cran.
 */
function fermerModalePuis(suite) {
  if (typeof suite !== 'function') suite = function () {};

  if (!Nav.modaleOuverte) { fermerModaleDom(); suite(); return; }

  Nav.modaleOuverte = false;
  fermerModaleDom();

  var fait = false;
  function reprendre() {
    if (fait) return;
    fait = true;
    window.removeEventListener('popstate', surRetour);
    suite();
  }
  function surRetour() { setTimeout(reprendre, 0); }

  window.addEventListener('popstate', surRetour);
  try { history.back(); } catch (e) { reprendre(); return; }
  setTimeout(reprendre, 250);
}


function fermerModale() {
  if (Nav.modaleOuverte) {
    Nav.modaleOuverte = false;
    fermerModaleDom();
    try { history.back(); } catch (e) {}
    return;
  }
  fermerModaleDom();
}

window.addEventListener('online', function () {
  Etat.enLigne = true;
  majBandeau();
  toast('Réseau revenu.', 'ok');
  if (Queue.nb()) Queue.vider();
});

window.addEventListener('offline', function () {
  Etat.enLigne = false;
  majBandeau();
  toast('Réseau perdu — les scans seront mis en attente.', 'ko');
});

document.addEventListener('visibilitychange', function () {
  if (document.hidden) arreterCamera();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

// Au démarrage, si une session existe déjà, on récupère les
// référentiels avant de peindre : sans eux les libellés et les villes
// seraient affichés en codes bruts.
(function demarrer() {
  try {
    var depuisLien = (location.hash || '').replace('#', '');
    if (depuisLien && ONGLETS.some(function (o) { return o.id === depuisLien; })) {
      Etat.onglet = depuisLien;
    }
    history.replaceState({ onglet: Etat.onglet }, '', '#' + Etat.onglet);
  } catch (e) {}

  if (Etat.url && Etat.token) {
    document.getElementById('app').innerHTML =
      '<header class="entete"><h1>Flashipping<span class="sous">Ouverture…' +
      '</span></h1></header><main>' + chargement() + '</main>';
    verifierVersion();
    chargerReferentiels().then(dessiner).catch(function (err) {
      if (/Session|Jeton/i.test(err.message)) { deconnecter(); return; }
      toast(err.message, 'ko');
      dessiner();
    });
    if (Queue.nb() && navigator.onLine) setTimeout(function () { Queue.vider(); }, 1400);
  } else {
    dessiner();
  }
})();
</script>
