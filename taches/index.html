      <div class="champ"><span class="val muet" style="font-size:12.5px;word-break:break-all">${e(apiUrl())}</span></div>
      ${m.niveau === 'admin' ? `<button class="champ edit" data-act="copier-invitation">${ic('lien')}<span class="val">Copier le lien d'invitation</span></button>` : ''}
      <button class="champ edit" data-act="changer-serveur">${ic('reglages')}<span class="val">Changer l'adresse</span></button></div>
      ${m.niveau === 'admin' ? '<p class="aide" style="margin:6px 4px">Le lien d\'invitation ouvre l\'app déjà réglée sur ce serveur : envoie-le aux membres sur WhatsApp, ils n\'auront plus qu\'à se connecter.</p>' : ''}</div>`}
    <p class="aide" style="text-align:center;margin:24px">Flashipping Tâches v${VERSION_APP} — serveur ${e(S.d.serveur.version)}</p>`;
  return charpente('Réglages', contenu);
}

/* ── Calques : feuilles empilées, fermées par le bouton retour ── */
function ouvrirCalque(html, opts = {}) {
  const id = 'c' + Date.now() + Math.random().toString(36).slice(2, 6);
  const voile = document.createElement('div'); voile.className = 'voile';
  const f = document.createElement('div');
  f.className = 'feuille' + (opts.pleine ? ' pleine' : '') + (opts.etroite ? ' etroite' : '');
  f.setAttribute('role', 'dialog'); f.setAttribute('aria-modal', 'true'); f.dataset.id = id;
  f.innerHTML = html;
  $('#calques').append(voile, f);
  requestAnimationFrame(() => { voile.classList.add('ouvert'); f.classList.add('ouvert'); });
  voile.onclick = () => fermerCalque();
  const c = { id, f, voile, opts };
  S.calques.push(c);
  history.pushState({ calque: id }, '');
  setTimeout(() => { const a = f.querySelector('[autofocus]'); if (a) a.focus(); }, 280);
  return c;
}
function retirerCalque(c) {
  c.f.classList.remove('ouvert'); c.voile.classList.remove('ouvert');
  setTimeout(() => { c.f.remove(); c.voile.remove(); }, 260);
  if (c.opts.apres) c.opts.apres();
}
function fermerCalque() { if (S.calques.length) history.back(); }
window.addEventListener('popstate', ev => {
  const cible = ev.state && ev.state.calque;
  while (S.calques.length && S.calques[S.calques.length - 1].id !== cible) retirerCalque(S.calques.pop());
});
function fermerTousCalques() { while (S.calques.length) retirerCalque(S.calques.pop()); document.querySelectorAll('.menu').forEach(m => m.remove()); }
function rafraichirCalques() { S.calques.forEach(c => { if (c.opts.rafraichir) c.opts.rafraichir(c); }); }
const teteCalque = (titre, droite = '') => `<div class="feuille-tete"><button class="btn-ic" data-act="fermer" aria-label="Fermer">${ic('x')}</button><h2>${e(titre)}</h2>${droite}</div>`;

function menu(ancre, items) {
  document.querySelectorAll('.menu').forEach(m => m.remove());
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = items.filter(Boolean).map((it, i) => `<button data-i="${i}" class="${it.danger ? 'danger' : ''}">${ic(it.ic)}${e(it.lib)}</button>`).join('');
  const r = ancre.getBoundingClientRect();
  m.style.top = (r.bottom + 6) + 'px';
  if (r.left < innerWidth / 2) { m.style.left = Math.max(10, r.left) + 'px'; m.style.right = 'auto'; }
  else m.style.right = Math.max(10, innerWidth - r.right) + 'px';
  document.body.append(m);
  const liste = items.filter(Boolean);
  m.onclick = ev => { const b = ev.target.closest('[data-i]'); if (!b) return; m.remove(); liste[+b.dataset.i].fn(); };
  setTimeout(() => document.addEventListener('click', function f(ev) { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener('click', f, true); } }, true), 0);
}

/** Petite boîte de question (remplace prompt/confirm). */
function demander(titre, opts = {}) {
  return new Promise(res => {
    let fini = false;
    const c = ouvrirCalque(`${teteCalque(titre)}<div class="feuille-corps"><div class="form">
      ${opts.texte ? `<p style="margin:0;color:var(--gris)">${e(opts.texte)}</p>` : ''}
      ${opts.champ ? `<textarea class="inp" id="dm-val" placeholder="${e(opts.placeholder || '')}" autofocus>${e(opts.valeur || '')}</textarea>` : ''}
    </div></div><div class="feuille-pied"><button class="btn" data-act="fermer" style="flex:1">Annuler</button>
      <button class="btn ${opts.ton || 'primaire'}" id="dm-ok" style="flex:2">${e(opts.ok || 'Valider')}</button></div>`,
      { etroite: true, apres: () => { if (!fini) res(null); } });
    $('#dm-ok', c.f).onclick = () => {
      const v = opts.champ ? $('#dm-val', c.f).value.trim() : true;
      if (opts.champ && opts.requis && !v) return toast(opts.requis, { erreur: true });
      fini = true; res(v); fermerCalque();
    };
  });
}

/* ── Détail d'une tâche ──────────────────────────────────────── */
async function ouvrirTache(id) {
  const t = tache(id);
  const c = ouvrirCalque(`${teteCalque(t ? t.titre : 'Tâche', `<button class="btn-ic" data-act="menu-tache" data-id="${e(id)}" aria-label="Plus d'actions">${ic('plus3')}</button>`)}
    <div class="feuille-corps" id="dt-corps">${t ? corpsTache(t, null) : '<div class="charge"><div class="roue"></div></div>'}</div>
    <div class="feuille-pied"><div class="composer"><textarea id="dt-com" rows="1" placeholder="Écrire un commentaire…" aria-label="Commentaire"></textarea>
      <button class="btn-ic" data-act="commenter" data-id="${e(id)}" aria-label="Envoyer" style="background:var(--marine);color:#fff">${ic('envoi')}</button></div></div>`,
    { pleine: innerWidth < 960, rafraichir: cc => remplirTache(cc, id, true) });
  c.tacheId = id;
  const ta = $('#dt-com', c.f);
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(120, ta.scrollHeight) + 'px'; };
  await remplirTache(c, id);
}
async function remplirTache(c, id, silencieux) {
  try {
    const fil = await api('fil_tache', { tache_id: id });
    S.fils[id] = fil;
    const i = S.d.taches.findIndex(x => x.tache_id === id);
    if (i >= 0) S.d.taches[i] = fil.tache; else S.d.taches.push(fil.tache);
    fil.famille.forEach(f => { if (!tache(f.tache_id)) S.d.taches.push(f); });
    if (!c.f.isConnected) return;
    const corps = $('#dt-corps', c.f);
    const pos = corps.scrollTop;
    corps.innerHTML = corpsTache(fil.tache, fil);
    corps.scrollTop = pos;
    $('.feuille-tete h2', c.f).textContent = fil.tache.titre;
  } catch (x) {
    if (!silencieux && c.f.isConnected) $('#dt-corps', c.f).innerHTML = `<div class="vide"><b>Impossible d'ouvrir la tâche</b>${e(x.message)}</div>`;
  }
}

function corpsTache(t, fil) {
  const u = moi().user_id;
  const droits = fil ? fil.droits : { gerer: moi().niveau === 'admin' || t.createur_id === u, agir: t.responsable_id === u || moi().niveau === 'admin' };
  const a = auj();
  let etat, cls;
  if (t.statut === 'terminee') { etat = 'Terminée'; cls = 'terminee'; }
  else if (t.statut === 'annulee') { etat = 'Annulée'; cls = 'annulee'; }
  else if (t.statut === 'manquee') { etat = 'Manquée'; cls = 'manquee'; }
  else if (t.bloquee) { etat = 'En attente'; cls = 'attente'; }
  else if (t.type === 'validation') { etat = 'À valider'; cls = 'valider'; }
  else if (t.en_retard) { etat = 'En retard'; cls = 'retard'; }
  else if (t.statut === 'en_cours') { etat = 'En cours'; cls = 'en_cours'; }
  else { etat = 'À faire'; cls = 'a_faire'; }

  // Alertes
  let alertes = '';
  if (t.bloquee) alertes += `<div class="alerte gris">${ic('cadenas')}<span>Attend ${t.bloquee_par.map(b => `« ${e(b.titre)} » (${e(nomDe(b.responsable_id))})`).join(', ')}. Tu seras prévenu quand ce sera ton tour.</span></div>`;
  if (fil && ouverte(t) && t.renvois) {
    const dr = fil.fil.filter(f => f.genre === 'refus_recu').pop();
    if (dr) alertes += `<div class="alerte rouge">${ic('renvoi')}<span><b>Renvoyée par ${e(prenom(dr.auteur_id))}</b><br>${e(dr.texte.replace(/^Renvoyée : /, ''))}<br><small>Joins la version corrigée, puis termine à nouveau.</small></span></div>`;
  }
  if (t.type === 'validation' && t.decision === 'refuse' && ouverte(t)) alertes += `<div class="alerte ambre">${ic('renvoi')}<span>Tu as renvoyé le travail : ${e(String(t.decision_motif).replace(/[.\s]+$/, ''))}. Il reviendra ici une fois corrigé.</span></div>`;
  if (t.statut === 'terminee') alertes += `<div class="alerte vert">${ic('check')}<span>${t.type === 'validation' ? 'Feu vert donné' : 'Terminée'} par ${e(nomDe(t.terminee_par))}, ${e(quand(t.terminee_le))}${t.echeance && t.terminee_le.slice(0, 10) > t.echeance ? ' (après l\'échéance)' : ''}.${t.decision_motif ? '<br>' + e(t.decision_motif) : ''}</span></div>`;
  if (t.statut === 'annulee') alertes += `<div class="alerte gris">${ic('x')}<span>Annulée : ${e(t.annulee_motif)}</span></div>`;
  if (t.statut === 'manquee') alertes += `<div class="alerte rouge">${ic('x')}<span>Non faite le ${e(dateCourte(t.echeance))}. Tu peux encore la terminer : elle comptera comme faite en retard.</span></div>`;

  // Actions principales
  let actions = '';
  if (droits.agir && (ouverte(t) || t.statut === 'manquee') && !t.bloquee) {
    if (t.type === 'validation') {
      actions = `<button class="btn vert" data-act="feu-vert" data-id="${e(t.tache_id)}">${ic('feu')}Feu vert</button>
        <button class="btn rouge-txt" data-act="renvoyer" data-id="${e(t.tache_id)}">${ic('renvoi')}Renvoyer</button>`;
    } else if (t.nb_sous_taches && t.nb_sous_terminees < t.nb_sous_taches) {
      actions = '';
    } else {
      actions = `<button class="btn vert" data-act="terminer" data-id="${e(t.tache_id)}">${ic('check')}Marquer terminée</button>`
        + (t.statut === 'a_faire' ? `<button class="btn" data-act="commencer" data-id="${e(t.tache_id)}">Je commence</button>` : '');
    }
  } else if ((droits.agir || droits.gerer) && (t.statut === 'terminee' || (t.statut === 'annulee' && droits.gerer))) {
    actions = `<button class="btn" data-act="rouvrir" data-id="${e(t.tache_id)}">${ic('renvoi')}${t.statut === 'annulee' ? 'Réactiver' : 'Rouvrir'}</button>`;
  }

  // Champs
  const p = t.projet_id && projet(t.projet_id), o = t.objectif_id && objectif(t.objectif_id), r = t.recurrence_id && recurrence(t.recurrence_id);
  const ed = droits.gerer && ouverte(t);
  const champ = (cle, lib, val, muet) => `<button class="champ ${ed ? 'edit' : ''}" ${ed ? `data-act="editer-champ" data-champ="${cle}" data-id="${e(t.tache_id)}"` : 'disabled style="cursor:default"'}>
    <span class="lib">${lib}</span><span class="val ${muet ? 'muet' : ''}">${val}</span>${ed ? ic('crayon', 'crayon') : ''}</button>`;
  const champs = `<div class="champs">
    ${champ('responsable_id', 'Responsable', `${avatar(t.responsable_id, 'p')} ${e(nomDe(t.responsable_id))}`)}
    ${champ('echeance', 'Échéance', t.echeance ? `<span style="${t.en_retard ? 'color:var(--rouge)' : ''}">${e(dateLongue(t.echeance))}</span>` : 'Aucune', !t.echeance)}
    ${champ('projet_id', 'Projet', p ? `<span class="meta" style="margin:0"><span class="proj"><i style="background:${e(p.couleur)}"></i></span></span>${e(p.nom)}` : 'Aucun', !p)}
    ${champ('priorite', 'Priorité', PRIO[t.priorite])}
    ${o || ed ? champ('objectif_id', 'Objectif', o ? e(o.titre) : 'Aucun', !o) : ''}
    ${champ('preuve_requise', 'Preuve', t.preuve_requise ? 'Demandée pour terminer' : 'Facultative', !t.preuve_requise)}
    ${t.depend_de.length || ed ? champ('depend_de', 'Après', t.depend_de.length ? t.depend_de.map(d => e((tache(d) || { titre: d }).titre)).join(', ') : 'Rien', !t.depend_de.length) : ''}
    ${champ('suiveurs', 'Suiveurs', t.suiveurs.length ? t.suiveurs.map(s => avatar(s, 'p')).join('') : 'Personne', !t.suiveurs.length)}
    ${r ? `<div class="champ"><span class="lib">Répétition</span><span class="val">${ic('repete')} ${e(libelleRep(r))}</span></div>` : ''}
  </div>`;

  // Étapes du circuit
  let etapes = '';
  const fam = fil ? fil.famille : S.d.taches.filter(x => x.tache_id === t.tache_id || x.parent_id === t.tache_id || (t.parent_id && (x.parent_id === t.parent_id || x.tache_id === t.parent_id)));
  const mereId = t.nb_sous_taches ? t.tache_id : t.parent_id;
  const enfants = fam.filter(x => x.parent_id === mereId).sort((x, y) => x.ordre - y.ordre);
  if (mereId && enfants.length) {
    const mere = fam.find(x => x.tache_id === mereId) || tache(mereId);
    const iCour = enfants.findIndex(x => ouverte(x) && !x.bloquee);
    etapes = `<div class="section"><h4>${ic('circuit')} ${t.nb_sous_taches ? 'Étapes' : 'Circuit « ' + e(mere ? mere.titre : '') + ' »'} <span class="nb">${enfants.filter(x => x.statut === 'terminee').length}/${enfants.length}</span>
      ${droits.gerer && t.nb_sous_taches && ouverte(t) ? `<button class="btn discret" data-act="sous-tache" data-id="${e(t.tache_id)}">${ic('plus')}Ajouter</button>` : ''}
</h4>
      <div class="carte etapes">
      ${enfants.map((x, i) => `<button class="etape ${x.statut === 'terminee' ? 'ok' : x.statut === 'annulee' ? 'annulee' : i === iCour ? 'ici' : ''} ${x.tache_id === t.tache_id ? 'courante' : ''}" data-tache="${e(x.tache_id)}">
        <span class="pt"><b></b></span><span style="flex:1;min-width:0"><div class="t">${e(x.titre)}${x.type === 'validation' ? ' <span class="pil a_risque">validation</span>' : ''}</div>
        <div class="s">${e(nomDe(x.responsable_id))}${x.echeance ? ' — ' + e(dateCourte(x.echeance)) : ''}${x.statut === 'terminee' ? ' — fait' : x.statut === 'annulee' ? ' — annulée' : x.bloquee ? ' — en attente' : ' — en main'}${x.renvois ? ' — renvoyée ' + x.renvois + ' fois' : ''}</div></span>
        ${avatar(x.responsable_id, 'p')}</button>`).join('')}
      ${!t.nb_sous_taches && mere ? `<button class="btn discret" data-tache="${e(mere.tache_id)}" style="margin:2px 8px 6px">${ic('circuit')}Ouvrir le circuit</button>` : ''}</div></div>`;
  }

  // Ce qu'il faut valider
  let aValider = '';
  if (fil && fil.a_valider.length) {
    aValider = `<div class="section"><h4>${ic('feu')} ${ouverte(t) ? 'À regarder avant de décider' : 'Le travail soumis'}</h4>${fil.a_valider.map(av => `<div class="carte" style="margin-bottom:8px">
      <div class="champ" style="border:0"><span style="flex:1;font-weight:600">${e(av.titre)}</span>${avatar(av.responsable_id, 'p')}</div>
      ${av.preuves.length ? `<div class="preuves" style="padding-top:0">${av.preuves.map(vignette).join('')}</div>` : '<p class="aide" style="padding:0 14px 12px;margin:0">Aucune preuve jointe.</p>'}</div>`).join('')}</div>`;
  }

  // Preuves
  const peutJoindre = (droits.agir || droits.gerer) && t.statut !== 'annulee';
  const preuves = fil ? fil.preuves : [];
  const blocPreuves = (t.type !== 'validation' && !t.nb_sous_taches) || preuves.length ? `<div class="section"><h4>${ic('trombone')} Preuves <span class="nb">${preuves.length || ''}</span>
      ${t.preuve_requise && !preuves.length ? '<span class="pil a_risque">demandée</span>' : ''}</h4>
    <div class="carte">${preuves.length ? `<div class="preuves">${preuves.map(vignette).join('')}</div>` : (!fil ? '<div class="charge" style="padding:16px"><div class="roue"></div></div>' : '<p class="aide" style="padding:12px 14px 4px;margin:0">Une photo, un fichier, un lien de publication ou une note qui montre que c\'est fait.</p>')}
    ${peutJoindre && t.statut !== 'terminee' ? `<div class="ajout-preuve" style="${preuves.length ? '' : 'padding-top:10px'}">
      <button class="btn" data-act="preuve-photo" data-id="${e(t.tache_id)}">${ic('photo')}Photo</button>
      <button class="btn" data-act="preuve-fichier" data-id="${e(t.tache_id)}">${ic('fichier')}Fichier</button>
      <button class="btn" data-act="preuve-lien" data-id="${e(t.tache_id)}">${ic('lien')}Lien</button>
      <button class="btn" data-act="preuve-note" data-id="${e(t.tache_id)}">${ic('note')}Note</button></div>` : ''}</div></div>` : '';

  const ajoutSous = droits.gerer && ouverte(t) && !t.parent_id && !t.nb_sous_taches && !t.recurrence_id
    ? `<div class="section"><button class="btn discret" data-act="sous-tache" data-id="${e(t.tache_id)}">${ic('plus')}Découper en sous-tâches</button></div>` : '';

  // Fil
  const evts = fil ? fil.fil.map(f => {
    if (f.genre === 'commentaire' || f.genre === 'refus' || f.genre === 'refus_recu' || f.genre === 'approbation' || f.genre === 'approbation_recue') {
      return `<div class="evt ${f.genre}">${avatar(f.auteur_id, 'p')}<div class="bulle"><b>${e(nomDe(f.auteur_id))} <span class="quand" style="font-weight:400">${e(quand(f.cree_le))}</span></b>${e(f.texte)}</div></div>`;
    }
    return `<div class="evt systeme">${ic(f.genre === 'preuve' ? 'trombone' : 'check')}<span style="flex:1">${e(f.texte)}</span><span class="quand">${e(quand(f.cree_le))}</span></div>`;
  }).join('') : '';

  return `<div class="etiquette">
      <div class="haut"><span class="code">${e(t.tache_id)}</span>${t.type === 'validation' ? '<span>Validation</span>' : t.type === 'jalon' ? '<span>Jalon</span>' : t.nb_sous_taches ? '<span>Circuit</span>' : ''}
        ${t.recurrence_id ? `<span>${ic('repete')}</span>` : ''}<span class="etat ${cls}">${etat}</span></div>
      <h3>${e(t.titre)}</h3>
      <div class="desc ${t.description ? '' : 'vide-desc'}">${t.description ? e(t.description) : (droits.gerer || droits.agir ? 'Pas de description.' : '')}</div>
      ${alertes}
      ${actions ? `<div class="actions-princ">${actions}</div>` : ''}
    </div>
    ${t.type === 'validation' ? aValider + champs : champs + aValider}${etapes}${blocPreuves}${ajoutSous}
    <div class="section"><h4>${ic('bulle')} Activité</h4><div class="carte fil">${fil ? evts || '<p class="aide" style="padding:10px 14px;margin:0">Rien encore.</p>' : '<div class="charge" style="padding:16px"><div class="roue"></div></div>'}</div></div>
    <p class="aide" style="text-align:center;margin:16px">Créée par ${e(nomDe(t.createur_id))}, ${e(quand(t.cree_le))}</p>`;
}

function vignette(p) {
  if (p.genre === 'texte') return `<div class="preuve note">${ic('note')}<span style="white-space:pre-wrap">${e(p.texte)}</span><small class="aide" style="margin:0">${e(prenom(p.ajoute_par))}, ${e(quand(p.ajoute_le))}</small></div>`;
  if (p.genre === 'lien') return `<a class="preuve" href="${e(p.url)}" target="_blank" rel="noopener noreferrer">${ic('lien')}<span class="nomf">${e(p.nom)}</span></a>`;
  const img = p.miniature ? `<img src="${e(p.miniature)}" alt="${e(p.nom)}">` : '';
  return `<button class="preuve" data-act="voir-preuve" data-id="${e(p.preuve_id)}" data-nom="${e(p.nom)}" data-mime="${e(p.mime)}">${img || ic(p.mime.startsWith('image/') ? 'photo' : 'fichier') + `<span class="nomf">${e(p.nom)}</span>`}</button>`;
}

async function voirPreuve(id, nom, mime) {
  const v = document.createElement('div'); v.className = 'visionneuse';
  v.innerHTML = `<div class="haut"><button class="btn-ic" style="color:#fff" aria-label="Fermer">${ic('x')}</button><span>${e(nom)}</span></div><div class="img"><div class="roue"></div></div>`;
  document.body.append(v);
  v.querySelector('button').onclick = () => v.remove();
  try {
    const r = await api('preuve_lire', { preuve_id: id });
    const octets = Uint8Array.from(atob(r.donnees), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([octets], { type: r.mime }));
    if (r.mime.startsWith('image/')) v.querySelector('.img').innerHTML = `<img src="${url}" alt="${e(nom)}">`;
    else {
      v.querySelector('.img').innerHTML = `<div style="text-align:center;color:#fff">${ic('fichier')}<p>${e(nom)}</p>
        <a class="btn jaune" href="${url}" download="${e(nom)}" target="_blank" rel="noopener">Ouvrir le fichier</a></div>`;
    }
  } catch (x) { v.remove(); toast(x.message, { erreur: true }); }
}

/* ── Actions sur une tâche ───────────────────────────────────── */
async function terminer(id, depuisListe) {
  const t = tache(id);
  if (!t) return;
  if (t.statut === 'terminee') return ouvrirTache(id);
  if (t.bloquee) return toast('En attente de « ' + t.bloquee_par[0].titre + ' » (' + prenom(t.bloquee_par[0].responsable_id) + ').');
  if (t.type === 'validation' || t.nb_sous_taches || t.responsable_id !== moi().user_id && moi().niveau !== 'admin') return ouvrirTache(id);
  if (t.preuve_requise && !t.nb_preuves) {
    if (depuisListe) { await ouvrirTache(id); }
    return toast('Une preuve est demandée : joins une photo, un fichier, un lien ou une note.', { duree: 4000 });
  }
  const avant = Object.assign({}, t);
  t.statut = 'terminee'; t.terminee_le = auj() + ' 00:00:00'; rendre();
  try {
    const r = await agir('tache_terminer', { tache_id: id });
    toast('Terminée', { action: 'Annuler', fn: () => rouvrir(id) });
    integrer(r);
  } catch (x) { Object.assign(t, avant); rendre(); }
}
async function rouvrir(id) { try { integrer(await agir('tache_rouvrir', { tache_id: id }, 'Rouverte')); } catch (x) {} }

async function joindre(id, genre) {
  if (genre === 'photo' || genre === 'fichier') {
    const inp = $(genre === 'photo' ? '#f-photo' : '#f-fichier');
    inp.value = '';
    inp.onchange = () => { if (inp.files[0]) envoyerFichier(id, inp.files[0]); };
    inp.click();
    return;
  }
  if (genre === 'lien') {
    const url = await demander('Lien de la preuve', { champ: true, placeholder: 'https://… (publication Facebook, document en ligne…)', ok: 'Joindre', requis: 'Colle le lien.' });
    if (!url) return;
    try { await agir('preuve_ajouter', { tache_id: id, genre: 'lien', url: /^https?:\/\//i.test(url) ? url : 'https://' + url }, 'Lien joint'); apresPreuve(id); } catch (x) {}
  }
  if (genre === 'note') {
    const texte = await demander('Note de preuve', { champ: true, placeholder: 'Ex. : 50 affiches collées à Limonade et Grande-Rivière.', ok: 'Joindre', requis: 'Écris la note.' });
    if (!texte) return;
    try { await agir('preuve_ajouter', { tache_id: id, genre: 'texte', texte }, 'Note jointe'); apresPreuve(id); } catch (x) {}
  }
}
function apresPreuve(id) {
  const t = tache(id); if (t) t.nb_preuves = (t.nb_preuves || 0) + 1;
  const c = S.calques.find(x => x.tacheId === id);
  if (c) remplirTache(c, id, true);
  charger(true);
}
function lireBase64(blob) { return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ko; r.readAsDataURL(blob); }); }
function reduireImage(fichier, maxCote, qualite) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(fichier); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxCote / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? ok(b) : ko(new Error('Image illisible')), 'image/jpeg', qualite);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('Image illisible')); };
    img.src = url;
  });
}
async function envoyerFichier(id, f) {
  if (f.size > 25 * 1024 * 1024) return toast('Fichier trop lourd (10 Mo au plus).', { erreur: true });
  toast('Envoi de la preuve…', { duree: 60000 });
  try {
    let donnees, mime = f.type || 'application/octet-stream', nom = f.name || 'preuve', miniature = '';
    if (/^image\/(jpeg|png|webp|gif|heic|heif)$/.test(mime) || (!f.type && /\.(jpe?g|png|webp|heic)$/i.test(nom))) {
      try {
        const grand = await reduireImage(f, 1600, .82);
        donnees = await lireBase64(grand); mime = 'image/jpeg'; nom = nom.replace(/\.[a-z0-9]+$/i, '') + '.jpg';
        miniature = 'data:image/jpeg;base64,' + await lireBase64(await reduireImage(f, 220, .6));
      } catch (x) { donnees = await lireBase64(f); }
    } else {
      if (f.size > 10 * 1024 * 1024) return toast('Fichier trop lourd (10 Mo au plus).', { erreur: true });
      donnees = await lireBase64(f);
    }
    await agir('preuve_ajouter', { tache_id: id, genre: 'fichier', nom, mime, donnees, miniature }, 'Preuve jointe');
    apresPreuve(id);
  } catch (x) { if (!x.code) toast(x.message, { erreur: true }); }
}

async function decider(id, decision) {
  if (decision === 'refuse') {
    const motif = await demander('Renvoyer le travail', { champ: true, texte: 'Le motif part à la personne qui a fait l\'étape précédente. Sois précis : ce qui doit changer.', placeholder: 'Ex. : le prix doit être en gourdes, et ajouter le numéro WhatsApp.', ok: 'Renvoyer', ton: 'rouge-txt', requis: 'Le motif est obligatoire.' });
    if (!motif) return;
    try { integrer(await agir('validation_decider', { tache_id: id, decision, motif }, 'Renvoyé avec ton motif')); } catch (x) {}
  } else {
    const mot = await demander('Donner le feu vert', { champ: true, texte: 'L\'étape suivante s\'ouvre tout de suite.', placeholder: 'Un mot pour l\'équipe (facultatif)', ok: 'Feu vert', ton: 'vert' });
    if (mot === null) return;
    try { integrer(await agir('validation_decider', { tache_id: id, decision, motif: mot === true ? '' : mot }, 'Feu vert donné')); } catch (x) {}
  }
}

function relancerWhatsapp(t) {
  const tel = ((membre(t.responsable_id) || {}).telephone || '').replace(/\D/g, '');
  if (!tel) return toast('Pas de numéro pour ' + nomDe(t.responsable_id) + ' dans les apps.', { erreur: true });

  window.open(`https://wa.me/${tel.length === 8 ? '509' + tel : tel}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}

function menuTache(ancre, id) {
  const t = tache(id), fil = S.fils[id];
  if (!t) return;
  const d = fil ? fil.droits : { gerer: false, agir: false };
  menu(ancre, [
    d.gerer && ouverte(t) && { ic: 'crayon', lib: 'Modifier la tâche', fn: () => ouvrirCreation({ modifier: t }) },
    d.gerer && ouverte(t) && !t.parent_id && !t.recurrence_id && { ic: 'plus', lib: 'Ajouter une sous-tâche', fn: () => ouvrirCreation({ parent: t }) },
    t.responsable_id !== moi().user_id && ouverte(t) && { ic: 'whatsapp', lib: 'Relancer sur WhatsApp', fn: () => relancerWhatsapp(t) },
    (d.agir || d.gerer) && ouverte(t) && t.statut === 'en_cours' && { ic: 'pause', lib: 'Remettre à faire', fn: async () => { try { integrer(await agir('tache_statut', { tache_id: id, statut: 'a_faire' })); } catch (x) {} } },
    (d.agir || d.gerer) && (t.statut === 'terminee' || t.statut === 'manquee') && { ic: 'renvoi', lib: 'Rouvrir', fn: () => rouvrir(id) },
    d.gerer && t.statut !== 'annulee' && t.statut !== 'terminee' && { ic: 'poubelle', lib: 'Annuler la tâche', danger: true, fn: async () => {
      const motif = await demander('Annuler la tâche', { champ: true, texte: t.nb_sous_taches ? 'Les étapes encore ouvertes seront annulées aussi. Le travail déjà fait reste enregistré.' : 'Elle reste visible, marquée annulée.', placeholder: 'Pourquoi ?', ok: 'Annuler la tâche', ton: 'rouge-txt', requis: 'Indique pourquoi.' });
      if (motif) try { integrer(await agir('tache_annuler', { tache_id: id, motif }, 'Tâche annulée')); } catch (x) {}
    } },
    { ic: 'lien', lib: 'Copier le code ' + id, fn: () => { try { navigator.clipboard.writeText(id); toast('Code copié'); } catch (x) {} } }
  ]);
}

    }
    if (b.closest('[data-jours]')) { const j = +b.dataset.j; etat.jours = etat.jours.includes(j) ? etat.jours.filter(x => x !== j) : etat.jours.concat(j); b.setAttribute('aria-pressed', etat.jours.includes(j)); return; }
    if (b.closest('[data-jsem]')) { etat.jourSem = +b.dataset.j; b.parentElement.querySelectorAll('.puce').forEach(p => p.setAttribute('aria-pressed', p === b)); return; }
    if (b.closest('[data-suiveurs]')) { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); return; }
    if (etat.mode !== 'circuit') return;
    lireEtapes();
    if (b.closest('[data-modeles]')) {
      const md = S.d.modeles.find(x => x.modele_id === b.dataset.m);
      etat.modele = md.modele_id;
      const a = auj();
      etat.etapes = md.etapes.map((s, i) => ({ titre: s.titre, type: s.type, preuve_requise: !!s.preuve_requise,
        responsable_id: (etat.etapes[i] && etat.etapes[i].responsable_id) || (s.type === 'validation' ? moi().user_id : ''),
        echeance: s.delai === null || s.delai === undefined ? '' : dj(jn(a) + s.delai) }));
      if (!etat.b.titre) etat.b.titre = md.nom;
      return dessiner();
    }
    const fe = b.closest('.etape-form'); const i = fe ? +fe.dataset.i : -1;
    if (b.dataset.type) { etat.etapes[i].type = b.dataset.type; if (b.dataset.type === 'validation') etat.etapes[i].preuve_requise = false; return dessiner(); }
    if ('preuve' in b.dataset) { etat.etapes[i].preuve_requise = !etat.etapes[i].preuve_requise; return dessiner(); }
    if (b.dataset.monter) { const k = +b.dataset.monter; [etat.etapes[k - 1], etat.etapes[k]] = [etat.etapes[k], etat.etapes[k - 1]]; if (etat.etapes[0].type === 'validation') etat.etapes[0].type = 'tache'; return dessiner(); }
    if (b.dataset.descendre) { const k = +b.dataset.descendre; [etat.etapes[k + 1], etat.etapes[k]] = [etat.etapes[k], etat.etapes[k + 1]]; if (etat.etapes[0].type === 'validation') etat.etapes[0].type = 'tache'; return dessiner(); }
    if (b.dataset.suppr) { etat.etapes.splice(+b.dataset.suppr, 1); if (etat.etapes[0].type === 'validation') etat.etapes[0].type = 'tache'; return dessiner(); }
    if ('ajoutEtape' in b.dataset) { etat.etapes.push({ titre: '', type: 'tache', responsable_id: '', echeance: '', preuve_requise: true }); dessiner(); form.querySelector('.etape-form:last-child [data-k=titre]').focus(); }
  };

  $('#fc-ok', c.f).onclick = async () => {
    const v = n => { const el = form.querySelector(`[name="${n}"]`); return el ? el.value.trim() : undefined; };
    const sw = n => { const el = form.querySelector(`[data-switch="${n}"]`); return el ? el.getAttribute('aria-checked') === 'true' : false; };
    const suiveurs = [...form.querySelectorAll('[data-suiveurs] [aria-pressed=true]')].map(x => x.dataset.u);
    const btn = $('#fc-ok', c.f);
    if (!v('titre')) return toast('Donne un titre.', { erreur: true });
    btn.disabled = true;
    try {
      if (etat.mode === 'circuit') {
        lireEtapes();
        const manque = etat.etapes.findIndex(s => !s.titre.trim() || !s.responsable_id);
        if (manque >= 0) { btn.disabled = false; return toast(`Étape ${manque + 1} : il manque ${!etat.etapes[manque].titre.trim() ? 'le titre' : 'la personne'}.`, { erreur: true }); }
        const r = await agir('circuit_creer', { circuit: { titre: v('titre'), description: v('description'), projet_id: v('projet_id'), pilote_id: v('pilote_id'),
          etapes: etat.etapes.map(s => ({ titre: s.titre.trim(), type: s.type, responsable_id: s.responsable_id, echeance: s.echeance, preuve_requise: s.preuve_requise })),
          enregistrer_modele: sw('enregistrer_modele'), nom_modele: v('nom_modele') } }, 'Circuit lancé : ' + prenom(etat.etapes[0].responsable_id) + ' est prévenu');
        fermerCalque(); integrer(r);
        return;
      }
      const champs = { titre: v('titre'), description: v('description'), responsable_id: seulMoi ? moi().user_id : v('responsable_id'),
        priorite: v('priorite'), preuve_requise: sw('preuve_requise'), suiveurs };
      if (!parent) champs.projet_id = v('projet_id') || '';
      if (form.querySelector('[name=objectif_id]')) champs.objectif_id = v('objectif_id');
      if (form.querySelector('[name=echeance]')) champs.echeance = v('echeance');
      const dep = form.querySelector('[name=depend_de]');
      if (dep) champs.depend_de = [...dep.selectedOptions].map(o => o.value);
      if (m) {
        const diff = {};
        Object.keys(champs).forEach(k => { if (JSON.stringify(champs[k] ?? '') !== JSON.stringify(m[k] ?? '')) diff[k] = champs[k]; });
        if (!Object.keys(diff).length) { fermerCalque(); return; }
        const r = await agir('tache_modifier', { tache_id: m.tache_id, champs: diff }, 'Enregistré');
        fermerCalque(); integrer(r);
        return;
      }
      if (parent) champs.parent_id = parent.tache_id;
      const donnees = { tache: champs };
      if (etat.rep !== 'non') {
        donnees.repetition = { frequence: etat.rep, jours: etat.rep === 'jour' ? etat.jours : etat.rep === 'semaine' ? etat.jourSem : etat.jourMois };
        delete champs.depend_de;
      }
      const r = await agir('tache_creer', donnees, etat.rep !== 'non' ? 'Tâche répétitive créée' : 'Tâche créée');
      if (r.recurrence) { S.d.recurrences.push(r.recurrence); if (!r.tache) toast('Répétition enregistrée : la première tâche apparaîtra à sa période.', { duree: 4500 }); }
      fermerCalque(); integrer(r);
    } catch (x) { btn.disabled = false; }
  };
}

function telAffiche(t) {
  const d = String(t || '').replace(/\D/g, '');
  const n = d.length === 11 && d.startsWith('509') ? d.slice(3) : d;
  return n.length === 8 ? n.slice(0, 4) + ' ' + n.slice(4) : n;
}

    const c = ouvrirCalque(`${teteCalque(titre)}<div class="feuille-corps"><form class="form" id="fm">

      <p class="aide" style="margin:0">Il se connecte avec son téléphone ou son courriel, et le code à 6 chiffres qu'il utilise déjà dans les apps.</p>
    </form></div>
    <div class="feuille-pied"><button class="btn" data-act="fermer" style="flex:1">Annuler</button><button class="btn primaire" id="fm-ok" style="flex:2">${e(opts.ok || 'Enregistrer')}</button></div>`,
      { etroite: true, apres: () => { if (!fini) res(null); } });

    $('#fm-ok', c.f).onclick = () => {
      const v = { fonction: f.fonction.value.trim(), courriel: f.courriel.value.trim() };
      if (f.niveau) v.niveau = f.niveau.value;
      if (v.courriel && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.courriel)) return toast('Adresse courriel invalide.', { erreur: true });
      if (!v.courriel && !opts.telephone && !(opts.autres && opts.autres.length)) return toast('Sans téléphone enregistré, il lui faut un courriel pour se connecter.', { erreur: true, duree: 4500 });
      fini = true; res(v); fermerCalque();
    };
  });
}

async function gererEquipe() {
  const c = ouvrirCalque(`${teteCalque("Gérer l'équipe")}<div class="feuille-corps" id="ge"><div class="charge"><div class="roue"></div></div></div>`, { rafraichir: cc => remplir(cc) });
  let cands = [];
  async function remplir(cc) {
    try { cands = await api('equipe_candidats'); } catch (x) {}
    const ids = m => {
      const t = [];
      if (m.telephone) t.push(`<span>${ic('whatsapp')}${e(telAffiche(m.telephone))}</span>`);
      (m.courriels_connus || []).forEach(x => t.push(`<span>${ic('mail')}${e(x)}</span>`));
      return t.length ? `<div class="meta" style="margin-top:3px">${t.join('')}</div>` : (m.actif ? `<div class="meta" style="margin-top:3px"><span class="retard">${ic('cadenas')}Ni téléphone ni courriel : ne peut pas se connecter</span></div>` : '');
    };
    $('#ge', cc.f).innerHTML = `<div class="section"><h4>Dans l'app <span class="nb">${S.d.equipe.length}</span></h4><div class="carte">${S.d.equipe.map(m => `
      <div class="champ" style="flex-wrap:wrap;gap:8px 12px">${avatar(m.user_id)}<div style="flex:1;min-width:0"><b style="${m.actif ? '' : 'color:var(--gris-2)'}">${e(m.nom)}</b><div class="aide" style="margin:0">${e(m.fonction || '—')}${m.actif ? '' : ' — accès retiré'}</div>${ids(m)}</div>
        <div style="display:flex;gap:4px;align-items:center;width:100%;padding-left:40px">
          <select data-niveau="${e(m.user_id)}" aria-label="Niveau de ${e(m.nom)}" style="flex:1;min-height:38px;padding:6px 8px;border:1px solid #cfd8e3;border-radius:8px;background:#fff">${Object.entries(NIV).map(([k, l]) => `<option value="${k}" ${m.niveau === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <button class="btn-ic" data-fiche="${e(m.user_id)}" aria-label="Fonction et courriel de ${e(m.nom)}" style="color:var(--marine)">${ic('crayon')}</button>
          <button class="btn discret" data-actif="${e(m.user_id)}">${m.actif ? 'Retirer' : 'Rétablir'}</button></div></div>`).join('')}</div>
      <p class="aide" style="margin:6px 4px">Administrateur : tout voir et gérer l'équipe. Associé : voit les projets de direction, crée projets et objectifs. Employé : ses tâches, et les projets ouverts à toute l'équipe.</p></div>
      <div class="section"><h4>Ajouter depuis les apps Flashipping <span class="nb">${cands.length}</span></h4><div class="carte">${cands.length ? cands.map(u => `
        <div class="champ">${avatar(u.user_id)}<div style="flex:1"><b>${e(u.nom)}</b><div class="aide" style="margin:0">${e(u.role)}${u.agence_id ? ' — ' + e(u.agence_id) : ''}</div></div>
        <button class="btn" data-ajout="${e(u.user_id)}" data-role="${e(u.role)}">${ic('plus')}Ajouter</button></div>`).join('') : '<div class="champ"><span class="val muet">Tout le monde est déjà dans l\'app. Un nouveau compte se crée dans l\'app Administration.</span></div>'}</div></div>`;
    const z = $('#ge', cc.f);
    z.onchange = async ev => {
      const s = ev.target.closest('[data-niveau]'); if (!s) return;
      try { await agir('equipe_modifier', { user_id: s.dataset.niveau, champs: { niveau: s.value } }, 'Niveau changé'); await charger(true); remplir(cc); } catch (x) { remplir(cc); }
    };
    z.onclick = async ev => {
      const b = ev.target.closest('button'); if (!b) return;
      if (b.dataset.ajout) {
        const u = cands.find(x => x.user_id === b.dataset.ajout) || {};
        const v = await ficheMembre('Ajouter ' + (u.nom || ''), { niveau: ['superadmin', 'admin'].includes(b.dataset.role) ? 'associe' : 'employe', telephone: u.telephone, autres: u.courriels, ok: 'Ajouter' });
        if (!v) return;
        try { await agir('equipe_ajouter', { user_id: b.dataset.ajout, niveau: v.niveau, fonction: v.fonction, courriel: v.courriel }, 'Ajouté à l\'app'); await charger(true); remplir(cc); } catch (x) {}
      }
      if (b.dataset.actif) {
        const m = membre(b.dataset.actif);
        try { await agir('equipe_modifier', { user_id: m.user_id, champs: { actif: !m.actif } }, m.actif ? 'Accès retiré' : 'Accès rétabli'); await charger(true); remplir(cc); } catch (x) {}
      }
      if (b.dataset.fiche) {
        const m = membre(b.dataset.fiche);
        const autres = (m.courriels_connus || []).filter(x => x !== m.courriel);
        const v = await ficheMembre(m.nom, { fonction: m.fonction, courriel: m.courriel, telephone: m.telephone, autres });
        if (!v) return;
        try { await agir('equipe_modifier', { user_id: m.user_id, champs: { fonction: v.fonction, courriel: v.courriel } }, 'Enregistré'); await charger(true); remplir(cc); } catch (x) {}
      }
    };
  }
  remplir(c);
}

async function modifierRecurrence(id) {
  const r = recurrence(id);
  const c = ouvrirCalque(`${teteCalque('Tâche répétitive')}<div class="feuille-corps"><form class="form" id="fr">

    <p class="aide" style="margin:0">${ic('repete')} ${e(libelleRep(r))}. Les changements valent pour les prochaines fois ; les tâches déjà créées ne bougent pas.</p>
    ${interrupteur('preuve_requise', r.preuve_requise, 'Preuve demandée')}
    <div><label class="l" for="fr-f">Arrêter le</label><input id="fr-f" type="date" class="inp" name="fin" value="${e(r.fin || '')}"></div>
  </form></div><div class="feuille-pied"><button class="btn" data-act="fermer" style="flex:1">Annuler</button><button class="btn primaire" id="fr-ok" style="flex:2">Enregistrer</button></div>`, { etroite: true });

/* ── Impression du rapport ───────────────────────────────────── */
function imprimer(uid) {
  const m = moisCourant(), r = S.rapports[m];
  if (!r || r === 'charge') return toast('Rapport en cours de chargement.');
  const membres = uid ? r.membres.filter(x => x.user_id === uid) : r.membres;
  $('#impression').innerHTML = `<h1>Flashipping — rapport des tâches</h1><p>${libMois(m)}, établi le ${dateLongue(r.aujourdhui)}</p>
    ${membres.map(x => `<div class="pm"><h2>${e(x.nom)}${x.fonction ? ' — ' + e(x.fonction) : ''}</h2>
      <table><tbody><tr><td>Prévues</td><td><b>${x.prevues}</b></td><td>Terminées</td><td><b>${x.terminees}</b> (dont ${x.terminees_a_temps} à temps)</td><td>À temps</td><td><b>${fiab(x.fiabilite)}</b> (${x.a_temps_echues} sur ${x.echues})</td></tr>
      <tr><td>Manquées</td><td><b>${x.manquees}</b></td><td>Encore en retard</td><td><b>${x.ouvertes_en_retard}</b></td><td>Renvois reçus</td><td><b>${x.renvois}</b></td></tr>
      <tr><td>Preuves jointes</td><td><b>${x.preuves}</b></td><td>Feux verts donnés</td><td><b>${x.validations_donnees}</b></td><td>Renvois donnés</td><td><b>${x.renvois_donnes}</b></td></tr></tbody></table>
      ${x.liste.length ? `<table><thead><tr><th>Tâche</th><th>Échéance</th><th>Statut</th><th>Terminée le</th></tr></thead><tbody>${x.liste.map(t => `<tr><td>${e(t.titre)}</td><td>${e(t.echeance || '—')}</td><td>${{ a_faire: 'à faire', en_cours: 'en cours', terminee: t.a_temps ? 'faite à temps' : 'faite en retard', manquee: 'manquée' }[t.statut] || t.statut}${t.renvois ? ' (' + t.renvois + ' renvoi)' : ''}</td><td>${e((t.terminee_le || '').slice(0, 10) || '—')}</td></tr>`).join('')}</tbody></table>` : '<p>Aucune tâche ce mois.</p>'}</div>`).join('')}
    <p style="margin-top:16pt;font-size:9.5pt;color:#555">« À temps » : part des tâches du mois, déjà échues ou terminées, faites au plus tard le jour prévu. Une tâche répétitive non faite à son échéance compte comme manquée. Un renvoi est un travail refusé à la validation. Faits enregistrés dans l'app, sans pondération.</p>`;
  setTimeout(() => window.print(), 50);
}

/* ── Délégation des clics ────────────────────────────────────── */
document.addEventListener('click', async ev => {
  const coche = ev.target.closest('[data-coche]');
  if (coche) { ev.stopPropagation(); return terminer(coche.dataset.coche, true); }
  const a = ev.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act, id = a.dataset.id;
    switch (act) {
      case 'fermer': return fermerCalque();
      case 'fermer-et-aller': { ev.preventDefault(); const h = a.getAttribute('href'); const n = S.calques.length; if (n) history.go(-n); setTimeout(() => { location.hash = h; }, 120); return; }
      case 'creer': return ouvrirCreation({ projet: a.dataset.projet });
      case 'deplier': S.vue['ouvert_' + a.dataset.id] = !S.vue['ouvert_' + a.dataset.id]; return rendre();
      case 'terminer': return terminer(id);
      case 'commencer': try { integrer(await agir('tache_statut', { tache_id: id, statut: 'en_cours' }, 'C\'est parti')); } catch (x) {} return;
      case 'rouvrir': return rouvrir(id);
      case 'feu-vert': return decider(id, 'approuve');
      case 'renvoyer': return decider(id, 'refuse');
      case 'menu-tache': return menuTache(a, id);
      case 'editer-champ': return editerChamp(id);
      case 'sous-tache': return ouvrirCreation({ parent: tache(id) });
      case 'preuve-photo': return joindre(id, 'photo');
      case 'preuve-fichier': return joindre(id, 'fichier');
      case 'preuve-lien': return joindre(id, 'lien');
      case 'preuve-note': return joindre(id, 'note');
      case 'voir-preuve': return voirPreuve(id, a.dataset.nom, a.dataset.mime);
      case 'commenter': {
        const ta = a.closest('.feuille').querySelector('#dt-com'); const texte = ta.value.trim(); if (!texte) return;
        ta.value = ''; ta.style.height = '';
        try { await agir('commentaire_ajouter', { tache_id: id, texte }); const c = S.calques.find(x => x.tacheId === id); if (c) remplirTache(c, id, true); } catch (x) { ta.value = texte; }
        return;
      }
      case 'nouveau-projet': return ouvrirProjet(null);
      case 'modifier-projet': return ouvrirProjet(projet(id));
      case 'archiver-projet': { const p = projet(id); try { const r = await agir('projet_modifier', { projet_id: id, champs: { statut: p.statut === 'archive' ? 'actif' : 'archive' } }, p.statut === 'archive' ? 'Projet réactivé' : 'Projet archivé'); Object.assign(p, r.projet); rendre(); } catch (x) {} return; }
      case 'historique-projet': try { S.historiques[id] = (await api('historique', { projet_id: id })).taches.sort((x, y) => (y.terminee_le || '').localeCompare(x.terminee_le || '')); rendre(); } catch (x) { toast(x.message, { erreur: true }); } return;
      case 'nouvel-objectif': return ouvrirObjectifForm(null);
      case 'modifier-objectif': return ouvrirObjectifForm(objectif(id));
      case 'faire-point': return fairePoint(id);
      case 'gerer-equipe': return gererEquipe();
      case 'imprimer': return imprimer(a.dataset.uid);
      case 'tout-lu': try { const r = await agir('notifs_lues', {}); S.d.notifs.forEach(n => { n.lu = true; }); S.d.non_lues = r.non_lues; rendre(); } catch (x) {} return;
      case 'deconnexion': return deconnecter();
      case 'changer-serveur': return ecranServeur();
      case 'copier-invitation': {
        const id = (apiUrl().match(/\/s\/([^/]+)\/exec$/) || [])[1];
        const lien = location.origin + location.pathname + '?api=' + id;
        try { await navigator.clipboard.writeText(lien); toast('Lien copié : colle-le dans WhatsApp'); }
        catch (x) { await demander('Lien d\'invitation', { champ: true, valeur: lien, ok: 'Fermer' }); }
        return;
      }
      case 'rec-bascule': { const r = recurrence(id); try { await agir('recurrence_modifier', { recurrence_id: id, champs: { actif: !r.actif } }, r.actif ? 'En pause' : 'Reprise'); r.actif = !r.actif; rendre(); charger(true); } catch (x) {} return; }
      case 'rec-modifier': return modifierRecurrence(id);
      case 'modele-retirer': try { await agir('modele_modifier', { modele_id: id, champs: { actif: false } }, 'Modèle retiré'); S.d.modeles = S.d.modeles.filter(m => m.modele_id !== id); rendre(); } catch (x) {} return;
    }
    return;
  }
  const n = ev.target.closest('[data-notif]');
  if (n) {
    const no = S.d.notifs.find(x => x.notif_id === n.dataset.notif);
    if (no && !no.lu) { no.lu = true; S.d.non_lues = Math.max(0, S.d.non_lues - 1); rendre(); api('notifs_lues', { ids: [no.notif_id] }).catch(() => {}); }
    if (n.dataset.t) ouvrirTache(n.dataset.t);
    return;
  }
  const t = ev.target.closest('[data-tache]');
  if (t) return ouvrirTache(t.dataset.tache);
  const o = ev.target.closest('[data-objectif]'); if (o) return ouvrirObjectif(o.dataset.objectif);
  const f = ev.target.closest('[data-filtre]'); if (f) { S.vue.filtre = S.vue.filtre === f.dataset.filtre ? null : f.dataset.filtre; S.vue.perimetre = 'moi'; return rendre(); }
  const h = ev.target.closest('[data-horizon]'); if (h) { S.vue.horizon = h.dataset.horizon; S.vue.filtre = null; return rendre(); }
  const pe = ev.target.closest('[data-perimetre]'); if (pe) { S.vue.perimetre = pe.dataset.perimetre; S.vue.filtre = null; return rendre(); }
  const op = ev.target.closest('[data-ongletp]'); if (op) { S.vue.ongletProjet = op.dataset.ongletp; return rendre(); }
  const mo = ev.target.closest('[data-mois]'); if (mo) { S.vue.mois = decalerMois(moisCourant(), +mo.dataset.mois); rendre(); return; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches('.ligne[data-tache]')) ouvrirTache(ev.target.dataset.tache);
  if (ev.key === 'Escape' && S.calques.length) fermerCalque();
});

/* ── Adresse du serveur ──────────────────────────────────────── */
function normaliserApi(v) {
  v = String(v || '').trim();
  if (/^[A-Za-z0-9_-]{20,}$/.test(v)) v = 'https://script.google.com/macros/s/' + v + '/exec';
  return v.replace(/\/(dev|exec)?(\?.*)?$/, '/exec').replace(/\/exec\/exec$/, '/exec');
}

/** Vérifie que l'adresse répond, qu'elle est publique, et que c'est bien le serveur Tâches. */
async function verifierServeur(url) {
  let r;
  try { r = await fetch(url + '?action=diag', { redirect: 'follow' }); }
  catch (x) {
    throw new Error(navigator.onLine === false ? 'Pas de connexion internet.'
      : 'Le serveur ne répond pas à l\'app. Dans Apps Script, le déploiement doit être « Exécuter en tant que : Moi » et « Accès : Tout le monde ».');
  }
  let j;
  try { j = await r.json(); } catch (x) { throw new Error('Cette adresse ne renvoie pas de réponse lisible : vérifie que c\'est bien l\'URL /exec du déploiement.'); }
  if (!j.ok || !j.data || !/^taches-/.test(String(j.data.version || ''))) {
    throw new Error('Cette adresse n\'est pas celle du serveur Tâches (c\'est peut-être celle des autres apps).');
  }
  return j.data;
}

function ecranServeur(message) {
  fermerTousCalques();
  $('#app').innerHTML = `<div class="connexion">
    <div class="logo"><svg width="44" height="44" style="color:#fff"><use href="#i-logo"/></svg><b>Flashipping</b></div>
    <p class="sous">Tâches de l'équipe</p>
    <form class="boite" id="f-serveur" novalidate>
      <h2>Adresse du serveur</h2>
      <p class="aide" style="margin:0 0 12px">À faire une seule fois sur ce téléphone. C'est l'adresse du déploiement « Flashipping_Taches » ; elle finit par <b>/exec</b>. Le plus simple : ouvrir le lien d'invitation envoyé par l'administrateur.</p>
      <label class="l-cnx" for="srv">Adresse</label>
      <input id="srv" class="inp" type="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${e(apiUrl())}">
      <button type="submit" class="btn primaire plein" id="srv-ok" style="margin-top:12px">Enregistrer</button>
      ${message ? `<div class="alerte rouge" style="margin:12px 0 0">${ic('x')}<span>${e(message)}</span></div>` : ''}
    </form>
    <div class="pied">Pi rapid, pi sekirize, pi ba pri.</div>
  </div>`;
  $('#f-serveur').onsubmit = async ev => {
    ev.preventDefault();
    const url = normaliserApi($('#srv').value);
    if (!MOTIF_API.test(url)) return toast('L\'adresse doit ressembler à https://script.google.com/macros/s/…/exec', { erreur: true, duree: 4500 });
    $('#srv-ok').disabled = true; $('#srv-ok').textContent = 'Vérification…';
    try {
      await verifierServeur(url);
      changerServeur(url);
      toast('Serveur enregistré');
      ecranConnexion();
    } catch (x) {
      ecranServeur(x.message);
      $('#srv').value = url;
    }
  };
}

/** Changer de serveur invalide la session : un jeton ne vaut que pour le serveur qui l'a signé. */
function changerServeur(url) {
  if (url !== apiUrl()) { ecrire(CLE.jeton, null); ecrire(CLE.cache, null); S.jeton = null; S.d = null; }
  ecrire(CLE.api, url);
}

/** Lien d'invitation : …/taches/?api=ID enregistre l'adresse puis la retire de la barre d'adresse. */
function lireInvitation() {
  try {
    const q = new URLSearchParams(location.search);
    const v = q.get('api');
    if (!v) return;
    const url = normaliserApi(v);
    if (MOTIF_API.test(url)) changerServeur(url);
    q.delete('api');
    const reste = q.toString();
    history.replaceState(null, '', location.pathname + (reste ? '?' + reste : '') + location.hash);
  } catch (x) {}
}

/* ── Démarrage ───────────────────────────────────────────────── */
(async function demarrer() {
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.FS_BACKEND) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  if (!window.FS_BACKEND) {
    lireInvitation();
    if (!apiUrl()) return ecranServeur();
  }
  if (!S.jeton) return ecranConnexion();
  const cache = lire(CLE.cache);
  if (cache) { try { S.d = JSON.parse(cache); rendre(); } catch (x) {} }
  else $('#app').innerHTML = `<div class="charge" style="min-height:100vh"><div class="roue"></div></div>`;
  await charger(!!cache);
  if (!S.d) return;
  demarrerPoll();
})();
