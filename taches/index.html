<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003366">
<meta name="description" content="Suivi des tâches de l'équipe Flashipping : tâches du jour, circuits de validation, objectifs.">
<title>Flashipping · Tâches</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{
  --marine:#003366; --marine-2:#0b4a8a; --bleu:#1e6fd9; --rouge:#d7263d; --jaune:#ffc629; --vert:#1a9e5c;
  --encre:#0e1a2b; --gris:#56657a; --gris-2:#8a97a8; --trait:#dfe5ee; --fond:#f2f5f9; --blanc:#fff;
  --ambre-fond:#fff6db; --rouge-fond:#fdecee; --vert-fond:#e6f5ee; --bleu-fond:#e8f0fc;
  --r1:6px; --r2:12px; --r3:18px;
  --ombre:0 1px 2px rgba(0,30,70,.06),0 6px 18px rgba(0,30,70,.07);
  --nav:64px; --entete:58px;
  --police:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 var(--police);color:var(--encre);background:var(--fond);-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--bleu)}
:focus-visible{outline:3px solid var(--jaune);outline-offset:2px;border-radius:4px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cache{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Charpente ─────────────────────────────────────────── */
#app{min-height:100%;display:flex}
.lateral{display:none}
.principal{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.entete{position:sticky;top:0;z-index:20;background:var(--marine);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:12px;min-height:var(--entete)}
.entete h1{font-size:19px;font-weight:750;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entete .btn-ic{color:#fff;text-decoration:none}
.btn-ic{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative}
.btn-ic:active{background:rgba(255,255,255,.12)}
.pastille-nb{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rouge);
  color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--marine)}
.contenu{flex:1;padding:0 0 calc(var(--nav) + 90px + env(safe-area-inset-bottom))}
.bloc{padding:0 16px}

.nav-bas{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:#fff;border-top:1px solid var(--trait);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr}
.nav-bas a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--gris);text-decoration:none;font-size:11.5px;font-weight:600}
.nav-bas a.actif{color:var(--marine)}
.nav-bas a.actif .ic{stroke-width:2.4}
.fab{justify-self:center;align-self:start;margin-top:-22px;width:60px;height:60px;border-radius:50%;background:var(--jaune);color:var(--marine);
  display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,51,102,.28);border:4px solid #fff}
.fab .ic{width:28px;height:28px;stroke-width:2.6}

@media (min-width:960px){
  .nav-bas{display:none}
  .lateral{display:flex;flex-direction:column;width:248px;flex:none;background:var(--marine);color:#cfe0f5;position:sticky;top:0;height:100vh;padding:20px 14px}
  .lateral .marque{display:flex;align-items:center;gap:10px;color:#fff;font-weight:750;font-size:17px;padding:4px 8px 22px}
  .lateral a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#cfe0f5;text-decoration:none;font-weight:600}
  .lateral a:hover{background:rgba(255,255,255,.07)}
  .lateral a.actif{background:rgba(255,255,255,.12);color:#fff}
  .lateral .creer{margin:0 0 18px;background:var(--jaune);color:var(--marine);font-weight:750;border-radius:10px;padding:11px 14px;display:flex;gap:8px;align-items:center}
  .lateral .bas{margin-top:auto;font-size:12px;color:#8fb0d6;padding:0 8px}
  .contenu{padding-bottom:60px}
  .contenu>.cadre>*:not(.bandeau){max-width:880px}
  .entete{padding-left:28px}
  .bloc{padding:0 28px}
}

/* ── Bandeau du jour ───────────────────────────────────── */
.bandeau{background:var(--marine);color:#fff;padding:2px 16px 18px}
.bandeau .date{color:#a9c4e6;font-size:13.5px}
.compteurs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.compteurs::-webkit-scrollbar{display:none}
.compteur{flex:none;display:flex;align-items:baseline;gap:6px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08);color:#dbe8f7;font-size:13px}
.compteur b{font-size:20px;color:#fff;font-weight:750}
.compteur.rouge b{color:#ff8a98}
.compteur.jaune b{color:var(--jaune)}
.compteur[aria-pressed="true"]{background:#fff;color:var(--marine)}
.compteur[aria-pressed="true"] b{color:var(--marine)}
@media (min-width:960px){.bandeau{padding:4px 28px 22px}}

/* ── Contrôles ─────────────────────────────────────────── */
.segments{display:flex;background:#e6ebf2;border-radius:10px;padding:3px;gap:2px}
.segments button{flex:1;padding:7px 6px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--gris);white-space:nowrap}
.segments button[aria-pressed="true"]{background:#fff;color:var(--marine);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.barre-filtres{display:flex;flex-direction:column;gap:10px;padding:14px 16px 6px}
.onglets-txt{display:flex;gap:18px;border-bottom:1px solid var(--trait)}
.onglets-txt button{padding:8px 0 10px;font-weight:650;color:var(--gris);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.onglets-txt button[aria-pressed="true"]{color:var(--marine);border-color:var(--marine)}
@media (min-width:960px){.barre-filtres{padding:18px 28px 6px;flex-direction:row;align-items:center}.barre-filtres .segments{max-width:420px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:10px;font-weight:650;font-size:14.5px;
  background:#e6ebf2;color:var(--encre);min-height:44px}
.btn.primaire{background:var(--marine);color:#fff}
.btn.vert{background:var(--vert);color:#fff}
.btn.rouge-txt{background:var(--rouge-fond);color:var(--rouge)}
.btn.jaune{background:var(--jaune);color:var(--marine)}
.btn.discret{background:transparent;color:var(--marine);padding:8px 10px;min-height:36px}
.btn.plein{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn .ic{width:18px;height:18px}

/* ── Listes de tâches ──────────────────────────────────── */
.groupe{margin-top:18px}
.groupe-titre{display:flex;align-items:center;gap:8px;padding:0 16px 6px;font-size:13.5px;font-weight:700;color:var(--gris)}
.groupe-titre .nb{font-weight:600;color:var(--gris-2)}
.groupe-titre.rouge{color:var(--rouge)}
.groupe-titre.ambre{color:#9a6a00}
.groupe-titre button{margin-left:auto;font-size:13px;color:var(--bleu);font-weight:600}
@media (min-width:960px){.groupe-titre{padding:0 28px 6px}}
.liste{background:#fff;border-top:1px solid var(--trait);border-bottom:1px solid var(--trait)}
@media (min-width:960px){.liste{margin:0 28px;border:1px solid var(--trait);border-radius:var(--r2);overflow:hidden}}
.ligne{display:flex;align-items:flex-start;gap:12px;padding:11px 16px;border-top:1px solid #edf1f6;width:100%;text-align:left;position:relative}
.ligne:first-child{border-top:0}
.ligne:active{background:#f6f8fb}
.coche{width:26px;height:26px;border-radius:50%;border:2px solid #b8c3d1;display:grid;place-items:center;flex:none;margin-top:1px;color:transparent;transition:background .15s,border-color .15s}
.coche .ic{width:15px;height:15px;stroke-width:3}
.coche:hover{border-color:var(--vert);color:var(--vert)}
.coche.faite{background:var(--vert);border-color:var(--vert);color:#fff}
.coche.bloquee{border-style:dashed;color:var(--gris-2);border-color:#c9d2de}
.coche.validation{border-radius:7px;transform:rotate(45deg) scale(.86);border-color:#d8a200;background:var(--ambre-fond)}
.coche.validation .ic{transform:rotate(-45deg);color:#9a6a00}
.coche.mere{border-radius:7px;border-color:var(--marine-2)}
.coche.manquee{border-color:var(--rouge);color:var(--rouge)}
.ligne .corps{flex:1;min-width:0}
.ligne .titre{font-weight:600;line-height:1.3;word-break:break-word}
.ligne.close .titre{color:var(--gris-2);text-decoration:line-through;text-decoration-color:#b8c3d1}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:4px;font-size:12.5px;color:var(--gris)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ic{width:14px;height:14px}
.meta .retard{color:var(--rouge);font-weight:650}
.meta .proj i{width:8px;height:8px;border-radius:2px;display:inline-block}
.meta .attente{color:#6b7a8f}
.meta .haute{color:#b45309;font-weight:650}
.meta .urgente{color:var(--rouge);font-weight:700}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:750;color:#fff;flex:none;letter-spacing:.02em}
.av.g{width:40px;height:40px;font-size:14px}
.av.p{width:22px;height:22px;font-size:9.5px}
.vide{padding:40px 24px;text-align:center;color:var(--gris)}
.vide .ic{width:40px;height:40px;color:#b8c3d1;margin-bottom:8px}
.vide b{display:block;color:var(--encre);font-size:16px;margin-bottom:4px}

/* Itinéraire d'un circuit : la signature visuelle */
.trajet{display:flex;align-items:center;gap:0;margin-top:7px}
.trajet i{height:3px;flex:1;background:#d5dde8;max-width:34px}
.trajet b{width:9px;height:9px;border-radius:50%;background:#d5dde8;flex:none}
.trajet b.ok{background:var(--vert)}
.trajet i.ok{background:var(--vert)}
.trajet b.ici{background:var(--jaune);box-shadow:0 0 0 3px #fff3c4}
.trajet small{margin-left:8px;font-size:12px;color:var(--gris)}

/* ── Feuilles (détail, formulaires) ────────────────────── */
.voile{position:fixed;inset:0;background:rgba(5,20,40,.45);z-index:50;opacity:0;transition:opacity .2s}
.voile.ouvert{opacity:1}
.feuille{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:94vh;background:var(--fond);border-radius:var(--r3) var(--r3) 0 0;
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.feuille.ouvert{transform:none}
.feuille.pleine{top:0;max-height:none;border-radius:0}
@media (min-width:960px){
  .feuille{left:auto;top:0;bottom:0;width:560px;max-height:none;border-radius:0;transform:translateX(100%)}
  .feuille.ouvert{transform:none}
  .feuille.etroite{width:460px}
}
.feuille-tete{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;background:#fff;border-bottom:1px solid var(--trait);min-height:56px}
.feuille:not(.pleine) .feuille-tete{border-radius:var(--r3) var(--r3) 0 0;padding-top:8px}
@media (min-width:960px){.feuille:not(.pleine) .feuille-tete{border-radius:0}}
.feuille-tete h2{flex:1;margin:0;font-size:16.5px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feuille-tete .btn-ic{color:var(--marine)}
.feuille-corps{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.feuille-pied{background:#fff;border-top:1px solid var(--trait);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}

/* Détail d'une tâche */
.etiquette{background:#fff;margin:12px;border-radius:var(--r2);border:1px solid var(--trait);overflow:hidden}
.etiquette .haut{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px dashed var(--trait);font-size:12.5px;color:var(--gris)}
.etiquette .code{font-weight:750;color:var(--marine);letter-spacing:.04em}
.etiquette .etat{margin-left:auto;font-weight:700;padding:3px 9px;border-radius:20px;font-size:12px}
.etat.a_faire{background:#eef2f7;color:var(--gris)} .etat.en_cours{background:var(--bleu-fond);color:var(--bleu)}
.etat.terminee{background:var(--vert-fond);color:var(--vert)} .etat.annulee{background:#eee;color:#777}
.etat.manquee,.etat.retard{background:var(--rouge-fond);color:var(--rouge)} .etat.attente{background:#eef2f7;color:#5c6b80}
.etat.valider{background:var(--ambre-fond);color:#8a5d00}
.etiquette h3{margin:0;padding:14px 14px 4px;font-size:21px;line-height:1.25;font-weight:750;letter-spacing:-.01em;word-break:break-word}
.etiquette .desc{padding:4px 14px 14px;color:#33445a;white-space:pre-wrap;word-break:break-word}
.etiquette .desc.vide-desc{color:var(--gris-2)}
.actions-princ{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.actions-princ .btn{flex:1;min-width:120px}
.actions-princ .btn:first-child{flex:1.7}
.alerte{margin:0 14px 14px;padding:10px 12px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alerte .ic{margin-top:1px}
.alerte.rouge{background:var(--rouge-fond);color:#8f1023}
.alerte.gris{background:#eef2f7;color:#3d4c61}
.alerte.ambre{background:var(--ambre-fond);color:#6d4a00}
.alerte.vert{background:var(--vert-fond);color:#0d6b3d}
.champs{background:#fff;margin:0 12px 12px;border-radius:var(--r2);border:1px solid var(--trait)}
.champ{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid #edf1f6;min-height:48px;width:100%;text-align:left}
.champ:first-child{border-top:0}
.champ .lib{width:112px;flex:none;color:var(--gris);font-size:13.5px}
.champ .val{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:550}
.champ .val.muet{color:var(--gris-2);font-weight:500}
.champ.edit:active{background:#f6f8fb}
.champ .crayon{color:#b8c3d1;width:16px;height:16px}
.section{margin:18px 12px 0}
.section>h4{margin:0 4px 8px;font-size:14px;font-weight:700;color:var(--encre);display:flex;align-items:center;gap:8px}
.section>h4 .nb{color:var(--gris-2);font-weight:600}
.section>h4 button{margin-left:auto}
.carte{background:#fff;border:1px solid var(--trait);border-radius:var(--r2)}

/* Étapes du circuit, en itinéraire vertical */
.etapes{padding:6px 0}
.etape{display:flex;gap:12px;padding:8px 14px;position:relative;width:100%;text-align:left}
.etape .pt{position:relative;width:22px;flex:none;display:flex;justify-content:center}
.etape .pt b{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #c9d2de;margin-top:3px;z-index:1}
.etape .pt::after{content:"";position:absolute;top:18px;bottom:-12px;width:3px;background:#dde3ec}
.etape:last-child .pt::after{display:none}
.etape.ok .pt b{background:var(--vert);border-color:var(--vert)}
.etape.ok .pt::after{background:var(--vert)}
.etape.ici .pt b{border-color:#d8a200;background:var(--jaune)}
.etape.annulee .pt b{border-color:#bbb;background:#eee}
.etape.courante{background:var(--bleu-fond)}
.etape .t{font-weight:600}
.etape .s{font-size:12.5px;color:var(--gris);margin-top:1px}

/* Preuves */
.preuves{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:10px}
.preuve{aspect-ratio:1;border-radius:10px;background:#eef2f7;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:8px;text-align:center;font-size:11.5px;color:var(--gris);border:1px solid var(--trait)}
.preuve img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preuve .nomf{word-break:break-all;line-height:1.2;max-height:2.4em;overflow:hidden}
.preuve .ic{width:26px;height:26px;color:var(--marine)}
.preuve.note{aspect-ratio:auto;grid-column:1/-1;align-items:flex-start;text-align:left;font-size:14px;color:var(--encre);background:#fffdf3;border-color:#f1e4b3}
.ajout-preuve{display:flex;gap:8px;padding:0 10px 10px;flex-wrap:wrap}
.ajout-preuve .btn{flex:1;min-width:74px;padding:9px 8px;font-size:13px;flex-direction:column;gap:3px;min-height:58px}

/* Fil d'activité */
.fil{padding:4px 0}
.evt{display:flex;gap:10px;padding:8px 14px;font-size:13.5px}
.evt .quand{color:var(--gris-2);font-size:12px;white-space:nowrap}
.evt.systeme{color:var(--gris)}
.evt.systeme .ic{width:16px;height:16px;color:#b8c3d1;margin-top:2px}
.evt .bulle{background:#fff;border:1px solid var(--trait);border-radius:4px 12px 12px 12px;padding:8px 11px;flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.evt .bulle b{display:block;font-size:12.5px;margin-bottom:2px}
.evt.refus .bulle,.evt.refus_recu .bulle{background:var(--rouge-fond);border-color:#f6c6cd}
.evt.approbation .bulle,.evt.approbation_recue .bulle{background:var(--vert-fond);border-color:#bfe5d1}
.composer{display:flex;gap:8px;align-items:flex-end;flex:1}
.composer textarea{flex:1;resize:none;border:1px solid var(--trait);border-radius:20px;padding:10px 14px;max-height:120px;min-height:44px;background:#f6f8fb}

/* Formulaires */
.form{padding:14px 14px 4px;display:flex;flex-direction:column;gap:14px}
.form .l{display:block;font-size:13px;font-weight:650;color:var(--gris);margin-bottom:6px}
.inp,.form select,.form textarea{width:100%;border:1px solid #cfd8e3;background:#fff;border-radius:10px;padding:11px 12px;min-height:46px}
.inp:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--bleu);box-shadow:0 0 0 3px rgba(30,111,217,.15)}
.form textarea{min-height:84px;resize:vertical}
.inp.titre{font-size:18px;font-weight:650;border:0;border-bottom:2px solid var(--trait);border-radius:0;padding:8px 2px;background:transparent}
.inp.titre:focus{box-shadow:none;border-color:var(--marine)}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{padding:7px 12px;border-radius:20px;border:1px solid #cfd8e3;background:#fff;font-size:13.5px;font-weight:600;color:#3b4b60;display:inline-flex;align-items:center;gap:6px}
.puce[aria-pressed="true"]{background:var(--marine);border-color:var(--marine);color:#fff}
.rangee{display:flex;gap:10px}
.rangee>*{flex:1;min-width:0}
.bascule{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:#fff;border:1px solid #cfd8e3;border-radius:10px}
.bascule small{display:block;color:var(--gris);font-size:12.5px}
.interrupteur{width:46px;height:28px;border-radius:14px;background:#c9d2de;position:relative;flex:none;transition:background .15s}
.interrupteur::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.interrupteur[aria-checked="true"]{background:var(--vert)}
.interrupteur[aria-checked="true"]::after{transform:translateX(18px)}
.aide{font-size:12.5px;color:var(--gris);margin-top:5px}
.etape-form{background:#fff;border:1px solid var(--trait);border-radius:var(--r2);padding:10px 12px 12px;position:relative;margin-left:22px}
.etape-form::before{content:"";position:absolute;left:-15px;top:-14px;bottom:-14px;width:3px;background:#dde3ec}
.etape-form .num{position:absolute;left:-24px;top:12px;width:21px;height:21px;border-radius:50%;background:var(--marine);color:#fff;font-size:11.5px;font-weight:750;display:grid;place-items:center;z-index:1}
.etape-form.validation .num{background:var(--jaune);color:var(--marine)}
.etape-form .outils{display:flex;gap:2px;justify-content:flex-end;margin-top:6px}
.etapes-form{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.etapes-form .etape-form:first-child::before{top:12px}
.etapes-form .etape-form:last-child::before{bottom:auto;height:26px}

/* Projets, objectifs, équipe */
.grille{display:grid;gap:10px;padding:14px 16px}
@media (min-width:640px){.grille{grid-template-columns:1fr 1fr}}
@media (min-width:960px){.grille{padding:18px 28px}}
.projet-c{background:#fff;border:1px solid var(--trait);border-radius:var(--r2);padding:14px;text-align:left;width:100%;border-left:5px solid var(--c,#1e6fd9)}
.projet-c h3{margin:0 0 3px;font-size:16px;font-weight:700}
.projet-c p{margin:0;color:var(--gris);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jauge{height:6px;border-radius:3px;background:#e4e9f0;overflow:hidden;margin-top:12px}
.jauge i{display:block;height:100%;background:var(--vert);border-radius:3px}
.jauge-txt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gris);margin-top:6px}
.obj{background:#fff;border:1px solid var(--trait);border-radius:var(--r2);padding:14px;display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.obj.enfant{margin-left:22px;width:calc(100% - 22px);border-style:dashed}
.anneau{--p:0;width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--ca,var(--vert)) calc(var(--p)*1%),#e4e9f0 0)}
.anneau span{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:750}
.obj h3{margin:0;font-size:15.5px;font-weight:700}
.obj .s{font-size:12.5px;color:var(--gris);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pil{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px}
.pil.en_bonne_voie{background:var(--vert-fond);color:var(--vert)}
.pil.a_risque{background:var(--ambre-fond);color:#8a5d00}
.pil.en_retard{background:var(--rouge-fond);color:var(--rouge)}
.pil.atteint{background:var(--bleu-fond);color:var(--bleu)}
.pil.abandonne{background:#eee;color:#777}
.colonnes{display:flex;gap:10px;overflow-x:auto;padding:14px 16px;scroll-snap-type:x mandatory}
.colonne{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:#e9eef4;border-radius:var(--r2);padding:8px}
.colonne h4{margin:4px 6px 8px;font-size:13.5px;display:flex;justify-content:space-between}
.colonne .ct{background:#fff;border-radius:10px;padding:10px;margin-bottom:6px;box-shadow:0 1px 1px rgba(0,30,70,.06);width:100%;text-align:left}
.colonne .ct .titre{font-weight:600;font-size:14px}
.membre-c{background:#fff;border:1px solid var(--trait);border-radius:var(--r2);padding:14px;width:100%;text-align:left}
.membre-c .tete{display:flex;gap:12px;align-items:center}
.membre-c .tete b{display:block;font-size:15.5px}
.membre-c .tete small{color:var(--gris)}
.membre-c .fiab{margin-left:auto;text-align:right}
.membre-c .fiab b{font-size:22px;font-weight:750}
.membre-c .fiab small{display:block;font-size:11.5px;color:var(--gris)}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.chiffres div{background:var(--fond);border-radius:8px;padding:7px 4px;text-align:center}
.chiffres b{display:block;font-size:17px;font-weight:750}
.chiffres small{font-size:11px;color:var(--gris)}
.chiffres .r b{color:var(--rouge)}
.mois-nav{display:flex;align-items:center;gap:6px;padding:12px 16px 0}
.mois-nav b{flex:1;text-align:center;font-size:16px;text-transform:capitalize}
.note-methode{margin:14px 16px;padding:12px 14px;background:#fff;border:1px solid var(--trait);border-radius:var(--r2);font-size:13px;color:var(--gris)}
.note-methode b{color:var(--encre)}
@media (min-width:960px){.mois-nav,.note-methode{margin-left:28px;margin-right:28px;padding-left:0;padding-right:0}.note-methode{padding:12px 14px}}

/* Boîte */
.notif{display:flex;gap:12px;padding:12px 16px;border-top:1px solid #edf1f6;width:100%;text-align:left;background:#fff}
.notif.nonlue{background:#f3f8ff}
.notif .pic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.notif .pic .ic{width:17px;height:17px}
.notif .t{font-size:14px;line-height:1.35}
.notif .q{font-size:12px;color:var(--gris-2);margin-top:3px}
.notif .point{width:9px;height:9px;border-radius:50%;background:var(--bleu);flex:none;margin-top:6px}

/* Connexion */
.connexion{min-height:100vh;background:var(--marine);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 40px) 20px 30px}
.connexion .logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.connexion .logo b{font-size:24px;font-weight:800;letter-spacing:.01em}
.connexion p.sous{color:#a9c4e6;margin:0 0 26px}
.connexion .boite{background:#fff;color:var(--encre);border-radius:var(--r3);width:100%;max-width:420px;padding:18px}
.connexion h2{margin:0 0 14px;font-size:17px}
.champ-code{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:700}
.l-cnx{display:block;font-size:13.5px;font-weight:650;color:var(--gris);margin-bottom:6px}
.connexion .pied{margin-top:auto;padding-top:24px;color:#8fb0d6;font-size:12.5px;text-align:center}

/* Divers */
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;
  background:#0e1a2b;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center;transition:.2s;pointer-events:none}
.toast.vu{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast.erreur{background:#8f1023}
.toast button{color:var(--jaune);font-weight:700}
@media (min-width:960px){.toast{bottom:28px}}
.charge{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--gris)}
.roue{width:22px;height:22px;border:3px solid #cfd8e3;border-top-color:var(--marine);border-radius:50%;animation:tour .8s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
.menu{position:fixed;z-index:60;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:230px;padding:6px;right:10px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:8px;text-align:left;font-weight:550}
.menu button:hover{background:#f2f5f9}
.menu button.danger{color:var(--rouge)}
.visionneuse{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
.visionneuse .haut{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;color:#fff}
.visionneuse .haut span{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visionneuse .img{flex:1;display:grid;place-items:center;overflow:auto;padding:10px}
.visionneuse img{max-width:100%;max-height:100%}
.hors-ligne{background:#8f1023;color:#fff;text-align:center;font-size:13px;padding:6px}
.sous-titre-page{padding:16px 16px 0;margin:0;font-size:13.5px;color:var(--gris)}
@media (min-width:960px){.sous-titre-page{padding:18px 28px 0}}

/* Impression du rapport */
#impression{display:none}
@media print{
  body{background:#fff}
  #app,.toast,.voile,.feuille,.menu{display:none!important}
  #impression{display:block;font-size:11.5pt;color:#000}
  #impression h1{font-size:18pt;margin:0 0 2pt}
  #impression h2{font-size:13pt;margin:16pt 0 4pt;border-bottom:1.5pt solid #003366;padding-bottom:2pt}
  #impression table{width:100%;border-collapse:collapse;margin-top:4pt}
  #impression th,#impression td{border-bottom:.5pt solid #bbb;padding:3pt 4pt;text-align:left;font-size:10pt}
  #impression .pm{page-break-inside:avoid}
}
</style>

const VERSION_APP = '1.2.1';
const MOTIF_API = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/;

const CLE = { jeton: 'fst_jeton', cache: 'fst_cache', dernier: 'fst_dernier', moi: 'fst_moi', api: 'fst_api_url' };
const lire = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const apiUrl = () => lire(CLE.api) || '';
const ecrire = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

const S = {

/* ── Outils ─────────────────────────────────────────────────── */
const $ = (s, r = document) => r.querySelector(s);
const e = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const JOURS_C = ['', 'L', 'M', 'M', 'J', 'V', 'S', 'D'];
const NOMS_JOURS = ['', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];

function jn(s) { const p = String(s).slice(0, 10).split('-').map(Number); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 864e5); }
function dj(n) { const d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
function jourSem(s) { return new Date(jn(s) * 864e5).getUTCDay(); }
function auj() { return (S.d && S.d.aujourdhui) || new Date().toISOString().slice(0, 10); }
function finSemaine(s) { const w = jourSem(s) || 7; return dj(jn(s) + 7 - w); }
function finMois(s) { const y = +s.slice(0, 4), m = +s.slice(5, 7); return s.slice(0, 8) + String(new Date(Date.UTC(y, m, 0)).getUTCDate()).padStart(2, '0'); }

function dateCourte(s) {
  if (!s) return '';
  const a = auj(), k = jn(s) - jn(a);
  if (k === 0) return "aujourd'hui";
  if (k === 1) return 'demain';
  if (k === -1) return 'hier';
  const d = new Date(jn(s) * 864e5);
  if (k > 1 && k < 7) return JOURS[d.getUTCDay()];
  return d.getUTCDate() + ' ' + MOIS_C[d.getUTCMonth()] + (s.slice(0, 4) !== a.slice(0, 4) ? ' ' + s.slice(0, 4) : '');

function quand(ts) {
  if (!ts) return '';
  const j = ts.slice(0, 10), h = ts.slice(11, 16);
  const dc = dateCourte(j);
  return (dc === "aujourd'hui" ? '' : dc + ' ') + h;
}
const COULEURS_AV = ['#1e6fd9', '#0b8a6a', '#b4469b', '#d9622b', '#5b5bd6', '#2c8fb3', '#9a6a00', '#c2364a', '#3e7d1f', '#7b4bb3'];
function couleurDe(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) | 0; return COULEURS_AV[Math.abs(h) % COULEURS_AV.length]; }
function initiales(nom) { const p = String(nom || '?').trim().split(/\s+/); return ((p[0] || '')[0] || '?').toUpperCase() + ((p[1] || '')[0] || '').toUpperCase(); }
function avatar(id, taille = '') { const n = nomDe(id); return `<span class="av ${taille}" style="background:${couleurDe(id)}" title="${e(n)}">${e(initiales(n))}</span>`; }
const membre = id => (S.d.equipe || []).find(m => m.user_id === id);
const nomDe = id => (membre(id) || {}).nom || id || '—';
const prenom = id => String(nomDe(id)).split(' ')[0];
const projet = id => (S.d.projets || []).find(p => p.projet_id === id);
const objectif = id => (S.d.objectifs || []).find(o => o.objectif_id === id);
const tache = id => (S.d.taches || []).find(t => t.tache_id === id);
const moi = () => S.d.moi;
const direction = () => ['admin', 'associe'].includes(moi().niveau);
const ouverte = t => t.statut === 'a_faire' || t.statut === 'en_cours';
const PRIO = { basse: 'Basse', normale: 'Normale', haute: 'Haute', urgente: 'Urgente' };
const NIV = { admin: 'Administrateur', associe: 'Associé', employe: 'Employé' };
const ETATS_O = { en_bonne_voie: 'En bonne voie', a_risque: 'À risque', en_retard: 'En retard', atteint: 'Atteint', abandonne: 'Abandonné' };

function libelleRep(r) {
  if (!r) return '';
  if (r.frequence === 'jour') return r.jours === '1,2,3,4,5,6,7' ? 'Chaque jour' : 'Chaque ' + r.jours.split(',').map(j => NOMS_JOURS[+j]).join(', ');
  if (r.frequence === 'semaine') return 'Chaque semaine, pour le ' + NOMS_JOURS[+r.jours];
  return 'Chaque mois, pour le ' + (r.jours === 'fin' ? 'dernier jour' : r.jours);
}
const recurrence = id => (S.d.recurrences || []).find(r => r.recurrence_id === id);

let minuterieToast;
function toast(msg, opts = {}) {
  const t = $('#toast');
  t.className = 'toast vu' + (opts.erreur ? ' erreur' : '');
  t.innerHTML = `<span>${e(msg)}</span>` + (opts.action ? `<button type="button">${e(opts.action)}</button>` : '');
  if (opts.action) t.querySelector('button').onclick = () => { t.className = 'toast'; opts.fn(); };
  clearTimeout(minuterieToast);
  minuterieToast = setTimeout(() => { t.className = 'toast'; }, opts.duree || (opts.action ? 5000 : 2800));
}

/* ── Serveur ─────────────────────────────────────────────────── */
async function api(action, donnees = {}) {
  const corps = Object.assign({ action, token: S.jeton }, donnees);
  let rep;
  if (window.FS_BACKEND) {
    rep = await window.FS_BACKEND(corps);
  } else {
    let r;
    try {
      if (!apiUrl()) { ecranServeur(); throw new Error('Adresse du serveur à saisir.'); }
      r = await fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corps), redirect: 'follow' });
    } catch (x) {
      throw new Error(navigator.onLine === false ? 'Pas de connexion internet.' : 'Serveur injoignable. Vérifie ta connexion.');
    }
    try { rep = await r.json(); } catch (x) { throw new Error('Réponse illisible du serveur (déploiement à vérifier).'); }
  }
  if (!rep.ok) {
    if (rep.code === 'SESSION' && action !== 'connexion') { deconnecter(rep.erreur); }
    const err = new Error(rep.erreur || 'Erreur inconnue.');
    err.code = rep.code;
    throw err;
  }
  return rep.data;
}

async function charger(silencieux) {
  if (S.chargement) return S.chargement;
  S.chargement = (async () => {
    try {
      const d = await api('charger');
      S.d = d;
      ecrire(CLE.cache, JSON.stringify(d));
      majBadge();
      rendre();
    } catch (x) {
      if (!silencieux && x.code !== 'SESSION') toast(x.message, { erreur: true });
    } finally { S.chargement = false; }
  })();
  return S.chargement;
}

/** Applique le retour d'une action tout de suite, puis resynchronise en fond. */
function integrer(r) {
  const ts = [].concat(r && r.tache ? [r.tache] : [], (r && r.etapes) || [], (r && r.renvoyees) || []);
  ts.forEach(t => {
    const i = S.d.taches.findIndex(x => x.tache_id === t.tache_id);
    if (i >= 0) S.d.taches[i] = t; else S.d.taches.push(t);
  });
  rendre();
  charger(true).then(() => rafraichirCalques());
}

async function agir(action, donnees, ok) {
  try {
    const r = await api(action, donnees);
    if (ok) toast(ok);
    return r;
  } catch (x) {
    if (x.code !== 'SESSION') toast(x.message, { erreur: true, duree: 4500 });
    throw x;
  }
}

function majBadge() {
  const n = (S.d && S.d.non_lues) || 0;
  document.querySelectorAll('[data-badge]').forEach(b => { b.textContent = n > 99 ? '99+' : n; b.classList.toggle('cache', !n); });
  try { if (navigator.setAppBadge) n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (x) {}
}

let minuteriePoll;
function demarrerPoll() {
  clearInterval(minuteriePoll);
  minuteriePoll = setInterval(async () => {
    if (document.hidden || !S.jeton || !S.d) return;
    try {
      const p = await api('poll');
      if (p.non_lues !== S.d.non_lues) { S.d.non_lues = p.non_lues; majBadge(); }
      if (p.version !== S.d.version) await charger(true);
    } catch (x) {}
  }, 60000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.jeton && S.d) charger(true); });

/* ── Connexion ───────────────────────────────────────────────── */
async function ecranConnexion(message) {
  fermerTousCalques();
  const dernier = lire(CLE.dernier) || '';
  $('#app').innerHTML = `<div class="connexion">
    <div class="logo"><svg width="44" height="44" style="color:#fff"><use href="#i-logo"/></svg><b>Flashipping</b></div>
    <p class="sous">Tâches de l'équipe</p>
    <form class="boite" id="f-connexion" novalidate>
      <h2>Connexion</h2>
      <label class="l-cnx" for="ident">Téléphone ou courriel</label>
      <input id="ident" class="inp" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="4331 4028 ou nom@exemple.com" value="${e(dernier)}">
      <label class="l-cnx" for="code" style="margin-top:14px">Code à 6 chiffres</label>
      <input id="code" class="inp champ-code" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" maxlength="6" placeholder="••••••">
      <p class="aide">Le même code que dans les apps Flashipping.</p>
      <button type="submit" class="btn primaire plein" id="go" style="margin-top:12px">Se connecter</button>
      ${message ? `<div class="alerte rouge" style="margin:12px 0 0">${ic('cadenas')}<span>${e(message)}</span></div>` : ''}
    </form>
    ${window.FS_BACKEND ? '' : '<button type="button" class="pied" id="chg-srv" style="background:none;color:#8fb0d6;text-decoration:underline">Changer l\'adresse du serveur</button>'}
    <div class="pied" style="margin-top:0;padding-top:8px">Pi rapid, pi sekirize, pi ba pri.</div>
  </div>`;
  if ($('#chg-srv')) $('#chg-srv').onclick = () => ecranServeur();
  const ident = $('#ident'), code = $('#code');
  (dernier ? code : ident).focus();
  let envoi = false;
  const go = async () => {
    if (envoi) return;
    const id = ident.value.trim(), c = code.value.replace(/\D/g, '');
    if (!id) { ident.focus(); return toast('Saisis ton téléphone ou ton courriel.', { erreur: true }); }
    if (c.length !== 6) { code.focus(); return toast('Le code a 6 chiffres.', { erreur: true }); }
    envoi = true; $('#go').disabled = true; $('#go').textContent = 'Connexion…';
    try {
      const r = await api('connexion', { identifiant: id, code: c });
      S.jeton = r.jeton; ecrire(CLE.jeton, r.jeton); ecrire(CLE.dernier, id);
      $('#app').innerHTML = `<div class="charge" style="min-height:100vh"><div class="roue"></div></div>`;
      if (location.hash !== '#/accueil') history.replaceState(null, '', '#/accueil');
      await charger();
      demarrerPoll();
    } catch (x) {
      toast(x.message, { erreur: true, duree: 4500 });
      envoi = false; $('#go').disabled = false; $('#go').textContent = 'Se connecter';
      code.value = ''; code.focus();
    }
  };
  $('#f-connexion').onsubmit = ev => { ev.preventDefault(); go(); };
  ident.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); code.focus(); } };
  code.oninput = () => {
    code.value = code.value.replace(/\D/g, '').slice(0, 6);
    if (code.value.length === 6 && ident.value.trim()) go();
  };
}

function deconnecter(message) {
  S.jeton = null; S.d = null; S.fils = {}; S.rapports = {};
  ecrire(CLE.jeton, null); ecrire(CLE.cache, null);
  clearInterval(minuteriePoll);
  try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch (x) {}
  ecranConnexion(message);
}

/* ── Charpente et navigation ─────────────────────────────────── */
const VUES = [
  { id: 'accueil', nom: 'Mes tâches', ic: 'taches' },
  { id: 'projets', nom: 'Projets', ic: 'projets' },
  { id: 'objectifs', nom: 'Objectifs', ic: 'cible' },
  { id: 'equipe', nom: 'Équipe', ic: 'equipe' }
];
function route() {
  const h = (location.hash || '#/accueil').slice(2).split('/');
  return { vue: h[0] || 'accueil', id: h[1] ? decodeURIComponent(h[1]) : null };
}

function charpente(titre, contenu, opts = {}) {
  const r = route();
  const actif = v => (r.vue === v || (v === 'projets' && r.vue === 'projet') || (v === 'equipe' && r.vue === 'membre') || (v === 'objectifs' && r.vue === 'objectif')) ? 'actif' : '';
  return `<aside class="lateral">
      <div class="marque"><svg width="30" height="30"><use href="#i-logo"/></svg>Flashipping Tâches</div>

      ${VUES.map(v => `<a href="#/${v.id}" class="${actif(v.id)}">${ic(v.ic)} ${v.nom}</a>`).join('')}
      <a href="#/boite" class="${actif('boite')}">${ic('cloche')} Boîte de réception <span class="pastille-nb cache" data-badge style="position:static;border:0;margin-left:auto"></span></a>
      <a href="#/reglages" class="${actif('reglages')}">${ic('reglages')} Réglages</a>
      <div class="bas">${e(moi().nom)}<br>${e(NIV[moi().niveau])}, v${VERSION_APP}</div>
    </aside>
    <div class="principal">
      ${navigator.onLine === false ? '<div class="hors-ligne">Hors ligne : affichage de la dernière version chargée.</div>' : ''}
      <header class="entete">
        ${opts.retour ? `<a class="btn-ic" href="${opts.retour}" aria-label="Retour">${ic('retour')}</a>` : ''}
        <h1>${e(titre)}</h1>
        ${opts.droite || ''}
        <a class="btn-ic" href="#/boite" aria-label="Boîte de réception">${ic('cloche')}<span class="pastille-nb cache" data-badge></span></a>
        <a class="btn-ic" href="#/reglages" aria-label="Réglages">${avatar(moi().user_id, 'p')}</a>
      </header>
      <main class="contenu"><div class="cadre">${contenu}</div></main>
    </div>
    <nav class="nav-bas">
      <a href="#/accueil" class="${actif('accueil')}">${ic('taches')}Tâches</a>
      <a href="#/projets" class="${actif('projets')}">${ic('projets')}Projets</a>
      <button class="fab" data-act="creer" aria-label="Nouvelle tâche">${ic('plus')}</button>
      <a href="#/objectifs" class="${actif('objectifs')}">${ic('cible')}Objectifs</a>
      <a href="#/equipe" class="${actif('equipe')}">${ic('equipe')}Équipe</a>
    </nav>`;
}

function rendre() {
  if (!S.d) return;
  const r = route();
  const pos = window.scrollY;
  const memeVue = S.derniereVue === location.hash;
  let html;
  switch (r.vue) {
    case 'projets': html = vueProjets(); break;
    case 'projet': html = vueProjet(r.id); break;
    case 'objectifs': html = vueObjectifs(); break;
    case 'equipe': html = vueEquipe(); break;
    case 'membre': html = vueMembre(r.id); break;
    case 'boite': html = vueBoite(); break;
    case 'reglages': html = vueReglages(); break;
    default: html = vueAccueil();
  }
  $('#app').innerHTML = html;
  majBadge();
  if (memeVue) window.scrollTo(0, pos); else window.scrollTo(0, 0);
  S.derniereVue = location.hash;
  if (r.vue === 'equipe' || r.vue === 'membre') chargerRapport();
}
window.addEventListener('hashchange', () => { if (S.d) rendre(); });
window.addEventListener('online', () => S.d && rendre());
window.addEventListener('offline', () => S.d && rendre());

/* ── Ligne de tâche ──────────────────────────────────────────── */
function trajetMini(t) {
  const etapes = S.d.taches.filter(x => x.parent_id === t.tache_id && x.statut !== 'annulee').sort((a, b) => a.ordre - b.ordre);
  if (!etapes.length) return '';
  const iCour = etapes.findIndex(x => x.statut !== 'terminee');
  return `<div class="trajet" aria-label="${t.nb_sous_terminees} étape(s) sur ${t.nb_sous_taches}">` + etapes.map((x, i) =>
    (i ? `<i class="${x.statut === 'terminee' ? 'ok' : ''}"></i>` : '') + `<b class="${x.statut === 'terminee' ? 'ok' : (i === iCour ? 'ici' : '')}"></b>`).join('')
    + `<small>${iCour < 0 ? 'Toutes les étapes faites' : 'Étape ' + (iCour + 1) + ' : ' + e(prenom(etapes[iCour].responsable_id))}</small></div>`;
}

function ligneTache(t, opts = {}) {
  const close = !ouverte(t);
  let cls = 'coche', contenu = ic('check');
  if (t.statut === 'terminee') cls += ' faite';
  else if (t.statut === 'manquee') { cls += ' manquee'; contenu = ic('x'); }
  else if (t.bloquee) { cls += ' bloquee'; contenu = ic('cadenas'); }
  else if (t.type === 'validation') { cls += ' validation'; contenu = ic('feu'); }
  else if (t.nb_sous_taches) cls += ' mere';
  const p = t.projet_id && projet(t.projet_id);
  const m = [];
  if (t.echeance) m.push(`<span class="${t.en_retard ? 'retard' : ''}">${ic('cal')}${e(dateCourte(t.echeance))}</span>`);
  if (p && !opts.sansProjet) m.push(`<span class="proj"><i style="background:${e(p.couleur)}"></i>${e(p.nom)}</span>`);
  if (t.parent_id && tache(t.parent_id) && !opts.sansParent) m.push(`<span>${ic('circuit')}${e(tache(t.parent_id).titre)}</span>`);
  if (t.recurrence_id) m.push(`<span title="${e(libelleRep(recurrence(t.recurrence_id)))}">${ic('repete')}</span>`);
  if (t.nb_preuves) m.push(`<span>${ic('trombone')}${t.nb_preuves}</span>`);
  if (t.priorite === 'haute' || t.priorite === 'urgente') m.push(`<span class="${t.priorite}">${ic('drapeau')}${PRIO[t.priorite]}</span>`);
  if (t.bloquee && t.bloquee_par[0]) m.push(`<span class="attente">${ic('cadenas')}attend ${e(prenom(t.bloquee_par[0].responsable_id))}</span>`);
  if (t.statut === 'manquee') m.push(`<span class="retard">Manquée</span>`);
  if (t.renvois && ouverte(t)) m.push(`<span class="retard">${ic('renvoi')}renvoyée</span>`);
  const montrerAv = opts.avatar || t.responsable_id !== moi().user_id;
  return `<div class="ligne ${close ? 'close' : ''}" data-tache="${e(t.tache_id)}" role="button" tabindex="0">
    <button class="${cls}" data-coche="${e(t.tache_id)}" aria-label="${t.statut === 'terminee' ? 'Terminée' : 'Terminer'} : ${e(t.titre)}">${contenu}</button>
    <div class="corps"><div class="titre">${e(t.titre)}</div>
      ${m.length ? `<div class="meta">${m.join('')}</div>` : ''}
      ${t.nb_sous_taches ? trajetMini(t) : ''}
    </div>
    ${montrerAv ? avatar(t.responsable_id) : ''}
  </div>`;
}

function groupe(titre, taches, opts = {}) {
  if (!taches.length && !opts.toujours) return '';
  const id = opts.id || '';
  const replie = opts.repliable && !S.vue['ouvert_' + id];
  return `<section class="groupe">
    <div class="groupe-titre ${opts.ton || ''}">${titre} <span class="nb">${taches.length}</span>
      ${opts.repliable ? `<button data-act="deplier" data-id="${id}">${replie ? 'Afficher' : 'Masquer'}</button>` : ''}</div>
    ${replie ? '' : `<div class="liste">${taches.map(t => ligneTache(t, opts)).join('')}</div>`}
  </section>`;
}

const triEcheance = (a, b) => (a.echeance || '9999').localeCompare(b.echeance || '9999') || ({ urgente: 0, haute: 1, normale: 2, basse: 3 }[a.priorite] - { urgente: 0, haute: 1, normale: 2, basse: 3 }[b.priorite]);

/* ── Accueil : mes tâches ────────────────────────────────────── */
function vueAccueil() {
  const a = auj(), fs = finSemaine(a), fm = finMois(a), u = moi().user_id, V = S.vue;
  const miennes = S.d.taches.filter(t => t.responsable_id === u && !t.nb_sous_taches);
  const ouvertes = miennes.filter(ouverte);
  const aValider = ouvertes.filter(t => t.type === 'validation' && !t.bloquee);
  const actives = ouvertes.filter(t => !t.bloquee && !(t.type === 'validation'));
  const attente = ouvertes.filter(t => t.bloquee);
  const retard = actives.filter(t => t.echeance && t.echeance < a);
  const ajd = actives.filter(t => t.echeance === a);
  const confiees = S.d.taches.filter(t => ouverte(t) && t.createur_id === u && (t.responsable_id !== u || t.nb_sous_taches) && !(t.parent_id && tache(t.parent_id) && tache(t.parent_id).createur_id === u));

  let corps = '';
  if (V.perimetre === 'confiees') {
    const parPers = {};
    confiees.sort(triEcheance).forEach(t => (parPers[t.responsable_id] = parPers[t.responsable_id] || []).push(t));
    corps = Object.keys(parPers).length ? Object.keys(parPers).map(uid => groupe(e(nomDe(uid)), parPers[uid], { avatar: true })).join('')
      : `<div class="vide">${ic('equipe')}<b>Rien de confié en cours</b>Les tâches et circuits que tu crées pour les autres apparaissent ici, avec leur avancement.</div>`;
  } else {
    const filtre = V.filtre;
    const horizon = { aujourdhui: a, semaine: fs, mois: fm, tout: '9999-12-31' }[V.horizon];
    const dansHorizon = t => !t.echeance ? V.horizon === 'tout' : t.echeance <= horizon;
    let liste = actives.filter(dansHorizon);
    if (filtre === 'retard') liste = retard;
    if (filtre === 'aujourdhui') liste = ajd;
    const g = {
      retard: liste.filter(t => t.echeance && t.echeance < a),
      ajd: liste.filter(t => t.echeance === a),
      sem: liste.filter(t => t.echeance > a && t.echeance <= fs),
      mois: liste.filter(t => t.echeance > fs && t.echeance <= fm),
      tard: liste.filter(t => t.echeance > fm),
      sans: liste.filter(t => !t.echeance)
    };
    Object.values(g).forEach(x => x.sort(triEcheance));
    const recentes = miennes.filter(t => t.statut === 'terminee' && t.terminee_le && jn(a) - jn(t.terminee_le) <= 2)
      .sort((x, y) => y.terminee_le.localeCompare(x.terminee_le));
    if (filtre === 'valider' || filtre === 'attente') liste = [];
    corps = (filtre === 'attente' ? '' : groupe('À valider', aValider, { ton: 'ambre' }))
      + (filtre === 'valider' ? '' : filtre === 'attente' ? groupe("En attente d'une autre étape", attente, { toujours: true })
        : groupe('En retard', g.retard, { ton: 'rouge' })
        + groupe("Aujourd'hui", g.ajd)
        + groupe('Cette semaine', g.sem)
        + groupe('Ce mois-ci', g.mois)
        + groupe('Plus tard', g.tard)
        + groupe('Sans échéance', g.sans)
        + (filtre ? '' : groupe("En attente d'une autre étape", attente, { repliable: true, id: 'attente' }))
        + (filtre ? '' : groupe('Terminées ces deux derniers jours', recentes, { repliable: true, id: 'recentes' })));
    const rien = !aValider.length && !liste.length && (filtre || !attente.length);
    if (rien && filtre !== 'attente' && filtre !== 'valider') {
      corps = `<div class="vide">${ic('taches')}<b>${V.horizon === 'aujourdhui' ? "Rien pour aujourd'hui" : 'Rien sur cette période'}</b>
        ${V.horizon !== 'tout' ? 'Regarde plus loin avec « Mois » ou « Tout », ou crée une tâche avec le bouton +.' : 'Crée une tâche avec le bouton +.'}</div>` + corps;
    }
  }

  const compteur = (cle, nb, lib, ton) => `<button class="compteur ${ton}" data-filtre="${cle}" aria-pressed="${V.filtre === cle}"><b>${nb}</b>${lib}</button>`;
  const bandeau = `<div class="bandeau">
      <div class="date">${e(dateLongue(a).replace(/^./, c => c.toUpperCase()))}</div>
      <div class="compteurs">
        ${compteur('retard', retard.length, 'en retard', retard.length ? 'rouge' : '')}
        ${compteur('aujourdhui', ajd.length, "aujourd'hui", '')}
        ${aValider.length ? compteur('valider', aValider.length, 'à valider', 'jaune') : ''}
        ${compteur('attente', attente.length, 'en attente', '')}
      </div>
    </div>`;
  const filtres = `<div class="barre-filtres">
      <div class="onglets-txt">

/* ── Projets ─────────────────────────────────────────────────── */

function vueProjet(id) {
  const p = projet(id);
  if (!p) return charpente('Projet', `<div class="vide"><b>Projet introuvable</b>Il a peut-être été retiré de ta vue.</div>`, { retour: '#/projets' });
  const a = auj();
  const ts = S.d.taches.filter(t => t.projet_id === id && t.statut !== 'annulee' && !(t.parent_id && tache(t.parent_id) && tache(t.parent_id).projet_id === id));
  const ong = S.vue.ongletProjet;
  const peutModifier = moi().niveau === 'admin' || p.responsable_id === moi().user_id || p.cree_par === moi().user_id;
  let corps;
  if (ong === 'tableau') {
    const col = (titre, liste) => `<div class="colonne"><h4>${titre}<span>${liste.length}</span></h4>${liste.map(t =>
      `<button class="ct" data-tache="${e(t.tache_id)}"><div class="titre">${e(t.titre)}</div><div class="meta" style="margin-top:6px">${t.echeance ? `<span class="${t.en_retard ? 'retard' : ''}">${ic('cal')}${e(dateCourte(t.echeance))}</span>` : ''}${t.nb_sous_taches ? `<span>${ic('circuit')}${t.nb_sous_terminees}/${t.nb_sous_taches}</span>` : ''}<span style="margin-left:auto">${avatar(t.responsable_id, 'p')}</span></div></button>`).join('')}</div>`;
    const o = ts.filter(ouverte);
    corps = `<div class="colonnes">
      ${col('À faire', o.filter(t => !t.bloquee && t.statut === 'a_faire').sort(triEcheance))}
      ${col('En cours', o.filter(t => !t.bloquee && t.statut === 'en_cours').sort(triEcheance))}
      ${col('En attente', o.filter(t => t.bloquee))}
      ${col('Terminées', ts.filter(t => t.statut === 'terminee').sort((x, y) => (y.terminee_le || '').localeCompare(x.terminee_le || '')))}
    </div>`;
  } else if (ong === 'infos') {
    const o = p.objectif_id && objectif(p.objectif_id);
    corps = `<div class="section"><div class="champs" style="margin:0">
      <div class="champ"><span class="lib">Responsable</span><span class="val">${avatar(p.responsable_id, 'p')} ${e(nomDe(p.responsable_id))}</span></div>
      <div class="champ"><span class="lib">Visible par</span><span class="val">${{ tous: "Toute l'équipe", associes: 'Les associés', membres: 'Les membres seulement' }[p.visibilite]}</span></div>
      <div class="champ"><span class="lib">Membres</span><span class="val">${p.membres.length ? p.membres.map(m => avatar(m, 'p')).join('') : '<span class="muet">—</span>'}</span></div>
      <div class="champ"><span class="lib">Objectif</span><span class="val ${o ? '' : 'muet'}">${o ? e(o.titre) : 'Aucun'}</span></div>
      <div class="champ"><span class="lib">Description</span><span class="val" style="font-weight:450;white-space:pre-wrap">${e(p.description || '—')}</span></div>
    </div>
    ${peutModifier ? `<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-act="modifier-projet" data-id="${e(id)}">${ic('crayon')}Modifier</button>
      <button class="btn" data-act="archiver-projet" data-id="${e(id)}">${p.statut === 'archive' ? 'Réactiver' : 'Archiver'}</button></div>` : ''}</div>`;
  } else {
    const o = ts.filter(ouverte).sort(triEcheance);
    const hist = S.historiques[id];
    corps = groupe('En retard', o.filter(t => t.echeance && t.echeance < a), { ton: 'rouge', sansProjet: true, avatar: true })
      + groupe('À faire', o.filter(t => !(t.echeance && t.echeance < a)), { sansProjet: true, avatar: true, toujours: true })
      + groupe('Terminées', ts.filter(t => t.statut === 'terminee').sort((x, y) => (y.terminee_le || '').localeCompare(x.terminee_le || '')), { sansProjet: true, avatar: true, repliable: true, id: 'term_' + id })
      + `<div class="bloc" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" data-act="creer" data-projet="${e(id)}">${ic('plus')}Ajouter une tâche</button>
          ${hist ? '' : `<button class="btn discret" data-act="historique-projet" data-id="${e(id)}">Voir les tâches plus anciennes</button>`}

      <div class="jauge" style="background:rgba(255,255,255,.15);margin-top:10px"><i style="width:${p.progression}%;background:var(--jaune)"></i></div>
    </div>

      ${[['liste', 'Liste'], ['tableau', 'Tableau'], ['infos', 'Infos']].map(([k, l]) => `<button data-ongletp="${k}" aria-pressed="${ong === k}">${l}</button>`).join('')}
    </div></div>`;
  return charpente(p.nom, tete + corps, { retour: '#/projets' });
}

/* ── Objectifs ───────────────────────────────────────────────── */
function anneau(o) {
  const c = { a_risque: '#e0a400', en_retard: 'var(--rouge)', atteint: 'var(--bleu)', abandonne: '#aaa' }[o.etat] || 'var(--vert)';
  return `<div class="anneau" style="--p:${o.progression};--ca:${c}"><span>${o.progression}%</span></div>`;
}
/** Un objectif qui n'a pas commencé n'est ni en bonne voie ni en retard : il est à venir. */
function aVenir(o) { return !!o.debut && o.debut > auj() && !o.dernier_point; }
function carteObjectif(o, enfant) {
  const mesure = o.mesure === 'valeur' ? `${e(o.valeur_actuelle || 0)} / ${e(o.cible)} ${e(o.unite || '')}`
    : o.mesure === 'sous_objectifs' ? 'Moyenne des sous-objectifs' : `${o.nb_terminees} / ${o.nb_taches} tâches`;
  return `<button class="obj ${enfant ? 'enfant' : ''}" data-objectif="${e(o.objectif_id)}">
    ${anneau(o)}
    <div style="min-width:0;flex:1"><h3>${e(o.titre)}</h3>
      <div class="s">${aVenir(o) ? `<span class="pil abandonne">À venir, dès ${e(dateCourte(o.debut))}</span>` : `<span class="pil ${o.etat}">${ETATS_O[o.etat]}</span>`}<span>${e(mesure)}</span>
      ${o.fin ? `<span>${ic('cal')} ${e(dateCourte(o.fin))}</span>` : ''}</div>
      <div class="s">${avatar(o.responsable_id, 'p')} ${e(nomDe(o.responsable_id))}</div>
    </div></button>`;
}
function vueObjectifs() {
  const tous = S.d.objectifs;
  const racines = tous.filter(o => !o.parent_id || !objectif(o.parent_id));
  const arbre = racines.map(o => carteObjectif(o) + tous.filter(x => x.parent_id === o.objectif_id).map(x => carteObjectif(x, true)).join('')).join('');
  const contenu = tous.length ? `<div class="grille" style="grid-template-columns:1fr">${arbre}</div>`
    : `<div class="vide">${ic('cible')}<b>Aucun objectif fixé</b>${direction() ? 'Fixe un objectif chiffré (ex. 1000 colis par mois) ou un objectif suivi par ses tâches, puis rattache-lui des projets.' : "Les objectifs de l'équipe apparaîtront ici."}</div>`;
  return charpente('Objectifs', contenu, { droite: direction() ? `<button class="btn-ic" data-act="nouvel-objectif" aria-label="Nouvel objectif">${ic('plus')}</button>` : '' });
}

/* ── Équipe et rapport du mois ───────────────────────────────── */
function moisCourant() { return S.vue.mois || auj().slice(0, 7); }
function libMois(m) { return MOIS[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4); }
function decalerMois(m, k) { let y = +m.slice(0, 4), mo = +m.slice(5, 7) + k; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; } return y + '-' + String(mo).padStart(2, '0'); }
async function chargerRapport(force) {
  const m = moisCourant();
  if (S.rapports[m] && !force) return;
  S.rapports[m] = 'charge';
  try { S.rapports[m] = await api('rapport', { mois: m }); }
  catch (x) { S.rapports[m] = null; toast(x.message, { erreur: true }); }
  const r = route();
  if (r.vue === 'equipe' || r.vue === 'membre') rendre();
}
function fiab(v) { return v === null || v === undefined ? '—' : v + ' %'; }
function couleurFiab(v) { return v === null ? 'var(--gris)' : v >= 85 ? 'var(--vert)' : v >= 60 ? '#b07800' : 'var(--rouge)'; }
function vueEquipe() {
  const m = moisCourant(), r = S.rapports[m];
  const nav = `<div class="mois-nav"><button class="btn-ic" data-mois="-1" aria-label="Mois précédent" style="color:var(--marine)">${ic('retour')}</button>
    <b>${libMois(m)}</b><button class="btn-ic" data-mois="1" aria-label="Mois suivant" style="color:var(--marine);transform:scaleX(-1)">${ic('retour')}</button></div>`;
  let corps;
  if (!r || r === 'charge') corps = `<div class="charge"><div class="roue"></div></div>`;
  else {
    corps = `<div class="grille">${r.membres.map(x => `<button class="membre-c" onclick="location.hash='#/membre/${e(x.user_id)}'">
      <div class="tete">${avatar(x.user_id, 'g')}<div><b>${e(x.nom)}</b><small>${e(x.fonction || NIV[(membre(x.user_id) || {}).niveau] || '')}</small></div>
        <div class="fiab"><b style="color:${couleurFiab(x.fiabilite)}">${fiab(x.fiabilite)}</b><small>à temps</small></div></div>
      <div class="chiffres">
        <div><b>${x.terminees}</b><small>terminées</small></div>
        <div class="${x.ouvertes_en_retard ? 'r' : ''}"><b>${x.ouvertes_en_retard}</b><small>en retard</small></div>
        <div class="${x.manquees ? 'r' : ''}"><b>${x.manquees}</b><small>manquées</small></div>
        <div><b>${x.renvois}</b><small>renvois</small></div>
      </div></button>`).join('')}</div>
      <div class="note-methode"><b>Comment lire ces chiffres.</b> « À temps » : part des tâches du mois, déjà échues ou terminées, faites au plus tard le jour prévu. Une tâche répétitive non faite à son échéance compte comme manquée. Un renvoi est un travail refusé à la validation. Les circuits comptent étape par étape. Ce sont des faits enregistrés, sans pondération.</div>`;
  }
  const droite = `<button class="btn-ic" data-act="imprimer" aria-label="Imprimer le rapport">${ic('imprimer')}</button>`
    + (moi().niveau === 'admin' ? `<button class="btn-ic" data-act="gerer-equipe" aria-label="Gérer l'équipe">${ic('reglages')}</button>` : '');
  return charpente(direction() ? 'Équipe' : 'Mon rapport', nav + corps, { droite });
}
function vueMembre(uid) {
  const m = moisCourant(), r = S.rapports[m];

  if (!x) corps += `<div class="charge"><div class="roue"></div></div>`;
  else {

      <div class="fiab"><b style="color:${couleurFiab(x.fiabilite)}">${fiab(x.fiabilite)}</b><small>à temps (${x.a_temps_echues} sur ${x.echues})</small></div></div>
      <div class="chiffres">

    const lignes = x.liste.map(t => `<div class="ligne ${t.statut !== 'a_faire' && t.statut !== 'en_cours' ? 'close' : ''}" data-tache="${e(t.tache_id)}" role="button" tabindex="0">

        ${t.echeance ? `<span>${ic('cal')}${e(dateCourte(t.echeance))}</span>` : ''}
        ${t.statut === 'terminee' ? `<span style="color:${t.a_temps ? 'var(--vert)' : 'var(--rouge)'}">${t.a_temps ? 'à temps' : 'en retard'}</span>` : ''}
