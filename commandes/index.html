      h += '<div class="titre-section">Marge réelle par commande</div>';
      h += d.commandes.map(function (c) {
        totalMarge += Number(c.marge_reelle_usd);

function validerRattacher(depotId, commandeId) {

          parDepot < 2 ? 'attention' : 'ok', parDepot < 2 ? '⚠️' : '✅') +

    h += '<div class="titre-section">Simuler une recharge</div>' +

        bloc('Tu recharges la carte d\'un montant donné. Les frais portent sur ' +
             'cette recharge entière, puis se répartissent entre les seules ' +
             'commandes rattachées. Moins tu en rattaches, plus chacune en porte.',
             'info', '🧮') +
        '<label class="champ"><span>Montant de la recharge ($)</span>' +
          '<input type="number" id="s-recharge" step="10" inputmode="decimal" ' +
          'value="300" oninput="simulerGroupage()"></label>' +
        '<div class="duo">' +
          '<label class="champ"><span>Panier moyen ($)</span>' +
            '<input type="number" id="s-panier" step="5" inputmode="decimal" ' +

    poser(h);

/** Taux de frais pour un montant, lu dans les paliers réels de Tarifs_Depot. */
function tauxDepotPour(montant) {
  var tarifs = (Etat.ref && Etat.ref.tarifs_depot) || [];
  for (var i = 0; i < tarifs.length; i++) {
    var min = Number(tarifs[i].min_usd) || 0;
    var brut = tarifs[i].max_usd;
    var max = (brut === '' || brut === null || brut === undefined)
      ? Infinity : Number(brut);
    if (montant >= min && montant < max) return Number(tarifs[i].taux) || 0;
  }
  return 0;
}

/**
 * Le vrai levier n'est pas « grouper fait baisser le pourcentage » — la
 * quote-part est proportionnelle au panier, donc à paliers égaux chaque
 * commande porte le même taux. Le levier, c'est que les frais sont
 * calculés sur la RECHARGE, pas sur les paniers rattachés : recharger
 * 300 $ et n'y rattacher qu'une commande de 75 $ fait porter à cette
 * seule commande les frais des 300 $.
 */
function simulerGroupage() {
  var z = document.getElementById('s-res');
  if (!z) return;

  var recharge = Number(document.getElementById('s-recharge').value) || 0;
  var panier = Number(document.getElementById('s-panier').value) || 0;
  var taux = (Number(document.getElementById('s-taux').value) || 0) / 100;

  if (recharge <= 0 || panier <= 0) { z.innerHTML = ''; return; }

  var tDepot = tauxDepotPour(recharge);
  var frais = recharge * tDepot;
  var commission = panier * taux;
  var maxN = Math.max(1, Math.floor(recharge / panier));

  var h = '<div class="total"><span class="l">Frais sur ' + usd(recharge) +
      ' (' + pct(tDepot) + ')</span><b style="color:var(--rouge)">' +
      usd(frais) + '</b></div>' +
    '<div class="total"><span class="l">Frais encaissés par commande</span><b>' +
      usd(commission) + '</b></div>' +
    '<div class="titre-section">Marge de chaque commande</div>';

  var seuil = null;
  var ns = [];
  for (var n = 1; n <= Math.min(maxN, 8); n++) ns.push(n);
  if (maxN > 8) ns.push(maxN);

  ns.forEach(function (n) {
    var quote = frais / n;                 // paniers égaux : part identique
    var marge = commission - quote;
    if (seuil === null && marge >= 0) seuil = n;
    var neg = marge < 0;
    h += '<div class="total"><span class="l">' + n + ' commande' +
      (n > 1 ? 's' : '') + ' rattachée' + (n > 1 ? 's' : '') +
      '</span><span style="font-weight:800;color:' +
      (neg ? 'var(--rouge)' : 'var(--vert)') + '">' +
      (neg ? '' : '+') + n2(marge) + ' $</span></div>';
  });

  if (tDepot === 0) {
    h += bloc('Aucun palier de frais n\'est défini dans Tarifs_Depot : la ' +
              'simulation suppose 0 % de frais, donc une marge toujours égale ' +
              'à la commission. Renseigne tes vrais paliers pour que ce ' +
              'tableau serve à quelque chose.', 'attention', '⚠️');
  } else if (seuil === null) {
    h += bloc('À ce taux, même en remplissant la recharge, chaque commande ' +
              'reste perdante. Il faut soit remonter les frais client, soit ' +
              'trouver un moyen de dépôt moins cher.', 'ko', '⚠️');
  } else {
    h += bloc('Il faut ' + seuil + ' commande' + (seuil > 1 ? 's' : '') +
              ' rattachée' + (seuil > 1 ? 's' : '') + ' à cette recharge pour ' +
              'que chacune devienne rentable. En dessous, tu paies pour ' +
              'travailler.' +
              (maxN > seuil
                ? ' La recharge peut en porter ' + maxN + ' : attends d\'en ' +
                  'avoir assez avant de recharger.'
                : ''),
              seuil === 1 ? 'ok' : 'attention', seuil === 1 ? '✅' : '💡');
  }
  z.innerHTML = h;
}

/**
 * Le contrôle de version.
 *
 * Un backend non redéployé, ou un fichier .gs oublié au copier-coller,
 * donne des symptômes incompréhensibles : une action qui répond
 * « inconnue », un écran vide, un champ qui ne s'enregistre pas. Cette
 * vérification transforme tout ça en une phrase claire.
 */
var VERSION_ATTENDUE = '2026-11-28.1';

function verifierVersion() {
  return api('diag').then(function (d) {
    var dep = String(d.version_code || '');
    Etat.versionBackend = dep || '(ancienne)';
    Etat.versionOk = (dep === VERSION_ATTENDUE);
    return Etat.versionOk;
  }).catch(function () { return null; });
}

function blocVersion() {
  if (Etat.versionOk === undefined) {
    // Réponse pas encore arrivée : on la demande et on repeint à son retour.
    verifierVersion().then(function (r) {
      if (r !== null && document.getElementById('voile')) ouvrirReglages();
    });
    return '<div style="text-align:center;color:var(--doux);font-size:11.5px;' +
      'margin-top:14px">Vérification de la version…</div>';
  }
  if (Etat.versionOk) {
    return '<div style="text-align:center;color:var(--doux);font-size:11.5px;' +
      'margin-top:14px">Code déployé ' + e(Etat.versionBackend) + ' — à jour</div>';
  }
  return bloc('Le code déployé dans Apps Script (' + Etat.versionBackend + ') ne ' +
    'correspond pas à cette application (' + VERSION_ATTENDUE + '). Il manque un ' +
    'fichier .gs, ou le déploiement n\'a pas été refait en « Nouvelle version ». ' +
    'Certaines fonctions ne marcheront pas.', 'attention', '⚠️');
}

function modale(titre, html) {
  var dejaOuverte = Nav.modaleOuverte;
  fermerModaleDom();

  /* Le clavier doit disparaître AVANT que la fiche s'ouvre.

     Un élément en position:fixed se cale sur la fenêtre de mise en
     page, pas sur ce qu'il reste de visible. Clavier ouvert, le
     panneau — collé en bas — se range donc DERRIÈRE le clavier : rien
     ne bouge à l'écran, et le bouton passe pour mort. L'onglet Clients
     donne le focus au champ de recherche en arrivant, donc le clavier
     est ouvert précisément là où on va chercher l'engrenage. */
  try {
    var actif = document.activeElement;
    if (actif && actif !== document.body && typeof actif.blur === 'function') {
      actif.blur();
    }
  } catch (eb) {}
  var v = document.createElement('div');
  v.className = 'voile'; v.id = 'voile';
  v.innerHTML = '<div class="modale" onclick="event.stopPropagation()">' +
    '<div class="poignee"></div><h3>' + e(titre) + '</h3>' +
    '<div id="corps-modale">' + html + '</div></div>';
  /* Le geste qui OUVRE ne doit pas refermer.

     Sur mobile, le clic de synthèse qui suit le doigt est remis à
     l'élément présent sous le point touché AU MOMENT où il part —
     c'est-à-dire au voile qu'on vient d'insérer. Et comme le panneau
     est collé en bas, tout le haut de l'écran est du voile : un bouton
     d'en-tête refermait donc la fiche dans la même fraction de
     seconde. Symptôme vu par l'agent : « je clique, rien ne se passe ».

     On ignore les clics sur le voile le temps que ce fantôme puisse
     encore arriver. Fermer au doigt reste possible juste après. */
  var ouvertA = Date.now();
  v.onclick = function () {
    if (Date.now() - ouvertA < 400) return;
    fermerModale();
  };
  document.body.appendChild(v);
  document.body.style.overflow = 'hidden';
  Nav.modaleOuverte = true;
  if (!dejaOuverte) { try { history.pushState({ modale: true }, ''); } catch (e) {} }
}
function majModale(titre, html) {
  var c = document.getElementById('corps-modale');
  var t = document.querySelector('.modale h3');
  if (c) { c.innerHTML = html; if (t) t.textContent = titre; }
  else modale(titre, html);
}
/** Ferme sans toucher à l'historique — réservé à popstate. */
function fermerModaleDom() {
  var v = document.getElementById('voile');
  if (v) v.remove();
  document.body.style.overflow = '';
  Nav.modaleOuverte = false;
}
function fermerModale() {
  if (Nav.modaleOuverte) {
    Nav.modaleOuverte = false;
    fermerModaleDom();
    try { history.back(); } catch (e) {}
    return;
  }
  fermerModaleDom();
}

function chargerDemandes() {
  var z = document.getElementById('liste-dem');
  if (!z) return;
  z.innerHTML = chargement();

  api('cpm_lister', { statut: FiltreDem.statut, q: FiltreDem.q, du: FiltreDem.du,
                      au: FiltreDem.au, limite: 200 }).then(function (d) {

    var enCours = 0;
    Object.keys(cpt).forEach(function (k) {
      if (k !== 'livree' && k !== 'annulee') enCours += cpt[k];
    });
    var p = document.getElementById('dm-puces');
    if (p) {
      p.innerHTML =
        '<button class="puce ' + (FiltreDem.statut === 'en_cours' ? 'actif' : '') +

          '" onclick="filtreDem(\'\')">Toutes</button>' +
        STATUTS_DEM.map(function (s) {
          var n = cpt[s.code] || 0;
          if (!n && FiltreDem.statut !== s.code) return '';
          return '<button class="puce ' + (FiltreDem.statut === s.code ? 'actif' : '') +
            '" onclick="filtreDem(\'' + s.code + '\')">' + e(s.libelle) + ' · ' + n + '</button>';
        }).join('');

    if (!d.demandes.length) { z.innerHTML = vide('🌐', 'Aucune demande ici.'); return; }

      '<div style="margin-top:5px">' + puceDem(x.statut_affiche) +
        (action ? ' <span class="badge">' + action + '</span>' : '') + '</div>' +

    '<div class="droite">' +

      (x.commande_id ? '<div style="font-size:11.5px;color:var(--doux)">' +
        e(x.commande_id) + '</div>' : '') +

// ── Détail ─────────────────────────────────────────────────────────

function ouvrirDemande(id) {
  modale('Demande', chargement());
  api('cpm_detail', { demande_id: id }).then(function (d) {
    Dem.detail = d;
    Dem.prix = {};
    d.articles.forEach(function (a) {
      Dem.prix[a.article_id] = {
        prix_unitaire_usd: a.prix_unitaire_usd || '',
        livraison_vendeur_usd: a.livraison_vendeur_usd || '',
        taxes_vendeur_usd: a.taxes_vendeur_usd || '',
        poids_estime_lb: a.poids_estime_lb || '',
        quantite: estPanierDem(a) ? 1 : a.quantite || 1,
        statut_article: a.statut_article === 'indisponible' ? 'indisponible' : 'disponible'
      };
    });
    /* Le mode : celui de la demande ; sinon celui de sa facture ; sinon
       « au total du vendeur », la façon de travailler de l'équipe. */
    var dm = d.demande;
    Dem.mode = dm.chiffrage_mode || (d.facture && d.facture.mode_chiffrage) || 'total';
    Dem.recap = {
      total_vendeur_usd: dm.total_vendeur_usd || '',
      nb_articles_vendeur: dm.nb_articles_vendeur || '',
      poids_total_lb: dm.poids_total_lb || ''
    };
    Dem.recapIds = (dm.recap_ids || []).slice();
    if (Dem.recapDe !== dm.demande_id) { Dem.recapImg = {}; Dem.recapDe = dm.demande_id; }
    majModale(d.demande.demande_id, htmlDemande(d));
    chargerRecapsDem();
    chargerDepotsDem();
  }).catch(function (err) { majModale('Demande', erreurDem(err)); });
}

function rechargerDemande() {
  if (Dem.detail) ouvrirDemande(Dem.detail.demande.demande_id);
  if (Etat.onglet === 'demandes') chargerDemandes();
}

function peutSaisir() {
  return !!(Etat.user && Etat.user.droits && Etat.user.droits.saisir_commande);
}

function htmlDemande(d) {
  var dm = d.demande, st = dm.statut_affiche;
  var iCourant = PARCOURS_DEM.indexOf(st === 'facture_expiree' ? 'facture_envoyee' : st);
  var h = '';

  // ── En-tête ──
  h += '<div style="margin-bottom:10px">' +
    '<div style="font-weight:800;font-size:17px">' + e(dm.nom_complet) + '</div>' +
    '<div style="color:var(--doux);font-size:13px;margin:2px 0 8px">' +
      e(dm.demande_id) + ' · reçue le ' + dateCourte(dm.date) + ' · retrait ' + e(dm.ville) + '</div>' +
    puceDem(st) + '</div>';

  if (st !== 'annulee') {
    h += '<div class="jalons">' + PARCOURS_DEM.map(function (c, i) {
      return '<div class="jalon ' + (i < iCourant ? 'faite' : (i === iCourant ? 'ici' : '')) +
        '"><div class="pt"></div></div>';
    }).join('') + '</div>';
  }

  (d.alertes || []).forEach(function (a) { h += bloc(a, 'attention', '⚠️'); });

  // ── Prévenir le client, pour l'étape en cours ──
  var cleMsg = MESSAGE_DEM[st];
  if (cleMsg && d.liens_whatsapp[cleMsg]) {
    h += '<a class="btn vert" href="' + e(d.liens_whatsapp[cleMsg]) + '" target="_blank" ' +
      'rel="noopener" onclick="notePrevenu(\'' + e(dm.demande_id) + '\',\'' + e(st) + '\')">' +
      '📲 Prévenir le client — ' + e(infoDem(st).libelle) + '</a>';
  }

  // ── Client ──
  h += '<div class="titre-section">Client</div>' +
    '<div class="carte serree">' +
      '<div class="total"><span class="l">WhatsApp</span><a href="https://wa.me/' +
        e(dm.whatsapp_international) + '" target="_blank" rel="noopener">' +
        e(dm.whatsapp) + '</a></div>' +
      (dm.email ? '<div class="total"><span class="l">Courriel</span><span>' + e(dm.email) +
        '</span></div>' : '') +
      '<div class="total"><span class="l">Notification équipe</span><span style="font-size:12px">' +
        'Telegram ' + e(dm.notif_telegram || '—') + '</span></div>' +
    '</div>' + htmlClientDem(d);

  // ── Articles et chiffrage ──
  h += htmlArticlesDem(d);

  // ── Facture ──
  if (d.facture) h += htmlFactureDem(d);

  // ── Paiements ──
  h += htmlPaiementsDem(d);

  // ── Commande, achat, réception ──
  h += htmlSuiteDem(d);

  // ── Note interne ──
  h += '<div class="titre-section">Note interne</div>' +
    (dm.note_interne ? '<div class="carte serree" style="white-space:pre-wrap;font-size:13px">' +
      e(dm.note_interne) + '</div>' : '') +
    (peutSaisir() ? '<div class="duo"><input type="text" id="dm-note" placeholder="Ajouter une note">' +
      '<button class="btn vide petit" style="flex:0 0 auto;width:auto" ' +
      'onclick="noterDem(\'' + e(dm.demande_id) + '\')">Ajouter</button></div>' : '');

  // ── Historique ──
  h += '<div class="titre-section">Historique</div>' +
    d.historique.slice().reverse().map(function (x) {
      var change = x.nouveau && x.nouveau !== x.ancien;
      return '<div style="padding:8px 2px;border-bottom:1px solid var(--bord);font-size:12.5px">' +
        '<div style="color:var(--doux)">' + dateHeureDem(x.date) + ' · ' + e(x.par || '—') + '</div>' +
        (change ? '<div style="margin:3px 0">' + (x.ancien ? puceDem(x.ancien) + ' → ' : '') +
          puceDem(x.nouveau) + '</div>' : '') +
        '<div>' + e(x.detail) + '</div></div>';
    }).join('');

  // ── Annuler ──
  if (peutSaisir() && ['nouvelle', 'facture_envoyee', 'facture_expiree', 'paiement_declare',
                       'payee'].indexOf(st) !== -1) {
    h += '<button class="btn rouge" style="margin-top:14px" onclick="ouvrirAnnulerDem(\'' +
      e(dm.demande_id) + '\',\'' + e(st) + '\')">Annuler la demande</button>';
  }
  return h;
}

function dateHeureDem(d) {
  if (!d) return '';
  var x = new Date(d);
  if (isNaN(x)) return '';
  return dateCourte(d) + ' ' + ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2);
}

function notePrevenu(id, etape) {
  api('cpm_prevenu', { demande_id: id, etape: etape }).catch(function () {});
}

function noterDem(id) {
  var z = document.getElementById('dm-note');
  if (!z || !z.value.trim()) return;
  api('cpm_noter', { demande_id: id, note: z.value.trim() }).then(function () {
    toast('Note ajoutée.', 'ok'); rechargerDemande();
  }).catch(function (err) { toast(err.message, 'ko'); });
}


// ── Fiche client ───────────────────────────────────────────────────

function htmlClientDem(d) {
  var dm = d.demande;
  if (d.client) {
    return '<div class="ligne"><div class="corps"><div class="t1">👤 ' + e(d.client.nom_complet) +
      '</div><div class="t2">' + e(d.client.client_id) + ' · ' + e(d.client.code_client) +
      '</div></div><div class="droite"><span class="badge ok">fiche reliée</span></div></div>';
  }
  if (dm.commande_id || !peutSaisir()) return '';

  var morceaux = dm.nom_complet.split(/\s+/);
  var prenom = morceaux.shift() || '', nom = morceaux.join(' ');

  return bloc('Relie la demande à une fiche client avant d\'encaisser : c\'est elle qui ' +
              'portera la commande, le koli et la facture de transport.', 'info', '👤') +
    (d.suggestions.length
      ? '<div class="suggestions">' + d.suggestions.map(function (c) {
          return '<button onclick="lierClientDem(\'' + e(dm.demande_id) + '\',\'' +
            e(c.client_id) + '\')"><b>' + e(c.nom_complet) + '</b> · ' + e(c.client_id) +
            '<div style="font-size:12px;color:var(--doux)">' + e(c.telephone) + ' · ' +
            e(c.ville) + ' — même numéro</div></button>';
        }).join('') + '</div>'
      : '') +
    '<label class="champ"><span>Chercher une fiche</span><input type="text" id="dm-cli" ' +
      'placeholder="Nom, code ou téléphone" oninput="chercherClientDem(\'' +
      e(dm.demande_id) + '\')"></label><div id="dm-cli-sugg"></div>' +
    '<div class="duo"><label class="champ"><span>Prénom</span><input type="text" id="dm-prenom" ' +
      'value="' + e(prenom) + '"></label><label class="champ"><span>Nom</span>' +
      '<input type="text" id="dm-nom" value="' + e(nom) + '"></label></div>' +
    '<button class="btn vide" onclick="creerClientDem(\'' + e(dm.demande_id) + '\')">' +

var minuteurCliDem = null;
function chercherClientDem(id) {
  clearTimeout(minuteurCliDem);
  var q = document.getElementById('dm-cli').value.trim();
  var z = document.getElementById('dm-cli-sugg');
  if (q.length < 2) { z.innerHTML = ''; return; }
  minuteurCliDem = setTimeout(function () {
    api('client_chercher', { q: q }).then(function (liste) {
      z.innerHTML = liste.length ? '<div class="suggestions">' + liste.map(function (c) {
        return '<button onclick="lierClientDem(\'' + e(id) + '\',\'' + e(c.client_id) + '\')"><b>' +
          e(c.nom_complet) + '</b> · ' + e(c.client_id) + '<div style="font-size:12px;' +
          'color:var(--doux)">' + e(c.telephone || '') + ' · ' + e(c.ville || '') + '</div></button>';
      }).join('') + '</div>' : bloc('Aucune fiche.', 'info', '🔍');
    }).catch(function (err) { z.innerHTML = bloc(err.message, 'ko', '❌'); });
  }, 300);
}

function lierClientDem(id, clientId) {
  api('cpm_client_lier', { demande_id: id, client_id: clientId }).then(function () {
    toast('Fiche reliée.', 'ok'); rechargerDemande();
  }).catch(function (err) { toast(err.message, 'ko'); });
}

function creerClientDem(id) {
  api('cpm_client_lier', {
    demande_id: id, creer: true,
    prenom: document.getElementById('dm-prenom').value.trim(),
    nom: document.getElementById('dm-nom').value.trim()
  }).then(function (r) {
    toast('Fiche ' + r.client_id + ' créée et reliée.', 'ok'); rechargerDemande();
  }).catch(function (err) { toast(err.message, 'ko'); });
}


// ── Articles et chiffrage ──────────────────────────────────────────

function chiffrable(st) {
  return ['nouvelle', 'facture_envoyee', 'facture_expiree'].indexOf(st) !== -1 && peutSaisir();
}

/* Un panier partagé en entier : le client a déjà choisi tailles, couleurs
   et quantités chez le vendeur. Il se chiffre d'un bloc — le prix du
   panier, le poids du panier — et sa quantité reste 1. */
function estPanierDem(a) { return a && a.type_article === 'panier'; }

function compterDem(articles) {
  var p = articles.filter(estPanierDem).length, a = articles.length - p, m = [];
  if (a) m.push(a + ' article' + (a > 1 ? 's' : ''));
  if (p) m.push(p + ' panier' + (p > 1 ? 's' : ''));
  return m.join(' et ') || '0 article';
}

  var st = d.demande.statut_affiche;
  var edit = chiffrable(st);
  var auTotal = edit && Dem.mode === 'total';
  var h = '<div class="titre-section">' + e(compterDem(d.articles)) + '</div>';

  if (edit) {
    h += '<div class="duo" style="margin-bottom:10px">' +
      '<button class="btn petit' + (auTotal ? '' : ' vide') + '" style="margin:0" ' +
        'onclick="modeDem(\'total\')">🧾 Au total du vendeur</button>' +
      '<button class="btn petit' + (auTotal ? ' vide' : '') + '" style="margin:0" ' +
        'onclick="modeDem(\'detail\')">✏️ Article par article</button></div>' +
      '<div style="font-size:12.5px;color:var(--doux);margin:-2px 2px 12px;line-height:1.4">' +
      (auTotal
        ? 'Passe le panier chez le vendeur, recopie le <b>total de la commande</b> et joins la ' +
          'capture du récapitulatif : le client la verra sur sa facture.'
        : 'Prix, livraison, taxes et poids saisis ligne par ligne.') + '</div>';
  }

  h += d.articles.map(function (a) {
    var x = Dem.prix[a.article_id];
    var indispo = x.statut_article === 'indisponible';
    var panier = estPanierDem(a);
    var entete =
      '<div class="tete"><span class="num">' + a.rang + '</span>' +
        '<b>' + e(a.plateforme) + '</b>' +
        (panier
          ? '<span class="etat" style="background:#E3F2FD">🛒 Panier entier</span>'
          : '<span style="font-size:12.5px;color:var(--doux)">' +
              [a.taille, a.couleur].filter(Boolean).map(e).join(' · ') + '</span>') + '</div>' +
      '<a href="' + e(a.url_produit) + '" target="_blank" rel="noopener noreferrer" ' +
        'style="font-size:12.5px;word-break:break-all;display:block;margin-bottom:6px">' +
        e(a.url_produit) + ' ↗</a>' +
      (a.remarque ? '<div style="font-size:13px;margin-bottom:6px">💬 ' + e(a.remarque) + '</div>' : '') +
      (a.a_capture ? '<div id="cap-' + e(a.article_id) + '"><button class="btn vide petit" ' +
        'style="width:auto;margin-bottom:8px" onclick="voirImageDem(\'article\',\'' +
        e(a.article_id) + '\',\'cap-' + e(a.article_id) + '\')">📷 Voir la capture</button></div>' : '');

    if (!edit) {
      return '<div class="article' + (indispo ? '" style="opacity:.55' : '') + '">' + entete +
        '<div style="font-size:13px;color:var(--doux)">' +
        (panier ? 'Panier : ' : a.quantite + ' × ') +
        (a.prix_unitaire_usd ? usd(a.prix_unitaire_usd) : '—') +
        (indispo ? ' · <b>indisponible</b>' : '') + '</div></div>';

    var id = e(a.article_id);
    if (auTotal) {
      return '<div class="article" id="art-' + id + '"' + (indispo ? ' style="opacity:.7"' : '') + '>' +
        entete +
        '<label class="coche' + (indispo ? '' : ' on') + '" style="margin-bottom:0">' +
          '<input type="checkbox" ' + (indispo ? '' : 'checked') + ' onchange="dispoDem(\'' + id +
          '\',this.checked)"><span class="corps">Disponible chez le vendeur</span></label></div>';
    }
    var champ = function (cle, lib, pas) {
      return '<label class="champ"><span>' + lib + '</span><input type="number" step="' + pas +
        '" min="0" inputmode="decimal" value="' + e(x[cle]) + '" ' +
        'oninput="prixDem(\'' + id + '\',\'' + cle + '\',this.value)"' +
        (indispo ? ' disabled' : '') + '></label>';
    };
    return '<div class="article" id="art-' + id + '">' + entete +
      '<label class="coche' + (indispo ? '' : ' on') + '" style="margin-bottom:9px">' +
        '<input type="checkbox" ' + (indispo ? '' : 'checked') + ' onchange="dispoDem(\'' + id +
        '\',this.checked)"><span class="corps">Disponible chez le vendeur</span></label>' +
      (panier
        ? '<div class="duo">' + champ('prix_unitaire_usd', 'Prix du panier ($)', '0.01') +
            champ('poids_estime_lb', 'Poids du panier (lb)', '0.1') + '</div>' +
          '<div class="duo">' + champ('livraison_vendeur_usd', 'Livraison vendeur ($)', '0.01') +
            champ('taxes_vendeur_usd', 'Taxes vendeur ($)', '0.01') + '</div>'
        : '<div class="duo">' + champ('prix_unitaire_usd', 'Prix unitaire ($)', '0.01') +
            champ('quantite', 'Quantité', '1') + '</div>' +
          '<div class="trio">' + champ('livraison_vendeur_usd', 'Livraison vendeur ($)', '0.01') +
            champ('taxes_vendeur_usd', 'Taxes vendeur ($)', '0.01') +
            champ('poids_estime_lb', 'Poids / unité (lb)', '0.1') + '</div>') +
    '</div>';
  }).join('');

  if (auTotal) h += htmlRecapDem(d);

  if (edit) {
    h += '<div class="carte" id="dm-apercu">' + htmlApercuDem(d) + '</div>' +
      '<div id="dm-fact-res"></div>' +
      '<button class="btn sombre" id="dm-fact-btn" onclick="facturerDem(\'' +
        e(d.demande.demande_id) + '\')">🧾 ' +
        (d.facture ? 'Refaire la facture avec ces montants' : 'Générer la facture') + '</button>';
  }
  return h;
}

/** Le calcul du serveur, refait ici pour l'aperçu pendant la saisie.
 *  Le serveur recalcule tout à la génération : c'est lui qui fait foi. */
function calculDem(d) {
  var p = d.parametres, sous = 0, poids = 0, n = 0, manque = false;
  var auTotal = Dem.mode === 'total';
  d.articles.forEach(function (a) {
    var x = Dem.prix[a.article_id];
    if (x.statut_article === 'indisponible') return;
    if (auTotal) { n++; return; }
    var q = estPanierDem(a) ? 1 : Math.max(1, Math.round(Number(x.quantite) || 1));
    var pu = r2(x.prix_unitaire_usd);
    if (!(pu > 0)) manque = true;
    sous += r2(pu * q + r2(x.livraison_vendeur_usd) + r2(x.taxes_vendeur_usd));
    poids += Math.max(0, Number(x.poids_estime_lb) || 0) * q;
    n++;
  });
  if (auTotal) {
    sous = r2(Dem.recap.total_vendeur_usd);
    poids = Math.max(0, Number(Dem.recap.poids_total_lb) || 0);
    manque = !(sous > 0);
  }
  sous = r2(sous);
  var auPct = r2(sous * p.taux_service);
  var frais = sous > 0 ? Math.max(auPct, r2(p.frais_min)) : 0;
  var aPayer = r2(sous + frais);
  var poidsF = poids > 0 ? Math.max(poids, p.poids_min) : 0;
  return { n: n, manque: manque, sous: sous, frais: frais, mini: sous > 0 && frais > auPct,
           aPayer: aPayer, htg: Math.round(aPayer * p.taux_htg), poids: r2(poidsF),
           fret: r2(poidsF * p.prix_lb) };
}

function htmlApercuDem(d) {
  var c = calculDem(d), p = d.parametres;
  var auTotal = Dem.mode === 'total';
  var nb = Math.round(Number(Dem.recap.nb_articles_vendeur) || 0);
  return '<div class="total"><span class="l">' +
      (auTotal ? 'Total chez le vendeur' + (nb ? ' (' + nb + ' article' + (nb > 1 ? 's' : '') + ')' : '')
               : 'Sous-total produits (' + c.n + ')') + '</span><span>' +
      usd(c.sous) + '</span></div>' +
    '<div class="total"><span class="l">Frais de service ' + pct(p.taux_service) +
      (c.mini ? ' → minimum ' + usd(p.frais_min) : '') + '</span><span>' + usd(c.frais) + '</span></div>' +
    '<div class="total gros"><span class="l">À payer</span><span>' + usd(c.aPayer) + '</span></div>' +
    '<div class="total"><span class="l">En gourdes (taux ' + n0(p.taux_htg) + ')</span><b>' +
      htg(c.htg) + '</b></div>' +
    (c.poids > 0
      ? '<div class="total"><span class="l">Fret estimé · ' + n2(c.poids) + ' lb · payé au retrait</span><span>' +
          usd(c.fret) + '</span></div>'
      : '<div class="total"><span class="l">Fret</span><span>au retrait, au poids réel</span></div>') +
    (c.manque ? bloc(auTotal ? 'Mets le total de la commande chez le vendeur.'
                             : 'Un article disponible n\'a pas de prix.', 'attention', '⚠️') : '') +
    (auTotal && !Dem.recapIds.length
      ? bloc('Ajoute la capture du récapitulatif : sans elle, pas de facture.', 'attention', '📷') : '') +
    (auTotal && !nb ? bloc('Mets le nombre d\'articles du récapitulatif.', 'attention', '⚠️') : '');
}

/* ── Au total du vendeur ──────────────────────────────────────────
   Le récapitulatif de Shein (« Retail Price : 8 Items … Total de la
   commande ») montre déjà prix, livraison, promotions et taxes. On ne
   les recopie plus : un total, un nombre d'articles, la capture. */

function modeDem(m) {
  Dem.mode = m === 'detail' ? 'detail' : 'total';
  majModale(Dem.detail.demande.demande_id, htmlDemande(Dem.detail));
  if (Dem.mode === 'total') chargerRecapsDem();
}

function htmlRecapDem(d) {
  var r = Dem.recap;
  var champ = function (cle, lib, pas, mode) {
    return '<label class="champ"><span>' + lib + '</span><input type="number" step="' + pas +
      '" min="0" inputmode="' + mode + '" value="' + e(r[cle]) + '" ' +
      'oninput="recapDem(\'' + cle + '\',this.value)"></label>';
  };
  var vignettes = Dem.recapIds.map(function (id) {
    return '<div class="article" style="padding:8px;margin-bottom:8px">' +
      '<div id="rc-' + e(id) + '">' + (Dem.recapImg[id] ? imgRecapDem(Dem.recapImg[id]) : chargement('Capture…')) + '</div>' +
      '<button class="btn vide petit" style="width:auto;margin:0" onclick="retirerRecapDem(\'' +
        e(id) + '\')">🗑 Retirer cette capture</button></div>';
  }).join('');

/** Les vignettes, chargées après l'affichage et gardées : redessiner la

function chargerRecapsDem() {
  var dem = Dem.detail && Dem.detail.demande;
  if (!dem) return;
  Dem.recapIds.forEach(function (id) {
    if (Dem.recapImg[id] || Dem.recapImg[id] === false) return;

    api('cpm_image', { type: 'recap', id: id, demande_id: dem.demande_id }).then(function (r) {
      Dem.recapImg[id] = 'data:' + r.mime + ';base64,' + r.base64;

  });
}

/** Une capture d'écran de téléphone pèse lourd : réduite avant l'envoi,
 *  assez nette pour que les chiffres restent lisibles. */
function reduireImageDem(fichier) {
  return new Promise(function (ok, ko) {
    if (!fichier || !/^image\//.test(fichier.type)) return ko(new Error('Choisis une image.'));
    var url = URL.createObjectURL(fichier);
    var img = new Image();
    img.onload = function () {
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight;
      var k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      var g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var data = c.toDataURL('image/jpeg', 0.85);
      ok({ mime: 'image/jpeg', base64: data.split(',')[1] });
    };
    img.onerror = function () { URL.revokeObjectURL(url); ko(new Error('Image illisible.')); };
    img.src = url;
  });
}

function ajouterRecapDem(input) {
  var f = input.files && input.files[0];
  input.value = '';

  var id = Dem.detail.demande.demande_id;
  Dem.recapEnvoi = true;
  majModale(id, htmlDemande(Dem.detail)); chargerRecapsDem();
  reduireImageDem(f).then(function (img) {
    return api('cpm_recap_ajouter', { demande_id: id, mime: img.mime, base64: img.base64 });
  }).then(function (r) {
    Dem.recapEnvoi = false;
    Dem.recapIds = r.recap_ids;
    Dem.detail.demande.recap_ids = r.recap_ids;
    toast('Capture jointe.', 'ok');
    majModale(id, htmlDemande(Dem.detail)); chargerRecapsDem();
  }).catch(function (err) {
    Dem.recapEnvoi = false;

}

        '📦 Marquer « Reçue aux US »</button>' +
      '<details style="margin-top:10px"><summary style="font-size:13px;color:var(--doux)">' +
        'Compléter le numéro de suivi du vendeur</summary>' +
        '<label class="champ" style="margin-top:8px"><span>Suivi vendeur</span><input type="text" ' +
          'id="cp-tk" class="mono" value="' + e(dm.tracking_vendeur) + '"></label>' +
        '<button class="btn vide petit" onclick="completerDem(\'' + e(dm.demande_id) + '\')">' +
          'Enregistrer</button></details>';
  }

  return h + htmlColisDem(d);
}

function htmlColisDem(d) {
  if (!d.colis.length) return '';
  var st = d.demande.statut_affiche;
  return '<div class="titre-section">Koli — suivis dans l\'app Logistique</div>' +
    d.colis.map(function (x) {
      return '<div class="ligne"><div class="corps"><div class="t2 mono" ' +
        'style="color:var(--texte);font-weight:650">' + e(x.tracking) + '</div>' +
        (x.agence_courante ? '<div class="t2">' + e(x.agence_courante) + '</div>' : '') +
        '</div><div class="droite"><span class="badge">' + e(x.statut) + '</span>' +
        (x.poids_lb ? '<div style="font-size:11.5px;color:var(--doux);margin-top:3px">' +
          n2(x.poids_lb) + ' lb</div>' : '') + '</div></div>';
    }).join('') +
    (['recue_usa', 'en_transit', 'disponible'].indexOf(st) !== -1
      ? bloc('La demande avance toute seule avec les scans de la logistique. Elle passera ' +
             '« livrée » quand le koli sera facturé et remis.', 'info', '🚚')
      : '');
}

/** Les dépôts qui peuvent encore porter ce panier. */
function chargerDepotsDem() {
  var z = document.getElementById('dm-depots');
  if (!z || !Dem.detail || !Dem.detail.commande) return;
  var panier = Number(Dem.detail.commande.montant_panier_usd) || 0;
  var peutDepot = Etat.user && Etat.user.droits && Etat.user.droits.gerer_depots;
  api('depot_lister').then(function (liste) {
    var ok = liste.filter(function (x) { return x.non_affecte_usd + 0.01 >= panier; });
    z.innerHTML = (ok.length
      ? '<label class="champ"><span>Dépôt qui paie cet achat</span><select id="ach-depot">' +
          ok.map(function (x) {
            return '<option value="' + e(x.depot_id) + '">' + e(x.depot_id) + ' — ' +
              usd(x.non_affecte_usd) + ' libres · ' + dateCourte(x.date) + '</option>';
          }).join('') + '</select></label>'
      : bloc('Aucun dépôt n\'a assez de solde libre pour ce panier (' + usd(panier) + ').',
             'attention', '💳')) +
      (peutDepot ? '<button class="btn vide petit" style="margin-bottom:12px" ' +
        'onclick="fermerModale();ouvrirNouveauDepot(\'' + e(Dem.detail.commande.commande_id) +
        '\')">💳 Créer un dépôt pour cette commande</button>'
        : bloc('Un dépôt s\'enregistre par la direction.', 'info', '🔒'));
  }).catch(function (err) { z.innerHTML = bloc(err.message, 'ko', '❌'); });
}

function commandeeDem(id, depotFixe) {
  var b = document.getElementById('ach-btn');
  var sel = document.getElementById('ach-depot');
  var p = {
    demande_id: id,
    depot_id: depotFixe || (sel ? sel.value : ''),
    numero_commande: document.getElementById('ach-num').value.trim(),
    tracking_vendeur: document.getElementById('ach-tk').value.trim(),
    date_commande: document.getElementById('ach-date').value,
    montant_reel_usd: document.getElementById('ach-montant').value
  };
  if (!p.numero_commande) {
    document.getElementById('ach-res').innerHTML = bloc('Le numéro de commande du vendeur est requis.', 'ko', '⚠️');
    return;
  }
  b.disabled = true; b.textContent = 'Enregistrement…';
  api('cpm_commandee', p).then(function (r) {
    toast(r.alerte || 'Commandée.', r.alerte ? 'ko' : 'ok');
    rechargerDemande();
  }).catch(function (err) {
    b.disabled = false; b.textContent = '🛍 Marquer « Commandée »';
    document.getElementById('ach-res').innerHTML = bloc(err.message, 'ko', '❌');
  });
}

function completerDem(id) {
  api('cpm_commandee', { demande_id: id, tracking_vendeur: document.getElementById('cp-tk').value.trim() })
    .then(function () { toast('Suivi enregistré.', 'ok'); rechargerDemande(); })
    .catch(function (err) { toast(err.message, 'ko'); });
}

function recueDem(id) {
  var b = document.getElementById('rc-btn');
  var p = { demande_id: id, trackings: document.getElementById('rc-tk').value,
            poids_lb: document.getElementById('rc-poids').value || 0 };
  var entree = document.getElementById('rc-entree').value;
  if (entree) p.agence_entree = entree;
  b.disabled = true; b.textContent = 'Enregistrement…';
  api('cpm_recue_usa', p).then(function (r) {
    toast('Koli dans le circuit : ' + r.trackings.join(', '), 'ok');
    rechargerDemande();
  }).catch(function (err) {
    b.disabled = false; b.textContent = '📦 Marquer « Reçue aux US »';
    document.getElementById('rc-res').innerHTML = bloc(err.message, 'ko', '❌');
  });
}


// ── Annulation ─────────────────────────────────────────────────────

function ouvrirAnnulerDem(id, st) {
  modale('Annuler ' + id,
    (st === 'payee'
      ? bloc('La demande est payée : l\'annulation annule aussi la commande et ses revenus. ' +
             'Réservé à la direction. Le montant à rendre au client te sera indiqué.', 'attention', '💵')
      : bloc('Aucun argent n\'a été encaissé : seule la demande s\'éteint.', 'info', 'ℹ️')) +
    '<label class="champ"><span>Motif</span><input type="text" id="an-motif" ' +
      'placeholder="Ex. articles en rupture"></label><div id="an-res"></div>' +
    '<button class="btn rouge" onclick="annulerDem(\'' + e(id) + '\')">Annuler la demande</button>');
}

function annulerDem(id) {
  api('cpm_annuler', { demande_id: id, motif: document.getElementById('an-motif').value.trim() })
    .then(function (r) {
      majModale('Demande annulée',
        (r.a_rembourser_usd ? bloc(usd(r.a_rembourser_usd) + ' à rendre au client.', 'attention', '💵') : '') +
        '<a class="btn vert" href="' + e(r.lien_whatsapp) + '" target="_blank" rel="noopener">' +
        '📲 Prévenir le client</a><button class="btn vide" onclick="ouvrirDemande(\'' + e(id) +
        '\')">Revenir à la demande</button>');
      if (Etat.onglet === 'demandes') chargerDemandes();
    }).catch(function (err) {
      document.getElementById('an-res').innerHTML = bloc(err.message, 'ko', '❌');
    });
}


// ── Réglages « Commande pour moi » ─────────────────────────────────

/**
 * Chaque réglage dit son unité et son effet. Les numéros de paiement et
 * le texte des conditions restent au fondateur : changer le numéro
 * MonCash imprimé sur les factures, c'est décider où arrive l'argent de
 * tous les clients.
 */
var REGLAGES_CPM = [
  { cle: 'TAUX_COMMISSION_DEFAUT', nom: 'Frais de service', unite: '%', fraction: true,
    aide: 'Le même taux qu\'au comptoir. 0 pour une promotion.' },
  { cle: 'FRAIS_SERVICE_MIN_USD', nom: 'Frais minimum', unite: '$',
    aide: 'Appliqué quand le pourcentage donnerait moins.' },
  { cle: 'CPM_VALIDITE_HEURES', nom: 'Validité d\'une facture', unite: 'h',
    aide: 'Passé ce délai, le client ne peut plus déclarer de paiement dessus.' },
  { cle: 'PRIX_LB_USD', nom: 'Fret par livre (estimation)', unite: '$',
    aide: 'Le prix de la logistique : changer ici le change partout.' },
  { cle: 'TAUX_ACHAT_USD', nom: 'Taux USD → HTG', unite: 'HTG',
    aide: 'Le taux d\'achat du dollar, commun à toute l\'entreprise.' },
  { cle: 'CPM_ACTIF', nom: 'Formulaire ouvert', type: 'oui_non',
    aide: 'NON : le site renvoie les clients vers WhatsApp.' },
  { cle: 'CPM_MAX_ARTICLES', nom: 'Articles par demande', unite: '' },
  { cle: 'CPM_PAIEMENT_MONCASH', nom: 'MonCash (numéro et nom)', type: 'texte' },
  { cle: 'CPM_PAIEMENT_NATCASH', nom: 'NatCash (numéro et nom)', type: 'texte' },
  { cle: 'CPM_PAIEMENT_VIREMENT', nom: 'Virement (banque, titulaire, compte)', type: 'texte' },
  { cle: 'CPM_PAIEMENT_CASH', nom: 'Espèces (où payer)', type: 'texte' },
  { cle: 'CPM_ARTICLES_INTERDITS', nom: 'Articles interdits', type: 'liste',
    aide: 'Un par ligne.' },
  { cle: 'CPM_CONDITIONS', nom: 'Conditions', type: 'liste',
    aide: 'Une par ligne. {heures} est remplacé par la validité.' },
  { cle: 'CPM_EMAIL_EQUIPE', nom: 'Courriel de secours de l\'équipe', type: 'texte' },
  { cle: 'CPM_URL_ADMIN', nom: 'Adresse de cette app (lien Telegram)', type: 'texte' }
];

function ouvrirReglagesCpm() {
  modale('Réglages — Commande pour moi', chargement());
  api('cpm_parametres').then(function (r) {
    var parCle = {};
    r.parametres.forEach(function (x) { parCle[x.cle] = x; });
    var n = r.notifications;
    majModale('Réglages — Commande pour moi',
      bloc('Une facture déjà émise garde ses montants : un réglage ne change que les ' +
           'factures suivantes.', 'info', 'ℹ️') +
      '<div class="carte serree"><div class="titre-section" style="margin-top:0">Notifications ' +
        'à l\'équipe</div>' +
        (n ? '<div style="font-size:13px">Dernière demande ' + e(n.demande_id) + ' (' +
          dateHeureDem(n.date) + ')<br>Telegram : <b>' + e(n.telegram || '—') + '</b><br>' +
          'Courriel : <b>' + e(n.email || '—') + '</b></div>'
          : '<div style="font-size:13px">Aucune demande reçue pour l\'instant.</div>') +
        '<div style="font-size:12px;color:var(--doux);margin-top:6px">Le bot Telegram se ' +
          'configure dans les propriétés du projet API publique (TELEGRAM_BOT_TOKEN, ' +
          'TELEGRAM_CHAT_ID) — jamais dans le classeur, que six agents peuvent ouvrir.</div>' +
      '</div>' +
      REGLAGES_CPM.map(function (def) {
        var x = parCle[def.cle];
        if (!x) return '';
        if (!x.present) return bloc(def.cle + ' absent : lance SYNCHRONISER_SCHEMA().', 'attention', '⚠️');
        var id = 'rg-' + def.cle, dis = x.modifiable ? '' : ' disabled';
        var champ;
        if (def.type === 'oui_non') {
          champ = '<select id="' + id + '"' + dis + '>' + ['OUI', 'NON'].map(function (v) {
            return '<option' + (String(x.valeur).toUpperCase() === v ? ' selected' : '') + '>' + v + '</option>';
          }).join('') + '</select>';
        } else if (def.type === 'liste') {
          champ = '<textarea id="' + id + '" rows="4"' + dis + '>' +
            e(String(x.valeur || '').split('|').join('\n')) + '</textarea>';
        } else if (def.type === 'texte') {
          champ = '<input type="text" id="' + id + '" value="' + e(x.valeur) + '"' + dis + '>';
        } else {
          var v = def.fraction ? r2(Number(x.valeur) * 100) : x.valeur;
          champ = '<input type="number" step="any" inputmode="decimal" id="' + id + '" value="' +
            e(v) + '"' + dis + '>';
        }
        return '<label class="champ"><span>' + e(def.nom) + (def.unite ? ' (' + def.unite + ')' : '') +
          (x.sensible ? ' 🔒' : '') + '</span>' + champ + '</label>' +
          (def.aide ? '<div style="font-size:12px;color:var(--doux);margin:-8px 0 8px">' +
            e(def.aide) + '</div>' : '') +
          (x.modifiable ? '<button class="btn vide petit" style="margin-bottom:14px" ' +
            'onclick="enregistrerReglageCpm(\'' + def.cle + '\')">Enregistrer</button>' : '');
      }).join('') +
      '<div style="font-size:12px;color:var(--doux);text-align:center">Module ' +
        e(r.version_cpm) + '</div>');
  }).catch(function (err) { majModale('Réglages', erreurDem(err)); });
}

function enregistrerReglageCpm(cle) {
  var def = REGLAGES_CPM.filter(function (x) { return x.cle === cle; })[0];
  var z = document.getElementById('rg-' + cle);
  var v = z.value;
  if (def.type === 'liste') {
    v = v.split('\n').map(function (l) { return l.trim(); }).filter(Boolean).join('|');
  }
  if (def.fraction) v = Number(v) / 100;
  api('cpm_parametres', { cle: cle, valeur: v }).then(function () {
    toast(def.nom + ' enregistré.', 'ok');
    z.style.borderColor = 'var(--vert)';
    if (/^(TAUX_|PRIX_)/.test(cle)) chargerReferentiels();
  }).catch(function (err) {
    z.style.borderColor = 'var(--rouge)';
    toast(err.message, 'ko');
  });
}

window.addEventListener('online',  function () { majBandeau(); toast('Réseau revenu.', 'ok'); });
window.addEventListener('offline', function () { majBandeau(); toast('Réseau perdu.', 'ko'); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });

  /* ── Une mise à jour ne doit pas attendre la visite suivante ──
   *
   * Le service worker sert la page depuis le cache puis la rafraîchit
   * en arrière-plan : l'application s'ouvre hors ligne, mais le code
   * neuf n'apparaît qu'à l'ouverture d'APRÈS. Personne ne le sait.
   * Le 1er novembre 2026, un bouton livré la veille restait invisible
   * pour cette seule raison, et on a cherché le défaut dans les droits.
   *
   * Le nouveau worker prend la main tout de suite (skipWaiting puis
   * clients.claim) : quand il la prend, la page affichée est périmée
   * et on la recharge. Pas à la première installation — là, il n'y a
   * rien de périmé à remplacer, et recharger ferait clignoter un
   * premier lancement sans raison.
   */
  var avaitUnWorker = !!navigator.serviceWorker.controller;
  var rechargeFaite = false;

  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!avaitUnWorker || rechargeFaite) return;
    rechargeFaite = true;
    location.reload();
  });
}

(function demarrer() {
  try {
    var h = (location.hash || '').replace('#', '');
    var lien = /^demande=(.+)$/.exec(h);
    if (lien) {
      Etat.onglet = 'demandes';
      Etat.demandeAOuvrir = decodeURIComponent(lien[1]);
    }
    if (h && ONGLETS.some(function (o) { return o.id === h; })) Etat.onglet = h;
    history.replaceState({ onglet: Etat.onglet }, '', '#' + Etat.onglet);
  } catch (e) {}

  if (Etat.url && Etat.token) {
    document.getElementById('app').innerHTML =
      '<header class="entete"><h1>Flashipping<span class="sous">Ouverture…' +
      '</span></h1></header><main>' + chargement() + '</main>';
    verifierVersion();
    chargerReferentiels().then(dessiner).catch(function (err) {
      if (/Session|Jeton/i.test(err.message)) { deconnecter(); return; }
      toast(err.message, 'ko'); dessiner();
    });
  } else {
    dessiner();
  }
})();
</script>
